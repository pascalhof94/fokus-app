/* Farbstreifen: nächste 10 Karten des aktiven Stapels als Farbrechtecke. */
/* A6: großer, horizontal snappender Karten-Streifen über ALLE Karten des
   aktiven Stapels — Titel (voll) + Soll-Min + Dringlichkeit; Kartenfarbe als
   Grundierung (Farb-Band oben). Tap wählt die Karte in den Fokus. */
/* U2: Karte in die Schnellauswahl aufnehmen/entfernen (Toggle ⚡). Beim
   Aufnehmen ans Ende der manuellen Reihenfolge. */
/* §4 (v1.8.0): ⚡ legt die Karte in den Schnellauswahl-Stapel bzw. nimmt sie
   heraus. Der Zeitstempel sorgt dafür, dass zuletzt Hinzugefügtes oben steht. */
/* §1.3 (v1.12.0): Die Schnellauswahl (toggleSchnell/⚡) ist ersatzlos
   entfallen — ihre Karten liegen seit der Migration in den Ketten. */
/* A4: Einfrieren/Auftauen. Eingefroren = pausiert (raus aus Abräumpflicht,
   Timer nicht startbar); bleibt in allen Stapeln ausgegraut sichtbar. */
function toggleFreeze(kid){
  const k=S.karten.find(x=>x.id===kid); if(!k) return;
  k.freeze=!k.freeze;
  if(k.freeze && S.fokus && S.fokus.karteId===kid) fokusBeenden();   // laufenden Timer beenden
  beruehre(k); saveKarten(); renderAlles();

}
/* A8: Karte an-/abpinnen (Quick-Leiste). Nur sinnvoll auf Counter/Routine. */
/* §1.2 (v1.12.0): Pin ist ersatzlos entfallen — die Migration hat gepinnte
   Karten in die Kette ihrer Domäne übernommen. Die Quick-Leiste (A8) fällt
   mit; ihre Direktaktionen leben in der Ketten-Schublade weiter. */
/* ══════════════════════════════════════════════════════════════════════
   §2 (v1.6.0) · Drei Navigationsebenen — ersetzen die 11 Standardstapel.
     Ebene 1  Domäne  dfm | privat                → Filter
     Ebene 2  Art     aufgabe | routine           → Filter
     Ebene 3  dfm:    projekt | deadline | start  → SORTIERUNG (filtert nicht)
              privat: Morgens/Tagsüber/Abends     → GRUPPIERUNG (alle sichtbar)
   Der Zustand liegt in S.ui und überlebt damit jeden Reload.
   ══════════════════════════════════════════════════════════════════════ */
function navDomain(){ return S.ui.navDomain==='privat' ? 'privat' : 'dfm'; }
function navArt(){ return S.ui.navArt==='routine' ? 'routine' : 'aufgabe'; }
function navSort(){ return ['projekt','deadline','start'].indexOf(S.ui.navSort)>=0 ? S.ui.navSort : 'deadline'; }
/* Ebene 1+2 auf eine Kartenliste anwenden. Counter zählen zu den Routinen
   (beide werden abgetickt statt durchgearbeitet). Freeze filtert NICHT (§2.4). */
function navFilter(ks){
  const dom=navDomain(), art=navArt();
  return ks.filter(k=>{
    if(k.domain!==dom) return false;
    const a=kartenArt(k);
    return art==='routine' ? (a==='Routine'||a==='Counter') : a==='Aufgabe';
  });
}
/* Ebene 3 für DFM: reine Sortierung. */
function navSortiere(ks){
  const so=navSort();
  return ks.slice().sort((a,b)=>{
    if(so==='projekt'){
      const pa=(a.projekt||'￿'), pb=(b.projekt||'￿');
      if(pa!==pb) return pa.localeCompare(pb);
    } else if(so==='start'){
      // „Start" = geplanter Beginn: Fälligkeit + Uhrzeit, ohne Termin ans Ende

/* §1.2 (v1.10.0): Reichweite — aus Akku-Stand und dem geplanten Netto-Verbrauch
   der Rest-Arbeit im Tagesstrom (dieselbe Rechnung wie der gelbe Batterie-
   Anteil), gleichmäßig über die Rest-Minuten verteilt → Uhrzeit, bis zu der
   der Akku reicht. Über das 22:00-Tagesfenster hinaus (oder Netto-Ladung):
   „reicht". */
function akkuReichweiteInfo(eb){
  if(!eb || eb.akku==null) return null;
  let verbrauch=0, laden=0, restMin=0;
  S.karten.forEach(k=>{ if(!imTagesstrom(k)) return;
    const r=Math.max(0, num(k.sollMin)-heuteInvestiertMin(k)); if(r<=0) return;
    restMin+=r; const d=akkuRate(k)*r/60; if(d<0) verbrauch+=-d; else laden+=d; });
  const netto=verbrauch-laden;
  if(netto<=0 || restMin<=0 || eb.akku>=netto) return { reicht:true };
  return { reicht:false, ms: Date.now()+restMin*(eb.akku/netto)*60000 };
}
function akkuReichweite(eb){
  const i=akkuReichweiteInfo(eb);
  if(!i) return '–';
  if(i.reicht) return 'reicht';
  const t=new Date(i.ms);
  if(t.getDate()!==new Date().getDate() || t.getHours()>=22) return 'reicht';
  return 'bis '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

/* Heute erreichte Punkte (live, inkl. laufendem Timer) minus Schiebe-Abzüge. */
/* A1: heutige Punkte EINER Domäne (erledigt heute + laufender Fokus dieser
   Domäne + Schiebe-Strafen dieser Domäne als negative Log-Einträge, A4). */
/* Heutiger Punkt-Beitrag EINER Karte (V1.1): erledigt/laufend/reaktiviert oder
   heute getrackt (auch pausiert) → volle Kartenpunkte, bei mehrtägigen Aufgaben
   minus der an Vortagen gezählten Zeit; sonst nur heutige Tick-Punkte. */
function kartePunkteHeute(k){
  const tid=aktuelleTagId();
  const laeuftId = S.fokus ? S.fokus.karteId : null;
  const erl = k.status==='erledigt' && k.tagId===tid;
  const laeuft = k.id===laeuftId && k.status==='offen';
  const reaktiviert = k.status==='offen' && k.punkteOverride!=null && k.tagId===tid;
  const gearbeitet = k.status==='offen' && k.punkteOverride==null && heuteInvestiertMin(k)>0;
  if(!(erl || laeuft || reaktiviert || gearbeitet)){
    return (num(k.ticksHeute)>0 && istTickKarte(k)) ? tickPunkte(k) : 0;
  }
  let pk = kartePunkte(k);
  if(k.punkteOverride==null && S.tag && S.tag.istMinutenStart){
    const basisMin=num(S.tag.istMinutenStart[k.id],0);
    if(basisMin>0 && num(k.istSek)/60 > basisMin) pk -= punkteFuerZeit(k, basisMin)*(S.settings.zeitGewicht!=null?S.settings.zeitGewicht:1);
  }
  return Math.max(0, pk);
}
function tagesPunkteDomain(dom){

/* ══ §2 (v1.12.0) · DIE Soll-Funktion — eine Treppe statt der Linie. ══════

/* Ankerpunkt der Form: Startzeit des (offenen oder historischen) Tages; ohne

function tagesStartStunde(datum){

/* §5.3 (v1.13.0): Tagesrahmen aus der Planung (Import) — Segmente

function tagesRahmen(datum){

function rahmenFenster(segmente, dom){

/* Absolute aktive Fenster eines Tages: Rahmen schlägt Form-am-Start.
   §5.2: Das Tagesende ist die Annahme Start+Formlänge — läuft der OFFENE Tag
   darüber hinaus, STRECKT sich das letzte Fenster bis jetzt mit (nichts liegt
   mehr „als Bonus außerhalb"; der Tag endet erst mit dem manuellen Abschluss,
   auch nach Mitternacht). */
function sollFensterAktiv(datum, dom){
  const d=datum||heuteApp();
  const ra=tagesRahmen(d);
  if(ra){
    // Der Rahmen ist der EXPLIZITE Plan — er wird nicht gestreckt (jenseits
    // seines Endes steht das Soll ohnehin auf 100 %).
    const fs=rahmenFenster(ra, dom);
    return fs.length ? fs : rahmenFenster(ra);
  }
  const start=tagesStartStunde(d);
  let fs=sollFormWerktag().map(f=>[start+num(f[0]), start+num(f[1])]);
  if(!fs.length) return fs;
  if(tagOffen() && S.tag.datum===d){
    let jetzt=jetztStunde(); if(jetzt<fs[0][0]-6) jetzt+=24;   // Tag läuft über Mitternacht
    const ende=fs[fs.length-1][1];
    if(jetzt>ende) fs=fs.slice(0,-1).concat([[fs[fs.length-1][0], jetzt]]);
  }

}
function sollFensterStunden(datum, dom){ return sollFensterAktiv(datum, dom).reduce((a,f)=>a+(f[1]-f[0]),0)||1; }
function jetztStunde(){ const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; }
function istWochenendTag(datum){ const d=new Date((datum||heuteApp())+'T12:00:00').getDay(); return d===0||d===6; }
function fensterAnteil(stunde, datum, dom){
  const fs=sollFensterAktiv(datum, dom);
  if(!fs.length) return 0;
  let h=(stunde==null)?jetztStunde():stunde;
  if(h<fs[0][0]-6) h+=24;   // Stunde nach Mitternacht eines langen Tages
  let v=0, ges=0; fs.forEach(f=>{ ges+=f[1]-f[0]; v+=Math.max(0, Math.min(h,f[1])-f[0]); });
  return Math.max(0, Math.min(1, v/(ges||1)));

function restFensterStd(stunde, datum){
  const d=datum||heuteApp();

  const fs=sollFensterAktiv(d);
  if(!fs.length) return 0;
  let h=(stunde==null)?jetztStunde():stunde;
  if(h<fs[0][0]-6) h+=24;

/* §3 · Gemessenes Verteilungsprofil je Tagestyp (werktag/wochenende) aus dem
   Intraday-Log: Punkteanteil je Stunde ueber die letzten aktiven Tage.
   §5.1 (v1.13.0): Stunden RELATIV zum jeweiligen Tagesstart — gelernt wird
   die FORM, nie die Uhrlage und nie die Zielhöhe. */
function profilGemessen(typ){
  const we=(typ==='wochenende');
  const tage=aktiveRateTage(60).filter(d=>istWochenendTag(d)===we).slice(0,28);
  const b=new Array(24).fill(0); let ges=0;
  tage.forEach(d=>{
    const start=tagesStartStunde(d);
    (S.intraday||[]).forEach(e=>{
      if(!e.ts || belFensterDatum(e.ts)!==d) return;
      const pe=Math.max(0,num(e.punkte)); if(pe<=0) return;
      let rel=belX(e.ts)-start; if(rel<0) rel=0; if(rel>23) rel=23;
      b[Math.floor(rel)]+=pe; ges+=pe;
    });
  });

/* Fenster aus der Messung ableiten: Stunden mit >=3 % der Punkte sind aktiv,
   Ein-Stunden-Luecken werden ueberbrueckt. */
function profilFenster(anteile){
  const aktiv=anteile.map(a=>a>=0.03);
  for(let h=1;h<23;h++){ if(!aktiv[h] && aktiv[h-1] && aktiv[h+1]) aktiv[h]=true; }
  const out=[]; let start=null;
  for(let h=0;h<=24;h++){
    const an=h<24 && aktiv[h];
    if(an && start==null) start=h;
    if(!an && start!=null){ out.push([start,h]); start=null; }
  }
  return out;
}
/* §3 · Abweichung aktives vs. gemessenes Profil (Jaccard-Distanz der
   Stundenmengen). Schwelle 0,25 und Mindeststichprobe 14 aktive Werktage —
   dieselbe Groessenordnung wie Rang-Fenster und Sternschwellen; Kappung:
   hoechstens ein Vorschlag je 7 Tage. */
function profilVorschlag(){
  const m=profilGemessen('werktag');
  if(m.n<14) return null;
  const gemessen=profilFenster(m.anteile);
  if(!gemessen.length) return null;
  const setVon=fs=>{ const st=new Set(); fs.forEach(f=>{ for(let h=f[0];h<f[1];h++) st.add(h); }); return st; };
  // §5.1: Vergleich in RELATIVEN Stunden — aktive Form vs. gemessene Form
  const A=setVon(sollFormWerktag()), B=setVon(gemessen);
  let schnitt=0; A.forEach(h=>{ if(B.has(h)) schnitt++; });
  const vereinigung=new Set([...A,...B]).size;
  const distanz=vereinigung>0 ? 1-(schnitt/vereinigung) : 0;
  if(distanz<0.25) return null;
  return { gemessen, distanz, n:m.n, anteile:m.anteile };
}

/* Zeit-Aggregat (§9 Stat 3): Ist-Sekunden je Domäne + Projekt für einen Tag.

    const sek = heuteInvestiertMin(k) * 60;
    if(sek<=0) return;
    agg[k.domain==='dfm'?'dfm':'privat'] += sek;
    const p = k.domain==='dfm' ? (k.projekt||'(ohne Projekt)') : 'Privat';
    agg.projekte[p]=(agg.projekte[p]||0)+sek;
  });
  return agg;
}
/* ── Statusleiste-/Fokus-Kennzahlen (v1.1, v0.38-Port) ───────────────
   Heute erreichte Punkte für die Anzeige: nie negativ, keine Obergrenze
   (Schiebe-Abzüge mindern, können aber nicht unter 0 drücken). */
function punkteHeuteAnzeige(){ return Math.max(0, tagesPunkteLive()); }
/* Verstrichene Stunden seit Tagesbeginn (manueller Tag, uhrzeitunabhängig). */
function tagStundenVergangen(){
  if(!S.tag || !S.tag.startTs) return 0;
  return Math.max(0, (Date.now()-new Date(S.tag.startTs).getTime())/3600000);
}
/* Pace (A2): Ø IST-Punkte/Stunde (Tagespunkte ÷ Stunden seit Tagesstart) vs.
   SOLL-Rate (Gesamt-Tagesziel ÷ 16 h Wachfenster). ist/soll bleiben kumulativ
   (Balken/Pfeil-Zonen), istRate/sollRate/deltaRate treiben die Anzeige. */
/* §2 (v1.12.0): Konsument 1 — Pace über sollStand (Treppe). Der Pfeil
   rechnet STAND-basiert (ist − soll): im 18–21-Plateau steigt das Soll
   nicht, also dreht dort nichts ins Rote. Wochenende: keine Pace. */
/* §1.5 (v1.13.0): Drei Werte — istRate = echte Ist-Rate (Punkte je vergangene
   aktive Fensterstunde), restRate = nötige Rest-Rate zum Ziel, sollRate =
   Soll-Marke. Der Pfeil bleibt STAND-basiert (ist − soll). §4.3: alle
   Geld-Größen laufen über den Upgrade-Faktor (ist UND soll — Verhältnisse
   bleiben identisch, keine Zielinflation). */
function paceWerte(){
  const f=upgradeFaktor();
  const zi=zielUndIstHeute();
  if(zi.we) return { we:true, ist:zi.ist*f, ziel:zi.ziel*f, soll:zi.ziel*f, delta:0, istRate:0, restRate:null, sollRate:0 };
  const soll=sollStandGesamt()*f;
  const ist=punkteHeuteAnzeige()*f;
  const ziel=zi.ziel*f;
  const rest=restFensterStd();
  const verg=Math.max(0, sollFensterStunden()-rest);
  return { we:false, ist, ziel, soll, delta:ist-soll,
    istRate: verg>0.05 ? ist/verg : 0,
    restRate: ist>=ziel ? 0 : (rest>0.05 ? (ziel-ist)/rest : null),
    sollRate: ziel/sollFensterStunden() };
}
/* §2 (v1.12.0): Konsument 2 — Pace je Domäne, ebenfalls Stand-basiert. */
function paceDomain(dom){
  const f=upgradeFaktor();
  const zi=zielUndIstHeute(dom);
  if(zi.we) return { we:true, ist:zi.ist*f, ziel:zi.ziel*f, soll:zi.ziel*f, delta:0, istRate:0, sollRate:0 };
  const soll=sollStand(dom)*f;
  const rest=restFensterStd();
  const verg=Math.max(0, sollFensterStunden()-rest);
  return { we:false, ist:zi.ist*f, ziel:zi.ziel*f, soll, delta:zi.ist*f-soll,
    istRate: verg>0.05 ? zi.ist*f/verg : 0, sollRate: soll };
}
/* §3.1 (v1.13.0): Anteil der HEUTE anstehenden Routinen in VIER Kategorien —
   erledigt · geschoben · entschuldigt · verpasst (Summe = 100 %). Solange der
   Tag läuft, heißt „verpasst": noch offen (endgültig erst beim Abschluss). */
function routinenQuoteHeute(dom){
  const h=heuteApp();
  const bil=(tagOffen() && S.tag ? (S.tag.routinenBilanz||[]) : []);
  const byBil={}; bil.forEach(b=>{ if(b && !byBil[b.id]) byBil[b.id]=b; });
  const set={ erledigt:0, geschoben:0, entschuldigt:0, verpasst:0 };
  S.karten.forEach(k=>{
    if(!k.rhythmus || k.status==='archiviert') return;
    if(dom && dom!=='alle' && k.domain!==dom) return;
    const b=byBil[k.id];
    const ansteht=(k.status==='offen' && !k.freeze && routineFaellig(k,h)) || routErledigtHeute(k) || !!b;
    if(!ansteht) return;
    if(routErledigtHeute(k)) set.erledigt++;
    else if(b && b.geschoben) set.geschoben++;
    else if(b && b.entschuldigt) set.entschuldigt++;
    else set.verpasst++;
  });
  set.gesamt=set.erledigt+set.geschoben+set.entschuldigt+set.verpasst;
  return set;
}
/* Karte gehört in den heutigen Energie-/Pace-Horizont: offen + heute fällig
   oder überfällig, oder die aktuell laufende Fokus-Karte. */
function imTagesstrom(k){
  if(k.status!=='offen') return false;
  if(S.fokus && S.fokus.karteId===k.id) return true;
  if(!k.faelligkeit) return false;
  return k.faelligkeit <= heuteApp();
}
/* 3-teilige Energie-Batterie (v0.38-Port): dunkel = verbraucht (100−Akku),
   gelb = im Tagesstrom verplante Energie (Verbrauch offener Karten über ihre
   Rest-Zeit, ladende Karten verkleinern es), grün = frei. */
function energieBatterie(){
  const akku=akkuLive();
  let verplant=0, laden=0;
  S.karten.forEach(k=>{
    if(!imTagesstrom(k)) return;
    const restMin=Math.max(0, num(k.sollMin) - heuteInvestiertMin(k));
    if(restMin<=0) return;
    const delta=akkuRate(k)*restMin/60;       // % über die Rest-Zeit (negativ = Verbrauch)
    if(delta<0) verplant += -delta; else laden += delta;
  });
  const p = akku==null ? 0 : akku;
  const dunkel=Math.max(0, 100-p);
  const netto=Math.max(0, verplant-laden);
  const gelb=Math.max(0, Math.min(p, netto));
  const gruen=Math.max(0, p-gelb);
  return { akku, gruen, gelb, dunkel };
}
function renderAlles(){
  _phCache=null;   // §5 (1.8.0): P/h-Schnitte je Render frisch
  rangCacheBauen();
  renderFokusleiste();
  if(S.ui.tab==='stapel') renderStapel();
  else if(S.ui.tab==='fokus') renderFokus();
  else if(S.ui.tab==='einst') renderEinst();
}
/* 1-Sekunden-Ticker nur solange der Timer läuft — aktualisiert Text in-place. */
/* ══════════════════════════════════════════════════════════════════════
   §4 (v1.6.1) · Auto-Pause bei unbeaufsichtigtem Timer
   Ein Timer, der AUTOPAUSE_MIN Minuten ohne jede Interaktion läuft (kein Tap,
   kein Tick, kein Seitenwechsel, keine Sichtbarkeitsänderung), wird pausiert.
   Beim nächsten Öffnen fragt die App nach der echten Arbeitsdauer und korrigiert
   istMin UND den zugehörigen Intraday-Eintrag, damit Karte und Log nicht driften.
   Karten mit keineAutoPause (Pausentimer, §5) sind ausgenommen.
   ══════════════════════════════════════════════════════════════════════ */
function interaktion(){ S.meta.letzteInteraktionTs=jetztIso(); }
/* Prüft im Sekundentakt, ob der laufende Timer unbeaufsichtigt ist. */
function autoPausePruefen(){
  if(!(S.fokus && S.fokus.laeuft)) return;
  const k=fokusKarte(); if(!k || k.keineAutoPause) return;               // §5: Pausentimer ausgenommen
  const letzte=S.meta.letzteInteraktionTs;
  if(!letzte){ interaktion(); saveMeta(); return; }
  if(minSeit(letzte) < AUTOPAUSE_MIN) return;
  // Auto-Pause: gelaufene Zeit reguär einbuchen, Rückfrage vormerken.
  const gelaufenMin=(Date.now()-S.fokus.startMs)/60000;
  const vorschlagMin=Math.max(0, (Date.parse(letzte)-S.fokus.startMs)/60000);
  const eintragTs=jetztIso();
  fokusZeitEinbuchen();
  // Der eben geschriebene Intraday-Eintrag ist der letzte dieser Karte.
  let idx=-1;
  for(let i=(S.intraday||[]).length-1;i>=0;i--){ if(S.intraday[i].kartenId===k.id){ idx=i; break; } }
  S.meta.autoPause={ kartenId:k.id, titel:k.titel||'', gelaufenMin, vorschlagMin,
                     intradayIdx:idx, ts:eintragTs };
  saveMeta(); saveFokus(); renderAlles();
  zeigeAutoPauseDialog();
}
/* Rückfrage — Vorschlag = Zeit bis zur letzten Interaktion, Direkteingabe möglich. */
function zeigeAutoPauseDialog(){
  const a=S.meta.autoPause; if(!a) return;
  const k=S.karten.find(x=>x.id===a.kartenId);
  const gel=hms(Math.round(a.gelaufenMin*60)), vor=Math.round(a.vorschlagMin);
  const h='<div class="hinweisbox">Der Timer lief <b>'+gel+'</b> auf „'+esc(a.titel||(k&&k.titel)||'?')+
    '", ohne dass etwas passiert ist. Wie lange hast du wirklich gearbeitet?</div>'+
    '<div class="field"><label>Tatsächliche Dauer (Min)</label>'+
    '<input type="number" inputmode="numeric" min="0" id="apMin" value="'+vor+'">'+
    '<div class="hint">Vorschlag '+vor+' Min = bis zur letzten Interaktion. Der Wert ersetzt die gelaufene Zeit in der Karte und im Zeit-Log.</div></div>';
  openSheet('Timer lief unbeaufsichtigt', h,
    '<button class="btn ghost sm" data-apkeep="1">Volle Zeit behalten</button><button class="btn prim" data-apok="1">Übernehmen</button>');
}
function autoPauseUebernehmen(volleZeit){
  const a=S.meta.autoPause; if(!a){ closeSheet(); return; }
  const k=S.karten.find(x=>x.id===a.kartenId);
  if(k && !volleZeit){
    const neu=Math.max(0, num(el('apMin')?el('apMin').value:a.vorschlagMin));
    const delta=neu-a.gelaufenMin;                       // negativ = Zeit abziehen
    k.istSek=Math.max(0, num(k.istSek)+delta*60);
    // Denselben Intraday-Eintrag korrigieren (statt einen zweiten anzulegen) und
    // als 'autopause' markieren — so bleibt nachvollziehbar, was korrigiert wurde.
    const e=(S.intraday||[])[a.intradayIdx];
    if(e && e.kartenId===a.kartenId){ e.minuten=Math.round(neu*10)/10; e.typ='autopause'; DB.set('intraday', S.intraday); }
    saveKarten();
    toast('Zeit korrigiert auf '+Math.round(neu)+' Min');
  }
  delete S.meta.autoPause; saveMeta();
  closeSheet(); renderAlles();
}
let tickerId=null, _sekTakt=0;
function starteTicker(){
  if(tickerId) return;
  tickerId=setInterval(()=>{
    if(!(S.fokus && S.fokus.laeuft)){ clearInterval(tickerId); tickerId=null; return; }
    if(S.tag){ S.tag.letzteAktivitaetTs=jetztIso(); }   // Aktivitäts-Stempel (Kanten §6)
    if(_sekTakt%10===0) autoPausePruefen();             // §4: alle 10 s reicht völlig
    if(!(S.fokus && S.fokus.laeuft)){ clearInterval(tickerId); tickerId=null; return; }   // Auto-Pause hat gestoppt
    renderFokusleiste();
    if(tagOffen()) renderStatusbar();                   // V1.1: Live-Punkte/-Minuten/-Pace in der Statusleiste sekündlich
    // Fokus-Tacho live nachziehen (Ring/Timer/Kennzahlen/Balken der angezeigten Karte)
    if(S.ui.tab==='fokus') fokusTacho(aktiveFokusKarte());
    else if(S.ui.tab==='belohnung' && _sekTakt%5===0) renderBelohnung();   // V1.1: Belohnungsseite live (alle 5 s, Perf)
    _sekTakt++;
  }, 1000);
}

/* ══════════════════════════════════════════════════════════════════════
   5c · Tageslogik (§6) — Tag-Start · Routinen-Reset · Tagesabschluss ·
        Streaks · Punkteabzug · Kanten. Tag rein manuell (uhrzeitunabhängig).
   ══════════════════════════════════════════════════════════════════════ */
/* Ist eine Routine am Kalenderdatum fällig? (v1.0-Rhythmustypen §3.1) */
function routineFaellig(k, datum){
  if(!k.rhythmus) return false;
  const d=new Date(datum+'T12:00:00'), typ=k.rhythmus.typ;
  if(typ==='taeglich') return true;
  if(typ==='wochentage'){ const wt=((d.getDay()+6)%7)+1; return (k.rhythmus.tage||[]).includes(wt); } // Mo=1..So=7
  if(typ==='alleNTage'){
    const n=Math.max(1, num(k.rhythmus.n));
    if(!k.zuletztRoutine) return true;
    const diff=Math.round((d-new Date(k.zuletztRoutine+'T12:00:00'))/86400000);
    return diff>=n;
  }
  return false;
}
function naechsterLaufindex(datum){
  // Jeder abgeschlossene Tag steht in der Historie (Finalisieren pusht dorthin),
  // ein noch offener Tag desselben Datums ebenfalls berücksichtigen, falls (Kante)
  // ausnahmsweise nicht in der Historie.
  let n=0; (S.historie||[]).forEach(h=>{ if(h.datum===datum) n++; });
  if(S.tag && S.tag.datum===datum && !(S.historie||[]).some(h=>h.tagId===S.tag.tagId)) n++;
  return n+1;
}
/* Tag-Start (§6): neue tagId, Akku, fällige Routinen zurücksetzen. */
function tagStarten(akkuProzent){
  // §3.2 (v1.10.0): KEIN Auto-Abschluss mehr — der Tag endet, wenn Pascal ihn
  // beendet. Ein offener (auch gestriger) Tag blockiert den Neustart sichtbar.
  if(tagOffen()){ toast('Der offene Tag ('+esc(S.tag.tagId)+') muss zuerst abgeschlossen werden'); oeffneTagAbschluss(); return; }
  const datum=heuteIso();
  S.tag = neuerTag(datum, naechsterLaufindex(datum));
  S.tag.akku = (akkuProzent==null?null:Math.round(akkuProzent));
  // §5.5 (v1.13.0): Mit dem Tagesstart beginnt ein neuer Plan — die
  // ungeplant-Marken des Vortags fallen (die Kette JETZT ist der Plan).
  S.karten.forEach(k=>{ if(k.ungeplant) delete k.ungeplant; });
  S.karten.forEach(k=>{
    if(k.rhythmus && routineFaellig(k, datum)){
      k.faelligkeit=datum; k.status='offen';
      k.ticksHeute=0; k.tickWerteHeute=[]; k.istSek=0; k.tagId=null; k.punkteOverride=null;   // Tages-Ist 0 (V1.3: Override zurücksetzen), Historie bleibt
      untermenge(k.id).forEach(u=>u.done=false);
    }
  });
  // v1.1: Tagesbasis der Ist-Minuten je Karte (heute-investiert startet bei 0,
  // mehrtägige Aufgaben behalten ihre bisherige Zeit) + erste Akku-Stichprobe.
  S.tag.istMinutenStart={}; S.karten.forEach(k=>{ S.tag.istMinutenStart[k.id]=istSekLive(k)/60; });
  S.tag.streak = tagesStreakStand(false);   // Stand VOR heute (heute wird beim Abschluss gebucht)
  akkuSampleSchreiben();
  saveTag(); saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  renderAlles();
}
/* Tages-Streak (v0.38-Art, additiv): Anzahl unmittelbar zusammenhängender
   abgeschlossener Tage mit positiver Bilanz. inklHeute=true zählt den offenen
   Tag mit, wenn seine Live-Bilanz > 0 ist (für die Live-Anzeige). */
/* ══ §5 (v1.9.0) · Tages-Streak-Fortschreibung beim Tagesabschluss ══════
   Regeln: Urlaubstag = neutral (bricht nicht, verlängert nicht, letzter
   Zähl-Tag bleibt stehen). Lückentage brechen nicht, wenn sie Urlaubs-
   Snapshots tragen ODER der Urlaubsmodus aktiv ist (der „große Freeze").
   Eine 1-Tages-Lücke wird ab Streak 30 automatisch von einem Joker
   überbrückt (einer je Kalendermonat), mit ruhigem Hinweis beim nächsten
   Rendern. Sonst: Serie auf 0 → neuer Tag zählt als 1. */
const STREAK_MEILENSTEINE={ 7:{m:2500,r:0}, 30:{m:5000,r:5000}, 100:{m:10000,r:10000}, 365:{m:25000,r:25000} };
function istUrlaubsLueckentag(d){
  if(S.meta && S.meta.urlaubsmodus) return true;
  return (S.historie||[]).some(h=>h.datum===d && h.urlaub && !h.luecke);
}
function streakFortschreiben(datum, urlaub){
  if(urlaub) return;   // neutral — Serie steht, zählt aber nicht weiter
  const letzt=S.meta.streakLetzterTag;
  let neu;
  if(!letzt || letzt>=datum){ neu=Math.max(1, num(S.meta.tagesStreak)); if(!letzt) neu=1; }
  else {
    let luecke=0, d=letzt, guard=0;
    while(guard++<400){ d=anVorTage(d,-1); if(d>=datum) break; if(!istUrlaubsLueckentag(d)) luecke++; }
    if(luecke===0) neu=num(S.meta.tagesStreak)+1;
    else if(luecke===1 && jokerVerfuegbar()){
      S.meta.jokerVerbrauchtMonat=heuteApp().slice(0,7);
      S.meta.jokerHinweis=num(S.meta.tagesStreak)+1;   // ruhiger Hinweis beim nächsten Rendern
      neu=num(S.meta.tagesStreak)+1;
    }
    else neu=1;
  }
  S.meta.tagesStreak=neu;
  S.meta.tagesStreakBest=Math.max(num(S.meta.tagesStreakBest), neu);
  S.meta.streakLetzterTag=datum;
  // §5.3: Meilensteine — einmalig beim exakten Erreichen
  const ms=STREAK_MEILENSTEINE[neu];
  if(ms){
    S.meta.muenzenGesamt=num(S.meta.muenzenGesamt)+ms.m;   // Münzen-Bonus
    S.meta.rangPunkte=num(S.meta.rangPunkte)+ms.r;         // Rang-Bonus (Quelle 3, §2.2)
    S.meta.meilensteinMoment=neu;                          // Feier beim nächsten Rendern (§6.3)
  }
  saveMeta();
}
/* ALT (v1.1): Tage in Folge mit positiver Bilanz — bleibt für S.tag.streak in
   der Historie erhalten; der NEUE Multiplikator-Streak ist meta.tagesStreak. */
function tagesStreakStand(inklHeute){
  const tage=(S.historie||[]).filter(h=>!h.luecke).slice().sort((a,b)=> (a.datum<b.datum?1:a.datum>b.datum?-1:(num(b.laufindex)-num(a.laufindex))) );
  let s=0;
  for(const h of tage){ if(num(h.punkteBilanz)>0) s++; else break; }
  if(inklHeute && tagOffen() && tagesPunkteLive()>0) s++;
  return s;
}
/* Streak-Buchung bei Routinen-Erledigung (aus karteAbhaken). */
function routineErledigtBuchen(k){
  if(!k.rhythmus) return;
  if(k.zuletztRoutine!==aktuelleTagId().slice(0,10)){ k.streak=num(k.streak)+1; }
  k.zuletztRoutine = heuteApp();
}
/* Generierter Abzug-Vorschlag beim Schieben (§4): grob nach Priorität/Punkten. */
function abzugVorschlag(k){
  if(urlaubHeute()) return 0;   // §5 (1.8.1)
  // §12.2 (v1.12.0): Vorschlag = 10 % der Prognose (auf 10 gerundet)
  return Math.max(10, Math.round(Math.max(0,kartePunkteGeplant(k))*0.1/10)*10);
}
/* Karte im Abschluss schieben — mit sofort gebuchtem Punkteabzug. */
function karteSchieben(k, datum, uhrzeit, abzug){
  k.faelligkeit = datum || null;
  k.uhrzeit = uhrzeit || null;
  if(num(abzug)>0 && S.tag){ S.tag.abzuegeBilanz = num(S.tag.abzuegeBilanz) + num(abzug); }
  // §3.2 (v1.13.0): Schub protokollieren — Abzug läuft hier über abzuegeBilanz,
  // deshalb Marker mit 0 Punkten (kein Doppelabzug); Ziel fürs „rein" am Zieltag.
  if(S.tag) (S.tag.log=S.tag.log||[]).push({ itemId:k.id, titel:k.titel||'', domain:k.domain, art:'schub', punkte:0, ts:jetztIso() });
  logIntraday(k,{punkte:0, typ:'schub', ziel:datum||null});
  if(k.rhythmus && tagOffen() && routineFaellig(k, heuteApp()) && !(S.tag.routinenBilanz||[]).some(b=>b.id===k.id))
    (S.tag.routinenBilanz=S.tag.routinenBilanz||[]).push({ id:k.id, titel:k.titel, geschoben:true });   // §3.1
  k.schiebeZaehler=num(k.schiebeZaehler)+1;   // §6.4
}
/* Routinen-Bilanz im Abschluss: „Verpasst" (Streak bricht) / „Heute nicht nötig". */
function routineBilanz(k, verpasst){
  if(verpasst){ k.streak=0; }
  (S.tag.routinenBilanz=S.tag.routinenBilanz||[]).push({ id:k.id, titel:k.titel, verpasst:!!verpasst, entschuldigt:!verpasst });
}
/* Tagesabschluss finalisieren: Timer stoppen, Bilanz einfrieren, Wohlstand
   buchen, Snapshot in Historie. */
function tagAbschlussFinalisieren(){
  if(S.fokus && S.fokus.laeuft) fokusZeitEinbuchen();   // laufenden Timer stoppen+buchen
  // §3.2 (v1.10.0): Die Routinen-Bilanz („verpasst") lief bisher NUR im
  // Auto-Abschluss — der ist weg. Jetzt beim Finalisieren, mit Dedup gegen den
  // Abräum-Flow und OHNE erledigte/getickte Routinen als verpasst zu werten.
  S.karten.forEach(k=>{
    if(!(k.rhythmus && k.status==='offen' && !k.freeze && routineFaellig(k, S.tag.datum))) return;
    if((S.tag.routinenBilanz||[]).some(b=>b.id===k.id)) return;
    if(routErledigtHeute(k) || k.zuletztRoutine===S.tag.datum) return;
    routineBilanz(k, !urlaubHeute());
  });
  const bilanz = tagesPunkteLive();                      // erledigte heute − Abzüge (+ nichts Laufendes mehr)
  S.tag.punkteBilanz = Math.round(bilanz);
  S.tag.endeTs = jetztIso();
  S.tag.streak = bilanz>0 ? tagesStreakStand(false)+1 : 0;   // v1.1: Tages-Streak einfrieren
  S.meta.wohlstand = num(S.meta.wohlstand) + bilanz;     // §4: kumulativ, nie Reset
  // Snapshot für Statistiken (§9) + Belohnungs-Diagramme (v1.1: log/akkuVerlauf/streak)
  S.tag.urlaub=urlaubHeute();   // §5.4 (1.8.1): Markierung gehoert an den TAG
  // ══ §2/§5 (v1.9.0) · Spiel-Ebene beim Tagesabschluss ═══════════════════
  // Zufluss = Tagesbilanz × Streakfaktor DES TAGES (der Faktor, der den ganzen
  // Tag sichtbar war — der Streak selbst wird erst DANACH fortgeschrieben).
  // Wirkt ausschließlich auf muenzenGesamt/rangPunkte, nie auf die Mess-Ebene.
  {
    const faktor=streakFaktor();
    const bonus=Math.max(0, num(S.tag.spielBonus));   // §6 (v1.11.0): Kauf-Tagespunkte (Altbestand — seit §4.3 v1.13.0 hebt der Kauf den Faktor)
    // §4.3 (v1.13.0): der Upgrade-Faktor wirkt auf die MÜNZEN (Spiel-Ebene)
    const zufluss=Math.round(Math.max(0, bilanz)*faktor*upgradeFaktor() + bonus);
    S.meta.muenzenGesamt=num(S.meta.muenzenGesamt)+zufluss;
    // rangPunkte ist seit v1.11.0 reine Lebenswerk-Summe (Statistik) — sie
    // wächst mit dem echten Verdienst; Kauf-Bonus/Upgrade-Faktor zählen nicht.
    S.meta.rangPunkte=num(S.meta.rangPunkte)+Math.round(Math.max(0, bilanz)*faktor);
    S.tag.spielZufluss=zufluss; S.tag.spielFaktor=faktor;   // für die Abschluss-Abfolge (§6.2)
    streakFortschreiben(S.tag.datum, S.tag.urlaub);
  }
  // §4 (v1.11.0): Stern-Tageswert festschreiben — Geld-Score der heute
  // abgeschlossenen DFM-Aufgaben + getrackte Minuten (Null-Minuten-Regel).
  {
    const r=tagesRate(belFensterDatum(S.tag.startTs||jetztIso()));
    if(!S.meta.sternTage) S.meta.sternTage={};
    S.meta.sternTage[S.tag.datum]={ geld:Math.round(sternGeldHeute()), min:r?Math.round(r.min):0 };
    const keys=Object.keys(S.meta.sternTage).sort();
    while(keys.length>60){ delete S.meta.sternTage[keys.shift()]; }   // Kappe: 60 Tage reichen für jedes 14er-Fenster
    sternKalibrierenPruefen();
  }
  S.historie.push({
    tagId:S.tag.tagId, datum:S.tag.datum, laufindex:S.tag.laufindex, urlaub:S.tag.urlaub, spielZufluss:num(S.tag.spielZufluss),
    startTs:S.tag.startTs, endeTs:S.tag.endeTs, akku:S.tag.akku,
    punkteBilanz:S.tag.punkteBilanz, abzuege:num(S.tag.abzuegeBilanz),
    routinenBilanz:S.tag.routinenBilanz||[], zeit:tagesZeitAggregat(S.tag.tagId), luecke:false,
    log:(S.tag.log||[]).slice(), akkuVerlauf:(S.tag.akkuVerlauf||[]).slice(),
    streak:S.tag.streak, erledigtHeute:num(S.tag.erledigtHeute)
  });
  saveTag(); saveHistorie(); saveMeta(); saveKarten();
}
/* §3.2 (v1.10.0): Beim Öffnen wird ein offener Vortag nur noch SICHTBAR
   gemacht (Banner + Toast mit Abschluss-Knopf), nie mehr automatisch
   abgeschlossen. */
function pruefeTagKante(){
  if(!S.tag) return;
  if(!tagOffen()) return;                       // schon abgeschlossen
  if(S.tag.datum===heuteIso()) return;          // Tag über Mitternacht ok, gleicher Start-Tag
  toast('⚠️ Der Tag vom '+S.tag.datum.slice(8)+'.'+S.tag.datum.slice(5,7)+'. ist noch offen — bitte abschließen');
}

/* A1: Priorisierung direkt im Tag-Start (nach Energie/Motivation) — Heute-Stapel
   in Wunschreihenfolge antippen (früher Tagesabschluss-Durchgang 2). */
function renderTagStartPrio(){
  rangCacheBauen();
  // §12.1 (v1.12.0): Grundlage sind die beiden Ketten (Auto-Befuellung baut
  // sie aus Morgenroutinen + faelligen Aufgaben zusammen). Der STATUS der
  // Karten wird dabei nicht veraendert — Kettenzugehoerigkeit heisst
  // „heute dran", nicht „in Arbeit".
  const ks=ketteKarten().filter(k=>k.status==='offen');
  const order=tagStartTmp.sortOrder||(tagStartTmp.sortOrder=[]);
  ks.sort((a,b)=>{ const ia=order.indexOf(a.id), ib=order.indexOf(b.id); return (ia<0?9e9:ia)-(ib<0?9e9:ib); });
  let h='<p class="d"><b>Heute priorisieren.</b> Tippe die Karten in der Reihenfolge an, in der du sie heute angehen willst. (Optional — „Fertig" reicht auch ohne.)</p>';
  if(!ks.length){ h+='<div class="card"><p class="d" style="text-align:center">Nichts im „Heute"-Stapel.</p></div>'; }
  ks.forEach(k=>{ const pos=order.indexOf(k.id);
    h+='<div class="abcard tap '+(pos>=0?'num':'')+'" data-tsprio="'+k.id+'" style="border-left-color:'+karteFarbe(k)+'">'+
      '<div class="tapnum">'+(pos>=0?(pos+1):'·')+'</div>'+
      '<div><div class="abtitel">'+esc(k.titel)+'</div><div class="abmeta">'+esc(fmtDatum(k.faelligkeit))+' · '+num(k.sollMin)+'′</div></div>'+
    '</div>';
  });
  const foot='<button class="btn ghost sm" data-tsprioreset="1">Reset</button><button class="btn prim" data-tsfinish="1">Fertig</button>';
  openSheet('Neuen Tag starten (2/2)', h, foot);
}
function tagStartPrioFinish(){
  const order=tagStartTmp.sortOrder||[];
  // §2.2 (v1.6.0): Die Tagesplanung schreibt direkt die Tageskette „Heute" —
  // angetippte Karten in Wunschreihenfolge zuerst, der Rest der fälligen Karten
  // hinten dran (Auto-Befüllung, manuell nachjustierbar).
  const rest=tagesKette().filter(id=>order.indexOf(id)<0);
  ketteSetzen(order.concat(rest));
  closeSheet(); renderAlles(); toast('Tag gestartet'+(order.length?' · priorisiert':''));
}

/* ── Tagesabschluss (2 Durchgänge) ────────────────────────────────── */
let abschlussTmp=null;
function abraeumKarten(){
  if(urlaubHeute()) return [];   // §5 (1.8.1): keine Abraeumpflicht im Urlaub
  const h=heuteApp();
  return S.karten.filter(k=>k.status==='offen' && !k.freeze && k.faelligkeit && (k.faelligkeit===h || k.faelligkeit<h));   // A4: Eingefrorene raus
}
function morgenIso(){ const d=new Date(heuteApp()+'T12:00:00'); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function oeffneTagAbschluss(){
  if(!tagOffen()){ toast('Kein offener Tag'); return; }
  abschlussTmp={ step:1, schiebenFor:null, abzug:0, sortOrder:[] };
  renderAbschluss();
}
function renderAbschluss(){ abschlussTmp.step===1 ? renderAbschlussAbraeumen() : renderAbschlussSortieren(); }
function renderAbschlussAbraeumen(){

  const karten=abraeumKarten();

    const istRoutine=!!k.rhythmus, tickartig=istTickKarte(k);

        '<div class="abzugsel">Punkteverlust: '+
          [['0','ohne'],[String(vor),'Vorschlag −'+vor]].map(([v,t])=>'<button class="chip '+(num(abschlussTmp.abzug)===num(v)&&!abschlussTmp.abzugSelbst?'on rot':'')+'" data-abzug="'+v+'">'+t+'</button>').join('')+
          '<input type="number" inputmode="numeric" id="ab-abzug" placeholder="selbst" style="width:76px" value="'+(abschlussTmp.abzugSelbst?num(abschlussTmp.abzug):'')+'">'+
        '</div>'+

function renderAbschlussSortieren(){
  rangCacheBauen();
  const morgen=morgenIso(), h0=heuteApp();
  // Morgen-Stapel = offene Karten, die morgen fällig/übrig sind
  const ks=S.karten.filter(k=>k.status==='offen' && k.faelligkeit && k.faelligkeit<=morgen);
  let h='<p class="d"><b>Durchgang 2 — Morgen sortieren.</b> Tippe die Karten in der Reihenfolge an, in der du sie morgen angehen willst.</p>';
  if(!ks.length){ h+='<div class="card"><p class="d" style="text-align:center">Nichts für morgen.</p></div>'; }

  const order=abschlussTmp.sortOrder;
  ks.sort((a,b)=>{ const ia=order.indexOf(a.id), ib=order.indexOf(b.id); return (ia<0?9e9:ia)-(ib<0?9e9:ib); });
  ks.forEach(k=>{

  });
  const foot='<button class="btn ghost sm" data-absortreset="1">Reset</button><button class="btn prim" data-abfinish="1">Abschließen + Backup</button>';
  openSheet('Tagesabschluss (2/2)', h, foot);
}
function abschlussFinish(){
  // §12.2 (v1.12.0): Die Morgen-Reihenfolge schreibt direkt die Ketten —
  // getappte Karten zuerst, der Rest bleibt dahinter; beim Tageswechsel
  // rollt die Reihenfolge mit.
  const order=abschlussTmp.sortOrder;
  if(order.length){
    const rest=tagesKette().filter(id=>order.indexOf(id)<0);
    ketteSetzen(order.concat(rest));
  }
  tagAbschlussFinalisieren();
  const paket=tagBackupPaket();
  closeSheet(); renderAlles();
  toast('Tag abgeschlossen · '+S.tag.punkteBilanz+' P');

  // Abschluss zeigt jetzt dasselbe Kopier-Sheet wie der Sync-Button; der
  // Download bleibt als zusätzliche Option erhalten.
  oeffneTagAbschlussPaket(paket);
}

function tagBackupPaket(){

function backupDownload(paket, name){
  const href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(paket,null,2));
  const a=document.createElement('a'); a.href=href; a.download=name||'fokus-backup.json';

/* ══════════════════════════════════════════════════════════════════════

/* ── D3 Karten-Detail ────────────────────────────────────────────── */
let entwurf=null;     // Arbeitskopie der Karte im offenen Sheet
let entwurfSubs=null; // Arbeitskopie der Unteraufgaben
let entwurfNeu=false;
let _detailMehrAuf=false, _detailAutofocus=false;   // U6-D: „Weitere Einstellungen"-Zustand + Titel-Autofokus

function oeffneDetail(kid){
  // Läuft der Timer auf dieser Karte, erst die Zeit einbuchen (pausieren),
  // damit die Bearbeitung nicht die laufende Ist-Zeit überschreibt.
  if(kid && S.fokus && S.fokus.karteId===kid && S.fokus.laeuft){ fokusZeitEinbuchen(); renderFokusleiste(); }
  const orig = kid ? S.karten.find(k=>k.id===kid) : neueKarte({faelligkeit:heuteApp()});
  entwurfNeu = !kid;
  entwurf = JSON.parse(JSON.stringify(orig));
  entwurfSubs = kid ? JSON.parse(JSON.stringify(untermenge(kid))) : [];

  _detailAutofocus = entwurfNeu;  // Neuanlage: Titel autofokussieren
  const sb=el('sheetBody'); if(sb) sb.scrollTop=0;   // V3: frisch oben starten (nicht vom Vor-Sheet erben)

/* Unteraufgaben-Balance (§3.2) */
function subBalanceNachAdd(){
  // Neue Unteraufgabe: Parent-Gesamtzeit gleichmäßig auf alle aufteilen.
  const n=entwurfSubs.length; if(!n) return;
  const total=num(entwurf.sollMin);
  const je=Math.round(total/n);
  entwurfSubs.forEach((u,i)=> u.sollMin = (i===n-1) ? (total-je*(n-1)) : je );
}
function subParentAngleichen(){
  // Parent-Soll = Σ Unteraufgaben (Differenz wird mit dem Parent verrechnet).
  if(!entwurfSubs.length) return;
  // FIX2 (v1.5.2): Sind ALLE Subs 0′ und trägt der Parent einen Wert, wird der
  // Parent-Wert gleichmäßig auf die Subs verteilt (statt den Parent auf 0 zu
  // sperren) — Invariante §3.2 ist danach wieder erfüllt.
  const alleNull = entwurfSubs.every(u=>num(u.sollMin)===0);
  if(alleNull && num(entwurf.sollMin)>0){ subBalanceNachAdd(); return; }
  entwurf.sollMin = entwurfSubs.reduce((a,u)=>a+num(u.sollMin),0);
}
function detailSpeichern(){
  entwurf.titel = (entwurf.titel||'').trim();
  if(!entwurf.titel){ toast('Titel fehlt'); return; }
  if(entwurf.domain!=='dfm'){ entwurf.projekt=null; entwurf.geldScore=0; }
  if(!Array.isArray(entwurf.tickKurve)||!entwurf.tickKurve.length) entwurf.tickKurve=[0];
  subParentAngleichen();
  // U6-D: Zeit-Ist-Nachtrag — Differenz zur bisher getrackten Zeit auf heute buchen
  if(entwurf._istMinEdit!=null){
    const delta = num(entwurf._istMinEdit) - Math.round(num(entwurf.istSek)/60);
    if(delta!==0){ entwurf.istSek=Math.max(0, num(entwurf.istSek)+delta*60); if(delta>0) logIntraday(entwurf,{minuten:delta,typ:'nachtrag'}); }
  }
  delete entwurf._istMinEdit;
  // §8 (v1.12.0): „Neu anlegen" aus dem Wiederholen-Dialog — die neue Karte
  // wandert OBEN in die Kette ihrer Domäne (Flag aus der Vorbelegung).
  const kettenOben=!!entwurf.kettenOben; delete entwurf.kettenOben;
  const idx=S.karten.findIndex(k=>k.id===entwurf.id);
  if(idx>=0) S.karten[idx]=entwurf; else S.karten.push(entwurf);
  if(kettenOben && idx<0){
    const st=ketteState(entwurf.domain); tagesKetteDom(entwurf.domain);
    st.ids=st.ids.filter(x=>x!==entwurf.id); st.ids.unshift(entwurf.id);
    st.entfernt=(st.entfernt||[]).filter(x=>x!==entwurf.id);
    if(tagOffen()) entwurf.ungeplant=true;   // §5.5 (v1.13.0)
    saveMeta(); ketteHistLog(entwurf.domain);
  }
  // Unteraufgaben ersetzen
  S.unteraufgaben = S.unteraufgaben.filter(u=>u.parentId!==entwurf.id).concat(
    entwurfSubs.map(u=>Object.assign(neueUnteraufgabe(entwurf.id), u, {parentId:entwurf.id}))
  );
  // Erledigt/archiviert + war im Fokus → Fokus beenden.
  if((entwurf.status==='erledigt'||entwurf.status==='archiviert') && S.fokus && S.fokus.karteId===entwurf.id){ S.fokus=null; saveFokus(); }
  beruehre(entwurf);                                     // A7: Edit zählt als Interaktion
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  closeSheet(); renderAlles();
  // §3.1 (v1.10.0): eine neu angelegte Karte wird sofort gestartet und ist der Fokus
  if(entwurfNeu){ fokusStarten(entwurf.id, null); setTab('fokus'); }
  toast(entwurfNeu?'Karte angelegt & gestartet':'Gespeichert'); haptik(12);
}
/* A3: einen Tick buchen (Timer-/Counter-Karten). Erhöht ticksHeute; Punkte
   kommen über die Tick-Kurve (tickSumme) in tickPunkte/kartePunkte. */
/* §9 (v1.8.0): Ein Tick bucht tickWert — oder den in der Tick-Zeile (§9.4)
   eingegebenen Override. Der erste Tick des Tages bucht bei Routinen den
   Streak (bisher nur beim Abhaken — seit §7 werden Tick-Routinen aber getickt,
   nie abgehakt, sonst ginge der Streak verloren). */
function karteTick(kid, fromDetail, wertOverride){
  const k = kid ? S.karten.find(x=>x.id===kid) : entwurf;
  if(!k) return;
  const vor=tickPunkte(k);
  const wert = (wertOverride!=null && wertOverride!=='') ? num(wertOverride) : tickWertEff(k);   // §2 (1.13.0): erbt Standard
  if(!Array.isArray(k.tickWerteHeute)) k.tickWerteHeute=[];
  k.tickWerteHeute.push(wert);
  k.ticksHeute = num(k.ticksHeute)+1;
  if(k.rhythmus && num(k.ticksHeute)===1) routineErledigtBuchen(k);   // §7: Streak bleibt intakt
  if(S.tag) S.tag.letzteAktivitaetTs=jetztIso();
  beruehre(k); logIntraday(k,{punkte:tickPunkte(k)-vor,typ:'tick'});   // A7 + B0
  momentBuchung(tickPunkte(k)-vor);                                    // §6.1 (1.9.0)
  haptik(12);
  if(!fromDetail){ saveKarten(); saveTag(); renderAlles(); }
}
/* §9: Gegenstück −1 — nimmt den letzten heutigen Tick samt seinem Wert zurück. */
function karteTickMinus(k){
  if(!k || num(k.ticksHeute)<=0) return false;
  if(Array.isArray(k.tickWerteHeute) && k.tickWerteHeute.length) k.tickWerteHeute.pop();
  k.ticksHeute=Math.max(0, num(k.ticksHeute)-1);
  if(k.rhythmus && num(k.ticksHeute)===0 && k.zuletztRoutine===heuteApp()){
    k.streak=Math.max(0,num(k.streak)-1); k.zuletztRoutine=null;      // Streak-Buchung des Tages zurück
  }
  beruehre(k); return true;
}
/* A4: Schieben um +24 h. Datum +1 Tag ab aktueller Fälligkeit (sonst heute);
   Uhrzeit bleibt. Vorschlag Minuspunkte = 10 % der Punkte-Prognose (sollMin/60
   × Rate), auf 5 gerundet, min. 10. */
function datumPlus1(iso){ const d=new Date((iso||heuteApp())+'T12:00:00'); d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function schiebeVorschlag(k){ if(urlaubHeute()) return 0;   // §5 (1.8.1): keine Minuspunkte im Urlaub
  const prog=num(k.sollMin)/60*rate(k); return Math.max(10, Math.round(prog*0.1/5)*5); }
/* ══ §1.2 (v1.13.0) · Verschieben braucht IMMER eine echte Datumsauswahl —

  const inp=el('schiebDatum');
  const v=inp && /^\d{4}-\d{2}-\d{2}$/.test(inp.value) ? inp.value : null;
  // §1.3-FIX: Ziel nie in der Vergangenheit — Basis ist HEUTE. (Der Altfehler:
  // datumPlus1 rechnete ab der ALTEN Fälligkeit; bei überfälligen Karten blieb
  // das Ziel in der Vergangenheit und „nichts passierte".)
  return (v && v>heuteApp()) ? v : datumPlus1(heuteApp());
}
function oeffneSchieben(kid){

/* §3.2 (v1.13.0): Jeder Schub wird protokolliert — Kategorie GESCHOBEN am
   Ausgangstag (kein Abgang: die Arbeit ist nicht weg, nur später), Ankunft am
   Zieltag über das ziel-Feld des Intraday-Eintrags. §3.1: eine heute fällige
   Routine zählt in der Tagesbilanz als „geschoben". §6.4: Schiebe-Zähler. */
function schubProtokoll(k, ziel, abzug){
  if(S.tag) (S.tag.log=S.tag.log||[]).push({ itemId:k.id, titel:k.titel||'', domain:k.domain, art:'schub',
    punkte:-Math.abs(num(abzug)), ts:jetztIso() });
  logIntraday(k,{punkte:-Math.abs(num(abzug)), typ:'schub', ziel:ziel||null});
  if(k.rhythmus && tagOffen() && routineFaellig(k, heuteApp()) && !(S.tag.routinenBilanz||[]).some(b=>b.id===k.id))
    (S.tag.routinenBilanz=S.tag.routinenBilanz||[]).push({ id:k.id, titel:k.titel, geschoben:true });
  k.schiebeZaehler=num(k.schiebeZaehler)+1;
}
/* §12.2 (v1.12.0)-Regel gilt jetzt bei JEDEM Schieben: das Zieldatum steuert
   die Ketten — raus aus der heutigen, die Auto-Befüllung des Zieltags holt
   die Karte zurück. */
function ketteRausHeute(k){
  const st=ketteState(k.domain);
  const i=st.ids.indexOf(k.id);
  if(i>=0){ st.ids.splice(i,1); if(!Array.isArray(st.entfernt)) st.entfernt=[];
    if(st.entfernt.indexOf(k.id)<0) st.entfernt.push(k.id); saveMeta(); ketteHistLog(k.domain); }
}
function karteSchiebenA4(kid, mitAbzug, abzug){
  const k=S.karten.find(x=>x.id===kid); if(!k) return;
  const ziel=schiebDatumLesen();
  k.faelligkeit=ziel;   // Uhrzeit unverändert
  const ab=mitAbzug?Math.abs(num(abzug)):0;
  schubProtokoll(k, ziel, ab);
  ketteRausHeute(k);
  beruehre(k);                                                    // A7
  saveKarten(); saveTag(); closeSheet(); renderAlles();
  toast('Auf '+fmtDatum(k.faelligkeit)+' ('+wochentagLang(k.faelligkeit)+') geschoben'+(ab>0?' · −'+ab+' P':'')); haptik(15);
  blockadeVorschlagPruefen(k);   // §6.4
}
/* ══ §6.4 (v1.13.0) · Blockade aus dem Schieben LERNEN — Vorschlag ab der
   dritten Verschiebung derselben Karte, Übernahme NUR nach Freigabe (eine
   automatische Hebung hieße mehr P/Std für aufgeschobene Arbeit). ══ */
const BLOCKADE_VORSCHLAG_AB=3;
function blockadeVorschlagPruefen(k){
  if(!k || k.status!=='offen') return;
  const n=num(k.schiebeZaehler);
  if(n<BLOCKADE_VORSCHLAG_AB || n%BLOCKADE_VORSCHLAG_AB!==0) return;
  const cur=num(k.blockade,1);
  const next=[1,1.5,2].find(x=>x>cur+0.01);
  if(!next) return;
  openSheet('Blockade heben?',
    '<p class="d">„<b>'+esc(k.titel||'(ohne Titel)')+'</b>" wurde zum <b>'+n+'.</b> Mal geschoben — das deutet auf eine echte Blockade hin.</p>'+
    '<p class="d">Vorschlag: Blockade von <b>'+String(cur).replace('.',',')+'</b> auf <b>'+String(next).replace('.',',')+'</b> heben. Die Punkterate der Karte steigt dadurch (Rate = Basis × Komplexität × Energie × Blockade). <b>Ohne Freigabe ändert sich nichts.</b></p>',
    '<button class="btn ghost sm" data-close="1">So lassen</button>'+
    '<button class="btn prim" data-blockadeheben="'+k.id+'" data-neu="'+next+'">Auf '+String(next).replace('.',',')+' heben</button>');
}
function karteAbhaken(kid, fromDetail){
  const k = kid ? S.karten.find(x=>x.id===kid) : entwurf;
  if(!k) return;
  // §4 (v1.9.1): die alte A3-Umleitung „Tick-Karte → karteTick" entfällt —
  // Ticken läuft über ＋ (data-tickplus), ✓ schließt die Karte ab.
  if(k.status==='erledigt'){
    // §6 (v1.6.0): Reaktivierung ist eine KORREKTUR an derselben Karte —
    // kein Duplikat mehr (die v1.2.1-Regel entfällt). Der oberste
    // Abschluss-Snapshot wird gepoppt und der Stand davor wiederhergestellt.
    logPunktEntfernen(k);                                 // v1.1: Punkt-Ereignis zurücknehmen (VOR override-Reset, damit der gebuchte Wert stimmt)
    abschlussZuruecknehmen(k);
    k.status='offen'; k.tagId=null;
    logIntraday(k,{punkte:0, typ:'wiederoffen'});         // §3.2 (v1.13.0): Wiedereröffnung = „rein"
    if(k.rhythmus && k.zuletztRoutine===heuteApp()){ k.streak=Math.max(0,num(k.streak)-1); k.zuletztRoutine=null; }
  } else {
    // Läuft der Timer auf dieser Karte → erst Zeit einbuchen; danach rückt die
    // nächste Karte aus derselben Quelle nach (§3.1 1.10.0), sonst Fokus-Ende.
    if(!fromDetail && S.fokus && S.fokus.karteId===k.id){
      fokusZeitEinbuchen();
      if(!fokusNachruecken(k.id)){ S.fokus=null; saveFokus(); if(S.fokusQuelleLeerToast!==false) toast('Liste leer — Fokus beendet'); }
    }
    abschlussSnapshot(k);                                // §6.1: Stand VOR dem Abschluss sichern
    k.status='erledigt'; k.tagId=aktuelleTagId();
    if(k.rhythmus) routineErledigtBuchen(k);              // Streak + zuletztRoutine
    if(S.tag) S.tag.letzteAktivitaetTs=jetztIso();
    logPunktSchreiben(k);                                 // v1.1: Punkt-Ereignis (Verlauf/Kennzahlen)
    logIntraday(k,{punkte:kartePunkte(k),typ:'abhaken'}); // B0: Intraday-Buchung
    momentBuchung(kartePunkte(k));                        // §6.1 (1.9.0)
    konfetti(); haptik(20);
  }
  beruehre(k);                                             // A7: jede Interaktion zählt
  gruppeNachAenderung(k.id);                               // §3 (1.6.1): Komplett-Bonus nachziehen
  if(!fromDetail){ saveKarten(); saveTag(); renderAlles(); }
}
/* ══════════════════════════════════════════════════════════════════════
   §6.1 + §7 (v1.6.0) · Abschluss-Snapshots und Bonus-Glättung
   Beim Abschließen wird der Stand VORHER auf einen Stack karte.abschluesse[]
   gelegt (Stack, damit mehrfaches Abschließen/Zurückholen funktioniert).
   Zusätzlich wird der Bonus-Anteil rückwirkend auf die Tage verteilt, an denen
   tatsächlich an der Karte gearbeitet wurde — reine Auswertungs-Logik,
   punkteIst bleibt kumulativ und ereignisbasiert.
   ══════════════════════════════════════════════════════════════════════ */
/* Tagesweise Ist-Minuten dieser Karte aus dem Intraday-Log (Timer + Nachträge).
   Liefert {datum: minuten}. Für Karten aus der Zeit vor dem Intraday-Log
   (< UP4-B) bleibt das leer → Fallback: Bonus bleibt am Abschlusstag (§7). */
function kartenMinutenProTag(kid){
  const out={};
  (S.intraday||[]).forEach(e=>{
    if(e.kartenId!==kid || !e.ts) return;
    const m=num(e.minuten); if(m<=0) return;
    const d=String(e.ts).slice(0,10); out[d]=(out[d]||0)+m;
  });
  return out;
}
/* §7: Bonus-Anteil des Abschlusses = Abhakbonus + Σ Sub-Boni der TATSÄCHLICH
   abgehakten Unteraufgaben (subBonusErreicht). Der zeitbasierte Anteil liegt
   bereits auf den richtigen Tagen und bleibt unangetastet. */
function abschlussBonusAnteil(k){
  return Math.max(0, abhakbonusDefault(k) + subBonusErreicht(k));
}
/* §7: Bonus anteilig nach den je Tag getrackten Minuten verteilen. */
function glaettungBerechnen(k, bonus){
  const proTag=kartenMinutenProTag(k.id);
  const tage=Object.keys(proTag).sort();
  const summe=tage.reduce((a,d)=>a+proTag[d],0);
  if(!tage.length || summe<=0 || bonus<=0) return [];   // Fallback: bleibt am Abschlusstag
  let rest=bonus, out=[];
  tage.forEach((d,i)=>{
    const p = (i===tage.length-1) ? rest : Math.round(bonus*proTag[d]/summe);
    rest-=p; out.push({datum:d, punkte:p});
  });
  return out;
}
/* §6.1: Snapshot des Standes VOR dem Abschluss auf den Stack legen. */
function abschlussSnapshot(k){
  if(!Array.isArray(k.abschluesse)) k.abschluesse=[];
  const bonus=abschlussBonusAnteil(k);
  k.abschluesse.push({
    ts: jetztIso(),
    tagId: aktuelleTagId(),
    punkteIstVorher: Math.round(kartePunkte(k)),
    istMinVorher: Math.round(num(k.istSek)/60),
    bonusPunkte: bonus,
    subsDoneVorher: untermenge(k.id).filter(u=>u.done).map(u=>u.id),
    glaettung: glaettungBerechnen(k, bonus)
  });
}
/* §6.2: obersten Snapshot poppen und den Stand davor wiederherstellen. */
function abschlussZuruecknehmen(k){
  if(!Array.isArray(k.abschluesse) || !k.abschluesse.length){
    // §6.2 Altbestand ohne Snapshot: NICHT verweigern — Karte öffnen und die
    // Punkte ausdrücklich UNVERÄNDERT lassen (nicht rückrechenbar), mit Hinweis.
    toast('Zurückgeholt · Punkte dieser Altkarte sind nicht rückrechenbar');
    return false;
  }
  const s=k.abschluesse.pop();
  k.istSek=Math.max(0, num(s.istMinVorher)*60);
  k.punkteOverride = (s.punkteIstVorher!=null) ? num(s.punkteIstVorher) : null;
  const done=new Set(s.subsDoneVorher||[]);
  untermenge(k.id).forEach(u=>{ u.done = done.has(u.id); });
  DB.set('unteraufgaben', S.unteraufgaben);
  return true;
}
/* §7 (v1.6.0) / §3 (v1.7.1): Bonus-Verschiebungen aller abgeschlossenen Karten
   für die Statistik — Abschlusstag negativ, Arbeitstage positiv. Der Bonus
   gehört zu DER Karte, an der er entstand: jedes Delta trägt deshalb Domäne
   und Kartenart mit, damit auch die gefilterten Sichten denselben
   Umbuchungsschritt anwenden und Summe(Arten) = Alle-Sicht bleibt.
   Liefert {datum: {gesamt, dom:{dfm,privat}, art:{'Art|dom':delta}}}. */
function glaettungDeltas(){
  const out={};
  S.karten.forEach(k=>{
    const dom=(k.domain==='dfm')?'dfm':'privat', key=kartenArt(k)+'|'+dom;
    const add=(d,p)=>{ const o=out[d]||(out[d]={gesamt:0, dom:{dfm:0,privat:0}, art:{}});
      o.gesamt+=p; o.dom[dom]+=p; o.art[key]=(o.art[key]||0)+p; };
    (k.abschluesse||[]).forEach(s=>{
      const g=s.glaettung; if(!Array.isArray(g) || !g.length) return;
      const abTag=String(s.tagId||'').slice(0,10); if(!abTag) return;
      add(abTag, -num(s.bonusPunkte));
      g.forEach(x=>add(x.datum, num(x.punkte)));
    });
  });
  return out;
}
/* v1.1: Punkt-Ereignisse des Tages (für Intraday-Kurve & Kennzahlen). Ein
   Eintrag je Abschluss mit Zeitstempel + Punktwert; Rücknahme entfernt den
   letzten passenden Eintrag. Rein additiv, nicht im §8-Sync-Export. */
function logPunktSchreiben(k){
  if(!S.tag) return;
  (S.tag.log=S.tag.log||[]).push({ itemId:k.id, titel:k.titel||'', domain:k.domain, art:kartenArt(k),
                                    punkte:Math.round(kartePunkte(k)), ts:jetztIso() });
  S.tag.erledigtHeute=num(S.tag.erledigtHeute)+1;
}
function logPunktEntfernen(k){
  if(!S.tag || !S.tag.log) return;
  for(let i=S.tag.log.length-1;i>=0;i--){ if(S.tag.log[i].itemId===k.id){ S.tag.log.splice(i,1); break; } }
  S.tag.erledigtHeute=Math.max(0, num(S.tag.erledigtHeute)-1);
}
/* V1.3 (vereinheitlicht mit U6-A6): erledigte/beliebige Karte wieder öffnen =
   IMMER ein frisches, offenes Duplikat — inkl. aller Unteraufgaben (neu,
   unabgehakt, neue App-IDs), ohne airtableId (nächster Sync = Neuanlage),
   Ist/Punkte/Override zurückgesetzt. Das Original bleibt vollständig erhalten
   (Statistik/Punkte/Zeiten unangetastet, kein Punktabzug). opts.starten=true
   nimmt das Duplikat direkt in den Fokus (Timer läuft). Ein Codepfad für
   „🔄 Neu starten", ▶ auf erledigter Zeile und Timer-Start. */
function karteNeuStarten(kid, opts){
  opts=opts||{};
  const o=S.karten.find(k=>k.id===kid); if(!o) return;
  const kopie=neueKarte({
    domain:o.domain, titel:o.titel, prioritaet:o.prioritaet, projekt:o.projekt, geldScore:num(o.geldScore),
    sollMin:num(o.sollMin), komplex:o.komplex, energie:o.energie, blockade:o.blockade,
    punkteProStd:o.punkteProStd, akkuProStd:o.akkuProStd, abhakbonus:o.abhakbonus,
    zeitStufen:o.zeitStufen?JSON.parse(JSON.stringify(o.zeitStufen)):null,
    tickKurve:Array.isArray(o.tickKurve)?o.tickKurve.slice():[0], timerFlag:o.timerFlag,
    rhythmus:o.rhythmus?JSON.parse(JSON.stringify(o.rhythmus)):null,
    notiz:o.notiz, kommentarClaude:o.kommentarClaude, gruppeId:o.gruppeId,
    faelligkeit:heuteApp()
    // airtableId/id/erstelltTs/istSek(0)/status(offen)/punkteOverride(null) → aus neueKarte-Defaults
  });
  untermenge(o.id).forEach(u=>{ S.unteraufgaben.push(neueUnteraufgabe(kopie.id, { titel:u.titel, sollMin:num(u.sollMin), bonusPunkte:u.bonusPunkte, done:false })); });
  S.karten.push(kopie);
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  closeSheet();
  if(opts.starten){ fokusStarten(kopie.id); setTab('fokus'); toast('Als neue Karte geöffnet — Timer läuft'); }
  else { renderAlles(); toast('🔄 Als neue Karte geöffnet'); }
  haptik(15);
}
/* ── U6-A/V1.3: Abhak-Dialog (Punktejustierung beim Erledigen) ────────
   Erscheint beim Abschließen JEDER abhakbaren Karte — Aufgaben UND Routinen.
   Counter/Timer-Ticks (istTickKarte) bleiben schnelles ＋-Ticken ohne Dialog,

let abhakTmp=null;
function karteAbhakenAuto(kid, fromDetail){

/* ══ §8 (v1.12.0) · Dialog „Karte wiederholen" ══════════════════════════ */

/* §2 (v1.13.0): erbt vom Domänen-STANDARDWERT (gemeinsam mit dem Tick-Wert);
   ein gesetzter Kartenwert ist ein dauerhafter Override. */
function abhakbonusDefault(k){ return k.abhakbonus!=null ? num(k.abhakbonus) : standardWert(k.domain); }
function abhakDialog(kid, fromDetail){
  const k=S.karten.find(x=>x.id===kid); if(!k) return;
  const hatOverride=k.punkteOverride!=null;                 // Re-Abhaken einer reaktivierten Karte
  const basis=Math.round(kartePunkte(k));                   // bei Override = bereits gebuchte Punkte, sonst berechnet
  // §5 (v1.6.0): Bei offenen Unteraufgaben wird die Folgeaufgabe von sich aus
  // vorgeschlagen (angelegt wird sie erst mit „Erledigen").
  const offen=untermenge(kid).filter(u=>!u.done).length;
  abhakTmp={ kid, fromDetail, folge:offen>0, basis, max:Math.max(10, basis*2),
    bonusDef: hatOverride ? 0 : abhakbonusDefault(k),       // Bonus steckt beim Re-Abhaken schon im Override → 0 vorbelegt
    istMin:Math.round(istSekLive(k)/60),
    offeneSubs:untermenge(k.id).filter(u=>!u.done).length };
  renderAbhakDialog();
}
function renderAbhakDialog(){
  const t=abhakTmp, k=S.karten.find(x=>x.id===t.kid); if(!k) return;
  const restMin=Math.max(0, num(k.sollMin)-t.istMin);
  let h='<p class="d">„<b>'+esc(k.titel||'(ohne Titel)')+'</b>" erledigen — Werte anpassen oder direkt ✅.</p>';
  // §6.1 (v1.8.0): Zusammensetzung — Zeit, Boni, Summe. Aktualisiert sich beim
  // Abhaken einer Unteraufgabe im Dialog (§6.2) sofort mit.
  {
    const zeitP=Math.round(punkteFuerZeit(k, zeitquelleMin(k))*(S.settings.zeitGewicht!=null?S.settings.zeitGewicht:1)
               + tickSumme(k, num(k.ticksHeute))*(S.settings.tickGewicht!=null?S.settings.tickGewicht:1)*geldFaktor(k));
    const bonusP=Math.round(abhakbonusDefault(k)+subBonusErreicht(k));
    h+='<div class="kvblock" style="margin-bottom:10px">'+
      '<div class="kv"><span>aus Zeit'+(num(k.ticksHeute)>0?' + Ticks':'')+'</span><b>'+zeitP+' P</b></div>'+
      '<div class="kv"><span>Abhakbonus + Unteraufgaben-Boni</span><b>'+bonusP+' P</b></div>'+
      '<div class="kv" style="font-size:15px"><span><b>Gesamt</b></span><b style="color:var(--ok)">'+(zeitP+bonusP)+' P</b></div>'+
    '</div>';
  }
  // §4.1 (v1.10.0): „Wie viel Batterie hat es gekostet?" — GESAMTDELTA der
  // Sitzung (kein Stundensatz!), Regler −50…+50 in 5ern + Zahlenfeld,
  // bidirektional wie der Punkte-Regler. Default: letzte Messung dieser Karte,
  // sonst die bisherige Annahme. „überspringen" = kein Lernen, keine Buchung.
  {
    if(t.akkuDelta===undefined){
      const letzte=akkuLetzteMessung(k.id);
      t.akkuDelta = letzte ? num(letzte.delta)
        : Math.max(-50, Math.min(50, Math.round(akkuRate(k)*t.istMin/60/5)*5));
      t.akkuSkip=false;
    }
    const rate = t.istMin>0 ? (num(t.akkuDelta)/(t.istMin/60)) : 0;
    h+='<div class="field"><label>Wie viel Batterie hat es gekostet?</label>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
      '<input type="range" id="abAkku" class="akkuslider" min="-50" max="50" step="5" value="'+Math.max(-50,Math.min(50,num(t.akkuDelta)))+'" style="flex:1">'+
      '<input type="number" inputmode="numeric" step="5" id="abAkkuN" value="'+num(t.akkuDelta)+'" style="width:70px">'+
      '<button class="chip '+(t.akkuSkip?'on':'')+'" data-abakkuskip="1">'+(t.akkuSkip?'übersprungen':'überspringen')+'</button></div>'+

  // §5: Bei offenen Unteraufgaben deutlich darauf hinweisen und die Folgeaufgabe

  h+='<div class="field"><label>Folgeaufgabe</label><div class="chips"><button class="chip '+(t.folge?'on lila':'')+'" data-abfolge="1">'+(t.folge?'✓ wird angelegt':'＋ anlegen')+'</button></div>';

/* §5 (v1.6.0): Folgeaufgabe aus dem editierten Vorschlag anlegen. Die offenen
   Unteraufgaben wandern MIT IHREN SOLL-MINUTEN und erhalten dort NEUE App-IDs;
   die abgehakten bleiben an der abgeschlossenen Aufgabe. Die Folgeaufgabe merkt
   sich ihre Vorgängerin (vorgaengerAppId / vorgaengerAirtableId). */
function folgeAufgabeAnlegen(k, f){
  f=f||{};
  const titel=(f.titel||'').trim() || (k.titel||'');
  const neu=neueKarte({
    domain:k.domain, titel,
    prioritaet: f.prioritaet || k.prioritaet,
    projekt:    (f.projekt!==undefined ? f.projekt : k.projekt),
    geldScore:  num(f.geldScore!==undefined ? f.geldScore : k.geldScore),
    notiz:      (f.notiz!==undefined ? f.notiz : ''),
    komplex: num(f.komplex, k.komplex), energie: num(f.energie, k.energie), blockade: num(f.blockade, k.blockade),
    abhakbonus:k.abhakbonus, tagesabschnitt:k.tagesabschnitt,
    faelligkeit: (f.faelligkeit!==undefined ? (f.faelligkeit||null) : heuteApp()),
    vorgaengerAppId: k.id,
    vorgaengerAirtableId: k.airtableId || null
  });
  // Offene Subs KOPIEREN (neue IDs), Originale an der alten Karte entfernen.
  const offene=untermenge(k.id).filter(u=>!u.done);
  const kopien=offene.map(u=>neueUnteraufgabe(neu.id,{ titel:u.titel, sollMin:num(u.sollMin), bonusPunkte:u.bonusPunkte, done:false }));
  const offenIds=new Set(offene.map(u=>u.id));
  S.unteraufgaben=S.unteraufgaben.filter(u=>!offenIds.has(u.id)).concat(kopien);
  // Invariante §3.2: Parent-Soll = Σ Subs (bei Subs) — sonst der eingegebene Wert.
  const summe=kopien.reduce((s,u)=>s+num(u.sollMin),0);
  neu.sollMin = kopien.length ? summe : Math.max(0, num(f.sollMin));
  // Alte Karte: ihr Soll schrumpft auf die verbliebenen (abgehakten) Subs.
  const rest=untermenge(k.id);
  if(rest.length) k.sollMin=rest.reduce((s,u)=>s+num(u.sollMin),0);
  S.karten.push(neu); DB.set('unteraufgaben', S.unteraufgaben);
  return neu;
}
function abhakDialogConfirm(){
  const t=abhakTmp; if(!t) return;
  const k=S.karten.find(x=>x.id===t.kid); if(!k){ abhakTmp=null; closeSheet(); return; }
  const raw=el('abPktN')?el('abPktN').value.trim():'';           // Zahlenfeld ist führend (auch > Regler-Max)
  const pkt=raw==='' ? t.basis : Math.max(0, Math.floor(num(raw)));   // leer = Default, sonst ganze Zahl ≥ 0
  const bonus=num(el('abBonus')?el('abBonus').value:t.bonusDef);
  const istMin=num(el('abIst')?el('abIst').value:t.istMin);
  const deltaMin=istMin-Math.round(istSekLive(k)/60);
  if(deltaMin!==0){ k.istSek=Math.max(0,num(k.istSek)+deltaMin*60); logIntraday(k,{minuten:deltaMin,typ:'nachtrag'}); }   // Zeit-Nachtrag auf heute
  // §4.2/§4.3 (v1.10.0): Akku-Messung — protokollieren, lernen, Tagesstand
  // geradeziehen (Differenz zum bereits mit der ANGENOMMENEN Rate Gebuchten).
  if(!t.akkuSkip && t.akkuDelta!==undefined){
    const delta=num(el('abAkkuN')?el('abAkkuN').value:t.akkuDelta);
    const dauer=Math.max(1, istMin);
    const angenommen=akkuRate(k);                        // VOR dem Protokollieren
    const gebucht=angenommen*heuteInvestiertMin(k)/60;   // heute mit alter Rate gebucht
    if(!Array.isArray(S.meta.akkuMessungen)) S.meta.akkuMessungen=[];
    S.meta.akkuMessungen.push({ kid:k.id, kat:akkuKategorie(k), datum:heuteApp(),
      delta:Math.round(delta), dauerMin:Math.round(dauer), rate:Math.round(delta/(dauer/60)*10)/10 });
    if(S.meta.akkuMessungen.length>500) S.meta.akkuMessungen=S.meta.akkuMessungen.slice(-500);
    if(S.tag && S.tag.akku!=null){
      S.tag.akku=Math.max(0, Math.min(AKKU_MAX, num(S.tag.akku) + (delta - gebucht)));   // live grob, beim Abschluss geradegezogen (§6.2: bis 150)
    }
    saveMeta();
  }
  k.abhakbonus=bonus;                                   // Wahl je Karte merken
  k.punkteOverride=Math.max(0, pkt+bonus);              // gebuchte Ist-Punkte (Slider + Bonus)
  let _folgeNeu=null;
  if(t.folge) _folgeNeu=folgeAufgabeAnlegen(k, {
    titel:      el('abFolgeTitel') ? el('abFolgeTitel').value : '',
    projekt:    el('abFolgeProjekt') ? (el('abFolgeProjekt').value.trim()||null) : undefined,
    geldScore:  el('abFolgeGeld') ? num(el('abFolgeGeld').value) : undefined,
    faelligkeit:el('abFolgeDl') ? el('abFolgeDl').value : undefined,
    sollMin:    num(el('abFolgeSoll') ? el('abFolgeSoll').value : 0),
    prioritaet: t.folgePri || k.prioritaet,
    komplex:    el('abFolgeKx') ? num(el('abFolgeKx').value, k.komplex) : k.komplex,
    energie:    el('abFolgeEn') ? num(el('abFolgeEn').value, k.energie) : k.energie,
    blockade:   el('abFolgeBl') ? num(el('abFolgeBl').value, k.blockade) : k.blockade,
    notiz:      el('abFolgeNotiz') ? el('abFolgeNotiz').value : ''
  });
  abhakTmp=null; closeSheet();
  karteAbhaken(k.id, false);                            // eigentliches Erledigen (Punkte=Override, Konfetti, Intraday, Speichern)
  // §3.1 (v1.10.0): die Folgeaufgabe übernimmt sofort den Fokus (schlägt das Nachrücken)
  if(_folgeNeu){ fokusStarten(_folgeNeu.id, S.fokus?S.fokus.quelle:null); setTab('fokus'); }
}

/* ══════════════════════════════════════════════════════════════════════
   §3 (v1.6.0) · Routinen-Schublade — Routinen werden nebenbei abgetickt,
   nicht durchgearbeitet. Halbhohes Bottom-Sheet, bleibt nach dem Abhaken
   OFFEN (mehrere hintereinander), Domänen-Toggle im Kopf, Gruppen nach
   Tagesabschnitt (die aktuelle ist aufgeklappt). Die bestehende Routinen-/
   Counter-Logik (Tick-Kurve, Streak, Punkte, Zeit) bleibt unverändert —
   es geht nur um Erreichbarkeit und Darstellung.
   ══════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════
   §3 (v1.6.1) · Routinen-Gruppe mit Komplett-Bonus
   Bündelt mehrere Routinen, die zusammengehören, aber einzeln und in
   beliebiger Reihenfolge abhakbar bleiben — KEINE Kette, keine Abhängigkeit.
   Sind an einem Tag alle Mitglieder erledigt, gibt es EINMALIG den
   komplettBonus; wird eines wieder aufgemacht, wird er zurückgenommen.
   ══════════════════════════════════════════════════════════════════════ */
const KOMPLETT_BONUS_DEFAULT = 200;
function saveRoutGruppen(){ DB.set('routinenGruppen', S.routinenGruppen); }
function gruppeVonKarte(kid){ return (S.routinenGruppen||[]).find(g=>(g.mitglieder||[]).indexOf(kid)>=0) || null; }
/* „heute erledigt" — Routinen werden abgehakt, Counter getickt. */
/* v1.9.2: Seit ＋ und ✓ nebeneinander stehen (v1.9.1 §4), gilt eine Tick-Karte
   als heute erledigt, wenn sie heute ABGEHAKT wurde ODER mindestens einen Tick
   hat — der Haken ist das stärkere Signal, die Ticks bleiben das schwächere
   („Sport"/„WhatsApp" zählen weiterhin allein über den Tick). */
function routErledigtHeute(k){
  if(!k) return false;
  const abgehakt = k.status==='erledigt' && k.tagId===aktuelleTagId();
  // §8 (v1.12.0): Die v1.9.2-Sonderregel („abgehakt und getickt bleibt nach
  // dem Wiederöffnen fertig") entfällt — eine heute wieder geöffnete Karte
  // ist OFFEN, ihre Ticks bleiben aber gebucht (Streak/Quote unberührt).
  if(istTickKarte(k)) return abgehakt || (num(k.ticksHeute)>0 && k.wiederOffenTag!==heuteApp());
  return abgehakt;
}
function gruppeStand(g){
  const ks=(g.mitglieder||[]).map(id=>S.karten.find(k=>k.id===id)).filter(Boolean);
  return { karten:ks, fertig:ks.filter(routErledigtHeute).length, gesamt:ks.length };
}
/* Bonus buchen/zurücknehmen. Ein Tag-Marker verhindert Doppelbuchung. */
function gruppeBonusPruefen(g){
  if(!g || !g.mitglieder || !g.mitglieder.length) return;
  const st=gruppeStand(g), tid=aktuelleTagId();
  const komplett = st.gesamt>0 && st.fertig===st.gesamt;
  g.bonusTag = g.bonusTag || null;
  if(komplett && g.bonusTag!==tid){
    g.bonusTag=tid; saveRoutGruppen();
    const p=num(g.komplettBonus, KOMPLETT_BONUS_DEFAULT);
    // Als eigene Log-Zeile mit Gruppennamen — bleibt in der Aufschlüsselung sichtbar.
    if(S.tag){ (S.tag.log=S.tag.log||[]).push({ itemId:'grp-'+g.id, titel:'Komplett: '+g.name,
      domain:g.domain||'privat', art:'Gruppenbonus', punkte:p, ts:jetztIso() }); saveTag(); }
    if(S.meta) S.meta.gruppenBonus=Object.assign({}, S.meta.gruppenBonus, {[g.id]:{tag:tid, punkte:p}});
    saveMeta();
    toast('🎉 '+g.name+' komplett · +'+p+' P'); konfetti(); haptik(25);
  } else if(!komplett && g.bonusTag===tid){
    g.bonusTag=null; saveRoutGruppen();
    if(S.tag && Array.isArray(S.tag.log)){
      for(let i=S.tag.log.length-1;i>=0;i--){ if(S.tag.log[i].itemId==='grp-'+g.id){ S.tag.log.splice(i,1); break; } }
      saveTag();
    }
    if(S.meta && S.meta.gruppenBonus){ delete S.meta.gruppenBonus[g.id]; saveMeta(); }
    toast(g.name+' nicht mehr komplett · Bonus zurückgenommen');
  }
}
/* Nach jedem Tick/Abhaken einer Gruppenkarte prüfen. */
function gruppeNachAenderung(kid){
  const g=gruppeVonKarte(kid); if(g) gruppeBonusPruefen(g);
}

let routTmp=null;
/* Aktueller Tagesabschnitt nach Uhrzeit — bestimmt die offene Gruppe. */
function jetztAbschnitt(){
  const h=new Date().getHours();
  if(h<TA_BIS_MORGENS) return 'morgens';
  if(h<TA_AB_ABENDS)   return 'tagsueber';
  return 'abends';
}
function oeffneRoutinen(){
  // §5.3 (v1.12.0): kein automatisches Aufklappen nach Uhrzeit mehr — der
  // manuell gesetzte Zustand persistiert (S.ui.routAuf, Muster navKette).
  routTmp={ dom:navDomain(), fb:{} };
  renderRoutinenSheet();
}
function routinenDerDomaene(dom){
  // §12.2 (v1.12.0): eine auf spaeter geschobene Routine taucht bis zum
  // Zieltag weder hier noch im Fokus auf — nur ueber Suche oder Stapel.
  return S.karten.filter(k=>k.domain===dom && k.status!=='archiviert'
    && (kartenArt(k)==='Routine' || kartenArt(k)==='Counter')
    && !(k.faelligkeit && k.faelligkeit>heuteApp()));
}
function renderRoutinenSheet(){
  const t=routTmp; if(!t) return;
  const ks=routinenDerDomaene(t.dom);
  const kopf='<div class="rs-kopf">'+
    ['dfm','privat'].map(d=>'<button class="'+(t.dom===d?'on '+(d==='privat'?'privat':''):'')+'" data-rdom="'+d+'">'+
      (d==='dfm'?'DFM':'Privat')+'</button>').join('')+'</div>';
  let body='';
  TAGESABSCHNITTE.forEach(ta=>{

/* §3 (v1.6.1): Karten einer Routinen-Gruppe stehen als Block zusammen — in der
   Array-Reihenfolge, gemeinsame Umrahmung, Gruppenfarbe, Kopfzeile mit Zähler.
   Karten ohne Gruppe erscheinen einzeln wie bisher. */
/* §5 (v1.12.0): routZeileHtml ist entfallen — die Routinen-Ansicht nutzt die
   Standard-Kartenzeile (kartenreiheHtml, gleiche Optik/Bedienung/Handler).
   Damit verschwinden die beiden Altfehler: das grüne ＋ des alten rz-plus
   buchte den TICK-Pfad (tickWert, nie abhakbonus) und wirkte durch die
   v1.9.2-Regel „getickt = fertig" wie ein Abhaken — der Abhakbonus privater
   Morgen-Routinen kam deshalb nie an. In der Standard-Zeile sind ＋ (Tick)
   und ✓ (karteAbhaken, MIT Abhakbonus) sauber getrennt.
   §5.2: Die Gruppen-Umrahmung (Aufräumrunde) samt Komplettbonus-Anzeige
   wandert mit — gruppeStand() bleibt die Quelle. */
function routBlockHtml(ks){
  const rest=ks.slice(), out=[], erledigt=new Set();
  (S.routinenGruppen||[]).forEach(g=>{
    const drin=(g.mitglieder||[]).map(id=>rest.find(k=>k.id===id)).filter(Boolean);
    if(!drin.length) return;
    drin.forEach(k=>erledigt.add(k.id));
    const st=gruppeStand(g), voll=st.gesamt>0 && st.fertig===st.gesamt;
    out.push('<div class="rgruppe'+(voll?' voll':'')+'" style="border-color:'+esc(g.farbe||'#b98af7')+'">'+
      '<div class="rgruppe-kopf"><span class="nm">'+esc(g.name)+'</span>'+
        '<span class="z">'+st.fertig+'/'+st.gesamt+'</span>'+
        '<span class="b">+'+num(g.komplettBonus,KOMPLETT_BONUS_DEFAULT)+' P</span></div>'+
      drin.map(k=>kartenreiheHtml(k,'routinen')).join('')+'</div>');
  });
  const einzeln=rest.filter(k=>!erledigt.has(k.id));
  return out.join('')+einzeln.map(k=>kartenreiheHtml(k,'routinen')).join('');
}
/* +1 / −1 — nutzt die bestehende Tick-Logik, das Sheet bleibt offen. */
function routTick(kid, minus){
  const k=S.karten.find(x=>x.id===kid); if(!k || !routTmp) return;
  const vorher=Math.round(kartePunkte(k));
  if(istTickKarte(k)){
    // Counter/Timer-Karten: reine Tick-Buchung (bestehende Tick-Kurven-Logik)
    if(minus){
      if(!karteTickMinus(k)){ toast('Schon bei 0'); return; }
      saveKarten();
    } else {
      karteTick(kid, true);
    }
  } else {
    // §3.3 (v1.10.0): Nicht-Tick-Routinen laufen über das Kästchen (data-rcheck);
    // der Swipe-links bleibt als „wieder öffnen".
    const erledigt=k.status==='erledigt';
    if(minus && !erledigt){ toast('Noch nicht erledigt'); return; }
    if(!minus && erledigt){ toast('Schon erledigt'); return; }
    karteAbhaken(kid, true);
    saveKarten(); saveTag();
  }
  gruppeNachAenderung(kid);   // §3: Komplett-Bonus buchen bzw. zurücknehmen
  const delta=Math.round(kartePunkte(k))-vorher;
  routTmp.fb[k.id]=(delta>=0?'+':'')+delta+' P';
  haptik(10); renderRoutinenSheet(); renderStatusbar();
  setTimeout(()=>{ if(routTmp && routTmp.fb[k.id]){ delete routTmp.fb[k.id]; renderRoutinenSheet(); } }, 1800);
}

   13b · Sync Stufe 1 (§8, Copy-Paste) — EIN Button in D6.

/* ══ §4 (v1.13.1) · Sitzungen des Tages je Karte — OHNE Umbau der Zeitmessung:
   fokusZeitEinbuchen schreibt beim Pausieren GENAU eine Intraday-Zeile mit
   Endzeitpunkt (ts) und Dauer (minuten) → der Start ist exakt rückrechenbar
   (von = ts − minuten). Damit liefert der Export ALLE Sitzungen des Tages,
   nicht nur die letzte. Nachträge haben keinen echten Zeitraum — sie werden
   mit nachtrag:true gekennzeichnet (von = bis − min als Konvention); eine
   gerade LAUFENDE Sitzung reist mit laufend:true. ══ */
function kartenSitzungenHeute(kid){
  const hf=belFensterDatum(jetztIso());
  const out=[];
  (S.intraday||[]).forEach(e=>{
    if(e.kartenId!==kid || !e.ts) return;
    if(belFensterDatum(e.ts)!==hf) return;
    if(e.typ!=='timer' && e.typ!=='autopause' && e.typ!=='nachtrag') return;
    const m=num(e.minuten); if(m<0.5) return;
    const bis=new Date(e.ts);
    const s={ von:new Date(bis.getTime()-m*60000).toISOString(), bis:bis.toISOString(), min:Math.round(m) };
    if(e.typ==='nachtrag') s.nachtrag=true;
    out.push(s);
  });
  if(S.fokus && S.fokus.karteId===kid && S.fokus.laeuft && S.fokus.startMs){
    const min=(Date.now()-S.fokus.startMs)/60000;
    if(min>=0.5) out.push({ von:new Date(S.fokus.startMs).toISOString(), bis:jetztIso(), min:Math.round(min), laufend:true });
  }
  return out;
}

    }),

        return { quelle:plan.quelle, stunden:out };
      }catch(e){ return null; }
    })(),
    // Akku-Einträge samt Kommentar (letzte 7 Tage) — Gründe für die Planung
    akkuEintraege: (S.meta.akkuEintraege||[]).filter(a=>a && a.datum>=anVorTage(heuteApp(),6)),
