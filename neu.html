  if(zr==='tag') h+='<input type="date" id="statDatum2" value="'+sel+'" max="'+heuteIso()+'">';
  h+='</div>';
  const snap=tagSnapshot(sel);
  // §5.4 (v1.8.1): Markierung am Tag — sichtbar und nachtraeglich umschaltbar
  if(zr==='tag' && snap) h+='<div class="kv" style="margin:4px 0"><span>'+(snap.urlaub?'🏖 Urlaubstag — nicht in Ø/Trends':'Normaler Tag')+'</span>'+
    '<button class="chip '+(snap.urlaub?'on gruen':'')+'" data-urlaubtag="'+sel+'">'+(snap.urlaub?'🏖 AN':'als Urlaub markieren')+'</button></div>';
  if(zr==='tag'){ h+=diagrammKurveTag(snap,dom)+kennzahlenHtml(snap,dom)+'<h4 class="auflh">Aufschlüsselung</h4>'+aufschluesselungHtml(snap,dom); }
  else { h+=diagrammBalken(zr,dom)+'<p class="stathint">Balken antippen wählt den Tag.</p>'+kennzahlenHtml(snap,dom); }
  h+='</div>';
  // §3.3 (v1.13.0): Rein/Raus — Tagesfläche bzw. Mehrtagesbalken
  h+= zr==='tag' ? reinRausTagHtml(sel, dom) : reinRausBalkenHtml(zr==='woche'?7:30, dom);
  return h;
}
/* A1: ein Domänen-Score-Ring (heutige Punkte der Domäne ÷ Domänen-Tagesziel),
   Pace-Pfeil = liegt die Domäne über ihrem anteiligen Soll? */
function scoreRingDomain(dom, label, farbe){
  const p=paceDomain(dom);
  const ist=Math.round(p.ist), ziel=Math.round(p.ziel);
  const imSoll = p.we ? true : p.ist>=p.soll;
  const pct=Math.max(0,Math.min(1, ziel? ist/ziel : 0));
  const R=42, U=2*Math.PI*R, off=U*(1-pct);
  return '<div class="statring-dom"><svg viewBox="0 0 104 104" width="104" height="104">'+
      '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
      '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="'+farbe+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+U.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 52 52)"/>'+
      '<text x="52" y="48" text-anchor="middle" fill="var(--txt)" font-size="19" font-weight="800">'+ist+'</text>'+
      '<text x="52" y="67" text-anchor="middle" fill="var(--mut)" font-size="9">von '+ziel+'</text></svg>'+
    '<div class="srd-lab">'+label+' <span class="'+(imSoll?'gut':'schlecht')+'">'+(imSoll?'▲':'▼')+'</span></div>'+
    '<div class="srd-sub">'+Math.round(pct*100)+'%'+(p.we?' · Wochenende':' · Soll jetzt '+Math.round(p.soll))+'</div></div>';
}
/* ══════════════════════════════════════════════════════════════════════
   V2 · Belohnungsseite neu — Tages-Diagramm 5→5, KPI-Felder mit Farbverlauf,
   Punkte-Aufschlüsselung, Stapel-100%-Balken. Alles Inline-SVG/HTML.
   ══════════════════════════════════════════════════════════════════════ */
const AN_WT_LANG=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];   // getDay-Index
function belX(ts){ const d=new Date(ts); let hh=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; return hh<5?hh+24:hh; }   // 5..29
function belFensterDatum(ts){ const d=new Date(ts); if(d.getHours()<5) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function belWochentag(datum){ return new Date(datum+'T12:00:00').getDay(); }
function belUhr(x){ x=((x%24)+24)%24; const h=Math.floor(x), m=Math.round((x-h)*60); return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
/* Kumulative Punkte-Kurve eines 5→5-Fensters aus dem Intraday-Log. */
function belTagKurve(fensterDatum, dom, startX){
  const ent=(S.intraday||[]).filter(e=>e.ts && num(e.punkte)>0 && (dom==='alle'||e.domaene===dom) && belFensterDatum(e.ts)===fensterDatum)
    .slice().sort((a,b)=> a.ts<b.ts?-1:1);
  let c=0; const pts=[{x:(startX==null?5:startX), p:0}];   // U1: Kurvenstart = Fensterstart
  ent.forEach(e=>{ c+=num(e.punkte); pts.push({x:belX(e.ts), p:c}); });
  return pts;
}
function belKurveWert(pts, x){ let v=0; for(let i=0;i<pts.length;i++){ if(pts[i].x<=x) v=pts[i].p; else break; } return v; }
/* U1 (v1.4.0): dynamisches Zeitfenster eines Tages statt fixer 5→5-Achse.
   Start = tatsächlicher (manueller) Tagesstart; fehlt er, die erste Aktivität
   des Tages; sonst 8:00 als neutraler Rückfall. Ende = 24:00 — Ausnahme: wurde
   der Tagesabschluss erst nach Mitternacht gemacht, reicht die Achse bis dahin.
   Zurückgegeben werden x-Werte im belX-Raum (5…29). */
function belTagFenster(fensterDatum){
  const snap=(typeof tagSnapshot==='function')?tagSnapshot(fensterDatum):null;
  let von=null, bis=24, quelle='rückfall';
  if(snap && snap.startTs){ von=belX(snap.startTs); quelle='tagesstart'; }
  if(von==null){
    const ent=(S.intraday||[]).filter(e=>e.ts && belFensterDatum(e.ts)===fensterDatum);
    if(ent.length){ von=Math.min.apply(null, ent.map(e=>belX(e.ts))); quelle='erste Aktivität'; }
  }
  if(von==null) von=8;
  // Abschluss nach Mitternacht verlängert das Fenster (belX liefert dort >24).
  if(snap && snap.endeTs){ const xe=belX(snap.endeTs); if(xe>bis) bis=xe; }
  // Laufender Tag: falls jetzt schon nach Mitternacht, bis „jetzt" mitwachsen.
  if(snap && snap.istHeute){ const xn=belX(jetztIso()); if(xn>bis) bis=xn; }
  // Buchungen dürfen nie aus dem Bild fallen.
  (S.intraday||[]).forEach(e=>{ if(e.ts && belFensterDatum(e.ts)===fensterDatum){ const x=belX(e.ts); if(x>bis) bis=x; if(x<von) von=x; } });
  von=Math.max(5, Math.min(von, bis-0.5));
  return { von, bis:Math.min(29, Math.max(bis, von+0.5)), quelle };
}
/* Farbverlauf rot(−1) → lila(0) → grün(+1). */
function belGrad(v){ v=Math.max(-1,Math.min(1,isFinite(v)?v:0));
  const R=[246,109,109],P=[185,138,247],G=[62,207,142], a=v<0?R:P, b=v<0?P:G, t=v<0?v+1:v;
  const c=a.map((x,i)=>Math.round(x+(b[i]-x)*t)); return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
/* H4.3: Wochenend-Regel — DFM-Ziel Sa+So gemeinsam 3000 (kombinierte DFM-Punkte
   des Wochenendes zählen gegen 3000). Privat-Ziel bleibt normales Tagesziel. */
function belIstWochenende(){ const d=new Date().getDay(); return d===0||d===6; }
/* §2 (v1.12.0): duenne Wrapper — die Rechnung lebt in zielTag()/weIstDomain(). */
function belZielDfm(){ return zielTag('dfm'); }
function belIstDfm(){ return istWochenendTag(heuteApp()) ? weIstDomain('dfm') : Math.max(0, tagesPunkteDomain('dfm')); }
function belZielGesamt(){ return zielTagGesamt(); }
function belIstGesamt(){ return zielUndIstHeute().ist; }

/* V2.1: Tages-Diagramm 5:00→5:00 mit 3 Heute- + 3 Wochentags-Ø-Linien + Ziel-Linie. */
function belTagesDiagramm(){
  // F1 (v1.3.3): Domänenfilter + Tagesauswahl wiederhergestellt (waren beim V2-Umbau
  // mit der alten diagrammHtml-Karte verlorengegangen). State/Handler existierten noch:
  // S.ui.statDomain (data-statdom) + S.ui.statDatum (#statDatum, statDatum()).
  const dom=S.ui.statDomain||'alle', sel=statDatum();
  const nowIso=jetztIso(), heuteF=belFensterDatum(nowIso), nowX=belX(nowIso);
  const istHeute = sel===heuteF, wt=belWochentag(sel);
  // U1 (v1.4.0): Achse läuft vom Tagesstart des angezeigten Tages bis 24:00
  // (bzw. bis zum Tagesabschluss, wenn der nach Mitternacht erfolgte).
  const fn=belTagFenster(sel), vonX=fn.von, endX=fn.bis;
  const bisX = istHeute ? Math.min(nowX, endX) : endX;   // gezeichnet wird bis „jetzt" bzw. Fensterende
  const liveGes = k=>Math.max(0, tagesPunkteDomain(k));
  function tagKurve(d){ const pts=belTagKurve(sel,d,vonX);
    if(!istHeute) return pts;          // Historie: nur gebuchte Punkte, kein Live-Fortschreiben
    const live=d==='alle'?(liveGes('dfm')+liveGes('privat')):liveGes(d);
    const last=pts[pts.length-1].p; pts.push({x:Math.max(vonX,Math.min(nowX,endX)), p:Math.max(last,live)}); return pts; }
  const kD=tagKurve('dfm'), kP=tagKurve('privat'), kG=tagKurve('alle');
  const fenster={}; (S.intraday||[]).forEach(e=>{ if(e.ts && num(e.punkte)>0) fenster[belFensterDatum(e.ts)]=true; });
  const wtF=Object.keys(fenster).filter(fd=>fd!==sel && belWochentag(fd)===wt);
  // U1: Ø-Vergleich wird über dasselbe Fenster abgetastet (gleiche Logik, echte
  // Uhrzeit-Koordinaten — jeder Vergleichstag steuert seinen Stand zur selben Uhrzeit bei).
  function wtAvg(d){ if(wtF.length<1) return null; const out=[];   // H1: schon 1 Vergleichstag genügt (als gedimmter Ø)
    const schritt=Math.max(0.1,(endX-vonX)/48);
    for(let x=vonX;x<=endX+0.0001;x+=schritt){ const vals=wtF.map(fd=>belKurveWert(belTagKurve(fd,d,vonX),x)); out.push({x, p: vals.reduce((a,b)=>a+b,0)/vals.length}); } return out; }
  const wD=wtAvg('dfm'), wP=wtAvg('privat'), wG=wtAvg('alle');
  // F1: Domänenfilter blendet Linien aus (Ziel-Linie folgt der gewählten Domäne)
  const zeigD=dom==='alle'||dom==='dfm', zeigP=dom==='alle'||dom==='privat', zeigG=dom==='alle';
  const ziel = dom==='dfm' ? belZielDfm() : dom==='privat' ? tagesZielDomain('privat') : belZielGesamt();   // H4.3: WE → DFM-Ziel 3000 gemeinsam
  const kSel = dom==='dfm'?kD : dom==='privat'?kP : kG;
  const istSel = dom==='dfm' ? belIstDfm() : dom==='privat' ? Math.max(0,tagesPunkteDomain('privat')) : belIstGesamt();
  const selGes=kSel[kSel.length-1].p, std=Math.max(0.02, (istHeute?nowX:endX)-vonX), pace=selGes/std;
  const restZiel=Math.max(0, ziel-istSel);
  const zielX = (istHeute && pace>0) ? nowX+restZiel/pace : null;   // Prognose nur für heute sinnvoll
  let maxY=ziel*1.05;
  [zeigD?kD:null, zeigP?kP:null, zeigG?kG:null, zeigD?wD:null, zeigP?wP:null, zeigG?wG:null]
    .forEach(s=>{ if(s) s.forEach(pt=>{ if(pt.p>maxY) maxY=pt.p; }); }); maxY=(maxY||10)*1.08;
  const W=320,H=176,pL=8,pR=8,pT=12,pB=20;
  // U1: X bildet jetzt das dynamische Fenster [vonX,endX] auf die volle Breite ab.
  const spanX=Math.max(0.5, endX-vonX);
  const X=x=>pL+((Math.max(vonX,Math.min(endX,x))-vonX)/spanX)*(W-pL-pR), Y=p=>pT+(1-p/maxY)*(H-pT-pB);
  function poly(pts,color,width,dash,clip){ if(!pts||!pts.length) return '';
    const seg=clip?pts.filter(p=>p.x<=bisX+0.001):pts; if(seg.length<1) return '';
    const d=seg.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.p).toFixed(1)).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+width+'"'+(dash?' stroke-dasharray="'+dash+'" opacity="0.5"':'')+' stroke-linejoin="round" stroke-linecap="round"/>'; }
  let g='';
  // U1: Stundenraster dynamisch — ganze Stunden im Fenster, Schrittweite nach Breite.
  const stdSchritt=spanX>16?4:spanX>9?3:spanX>5?2:1;
  const stdLab=hx=>(Math.abs(hx-24)<0.01?'24':String(Math.round(hx)%24));
  const ticks=[];   // volle Stunden im Raster …
  for(let hx=Math.ceil(vonX/stdSchritt)*stdSchritt; hx<=endX-0.4; hx+=stdSchritt){ if(hx>vonX+0.4) ticks.push({x:hx, lab:stdLab(hx), rand:false}); }
  ticks.unshift({x:vonX, lab:belUhr(vonX), rand:true});                       // … plus beide Fensterränder mit Uhrzeit
  ticks.push({x:endX, lab:(Math.abs(endX-24)<0.01?'24:00':belUhr(endX)), rand:true});
  ticks.forEach(t=>{ const x=X(t.x).toFixed(1);
    g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--line)" stroke-width="'+(t.rand?0.9:0.5)+'" opacity="'+(t.rand?'.8':'.5')+'"/>'+
      '<text x="'+x+'" y="'+(H-6)+'" text-anchor="'+(t.x===vonX?'start':t.x===endX?'end':'middle')+'" font-size="8" fill="'+(t.rand?'var(--mut)':'var(--mut2)')+'">'+t.lab+'</text>'; });
  // U1: Mitternachts-Marke, wenn das Fenster über 24:00 hinausreicht (Abschluss nach Mitternacht)
  if(endX>24.01){ const x=X(24).toFixed(1); g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--purple)" stroke-width="0.9" stroke-dasharray="2 2" opacity=".7"/>'; }
  g+='<line x1="'+pL+'" y1="'+Y(ziel).toFixed(1)+'" x2="'+(W-pR)+'" y2="'+Y(ziel).toFixed(1)+'" stroke="var(--mut2)" stroke-width="0.7" stroke-dasharray="2 3"/><text x="'+(W-pR)+'" y="'+(Y(ziel)-2).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">Ziel '+Math.round(ziel)+'</text>';
  if(zeigD) g+=poly(wD,'var(--blue)',1.4,'4 3');
  if(zeigP) g+=poly(wP,'var(--warn)',1.4,'4 3');
  if(zeigG) g+=poly(wG,'#f08c4b',1.4,'4 3');
  if(zeigD) g+=poly(kD,'var(--blue)',2,null,true);
  if(zeigP) g+=poly(kP,'var(--warn)',2,null,true);
  if(zeigG) g+=poly(kG,'#f08c4b',2.4,null,true);
  // §5.4 (v1.13.0): PLANKURVE (nur heute, Gesamtsicht) — beschriftet, damit
  // erkennbar ist, ob Rahmen oder Profil×Kette dahintersteht.
  var planLeg='';
  if(istHeute && zeigG && !istWochenendTag(sel) && !urlaubHeute()){
    const plan=planKurveInfo(sel);
    const pPts=[]; const schritt=Math.max(0.25,(endX-vonX)/40);
    for(let x=vonX;x<=endX+0.001;x+=schritt) pPts.push({x, p:plan.wert(x)});
    if(pPts.length && pPts[pPts.length-1].p>0){
      g+=poly(pPts,'var(--cyan)',1.5,'3 3');
      planLeg='<span><i style="background:var(--cyan)"></i>Plan ('+plan.quelle+')</span>';
    }
  }
  // U1: Jetzt-Marker im neuen Fenster
  if(istHeute && nowX>=vonX && nowX<=endX){ const x=X(nowX).toFixed(1);
    g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--txt)" stroke-width="0.8" opacity=".45"/>'; }
  if(istHeute){
    if(zielX!=null && zielX<=endX){ const x=X(zielX).toFixed(1); g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--ok)" stroke-width="1.4" stroke-dasharray="3 2"/><text x="'+x+'" y="'+(pT+8)+'" text-anchor="middle" font-size="8" fill="var(--ok)">🎯 ~'+belUhr(zielX)+'</text>'; }
    else { g+='<text x="'+(W-pR-2)+'" y="'+(pT+8)+'" text-anchor="end" font-size="8" fill="var(--bad)">🎯 außer Reichweite ▸</text>'; }
  } else {
    g+='<text x="'+(W-pR-2)+'" y="'+(pT+8)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+Math.round(selGes)+' P gesamt</text>';
  }
  // F1: Filterzeile — Domänen-Segment + Tagesauswahl (Datumsfeld + ‹ › Schritt)
  const dseg=(v,l)=>'<button class="'+(dom===v?'on':'')+'" data-statdom="'+v+'">'+l+'</button>';
  const controls='<div class="statfilter"><span class="segmini">'+dseg('alle','Alle')+dseg('dfm','DFM')+dseg('privat','Privat')+'</span>'+
    '<span class="dpick"><button data-statstep="-1" aria-label="Tag zurück">‹</button>'+
    '<input type="date" id="statDatum" value="'+sel+'" max="'+heuteApp()+'">'+
    '<button data-statstep="1" aria-label="Tag vor"'+(istHeute?' disabled':'')+'>›</button>'+
    (istHeute?'':'<button data-statheute="1">heute</button>')+'</span></div>';
  const legTeile=[];
  if(zeigD) legTeile.push('<span><i style="background:var(--blue)"></i>DFM</span>');
  if(zeigP) legTeile.push('<span><i style="background:var(--warn)"></i>Privat</span>');
  if(zeigG) legTeile.push('<span><i style="background:#f08c4b"></i>Gesamt</span>');
  if(planLeg) legTeile.push(planLeg);
  const legende='<div class="an-legend">'+legTeile.join('')+'<span style="color:var(--mut2)">— '+(istHeute?'heute':anKurzDatum(sel))+' · - - Ø '+AN_WT_LANG[wt]+' (Normaltag)</span></div>';
  const hint = wtF.length===0 ? '<div class="stathint">Noch kein Vergleichstag ('+AN_WT_LANG[wt]+') — Ø erscheint ab dem ersten getrackten '+AN_WT_LANG[wt]+'.</div>'
    : (wtF.length===1 ? '<div class="stathint">Ø basiert auf 1 Vergleichstag ('+AN_WT_LANG[wt]+').</div>' : '');   // H1
  // U1: Fenster im Titel benennen (Tagesstart → 24:00 bzw. Abschluss nach Mitternacht)
  const fensterTxt=belUhr(vonX)+'→'+(endX>=23.99&&endX<=24.01?'24:00':belUhr(endX))
    + (endX>24.01?' (Abschluss nach Mitternacht)':'');
  const titel='Tagesverlauf · '+fensterTxt+(istHeute?'':' · '+AN_WT_LANG[wt]+' '+anKurzDatum(sel));
  return '<div class="card"><h3>'+titel+'</h3>'+controls+'<svg class="an-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>'+legende+hint+'</div>';
}

/* V2.2: KPI-Felder mit Farbverläufen. */
function belKpiFelder(){
  const we=belIstWochenende();
  // §4.3 (v1.13.0): Anzeige-Zahlen über den Upgrade-Faktor (Ist, Ziel UND der
  // Normaltag-Vergleich — alles in derselben Währung, Verhältnisse identisch).
  const f43=upgradeFaktor();
  const zielD=belZielDfm()*f43, zielP=tagesZielDomain('privat')*f43, ziel=zielD+zielP;   // H4.3: DFM-Ziel am WE = Sa+So gemeinsam
  const pD=Math.round(belIstDfm()*f43), pP=Math.round(tagesPunkteDomain('privat')*f43), pGes=pD+pP;
  const paceD=paceDomain('dfm').istRate, paceP=paceDomain('privat').istRate;
  const dz=v=>v>=0?'+'+Math.round(v):''+Math.round(v);
  // Reihe 1: ein Feld, intern DFM | Privat
  let h='<div class="belkpi-r1"><div class="belkpi-col dfm"><div class="bk-h">DFM'+(we?' · WE (Sa+So/3000)':'')+'</div>'+
      '<div class="bk-row"><b>'+pD+'</b> P · <b>'+Math.round(paceD)+'</b> P/h · Δ '+dz(pD-zielD)+'</div></div>'+
    '<div class="belkpi-col priv"><div class="bk-h">Privat</div>'+
      '<div class="bk-row"><b>'+pP+'</b> P · <b>'+Math.round(paceP)+'</b> P/h · Δ '+dz(pP-zielP)+'</div></div></div>';
  // Reihe 2: drei Verlaufs-Felder
  const nowIso=jetztIso(), heuteF=belFensterDatum(nowIso), nowX=belX(nowIso), wt=belWochentag(heuteF);
  const fenster={}; (S.intraday||[]).forEach(e=>{ if(e.ts&&num(e.punkte)>0) fenster[belFensterDatum(e.ts)]=true; });
  const wtF=Object.keys(fenster).filter(fd=>fd!==heuteF && belWochentag(fd)===wt);
  const wtBei = wtF.length? wtF.map(fd=>belKurveWert(belTagKurve(fd,'alle'),nowX)).reduce((a,b)=>a+b,0)/wtF.length*f43 : null;
  // 1) Noch benötigte Punkte (Verlauf: heute vs Wochentags-Ø zur selben Uhrzeit)
  const noch=Math.max(0, ziel-pGes);
  let s1=0; if(wtBei!=null && wtBei>0) s1=Math.max(-1,Math.min(1,(pGes-wtBei)/Math.max(1,wtBei)));
  // 2) Benötigter Pace bis 22:00
  const nowH=new Date(nowIso).getHours()+new Date(nowIso).getMinutes()/60;
  const hBis22=Math.max(0.25, 22-nowH);
  const needPace = noch/hBis22, ownPace=(pGes)/Math.max(0.25,(nowX-5));
  let s2 = ownPace>0 ? Math.max(-1,Math.min(1,(ownPace-needPace)/Math.max(1,needPace))) : (needPace<=0?1:-1);
  if(noch<=0) s2=1;
  // 3) Aufgaben erledigt vs reingekommen heute.
  // §6.1 (v1.7.0) BUGFIX: zählte über ALLE Karten, obwohl direkt daneben nach
  // Domäne getrennt wird — jetzt folgt es dem aktiven Domänenfilter der Seite
  // (S.ui.statDomain), und beide Rohzahlen werden ausgewiesen; die Differenz
  // bleibt als Färbung erhalten.
  const tid=aktuelleTagId(), kDom=S.ui.statDomain||'alle';
  const domOk=k=>kDom==='alle'||k.domain===kDom;
  const erlAuf=S.karten.filter(k=>domOk(k)&&k.status==='erledigt'&&k.tagId===tid&&kartenArt(k)==='Aufgabe').length;
  const reinAuf=S.karten.filter(k=>domOk(k)&&k.erstelltTs && belFensterDatum(k.erstelltTs)===heuteF && kartenArt(k)==='Aufgabe').length;
  const dAuf=erlAuf-reinAuf; let s3 = dAuf>2?1 : dAuf<-2?-1 : dAuf/2*0.5;   // −2..+2 = lila-Bereich
  const feld=(val,sub,score)=>'<div class="belkpi-v" style="background:linear-gradient(180deg,'+belGrad(score)+'22, transparent);border-color:'+belGrad(score)+'55"><b style="color:'+belGrad(score)+'">'+val+'</b><span>'+sub+'</span></div>';
  h+='<div class="belkpi-r2">'+
    feld(noch>0?Math.round(noch):'✓', 'noch nötig', s1)+
    feld((noch<=0?'0':Math.round(needPace)), 'P/h bis 22:00', s2)+
    feld(reinAuf+' / '+erlAuf, 'rein / erledigt'+(kDom==='alle'?'':' · '+(kDom==='dfm'?'DFM':'Privat')), s3)+'</div>';
  return '<div class="card"><h3>Heute</h3>'+h+'</div>';
}

/* V2.3: Punkte-Aufschlüsselung (DFM-Projekte / Private Routinen / Private Aufgaben). */
function belAufschluesselung(){
  const gesamt=Math.max(1, tagesPunkteDomain('dfm')+tagesPunkteDomain('privat'));
  function ph(pkt,min){ return min>0.5 ? (pkt/(min/60)) : 0; }
  function karteZeile(k, offen){
    const pkt=kartePunkteHeute(k), min=heuteInvestiertMin(k);
    if(pkt<=0 && min<=0) return '';
    return '<div class="aufl-k"><span class="nm">'+esc(k.titel||'(ohne Titel)')+'</span>'+
      '<span class="v">'+Math.round(pkt)+' P · '+Math.round(ph(pkt,min))+' P/h · '+Math.round(pkt/gesamt*100)+'%</span></div>';
  }
  // Gruppen bauen
  const groups=[];
  // DFM-Projekte
  const dfmK=S.karten.filter(k=>k.domain==='dfm' && (kartePunkteHeute(k)>0||heuteInvestiertMin(k)>0));
  const proj={}; dfmK.forEach(k=>{ const p=k.projekt||'(ohne Projekt)'; (proj[p]=proj[p]||[]).push(k); });
  Object.keys(proj).sort().forEach(p=>groups.push({key:'dfm:'+p, label:'DFM · '+p, karten:proj[p]}));
  // Private Routinen + Aufgaben
  const prR=S.karten.filter(k=>k.domain==='privat' && k.rhythmus && (kartePunkteHeute(k)>0||heuteInvestiertMin(k)>0));
  const prA=S.karten.filter(k=>k.domain==='privat' && !k.rhythmus && (kartePunkteHeute(k)>0||heuteInvestiertMin(k)>0));
  if(prR.length) groups.push({key:'priv:rout', label:'Privat · Routinen', karten:prR});
  if(prA.length) groups.push({key:'priv:auf', label:'Privat · Aufgaben', karten:prA});
  let h='<div class="card"><h3>Punkte-Aufschlüsselung</h3>';
  if(!groups.length){ h+='<p class="d" style="color:var(--mut2)">Heute noch keine Punkte gesammelt.</p></div>'; return h; }
  // Gruppenfarben + Gruppenpunkte
  const PAL=['#4f8ef7','#f2b84b','#3ecf8e','#b98af7','#6dd3e0','#f66d6d','#f78ad0','#8fa1b8'];
  groups.forEach((gr,i)=>{ gr.color=PAL[i%PAL.length]; gr.pkt=gr.karten.reduce((a,k)=>a+kartePunkteHeute(k),0); gr.min=gr.karten.reduce((a,k)=>a+heuteInvestiertMin(k),0); });
  const gesG=Math.max(1, groups.reduce((a,g)=>a+g.pkt,0));
  // H2.1: Gesamtbalken (Verteilung auf die Gruppen)
  h+='<div class="stbar" style="margin-bottom:5px">'+groups.map(gr=>{ const pct=gr.pkt/gesG*100; if(pct<=0) return '';
    return '<i style="width:'+pct.toFixed(1)+'%;background:'+gr.color+'" title="'+esc(gr.label)+': '+Math.round(pct)+'%">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; }).join('')+'</div>';
  h+='<div class="stbar-leg" style="margin-bottom:8px">'+groups.map(gr=>'<span><i style="background:'+gr.color+'"></i>'+esc(gr.label)+'</span>').join('')+'</div>';
  groups.forEach(gr=>{
    const auf=S.ui.auflAuf&&S.ui.auflAuf[gr.key];
    h+='<div class="aufl-g"><div class="aufl-gh" data-aufltoggle="'+gr.key+'"><span class="caret">'+(auf?'▾':'▸')+'</span>'+
      '<span class="nm">'+esc(gr.label)+'</span><span class="v">'+Math.round(gr.pkt)+' P · '+Math.round(ph(gr.pkt,gr.min))+' P/h · '+Math.round(gr.pkt/gesamt*100)+'%</span></div>';
    // H2.2: Balken je Gruppe (Verteilung auf die Einzelkarten)
    const gsum=Math.max(1, gr.pkt), cards=gr.karten.slice().sort((a,b)=>kartePunkteHeute(b)-kartePunkteHeute(a));
    h+='<div class="stbar aufl-cardbar">'+cards.map((k,ci)=>{ const p=kartePunkteHeute(k), pct=p/gsum*100; if(pct<=0) return '';
      const op=(0.55+0.45*(1-ci/Math.max(1,cards.length))).toFixed(2);
      return '<i style="width:'+pct.toFixed(1)+'%;background:'+gr.color+';opacity:'+op+'" title="'+esc(k.titel||'(ohne Titel)')+': '+Math.round(pct)+'%">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; }).join('')+'</div>';
    if(auf){ h+='<div class="aufl-body">'+cards.map(k=>karteZeile(k)).join('')+'</div>'; }
    h+='</div>';
  });
  return h+'</div>';
}

/* V2.4: Stapel-100%-Segmentbalken. */
/* §7 (v1.7.0): Die Stapel-Übersicht rendert nicht mehr entlang der elf alten
   Stapel (mit v1.6.0 verschwunden), sondern entlang der neuen Filterebenen —
   je Domäne × Art eine Zeile (Routinen inkl. Counter, wie Ebene 2 der
   Navigation) — plus je eine Zeile für die Sonderstapel „Heute" und „Erledigt".
   Segmente unverändert: erledigt / offen muss / offen soll-kann / wartet / idee. */
function belStapelBalken(){
  const seg=[['erl','#3ecf8e','erledigt/bearbeitet'],['muss','#f66d6d','offen muss'],['sk','#f2b84b','offen soll/kann'],['freeze','#4f8ef7','wartet'],['idee','#b98af7','idee']];
  let h='<div class="card"><h3>Übersicht</h3>';
  h+='<div class="stbar-leg">'+seg.map(s=>'<span><i style="background:'+s[1]+'"></i>'+s[2]+'</span>').join('')+'</div>';
  const zeile=(name, ks)=>{
    if(!ks.length) return;
    const c={erl:0,muss:0,sk:0,freeze:0,idee:0};
    ks.forEach(k=>{ if(k.status==='erledigt' || (k.letzteBearbeitung&&String(k.letzteBearbeitung).slice(0,10)===heuteApp() && k.status!=='offen')) { c.erl++; return; }
      if(k.freeze){ c.freeze++; return; }
      const pr=k.prioritaet; if(pr==='muss') c.muss++; else if(pr==='idee') c.idee++; else c.sk++; });
    const tot=ks.length;
    let bar=''; seg.forEach(s=>{ const n=c[s[0]]; if(!n) return; const pct=n/tot*100;
      bar+='<i style="width:'+pct.toFixed(1)+'%;background:'+s[1]+'" title="'+s[2]+': '+n+'">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; });
    h+='<div class="stbar-row"><div class="stbar-nm">'+esc(name)+' <span>'+tot+'</span></div><div class="stbar">'+bar+'</div></div>';
  };
  // §10 (v1.12.0): Die Balken folgen den KETTEN — Gesamtbalken „Heute = alles",
  // darunter DFM- und Privat-Kette, darunter die feineren Filter.
  const aktiv=S.karten.filter(k=>k.status!=='archiviert');
  const istArt=(k,art)=>{ const a=kartenArt(k); return art==='aufgabe' ? a==='Aufgabe' : (a==='Routine'||a==='Counter'); };
  zeile('Heute · beide Ketten', ketteKarten());
  zeile('Kette DFM', ketteKarten('dfm'));
  zeile('Kette Privat', ketteKarten('privat'));
  [['dfm','aufgabe','DFM · Aufgaben'],['dfm','routine','DFM · Routinen'],
   ['privat','aufgabe','Privat · Aufgaben'],['privat','routine','Privat · Routinen']]
    .forEach(([d,a,name])=>zeile(name, aktiv.filter(k=>k.domain===d && istArt(k,a))));
  zeile('Erledigt', erledigtKarten());
  return h+'</div>';
}

function renderBelohnung(){
  rangCacheBauen();
  let h='';
  // ── Avatar-Szene (§7 D7 + §6.1): Foto nach Level/Vitalität, gekaufte
  //    Kategorien wachsen als Objekte in der Szene. Hintergrund-Verlauf.
  belohnungInit();
  // U4 (v1.4.0): Level/Name/Hintergrund/Funkel-Stufe zentral aus avatarAssets;
  // Fortschrittsleiste zeigt den Weg zum nächsten Level (Lifetime-Punkte).
  // §3 (v1.9.0): Anzeige läuft über RANG und STERNE (spielStand) — avatarAssets
  // bekommt das Level-Äquivalent 5·(Rang−1)+max(1,Stern), damit Bild-Slot=Rang
  // und Farbvariante=Stern gilt.

    '<div class="rankline"><div class="rankname" style="color:'+av.akzent+'">Outfit '+outfit+' / 20</div>'+
      '<div class="rankpts">🪙 '+Math.round(kontoP)+'</div></div>'+
    '<div class="rankline" style="margin-top:2px"><div class="rankstufe">'+
      (rm.rang==null ? 'Rang: sammelt noch Daten ('+rm.n+'/3)'
        : 'Rang '+rangAnzeigeText(rm)+' · '+esc(rangName(rm.rang))+' · '+Math.round(rm.median)+' P/Std')+
      ' <span style="color:'+av.akzent+';letter-spacing:2px">'+sterneHtml+'</span></div>'+
      '<div class="rankstufe">'+VITAL_LABEL[vs||'voll']+'</div></div>'+
    '<div class="av-bar" id="rangRing"><i style="width:'+Math.round((rm.rang!=null?rm.anteil:0)*100)+'%;background:'+av.akzent+'"></i></div>'+
    '<div class="rankstufe" style="margin-top:4px">'+(rm.rang==null
      ? 'Der Rang misst deinen P/Std-Median über 14 aktive Tage.'
      : (rm.rang>=RANG_MAX ? 'Höchster Rang — Median '+Math.round(rm.median)+' P/Std.'
        : 'Noch '+Math.round(rm.rest)+' P/Std bis Rang '+(rm.rang+1)+' — „'+esc(rangName(rm.rang+1))+'".'))+'</div>'+
    '<div class="rankstufe" style="margin-top:2px">Heute: '+Math.round(Math.max(0,tagesPunkteLive()))+' P · F '+F.toFixed(2).replace('.',',')+
      (outfit<20 ? ' · Outfit '+(outfit+1)+' in '+Math.round(outfitFehltBis(outfit+1))+' P' : ' · Frack an 🤵')+'</div>'+
    '<div class="rankline" style="margin-top:6px"><div class="rankstufe">🔥 Serie '+num(S.meta.tagesStreak)+' Tg · ×'+streakFaktor().toFixed(2).replace('.',',')+
      (jokerVerfuegbar()?' · ♦ Joker bereit':(num(S.meta.tagesStreak)>=30?' · ♦ diesen Monat verbraucht':''))+'</div>'+
      '<div class="rankstufe">'+(function(){ const st=bgStufeAus(ausgabenAnzeige());
        return 'Reise: Kulisse '+st+'/10'+(st<10?' · noch '+Math.round(bgSchwelle(st+1)-ausgabenAnzeige())+' 🪙 ausgeben':''); })()+'</div></div>'+
    '<button class="btn ghost sm" data-album="1" style="width:100%;margin-top:8px">🖼 Album — Ränge · Kulissen · Besitz</button></div>';

  // ── B1: Einstieg Detailanalyse ───────────────────────────────────
  h+='<button class="btn prim" data-analyse="1" style="width:100%;margin:0 0 14px;display:flex;align-items:center;justify-content:center;gap:8px">📊 Detailanalyse öffnen</button>';

  // ── V2.1 Tages-Diagramm 5→5 + V2.2 KPI-Felder ────────────────────
  h+=belTagesDiagramm();
  h+=belKpiFelder();

  // ── Stat 3: Zeitverteilung je Domäne + Projekt (heute) ───────────
  const zh=tagesZeitAggregat(aktuelleTagId()); const gesZ=zh.dfm+zh.privat;
  h+='<div class="card"><h3>Zeit heute</h3>';

  else {
    h+='<div class="split"><span class="dfm">DFM '+fmtMin(zh.dfm)+'</span><span class="priv">Privat '+fmtMin(zh.privat)+'</span></div>'+

    projekte.forEach(([p,sek])=>{ h+='<div class="projrow"><span>'+esc(p)+'</span><span class="bwrap2"><i style="width:'+Math.round(sek/gesZ*100)+'%"></i></span><b>'+fmtMin(sek)+'</b></div>'; });
  }
  h+='</div>';

  // ── V2.3 Punkte-Aufschlüsselung (aufklappbar) ────────────────────
  // §5 (v1.7.0): Diagramme-Karte wiederbelebt — Tag/Woche/Monat + Kennzahlen +
  // Aufschlüsselung nach Kartenart, oberhalb der Punkte-Aufschlüsselung.
  h+=diagrammHtml();
  h+=belAufschluesselung();

  // ── Stat 4: Routinen-Erfüllungsquote + Streaks ───────────────────
  // §4 (v1.7.1) BUGFIX: die Quote rechnete NUR über routinenBilanz — die enthält
  // aber ausschließlich verpasste/entschuldigte Einträge, nie erfüllte, womit
  // erf strukturell 0 blieb und die Quote dauerhaft 0 % zeigte. Jetzt DIESELBE
  // Rechnung wie im Routinen-Flow der Analyse: erfüllt aus dem Punkt-Log
  // (Historie + heute), verpasst aus der Bilanz, entschuldigt bleibt draußen.
  let erf=0, verp=0;
  S.historie.forEach(x=>{
    (x.log||[]).forEach(l=>{ if(l.art==='Routine' && num(l.punkte)>0) erf++; });
    (x.routinenBilanz||[]).forEach(r=>{ if(r.verpasst) verp++; });
  });
  if(tagOffen() && S.tag) (S.tag.log||[]).forEach(l=>{ if(l.art==='Routine' && num(l.punkte)>0) erf++; });
  const routKarten=S.karten.filter(k=>k.rhythmus && k.status!=='archiviert');
  const quote = (erf+verp)>0 ? Math.round(erf/(erf+verp)*100) : null;
  h+='<div class="card"><h3>Routinen</h3>';
  // §3.1 (v1.13.0): heute anstehende Routinen in VIER Kategorien (Σ = 100 %)
  {
    const q=routinenQuoteHeute('alle');
    if(q.gesamt>0){
      const seg=[['erledigt','var(--ok)',q.erledigt],['geschoben','#f08c4b',q.geschoben],
                 ['entschuldigt','var(--cyan)',q.entschuldigt],[tagOffen()?'verpasst/offen':'verpasst','var(--bad)',q.verpasst]];
      h+='<div class="kv"><span>Heute anstehend</span><b>'+q.gesamt+' Routinen</b></div>'+
        '<div class="stbar" style="margin:4px 0 5px">'+seg.map(s=>{ if(!s[2]) return '';
          const pct=s[2]/q.gesamt*100;
          return '<i style="width:'+pct.toFixed(1)+'%;background:'+s[1]+'" title="'+s[0]+': '+s[2]+'">'+(pct>=14?Math.round(pct)+'%':'')+'</i>'; }).join('')+'</div>'+
        '<div class="stbar-leg">'+seg.map(s=>'<span><i style="background:'+s[1]+'"></i>'+s[0]+' '+s[2]+'</span>').join('')+'</div>';
    } else {
      h+='<p class="d" style="color:var(--mut2)">Heute keine anstehenden Routinen.</p>';
    }
  }
  h+='<div class="kv"><span>Erfüllungsquote gesamt (entschuldigte raus)</span><b>'+(quote==null?'—':quote+'%')+'</b></div>';
  if(!routKarten.length) h+='<p class="d" style="color:var(--mut2)">Keine Routinen angelegt.</p>';
  routKarten.sort((a,b)=>num(b.streak)-num(a.streak)).slice(0,8).forEach(k=>{ h+='<div class="kv"><span>'+esc(k.titel)+'</span><b>🔥 '+num(k.streak)+'</b></div>'; });
  h+='</div>';

  // ── V2.4 Stapel-100%-Segmentbalken (ersetzt die alte Stapel-KPI) ──
  h+=belStapelBalken();

  // ── Shop — nächste Stufen (§7 D7, voller Port) ───────────────────
  h+='<div class="card"><h3>Shop — nächste Stufen</h3><p class="d">Konto '+Math.round(konto())+' P (Wohlstand − Ausgaben). Der Inhalt der nächsten Stufe bleibt „???" bis zum Freischalten.</p>'+shopHtml()+'</div>';

  el('belohnungBody').innerHTML=h;
}

  el('v-'+tab).classList.add('on');

let toastTimer=null;
function toast(msg){
  const t=el('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'), 1900);
}
function konfetti(){
  const cv=el('konfetti'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const farben=['#4f8ef7','#3ecf8e','#f2b84b','#f66d6d','#b98af7','#6dd3e0'];
  const parts=Array.from({length:70},()=>({
    x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.5,
    vx:(Math.random()-.5)*9, vy:-(Math.random()*10+5),
    g:.32+Math.random()*.15, s:5+Math.random()*5,
    c:farben[(Math.random()*farben.length)|0], r:Math.random()*6, vr:(Math.random()-.5)*.4
  }));
  let f=0;
  (function anim(){
    ctx.clearRect(0,0,cv.width,cv.height); f++;
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
    if(f<70) requestAnimationFrame(anim); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ── U2 (v1.4.0) · Swipe-Navigation auf der Fokuskarte ─────────────────
   Pointer-Gesten (Touch + Maus) direkt auf #fokusAktiv. Erst ab SWIPE_MIN_DX
   Pixeln UND einem flachen Winkel (|dx| > |dy| × SWIPE_WINKEL) gilt die Geste
   als horizontaler Swipe — vorher bleibt alles beim Alten, damit Scrollen und
   die Buttons (Play/Pause, Abhaken, ✎, ⏭) unberührt funktionieren. Wird ein
   Swipe erkannt, zieht die Karte sichtbar mit und der nachfolgende Klick wird
   einmalig unterdrückt. */
const SWIPE_START=10, SWIPE_MIN_DX=60, SWIPE_WINKEL=1.4, SWIPE_MAX_ZUG=90;
let _swId=null, _swX=0, _swY=0, _swAktiv=false, _swKarte=null, _swKlickAus=false;
function swipeKarteVon(t){ return t && t.closest ? t.closest('#fokusAktiv') : null; }
function swipeEnde(zug){
  if(_swKarte){ _swKarte.style.transition='transform .18s ease-out'; _swKarte.style.transform='';
    const k=_swKarte; setTimeout(()=>{ if(k) k.style.transition=''; }, 200); }
  _swId=null; _swAktiv=false; _swKarte=null;
}
el('fokusView').addEventListener('pointerdown', e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  const karte=swipeKarteVon(e.target); if(!karte) return;
  _swId=e.pointerId; _swX=e.clientX; _swY=e.clientY; _swAktiv=false; _swKarte=karte;
}, {passive:true});
el('fokusView').addEventListener('pointermove', e=>{
  if(_swId===null || e.pointerId!==_swId || !_swKarte) return;
  const dx=e.clientX-_swX, dy=e.clientY-_swY;
  if(!_swAktiv){
    // §9.1 (v1.11.0): Die Richtungs-Entscheidung fällt beim ERSTEN erkennbaren
    // Move (4 px), nicht erst bei SWIPE_START (10 px). Ursache des Wisch-Bugs:
    // der Scroll-Container `main` (touch-action:pan-y) übernahm auf iOS die
    // Geste und feuerte pointercancel, BEVOR die App bei 10 px ihr
    // preventDefault setzen konnte — die Kette riss vor swipeAbschluss.
    // Jetzt: horizontal-dominant → sofort aktiv + preventDefault + Capture.
    if(Math.abs(dx)<4 && Math.abs(dy)<4) return;              // noch kein Urteil
    if(Math.abs(dy)>=Math.abs(dx)){ swipeEnde(); return; }    // vertikal → Scrollen gewinnt
    _swAktiv=true; _swKarte.style.transition='none';
    try{ el('fokusView').setPointerCapture(e.pointerId); }catch(err){}
  }
  const zug=Math.max(-SWIPE_MAX_ZUG, Math.min(SWIPE_MAX_ZUG, dx*0.55));   // gedämpftes Mitziehen
  _swKarte.style.transform='translateX('+zug.toFixed(1)+'px)';
  _swKarte.style.opacity=(1-Math.min(0.25, Math.abs(zug)/400)).toFixed(3);
  if(e.cancelable) e.preventDefault();
}, {passive:false});
function swipeAbschluss(e){
  if(_swId===null || e.pointerId!==_swId) return;
  const dx=e.clientX-_swX, war=_swAktiv, karte=_swKarte;
  if(karte) karte.style.opacity='';
  swipeEnde();
  if(war && Math.abs(dx)>=SWIPE_MIN_DX){
    _swKlickAus=true; setTimeout(()=>{ _swKlickAus=false; }, 400);
    fokusSwipeSchritt(dx>0?1:-1);   // rechts (+) = Verlauf zurück, links (−) = Stapel vor
  }
}
el('fokusView').addEventListener('pointerup', swipeAbschluss);
el('fokusView').addEventListener('pointercancel', e=>{ if(_swKarte) _swKarte.style.opacity=''; swipeEnde(); });
// Erkannter Swipe darf nicht zusätzlich als Klick auf Button/Karte durchschlagen.
el('fokusView').addEventListener('click', e=>{
  if(_swKlickAus){ e.stopPropagation(); e.preventDefault(); }
}, true);

(function(){
  let y0=null; const sh=el('sheet');
  sh.querySelector('.sheetgriff').addEventListener('touchstart', e=>{ y0=e.touches[0].clientY; }, {passive:true});
  sh.querySelector('.sheetgriff').addEventListener('touchmove', e=>{

    if(dy>0) sh.style.transform='translateY('+dy+'px)';
  }, {passive:true});
  sh.querySelector('.sheetgriff').addEventListener('touchend', e=>{
    const dy=(e.changedTouches[0].clientY-(y0||0)); sh.style.transform='';
    if(dy>90) closeSheet(); y0=null;
  });
})();

// Stapelliste (Tag-Banner / Toggle / Detail / Check / Edit / Ordner)
/* Gemeinsame Klick-Aktionen einer Karten-Zeile (kartenreiheHtml) — genutzt vom
   Stapel-Tab UND von der Fokus-Liste (U1: eine Implementierung, nicht zwei). */
function karteRowClick(t, e){
  const scd=t.closest('[data-stapeldom]'); if(scd){ if(e) e.stopPropagation(); (S.ui.stapelDomain=S.ui.stapelDomain||{})[scd.dataset.stapelid]=scd.dataset.stapeldom; saveUi(); renderAlles(); return true; }   // A5 Domänenfilter je Stapel
  // U3 (v1.4.0): Status-Filter + Sortierrichtung für JEDEN Stapel (je Stapel persistent)
  const sts=t.closest('[data-stapelstatus]'); if(sts){ if(e) e.stopPropagation();
    S.ui.stapelStatus=Object.assign({}, S.ui.stapelStatus); S.ui.stapelStatus[sts.dataset.stapelid]=sts.dataset.stapelstatus;
    saveUi(); renderAlles(); return true; }
  const sri=t.closest('[data-stapelricht]'); if(sri){ if(e) e.stopPropagation();
    const bst=S.stapel.find(s=>s.id===sri.dataset.stapelid);
    if(bst){ const so=bst.sortierung||{feld:'auto',richtung:'asc'};
      bst.sortierung={feld:so.feld||'auto', richtung:(so.richtung==='asc'||!so.richtung)?'desc':'asc'}; saveStapel(); renderAlles(); }
    return true; }
  // §9.2 (v1.12.0): „▤" öffnet das Ketten-Aktions-Sheet (anzeigen, abhaken,
  // starten, hoch, runter, ganz nach oben mit Uhrstart, ganz raus/aufnehmen)
  const ket=t.closest('[data-kette]'); if(ket){ if(e) e.stopPropagation(); oeffneKetteAktion(ket.dataset.kette); return true; }
  // §2 (v1.8.0): Schieben-Dialog + Archivieren (mit Sicherheitsabfrage, No-delete)
  const scb=t.closest('[data-schieb]'); if(scb){ if(e) e.stopPropagation(); oeffneSchieben(scb.dataset.schieb); return true; }
  const arc=t.closest('[data-archiv]'); if(arc){ if(e) e.stopPropagation();
    const ak=S.karten.find(x=>x.id===arc.dataset.archiv);
    if(ak && confirm('„'+(ak.titel||'(ohne Titel)')+'" archivieren? Die Karte verschwindet aus allen Listen, bleibt aber im Datenbestand und im Export.')){
      ak.status='archiviert'; beruehre(ak); saveKarten(); renderAlles(); toast('Archiviert'); }
    return true; }
  const frz=t.closest('[data-freeze]'); if(frz){ if(e) e.stopPropagation(); toggleFreeze(frz.dataset.freeze); return true; }   // A4
  // A8: Quick-Leiste-Direktaktionen (ohne Ansichtswechsel)
  const pqs=t.closest('[data-pqstart]'); if(pqs){ if(e) e.stopPropagation(); const kid=pqs.dataset.pqstart; if(S.fokus&&S.fokus.karteId===kid) fokusToggle(); else fokusStarten(kid); return true; }
  const pqt=t.closest('[data-pqtick]'); if(pqt){ if(e) e.stopPropagation(); karteTick(pqt.dataset.pqtick, false); return true; }
  const pqc=t.closest('[data-pqcheck]'); if(pqc){ if(e) e.stopPropagation(); karteAbhakenAuto(pqc.dataset.pqcheck, false); return true; }
  const pqd=t.closest('[data-pqdetail]'); if(pqd){ if(e) e.stopPropagation(); oeffneDetail(pqd.dataset.pqdetail); return true; }
  const fst=t.closest('[data-fokusstart]'); if(fst){ if(e) e.stopPropagation();
    const sid=fst.dataset.stapel, kid=fst.dataset.fokusstart;
    if(sid){ S.ui.aktivStapel=sid; saveUi(); }
    if(S.fokus && S.fokus.karteId===kid) fokusToggle(); else fokusStarten(kid, sid||null);   // §3.1 (1.10.0): Quelle mitgeben
    setTab('fokus'); return true; }
  const su=t.closest('[data-sortup]'); if(su){ if(e) e.stopPropagation(); karteSortieren(su.dataset.sortup, -1, su.dataset.stapel); return true; }
  const sd=t.closest('[data-sortdown]'); if(sd){ if(e) e.stopPropagation(); karteSortieren(sd.dataset.sortdown, +1, sd.dataset.stapel); return true; }
  const tp=t.closest('[data-tickplus]'); if(tp){ if(e) e.stopPropagation(); karteTick(tp.dataset.tickplus, false); return true; }
  const det=t.closest('[data-detail]'); if(det){ oeffneDetail(det.dataset.detail); return true; }
  const chk=t.closest('[data-check]'); if(chk){ karteAbhakenAuto(chk.dataset.check, false); return true; }
  return false;
}

// Sheet-Interaktionen (Detail + Stapel-Editor + Filter + Migration).
// Delegation am ganzen #sheet, damit auch die Buttons im #sheetFoot greifen.
el('sheet').addEventListener('click', e=>{
  const t=e.target;
  if(t.id==='sheetX') return;   // eigener Close-Handler
  if(t.closest('[data-close]')){ closeSheet(); return; }
  // §9.2 (v1.12.0): Ketten-Aktions-Sheet — Uhr folgt der Handlung (§6):
  // „ganz nach oben" startet die Fokuszeit sofort, alles andere nicht.
  const kaT=t.closest('[data-kaTop]'); if(kaT){ const kid=kaT.dataset.katop;
    ketteBewegen(kid,'top'); closeSheet(); fokusNavReset(); fokusStarten(kid); setTab('fokus'); return; }
  const kaS=t.closest('[data-kaStart]'); if(kaS){ closeSheet(); fokusStarten(kaS.dataset.kastart); setTab('fokus'); return; }
  const kaC=t.closest('[data-kaCheck]'); if(kaC){ karteAbhakenAuto(kaC.dataset.kacheck, false); return; }
  const kaH=t.closest('[data-kaHoch]'); if(kaH){ ketteBewegen(kaH.dataset.kahoch,-1); oeffneKetteAktion(kaH.dataset.kahoch); renderAlles(); return; }
  const kaR=t.closest('[data-kaRunter]'); if(kaR){ ketteBewegen(kaR.dataset.karunter,1); oeffneKetteAktion(kaR.dataset.karunter); renderAlles(); return; }
  const kaX=t.closest('[data-kaRaus]'); if(kaX){ ketteToggle(kaX.dataset.karaus); closeSheet(); renderAlles(); toast('Aus der Kette entfernt'); return; }
  const kaI=t.closest('[data-kaRein]'); if(kaI){ ketteToggle(kaI.dataset.karein); oeffneKetteAktion(kaI.dataset.karein); renderAlles(); return; }
  // §8 (v1.12.0): Wiederholen-Dialog — drei Wege, überall identisch.
  const wo=t.closest('[data-woeffnen]'); if(wo){ const k=S.karten.find(x=>x.id===wo.dataset.woeffnen);
    if(k && k.status==='erledigt'){

    } return; }
  const wn=t.closest('[data-wneu]'); if(wn){ const k=S.karten.find(x=>x.id===wn.dataset.wneu);
    if(k){ // volle Bearbeitung VOR dem Anlegen: Detail-Editor mit Vorlage + Vorgänger-Link;
           // gespeichert wird über den normalen Speichern-Pfad, danach oben in die Kette.
      oeffneDetail(null);
      Object.assign(entwurf, { domain:k.domain, titel:k.titel, prioritaet:k.prioritaet, projekt:k.projekt,
        geldScore:num(k.geldScore), komplex:num(k.komplex,1), energie:num(k.energie,1), blockade:num(k.blockade,1),
        sollMin:num(k.sollMin), abhakbonus:k.abhakbonus, tagesabschnitt:k.tagesabschnitt, rhythmus:k.rhythmus?JSON.parse(JSON.stringify(k.rhythmus)):null,
        ticksAktiv:!!k.ticksAktiv, tickWert:(k.tickWert==null?null:num(k.tickWert)), zeitmessung:k.zeitmessung,
        faelligkeit:heuteApp(), vorgaengerAppId:k.id, vorgaengerAirtableId:k.airtableId||null, kettenOben:true });
      renderDetail();
    } return; }
  const wv=t.closest('[data-wverschieben]'); if(wv){ const k=S.karten.find(x=>x.id===wv.dataset.wverschieben);
    // §1.2 (v1.13.0): echter Date-Picker statt prompt() — auf dem iPhone war
    // die Texteingabe unbrauchbar (aufgefallen bei „nächster Montag").
    if(k){
      openSheet('📅 Verschieben',
        '<p class="d">„<b>'+esc(k.titel||'(ohne Titel)')+'</b>" als neue Aufgabe auf ein späteres Datum legen — die erledigte Karte bleibt unberührt, der Vorgänger-Link wird gesetzt.</p>'+
        datumsWahlHtml(morgenIso()),
        '<button class="btn ghost sm" data-close="1">Abbrechen</button>'+
        '<button class="btn prim" data-wverschiebengo="'+k.id+'">→ Verschieben</button>');
    } return; }
  // §9.3: Ketten-Schublade — Domänen-Umschaltung + Kartenzeilen-Aktionen
  const ksd=t.closest('[data-ksdom]'); if(ksd){ S.ui.ketteSheetDom=ksd.dataset.ksdom; saveUi(); renderKetteSheet(); return; }
  if(ketteSheetOffen && t.closest('#ketteSheetListe')){
    const ksWechselt=!!t.closest('[data-check],[data-detail]');

  }
  // §5 (v1.11.1): Kettenzeilen im Status-Sheet = normale Kartenzeilen mit den
  // gemeinsamen Handlern. Start schließt das Sheet; Detail/Abhaken ersetzen es
  // ohnehin; alles andere (Pfeile, Pin, Tick, …) rendert das Sheet neu.
  if(t.closest('#sheetKette')){
    const warStart=!!t.closest('[data-fokusstart]');
    const wechselt=!!t.closest('[data-detail],[data-check]');
    if(karteRowClick(t, e)){
      if(warStart) closeSheet();
      else if(!wechselt) renderStatusSheet();
      return;
    }
  }
  // U6-A: Abhak-Dialog
  if(t.closest('[data-abfolge]')){ if(abhakTmp){ abhakTmp.folge=!abhakTmp.folge; renderAbhakDialog(); } return; }
  if(t.closest('[data-abakkuskip]')){ if(abhakTmp){ abhakTmp.akkuSkip=!abhakTmp.akkuSkip; renderAbhakDialog(); } return; }   // §4.1 (1.10.0)
  // §6.2 (v1.8.0): Unteraufgabe im Abhak-Dialog abhaken → Bonus/Summe/Basis live
  const asd=t.closest('[data-absubdone]'); if(asd){ if(!abhakTmp) return;
    const u=S.unteraufgaben.find(x=>x.id===asd.dataset.absubdone); if(!u) return;
    u.done=!u.done; DB.set('unteraufgaben', S.unteraufgaben);
    const k=S.karten.find(x=>x.id===abhakTmp.kid);
    const tI=el('abIst'), tB=el('abBonus'), tP=el('abPktN');
    const altBasis=abhakTmp.basis;
    if(tI) abhakTmp.istMin=num(tI.value); if(tB) abhakTmp.bonusDef=num(tB.value);
    abhakTmp.basis=Math.round(kartePunkte(k));
    abhakTmp.max=Math.max(10, abhakTmp.basis*2);
    abhakTmp.userPkt=(tP && num(tP.value)!==altBasis)?tP.value:null;   // eigene Eingabe respektieren
    abhakTmp.offeneSubs=untermenge(k.id).filter(x=>!x.done).length;
    abhakTmp.folge=abhakTmp.offeneSubs>0;
    renderAbhakDialog();
    const nP=el('abPktN'); if(nP && abhakTmp.userPkt!=null){ nP.value=abhakTmp.userPkt; const r=el('abPkt'); if(r) r.value=String(Math.min(num(abhakTmp.userPkt),abhakTmp.max)); }
    return; }
  // §5: Priorität im Folgeaufgaben-Vorschlag (Auswahl über Render-Zyklus halten)
  const afp=t.closest('[data-abfpri]'); if(afp){ if(abhakTmp){ abhakTmp.folgePri=afp.dataset.abfpri;
    const box=el('abFolgePri'); if(box) box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===afp)); } return; }
  if(t.closest('[data-abgo]')){ abhakDialogConfirm(); return; }

  if(t.closest('[data-apkeep]')){ autoPauseUebernehmen(true);  return; }

  // ── Sync (§8)
  if(t.closest('[data-synccopy]')){ const ta=el('syncEx'); if(ta){ ta.select(); let okc=false; try{ okc=document.execCommand('copy'); }catch(e){} if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(()=>{}); toast(okc?'Kopiert':'Markiert — ⌘C'); } return; }

  if(t.closest('[data-tagdownload]')){ backupDownload(tagBackupPaket(), 'fokus-tagesabschluss-'+(S.tag?S.tag.tagId:'tag')+'.json'); return; }
  if(t.closest('[data-syncimport]')){ const ta=el('syncIn'); const res=syncImport(ta?ta.value:''); const box=el('syncErgebnis');
    if(res.fehler){ if(box) box.innerHTML='<div class="card" style="border-color:var(--bad)"><p class="d" style="color:var(--bad)">'+esc(res.fehler)+'</p></div>'; }
    else { renderAlles(); const exta=el('syncEx'); if(exta) exta.value=syncExportText('sync');
      // §2.4 (v1.7.1): getrennt ausweisen — angelegt je Domäne, aktualisiert,

  if(t.closest('[data-tsnext]')){ const a=tagStartTmp.akku; tagStarten(a); tagStartTmp.step=2; tagStartTmp.sortOrder=[]; renderTagStart(); toast('Tag gestartet · Akku '+a+'%'); return; }

  const abs=t.closest('[data-abschieben]'); if(abs){ abschlussTmp.schiebenFor=abs.dataset.abschieben; const k=S.karten.find(x=>x.id===abs.dataset.abschieben); abschlussTmp.abzug=abzugVorschlag(k); renderAbschluss(); return; }

  const abz=t.closest('[data-abzug]'); if(abz){ abschlussTmp.abzug=num(abz.dataset.abzug); renderAbschluss(); return; }
  const abg=t.closest('[data-abschiebengo]'); if(abg){ const k=S.karten.find(x=>x.id===abg.dataset.abschiebengo);
    const dt=el('ab-date'), tm=el('ab-time'), selbst=el('ab-abzug');
    const abzug=(selbst && selbst.value!=='')?Math.max(0,Math.round(num(selbst.value))):abschlussTmp.abzug;
    karteSchieben(k, dt?dt.value:null, tm&&tm.value?tm.value:null, abzug);
    // §12.2 (v1.12.0): das Zieldatum steuert die Ketten — bis dahin raus aus
    // der heutigen Kette (die Auto-Befuellung des Zieltags holt sie zurueck).
    // §2 (v1.13.1): über ketteRausHeute — der Inline-Splice schrieb keine Historie.
    if(k) ketteRausHeute(k);
    abschlussTmp.schiebenFor=null; saveKarten(); saveTag(); renderAbschluss(); return; }
  const aba=t.closest('[data-abarchiv]'); if(aba){ const k=S.karten.find(x=>x.id===aba.dataset.abarchiv); if(k){ k.status='archiviert'; saveKarten(); } renderAbschluss(); return; }
  const abe=t.closest('[data-abedit]'); if(abe){ oeffneDetail(abe.dataset.abedit); return; }
  const abv=t.closest('[data-abverpasst]'); if(abv){ const k=S.karten.find(x=>x.id===abv.dataset.abverpasst); if(k){ routineBilanz(k,true); k.faelligkeit=null; saveKarten(); saveTag(); } renderAbschluss(); return; }
  const abn=t.closest('[data-abnicht]'); if(abn){ const k=S.karten.find(x=>x.id===abn.dataset.abnicht); if(k){ if(k.rhythmus) routineBilanz(k,false); k.faelligkeit=null; saveKarten(); saveTag(); } renderAbschluss(); return; }
  if(t.closest('[data-abweiter]')){ abschlussTmp.step=2; renderAbschluss(); return; }
  const stp=t.closest('[data-sorttap]'); if(stp){ const id=stp.dataset.sorttap; const o=abschlussTmp.sortOrder; const i=o.indexOf(id); if(i>=0) o.splice(i,1); else o.push(id); renderAbschluss(); return; }
  if(t.closest('[data-absortreset]')){ abschlussTmp.sortOrder=[]; renderAbschluss(); return; }
  if(t.closest('[data-abfinish]')){ abschlussFinish(); return; }

  // ── Detail-Chips
  const chip=t.closest('[data-chip]');
  if(chip){
    const feld=chip.dataset.chip; let val=chip.dataset.val;
    if(feld==='domain'){ entwurf.domain=val; }
    else if(feld==='rhythmus'){
      entwurf.rhythmus = val==='keine'?null : val==='taeglich'?{typ:'taeglich'} : val==='alleNTage'?{typ:'alleNTage',n:num(entwurf.rhythmus&&entwurf.rhythmus.n,2)} : {typ:'wochentage',tage:(entwurf.rhythmus&&entwurf.rhythmus.tage)||[]};
    }
    else if(feld==='timerFlag'){ entwurf.timerFlag = (val==='ja'); }
    else if(['komplex','energie','blockade'].includes(feld)){ entwurf[feld]=num(val); }
    else { entwurf[feld]=val; }
    renderDetail(); return;
  }
  const wt=t.closest('[data-wtag]');
  if(wt){ const d=num(wt.dataset.wtag); const arr=(entwurf.rhythmus.tage||[]); entwurf.rhythmus.tage = arr.includes(d)?arr.filter(x=>x!==d):arr.concat([d]).sort(); renderDetail(); return; }

  // Vorlagen / Gruppen (§3.4 / §3.3)
  const av=t.closest('[data-ausvorlage]'); if(av){ detailAusVorlage(av.dataset.ausvorlage); return; }
  if(t.closest('[data-alsvorlage]')){ detailLies(); vorlageAusEntwurf(); return; }
  const gr=t.closest('[data-gruppe]'); if(gr){ entwurf.gruppeId = gr.dataset.gruppe || null; renderDetail(); return; }
  if(t.closest('[data-gruppeneu]')){ const n=(prompt('Name der Gruppe:')||'').trim(); if(n){ const g=neueGruppe({name:n}); S.gruppen.push(g); saveGruppen(); entwurf.gruppeId=g.id; } renderDetail(); return; }
  if(t.closest('[data-dfreeze]')){ entwurf.freeze=!entwurf.freeze; renderDetail(); return; }   // A4
  if(t.closest('[data-dabhak]')){ entwurf.abhakbonus = (entwurf.abhakbonus===0) ? null : 0; renderDetail(); return; }   // U6-D: Abhakbonus an/aus (null=Domänen-Default)
  // §2 (v1.13.0): Rückweg je Karte — beide Overrides auf „erbt Standard"
  if(t.closest('[data-dstandard]')){ entwurf.abhakbonus=null; entwurf.tickWert=null; renderDetail(); toast('↺ erbt wieder den Domänen-Standard'); return; }
  // §1 (v1.6.1): Tagesabschnitte umschalten (Mehrfachauswahl, leer = automatisch)
  const dta=t.closest('[data-dta]'); if(dta){ const ta=dta.dataset.dta;
    const cur=Array.isArray(entwurf.tagesabschnitt)?entwurf.tagesabschnitt.slice():[];
    const i=cur.indexOf(ta); if(i>=0) cur.splice(i,1); else cur.push(ta);
    entwurf.tagesabschnitt = cur.length ? TAGESABSCHNITTE.filter(x=>cur.indexOf(x)>=0) : null;   // stabile Reihenfolge
    renderDetail(); return; }
  // §5 (v1.6.1): Pausentimer-Flag je Karte
  if(t.closest('[data-dnoauto]')){ entwurf.keineAutoPause=!entwurf.keineAutoPause; renderDetail(); return; }

  // Tick-Kurve: erstes „Erstellen" springt auf 3 Schritte (Vorauswahl), jeder
  // weitere Klick fügt einen an; der ＋-Button bleibt immer.
  // §9.2 (v1.8.0): Ticks an/aus je Karte
  if(t.closest('[data-dticks]')){ entwurf.ticksAktiv=!entwurf.ticksAktiv; renderDetail(); return; }
  if(t.closest('[data-dzeit]')){ entwurf.zeitmessung=!hatZeitmessung(entwurf); renderDetail(); return; }   // §2 (1.9.1)

  // Zeitstaffel (§4): erste Anlage seedet 3 Stufen, danach je +1; Button bleibt.
  if(t.closest('[data-zsadd]')){ zeitStufenLies(); const cur=entwurf.zeitStufen||[];
    entwurf.zeitStufen = cur.length===0 ? [{bisMin:null,punkteProStd:0},{bisMin:null,punkteProStd:0},{bisMin:null,punkteProStd:0}] : cur.concat([{bisMin:null,punkteProStd:0}]);
    renderDetail(); return; }
  const zsd=t.closest('[data-zsdel]'); if(zsd){ zeitStufenLies(); (entwurf.zeitStufen||[]).splice(num(zsd.dataset.zsdel),1); if(!entwurf.zeitStufen.length) entwurf.zeitStufen=null; renderDetail(); return; }

  // Unteraufgaben
  if(t.closest('[data-subadd]')){ entwurfSubs.push(neueUnteraufgabe(entwurf.id,{titel:''})); subBalanceNachAdd(); subParentAngleichen(); renderDetail(); return; }
  const sdel=t.closest('[data-subdel]'); if(sdel){ entwurfSubs=entwurfSubs.filter(u=>u.id!==sdel.dataset.subdel); subParentAngleichen(); renderDetail(); return; }
  const sdone=t.closest('[data-subdone]'); if(sdone){ const u=entwurfSubs.find(x=>x.id===sdone.dataset.subdone); if(u) u.done=!u.done; renderDetail(); return; }

  // Detail-Aktionen
  const da=t.closest('[data-detailaktion]');
  if(da){
    const a=da.dataset.detailaktion;
    if(a==='speichern'){ detailLies(); detailSpeichern(); }
    else if(a==='abhaken'){ detailLies(); const id=entwurf.id, wasOffen=entwurf.status==='offen'; detailSpeichern();
      wasOffen ? karteAbhakenAuto(id, false) : karteAbhaken(id, false); }   // U6-A: Erledigen über Dialog, Un-Abhaken direkt
    else if(a==='archiv'){ detailLies(); entwurf.status='archiviert'; detailSpeichern(); }
    else if(a==='neustarten'){ karteNeuStarten(entwurf.id); }   // U6-A6
    return;
  }

  // ── Stapel-Editor
  const sf=t.closest('[data-sfarbe]'); if(sf){ stapelEntwurf.farbe=sf.dataset.sfarbe; renderStapelEditor(); return; }
  const so=t.closest('[data-sordner]'); if(so){ const id=so.dataset.sordner; const arr=stapelEntwurf.ordnerIds||[]; stapelEntwurf.ordnerIds = arr.includes(id)?arr.filter(x=>x!==id):arr.concat([id]); renderStapelEditor(); return; }
  if(t.closest('[data-ordnerneu]')){ const name=prompt('Ordnername'); if(name){ const o=neuerOrdner({name:name.trim()}); S.ordner.push(o); saveOrdner(); (stapelEntwurf.ordnerIds=stapelEntwurf.ordnerIds||[]).push(o.id); renderStapelEditor(); } return; }
  const sfl=t.closest('[data-sflag]'); if(sfl){ stapelEntwurf.schnellzugriffTimer=!stapelEntwurf.schnellzugriffTimer; renderStapelEditor(); return; }
  if(t.closest('[data-fbadd]')){ stapelLiesEditor(); (stapelEntwurf.filter=stapelEntwurf.filter||[]).push({feld:'domain',op:'ist',werte:[]}); renderStapelEditor(); return; }
  const fbdel=t.closest('[data-fbdel]'); if(fbdel){ stapelLiesEditor(); stapelEntwurf.filter.splice(num(fbdel.dataset.fbdel),1); renderStapelEditor(); return; }
  const fbw=t.closest('[data-fbwert]'); if(fbw){ const i=num(fbw.dataset.fbwert), v=fbw.dataset.v; const f=stapelEntwurf.filter[i]; f.werte=f.werte||[]; f.werte = f.werte.map(String).includes(String(v))?f.werte.filter(x=>String(x)!==String(v)):f.werte.concat([v]); renderStapelEditor(); return; }
  const sak=t.closest('[data-saktion]'); if(sak){ if(sak.dataset.saktion==='speichern'){ stapelLiesEditor(); stapelSpeichern(); } else if(sak.dataset.saktion==='loeschen'){ if(confirm('Stapel „'+stapelEntwurf.name+'" löschen?')) stapelLoeschen(); } return; }
});

  if(t.dataset.absubmin!=null){ const u=S.unteraufgaben.find(x=>x.id===t.dataset.absubmin); if(u){ u.sollMin=num(t.value);
    const k=abhakTmp&&S.karten.find(x=>x.id===abhakTmp.kid);

    DB.set('unteraufgaben', S.unteraufgaben); } return; }

  if((t.dataset.zsbis!=null||t.dataset.zspkt!=null) && entwurf){ zeitStufenLies(); return; }   // Zeitstaffel live binden
  if(t.dataset.sbind!=null && stapelEntwurf){ stapelFeld(t.dataset.sbind, t.value); return; }

  if(stapelEntwurf && stapelEntwurf.filter){

    if(t.dataset.fbvon!=null){ stapelEntwurf.filter[num(t.dataset.fbvon)].von=t.value||null; return; }
    if(t.dataset.fbbis!=null){ stapelEntwurf.filter[num(t.dataset.fbbis)].bis=t.value||null; return; }
  }

    const typ=feldTyp(f.feld); f.op = typ==='select'?'ist':typ==='zahl'?'gte':typ==='datum'?'heute':'enthaelt'; renderStapelEditor(); return; }

});

/* Detail: einzelnes gebundenes Feld in den Entwurf schreiben */
function detailFeld(bind, input){
  const v=input.value;
  if(bind==='geldScore'||bind==='sollMin'){ entwurf[bind]=num(v); }
  // §6.2 (v1.6.1): abhakbonus wie die anderen Overrides — leer = Domänen-Default,
  // sonst der eingegebene Wert INKLUSIVE negativer Beträge (kein Clamp).
  else if(bind==='tickWert'){ entwurf.tickWert = v===''?null:num(v); }   // §2 (1.13.0): leer = erbt Standard
  else if(bind==='punkteProStd'||bind==='akkuProStd'||bind==='_istMinEdit'||bind==='abhakbonus'){ entwurf[bind]= v===''?null:num(v); }  // leer = null (Fallback)
  else if(bind==='rhythmusN'){ if(entwurf.rhythmus) entwurf.rhythmus.n=Math.max(1,num(v)); }
  else { entwurf[bind]= (v===''&&(bind==='faelligkeit'||bind==='uhrzeit'||bind==='projekt')) ? null : v; }
}
/* Zeitstaffel aus dem DOM in den Entwurf lesen (leere bis-Minute = null „danach"). */
function zeitStufenLies(){
  if(!entwurf) return;
  const rows=document.querySelectorAll('#zsWrap .sub');
  if(!rows.length){ return; }
  const arr=[];
  rows.forEach(r=>{ const bisEl=r.querySelector('[data-zsbis]'), pktEl=r.querySelector('[data-zspkt]');
    arr.push({ bisMin: (bisEl && bisEl.value!=='')?num(bisEl.value):null, punkteProStd: pktEl?num(pktEl.value):0 }); });
  entwurf.zeitStufen = arr.length ? arr : null;
}
/* Detail: gesamten Formularstand aus dem DOM in den Entwurf lesen (vor Save/Aktion) */
function detailLies(){
  document.querySelectorAll('#sheetBody [data-bind]').forEach(inp=>detailFeld(inp.dataset.bind, inp));
  document.querySelectorAll('#sheetBody [data-subtitel]').forEach(inp=>{ const u=entwurfSubs.find(x=>x.id===inp.dataset.subtitel); if(u) u.titel=inp.value; });
  document.querySelectorAll('#sheetBody [data-submin]').forEach(inp=>{ const u=entwurfSubs.find(x=>x.id===inp.dataset.submin); if(u) u.sollMin=num(inp.value); });
  zeitStufenLies();
  subParentAngleichen();
}
function stapelFeld(bind, val){
  if(bind==='name') stapelEntwurf.name=val;
  else if(bind==='sortFeld'){ stapelEntwurf.sortierung=stapelEntwurf.sortierung||{}; stapelEntwurf.sortierung.feld=val; }
  else if(bind==='sortRichtung'){ stapelEntwurf.sortierung=stapelEntwurf.sortierung||{}; stapelEntwurf.sortierung.richtung=val; }
}
/* Stapel-Editor: Filterzeilen aus dem DOM in den Entwurf lesen */
function stapelLiesEditor(){
  const st=stapelEntwurf; if(!st.filter) return;
  document.querySelectorAll('#fbWrap .fbrow').forEach(row=>{
    const i=num(row.dataset.fbi); const f=st.filter[i]; if(!f) return;
    const fs=row.querySelector('[data-fbfeld]'); if(fs) f.feld=fs.value;
    const op=row.querySelector('[data-fbop]'); if(op) f.op=op.value;
    const nu=row.querySelector('[data-fbnum]'); if(nu) f.wert=num(nu.value);
    const tx=row.querySelector('[data-fbtext]'); if(tx) f.wert=tx.value;
    const vo=row.querySelector('[data-fbvon]'); if(vo) f.von=vo.value||null;
    const bi=row.querySelector('[data-fbbis]'); if(bi) f.bis=bi.value||null;
  });
}

  // §3 (v1.6.1): Routinen-Gruppen verwalten

  const gd=gt.closest('[data-grpdel]'); if(gd){ const g=S.routinenGruppen.find(x=>x.id===gd.dataset.grpdel);

  const gdm=gt.closest('[data-grpdom]'); if(gdm){ const g=S.routinenGruppen.find(x=>x.id===gdm.dataset.grpdom);
