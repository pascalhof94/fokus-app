/* FIX1 (v1.5.2): ab dieser Zahl gleichzeitiger Neuanlagen in EINEM Importlauf
   gilt es als Bestandsübernahme (Airtable-Erstsync), nicht als organischer
   Tageszugang — siehe Migration flowfix152 weiter oben (ladeAlles) für die
   rückwirkende Reparatur desselben Musters. */
const SYNC_BESTAND_SCHWELLE = 10;
/* Import eines Pakets aus dem Claude-Chat (§8-Hoheitsregeln). */
function syncImport(text){
  let paket; try{ paket=JSON.parse(text); }catch(e){ return {fehler:'Ungültiges JSON'}; }
  // §6.1 (v1.6.1): Das appVersion-Gate gilt jetzt AUSNAHMSLOS — auch für
  // Array-Pakete. Der v0.38-Konverter wird nicht mehr gebraucht.
  if(Array.isArray(paket)) return {fehler:'Array-Paket ohne appVersion — seit v1.6.1 nicht mehr zulässig. Bitte ein Paket nach Vertrag 1.x anfordern.'};
  const av=paket && paket.appVersion;
  if(av==null || av==='') return {fehler:'Paket ohne appVersion — bitte im Chat ein Paket nach Vertrag 1.x anfordern.'};
  if(/^0\./.test(String(av)))  return {fehler:'Altformat appVersion '+av+' — dieses Paket wird nicht mehr verarbeitet (Vertrag ab 1.0).'};
  // §7 (v1.13.0): Gate auf App-Version 1.13.0 hochgezogen — Vertrag 1.6
  // (Tagesrahmen, Korrekturblock, Rein/Raus, Akku-Einträge, Upgrade-Faktor).
  {
    const teile=String(av).split('.').map(x=>num(x));
    const wert=(teile[0]||0)*10000+(teile[1]||0)*100+(teile[2]||0);
    if(wert<11300) return {fehler:'Paket-appVersion '+av+' ist älter als 1.13.0 — bitte im Chat ein Paket nach Vertrag 1.6 anfordern (Tagesrahmen + Korrekturblock).'};
  }
  const arr = (paket && paket.karten) || null;
  if(!Array.isArray(arr) || !arr.length) return {fehler:'Keine Karten im Paket'};
  let neu=0, neuDfm=0, neuPrivat=0, upd=0, arch=0;
  const neuAngelegt=[];   // FIX1: Neuanlagen dieses Laufs — ggf. als Bestandsübernahme markieren
  const uebersprungen=[]; // §2.4 (v1.7.1): alles, was nicht ankam — MIT Grund
  arr.forEach(inc=>{
    if(!inc || (inc.id==null && inc.airtableId==null && (inc.titel==null||String(inc.titel).trim()===''))){
      uebersprungen.push({was:'Karte ohne id/airtableId/titel', grund:'nicht identifizierbar'}); return;
    }
    // Anker: App-id; sekundär airtableId (§8: airtableId→id-Match)
    let lok = (inc.id && S.karten.find(k=>k.id===inc.id)) ||
              (inc.airtableId && S.karten.find(k=>k.airtableId===inc.airtableId)) || null;
    // §3 (v1.13.1) · Vertrag 1.6: „id = recId wird in der App automatisch zur
    // airtableId" — der Zweitanker darf nie fehlen (sonst reißt der Match,
    // sobald die Karte umbenannt oder dupliziert wird).
    const recId=/^rec[A-Za-z0-9]{14}$/.test(String(inc.id||'')) ? String(inc.id) : null;
    if(!lok){
      // §2.1 (v1.7.1): domain wirkt NUR bei Neuanlage — 'privat' legt eine
      // private Karte an, alles andere (auch fehlend) bleibt beim bisherigen dfm.
      const dom = inc.domain==='privat' ? 'privat' : 'dfm';
      lok=neueKarte({ id: inc.id||uuid(), domain:dom,
        airtableId: inc.airtableId || (dom==='dfm'?recId:null) });
      S.karten.push(lok); neu++; if(dom==='dfm') neuDfm++; else neuPrivat++;
      neuAngelegt.push(lok);
    }
    else upd++;   // §2.1: bei bekannter Karte wird ein mitgeschicktes domain IGNORIERT
    // Airtable-Hoheit → übernehmen
    if(inc.airtableId!=null) lok.airtableId=inc.airtableId;
    else if(!lok.airtableId && recId && lok.domain==='dfm') lok.airtableId=recId;   // §3 (v1.13.1): Bestand heilen
    if(inc.titel!=null) lok.titel=inc.titel;
    if(inc.projekt!==undefined) lok.projekt=inc.projekt;
    if(inc.geldScore!=null) lok.geldScore=num(inc.geldScore);
    if(inc.notiz!=null) lok.notiz=inc.notiz;
    if(inc.kommentarClaude!=null) lok.kommentarClaude=inc.kommentarClaude;             // U6-F (1.2.0)
    else if(inc.kommentarFuerClaude!=null) lok.kommentarClaude=inc.kommentarFuerClaude; // Abwärtskompat.: 1.1.0-Pakete
    // Archivierung ist Airtable-Hoheit (Teil des Status); No-delete: nur archivieren, nie löschen
    if(inc.status==='archiviert' && lok.status!=='archiviert'){ lok.status='archiviert'; arch++; }
    // Beidseitige Felder → letzter Stand (Import bringt den abgestimmten Stand)
    if(inc.sollMin!=null) lok.sollMin=num(inc.sollMin);
    if(inc.prioritaet!=null) lok.prioritaet=inc.prioritaet;
    // §8.3 (1.4): neue Felder auch beim Import übernehmen
    // §1 (1.6.1): Array — ein einzelner String wird tolerant gelesen. §2: ein
    // mitgeschicktes tageszeit wird still ignoriert.
    if(inc.tagesabschnitt!=null){
      const roh=Array.isArray(inc.tagesabschnitt)?inc.tagesabschnitt:[inc.tagesabschnitt];
      const f=roh.filter(x=>TAGESABSCHNITTE.indexOf(x)>=0);
      if(f.length) lok.tagesabschnitt=TAGESABSCHNITTE.filter(x=>f.indexOf(x)>=0);
    }
    if(inc.vorgaengerAppId!=null)      lok.vorgaengerAppId=inc.vorgaengerAppId;
    if(inc.vorgaengerAirtableId!=null) lok.vorgaengerAirtableId=inc.vorgaengerAirtableId;
    // §2.2 (v1.7.1): Karten-Bausteine — jeweils NUR wenn mitgeschickt; fehlende
    // Felder ändern nichts. Damit entstehen Routinen und Counter vollständig
    // aus einem Paket (Neuaufbau-Weg).
    if(inc.rhythmus!==undefined)       lok.rhythmus = inc.rhythmus ? JSON.parse(JSON.stringify(inc.rhythmus)) : null;
    // §9.5 (1.8.0): neues Tick-Modell im Paket; eine alte tickKurve wird nach
    // derselben Regel wie in der Migration umgesetzt (erster Wert, [0] = aus).
    if(inc.ticksAktiv!==undefined)     lok.ticksAktiv=!!inc.ticksAktiv;
    if(inc.tickWert!==undefined)       lok.tickWert = inc.tickWert==null?null:num(inc.tickWert);   // §2 (1.13.0): null = erbt Standard; Zahl = Override (negativ zulässig)
    if(inc.tickKurve!==undefined && inc.ticksAktiv===undefined && inc.tickWert===undefined){
      const tk=Array.isArray(inc.tickKurve)?inc.tickKurve.map(x=>num(x)):[];
      const echt = tk.length>1 || (tk.length===1 && tk[0]!==0);
      if(echt){ lok.ticksAktiv=true; lok.tickWert=tk[0]; }
    }
    if(inc.punkteProStd!==undefined)   lok.punkteProStd = inc.punkteProStd==null?null:num(inc.punkteProStd);
    if(inc.akkuProStd!==undefined)     lok.akkuProStd   = inc.akkuProStd==null?null:num(inc.akkuProStd);
    if(inc.abhakbonus!==undefined)     lok.abhakbonus   = inc.abhakbonus==null?null:num(inc.abhakbonus);   // auch negativ
    if(inc.timerFlag!==undefined){     lok.timerFlag=!!inc.timerFlag;
                                       if(inc.zeitmessung===undefined) lok.zeitmessung=!!inc.timerFlag || kartenArt(lok)==='Aufgabe' || num(lok.sollMin)>0; }
    if(inc.zeitmessung!==undefined)    lok.zeitmessung=!!inc.zeitmessung;   // §2 (1.9.1): expliziter Schalter gewinnt
    if(inc.keineAutoPause!==undefined) lok.keineAutoPause=!!inc.keineAutoPause;
    if(inc.komplex!=null) lok.komplex=num(inc.komplex);
    if(inc.energie!=null) lok.energie=num(inc.energie);
    if(inc.blockade!=null) lok.blockade=num(inc.blockade);
    if(inc.faelligkeit!==undefined) lok.faelligkeit=inc.faelligkeit;   // Deadline↔Fälligkeit
    if(inc.uhrzeit!==undefined) lok.uhrzeit=inc.uhrzeit;               // Uhrzeit↔Airtable-Deadline
    if(inc.freeze!==undefined) lok.freeze=!!inc.freeze;               // M1 (v1.1.0): freeze true setzt / false löst; fehlend = unverändert
    // App-Hoheit (Status offen/erledigt, Ist, Punkte) wird NIE vom Import überschrieben.
    // Unteraufgaben — Match ausschließlich über App-id, nie über Titel.
    if(Array.isArray(inc.unteraufgaben)){
      inc.unteraufgaben.forEach(iu=>{
        let lu = S.unteraufgaben.find(u=>u.parentId===lok.id && u.id===iu.id);
        if(!lu){ lu=neueUnteraufgabe(lok.id, { id: iu.id||uuid() }); S.unteraufgaben.push(lu); }
        if(iu.titel!=null) lu.titel=iu.titel;        // Definition beidseitig
        if(iu.sollMin!=null) lu.sollMin=num(iu.sollMin);
        // done = App-Hoheit → nicht überschreiben
      });
    }
  });
  // FIX1: ≥SYNC_BESTAND_SCHWELLE Neuanlagen in diesem Rutsch = Bestandsübernahme,
  // kein Tageszugang — sofort markieren, bevor sie in einer Flow-Auswertung
  // als Spike auftauchen. Unter der Schwelle bleiben es normale neue Aufgaben.
  if(neuAngelegt.length>=SYNC_BESTAND_SCHWELLE) neuAngelegt.forEach(k=>{ k.flowBaseline=true; });
  // §13 (v1.12.0) · Vertrag 1.5: Top-Level ketteDfm[]/kettePrivat[] ersetzen
  // tagesKette. Der Import setzt eine Kette NUR, wenn das Paket sie trägt —
  // fehlt das Feld, bleibt die Reihenfolge unberührt (App behält die Hoheit).
  // Alt-Pakete mit kette[] werden weiterhin angenommen (nach Domäne verteilt).
  let ketteGesetzt=null, ketteUnbekannt=[];
  const ketteAufloesen=(arr)=>{
    const ids=[];
    (arr||[]).forEach(ref=>{
      const s=String(ref||'').trim(); if(!s) return;
      const k=S.karten.find(x=>x.id===s) || S.karten.find(x=>x.airtableId===s);
      if(k) ids.push(k.id); else ketteUnbekannt.push(s);
    });
    return ids;
  };
  if(paket && !Array.isArray(paket)){
    const traegtKette=Array.isArray(paket.ketteDfm)||Array.isArray(paket.kettePrivat)||Array.isArray(paket.kette);
    // §5.5 (v1.13.0): Karten, die der Import WÄHREND des Tages neu in eine
    // Kette bringt, tragen das ungeplant-Flag.
    const vorherKette=(traegtKette && tagOffen()) ? new Set(tagesKette()) : null;
    if(Array.isArray(paket.ketteDfm)){ const ids=ketteAufloesen(paket.ketteDfm); ketteSetzen(ids,'dfm'); ketteGesetzt=(ketteGesetzt||0)+ids.length; }
    if(Array.isArray(paket.kettePrivat)){ const ids=ketteAufloesen(paket.kettePrivat); ketteSetzen(ids,'privat'); ketteGesetzt=(ketteGesetzt||0)+ids.length; }
    if(ketteGesetzt==null && Array.isArray(paket.kette)){ const ids=ketteAufloesen(paket.kette); ketteSetzen(ids); ketteGesetzt=ids.length; }
    if(vorherKette){ let dirty=false;
      tagesKette().forEach(id=>{ if(vorherKette.has(id)) return;
        const k=S.karten.find(x=>x.id===id); if(k && !k.ungeplant){ k.ungeplant=true; dirty=true; } });
      if(dirty) saveKarten(); }
    ketteUnbekannt.forEach(s=>uebersprungen.push({was:'Ketten-Eintrag „'+s+'"', grund:'keine Karte mit dieser ID'}));
  }
  // ══ §5.3 (v1.13.0) · Tagesrahmen — Segmente {von,bis,typ} in Stunden oder
  // "HH:MM". Ein ZWEITER Sync ersetzt den Rahmen AB der aktuellen Uhrzeit;
  // bereits Vergangenes (und alles Gemessene) bleibt unberührt. ══
  let rahmenGesetzt=null;
  if(paket && !Array.isArray(paket) && Array.isArray(paket.tagesRahmen)){
    const parseStd=v=>{ const s=String(v==null?'':v).trim();
      if(/^\d{1,2}:\d{2}$/.test(s)){ const t=s.split(':'); return num(t[0])+num(t[1])/60; }
      const n=Number(s); return Number.isFinite(n)?n:NaN; };
    const seg=paket.tagesRahmen.map(s=>({von:parseStd(s&&s.von), bis:parseStd(s&&s.bis), typ:String((s&&s.typ)||'')}))
      .filter(s=>isFinite(s.von)&&isFinite(s.bis)&&s.bis>s.von&&['dfm','privat','pause','schlaf'].indexOf(s.typ)>=0)
      .sort((a,b)=>a.von-b.von);
    if(seg.length){
      const hTag=heuteApp();
      const alt=(S.meta.tagesRahmen && S.meta.tagesRahmen.datum===hTag) ? S.meta.tagesRahmen.segmente : null;
      let final=seg;
      if(alt && tagOffen()){
        const jetzt=jetztStunde();
        const vorher=alt.map(s=>({von:s.von, bis:Math.min(s.bis,jetzt), typ:s.typ})).filter(s=>s.bis>s.von+0.001);
        const nachher=seg.map(s=>({von:Math.max(s.von,jetzt), bis:s.bis, typ:s.typ})).filter(s=>s.bis>s.von+0.001);
        final=vorher.concat(nachher);
      }
      S.meta.tagesRahmen={ datum:hTag, segmente:final, ts:jetztIso() };
      rahmenGesetzt=final.length; saveMeta();
    } else if(paket.tagesRahmen.length){
      uebersprungen.push({was:'tagesRahmen', grund:'keine gültigen Segmente (von/bis/typ ∈ dfm|privat|pause|schlaf)'});
    }
  }
  // ══ §5.7 (v1.13.0) · Rückwirkende Korrektur — NUR benannte Tage, NUR die
  // ausdrücklich getragenen Felder, mit Protokoll. Ein Paket ohne
  // Korrekturblock ändert an vergangenen Tagen NICHTS. ══
  let korrigiert=[];
  if(paket && !Array.isArray(paket) && Array.isArray(paket.korrekturen)){
    paket.korrekturen.forEach(kx=>{
      if(!kx || !/^\d{4}-\d{2}-\d{2}$/.test(String(kx.datum||''))){
        uebersprungen.push({was:'Korrektur ohne gültiges Datum', grund:'nur BENANNTE Tage (§5.7)'}); return; }
      const snaps=(S.historie||[]).filter(h2=>h2.datum===kx.datum && !h2.luecke);
      if(!snaps.length && kx.punkteBilanz!==undefined){
        uebersprungen.push({was:'Korrektur '+kx.datum, grund:'kein Tages-Snapshot zu diesem Datum'}); }
      ['punkteBilanz','startTs','endeTs','akku','urlaub','spielZufluss'].forEach(f=>{
        if(kx[f]===undefined) return;
        snaps.forEach(h2=>{
          const vorher=(h2[f]===undefined)?null:h2[f];
          h2[f]=(f==='urlaub')?!!kx[f] : (f==='startTs'||f==='endeTs')?String(kx[f]) : num(kx[f]);
          korrigiert.push({ts:jetztIso(), datum:kx.datum, feld:f, vorher, nachher:h2[f]});
        });
      });
      if(Array.isArray(kx.karten)) kx.karten.forEach(kk=>{
        const lok2=(kk&&kk.id)?S.karten.find(x=>x.id===kk.id):null;
        if(!lok2){ uebersprungen.push({was:'Korrektur-Karte '+esc((kk&&kk.id)||'?'), grund:'keine Karte mit dieser ID'}); return; }
        if(kk.istMin!==undefined){
          const vorher=Math.round(num(lok2.istSek)/60);
          lok2.istSek=Math.max(0,num(kk.istMin))*60;
          korrigiert.push({ts:jetztIso(), datum:kx.datum, feld:'Karte „'+String(lok2.titel||'').slice(0,30)+'" istMin', vorher, nachher:num(kk.istMin)});
        }
      });
    });
    if(korrigiert.length){
      if(!Array.isArray(S.meta.syncKorrekturen)) S.meta.syncKorrekturen=[];
      S.meta.syncKorrekturen=S.meta.syncKorrekturen.concat(korrigiert).slice(-200);
      saveHistorie(); saveMeta();
    }
  }
  // §2.3 (v1.7.1): Top-Level gruppen[] — Routinen-Gruppen anlegen/aktualisieren.
  // mitglieder dürfen App-IDs ODER Kartentitel sein (Titel werden gegen die im
  // selben Paket angelegten Karten aufgelöst, da die Auflösung NACH der
  // Kartenschleife läuft). Unauflösbares wird gemeldet, nicht verschluckt.
  // Gleiche id → aktualisieren, nie duplizieren.
  let gruppenNeu=0, gruppenUpd=0;
  if(paket && Array.isArray(paket.gruppen)){
    if(!Array.isArray(S.routinenGruppen)) S.routinenGruppen=[];
    paket.gruppen.forEach(g=>{
      if(!g || (!g.id && !(g.name&&String(g.name).trim()))){
        uebersprungen.push({was:'Gruppe ohne id und name', grund:'nicht identifizierbar'}); return;
      }
      const mitglieder=[];
      (g.mitglieder||[]).forEach(ref=>{
        const s=String(ref||'').trim(); if(!s) return;
        const k=S.karten.find(x=>x.id===s)
             || S.karten.find(x=>String(x.titel||'').trim().toLowerCase()===s.toLowerCase());
        if(k){ if(mitglieder.indexOf(k.id)<0) mitglieder.push(k.id); }
        else uebersprungen.push({was:'Gruppen-Mitglied „'+s+'" ('+esc(g.name||g.id)+')', grund:'keine Karte mit dieser ID / diesem Titel'});
      });
      let vorhanden = g.id ? S.routinenGruppen.find(x=>x.id===g.id) : null;
      if(vorhanden){
        if(g.name!=null) vorhanden.name=g.name;
        if(g.domain==='dfm'||g.domain==='privat') vorhanden.domain=g.domain;
        vorhanden.mitglieder=mitglieder;
        if(g.komplettBonus!=null) vorhanden.komplettBonus=num(g.komplettBonus);
        gruppenUpd++;
      } else {
        S.routinenGruppen.push({ id:g.id||uuid(), name:g.name||'Gruppe',
          domain:(g.domain==='dfm'?'dfm':'privat'), mitglieder,
          komplettBonus:(g.komplettBonus!=null?num(g.komplettBonus):KOMPLETT_BONUS_DEFAULT),
          farbe:'#b98af7', bonusTag:null });
        gruppenNeu++;
      }
    });
    saveRoutGruppen();
  }
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  // §5.6 (v1.13.0): erfolgreicher Import = geprüfte Planung
  S.meta.letzterImportTs=jetztIso(); saveMeta();
  return {neu, neuDfm, neuPrivat, upd, arch, ketteGesetzt, ketteUnbekannt, gruppenNeu, gruppenUpd,
    rahmenGesetzt, korrigiert:korrigiert.length, uebersprungen};
}

/* ══════════════════════════════════════════════════════════════════════
   13c · Vorlagen (§3.4) & Karten-Gruppen (§3.3)
   ══════════════════════════════════════════════════════════════════════ */
/* Vorlage = komplette Karten-Config inkl. Unteraufgaben-Soll, OHNE
   Fälligkeit/Uhrzeit/Ist/Status/Instanz-Felder (§3.4). */
const VORLAGE_WEG = ['id','airtableId','herkunftId','faelligkeit','uhrzeit','istSek','ticksHeute','status','tagId','streak','zuletztRoutine','sortIndex','gruppeId','erstelltTs'];
function vorlageAusEntwurf(){
  const cfg = JSON.parse(JSON.stringify(entwurf));
  VORLAGE_WEG.forEach(f=>delete cfg[f]);
  const name = (prompt('Name der Vorlage:', entwurf.titel||'Vorlage')||'').trim();
  if(!name) return;
  S.vorlagen.push({ id:uuid(), name, karte:cfg,
    unteraufgaben: entwurfSubs.map(u=>({ titel:u.titel, sollMin:num(u.sollMin) })) });
  saveVorlagen(); toast('Vorlage „'+name+'" gespeichert');
}
function detailAusVorlage(vid){
  const v=S.vorlagen.find(x=>x.id===vid); if(!v) return;
  entwurfNeu=true;
  entwurf = neueKarte(Object.assign({}, v.karte, { faelligkeit: heuteApp() }));
  entwurfSubs = (v.unteraufgaben||[]).map(u=>neueUnteraufgabe(entwurf.id, { titel:u.titel, sollMin:num(u.sollMin) }));
  renderDetail();
}
function vorlageLoeschen(vid){ S.vorlagen=S.vorlagen.filter(v=>v.id!==vid); saveVorlagen(); }

/* Karten-Gruppe (§3.3): {id,name}. Bulk-Fälligkeit; für Punkte unsichtbar. */
function neueGruppe(f={}){ return Object.assign({ id:uuid(), name:'Gruppe' }, f); }
function gruppeMitglieder(gid){ return S.karten.filter(k=>k.gruppeId===gid && k.status!=='archiviert'); }
function gruppeVerschieben(gid, datum){ gruppeMitglieder(gid).forEach(k=>{ k.faelligkeit=datum||null; }); saveKarten(); }
function gruppeLoeschen(gid){ S.karten.forEach(k=>{ if(k.gruppeId===gid) k.gruppeId=null; }); S.gruppen=S.gruppen.filter(g=>g.id!==gid); saveKarten(); saveGruppen(); }
function gruppeName(gid){ const g=S.gruppen.find(x=>x.id===gid); return g?g.name:''; }
function oeffneGruppeAktion(gid){
  const mit=gruppeMitglieder(gid);
  let h='<p class="d">Gruppe „<b>'+esc(gruppeName(gid))+'</b>" · '+mit.length+' Karten. Verschieben setzt die Fälligkeit aller Mitglieder (§3.3).</p>';
  h+='<div class="field"><label>Alle verschieben auf</label><input type="date" id="grpDatum" value="'+heuteApp()+'"><div class="btnrow"><button class="btn sm" data-grpheute="'+gid+'">Heute</button><button class="btn sm" data-grpmorgen="'+gid+'">Morgen</button><button class="btn sm" data-grpwarte="'+gid+'">ohne Termin</button></div></div>';
  h+='<div class="btnrow"><button class="btn sm" data-grprename="'+gid+'">✎ Umbenennen</button><button class="btn sm" data-grpdatego="'+gid+'">→ Auf Datum</button></div>';
  const foot='<button class="btn ghost sm" data-close="1">Schließen</button><button class="btn warn sm" data-grpdissolve="'+gid+'">Gruppe auflösen</button>';
  openSheet('Karten-Gruppe', h, foot);
}
/* §3.3 Gruppen-Verwaltung + Bulk-Mehrfachzuordnung (Punkt 5g): zentrale Liste
   in den Einstellungen; „Zuordnen" öffnet eine gefilterte Checkbox-Liste ALLER
   Karten (v. a. der 61 privaten), Häkchen = Mitglied. Anwenden setzt/entfernt
   gruppeId im Bulk. Eine Karte gehört zu genau einer Gruppe (letzte Zuordnung
   gewinnt). */
function gruppenVerwaltungHtml(){
  let h='<div class="card"><h3>Karten-Gruppen</h3><p class="d">Karten (v. a. private) in Gruppen bündeln — Sammel-Zuordnung + gemeinsames Verschieben der Fälligkeit (§3.3).</p>';
  if(!S.gruppen.length) h+='<p class="d" style="color:var(--mut2)">Noch keine Gruppen.</p>';
  S.gruppen.forEach(g=>{ const n=gruppeMitglieder(g.id).length;
    h+='<div class="kv"><span>🗃 '+esc(g.name)+' <span style="color:var(--mut2)">· '+n+' Karten</span></span>'+
       '<span class="btnrow" style="margin:0;gap:6px"><button class="minibtn" data-grpassign="'+g.id+'">Zuordnen</button>'+
       '<button class="minibtn" data-grpakt="'+g.id+'">⚙︎</button></span></div>'; });
  h+='<div class="btnrow"><button class="btn sm" id="btnGruppeNeu">＋ Gruppe</button></div></div>';
  return h;
}
let gruppeZuTmp=null;
function oeffneGruppeZuordnen(gid){
  gruppeZuTmp={ gid, dom:'privat', checked:new Set(gruppeMitglieder(gid).map(k=>k.id)) };
  renderGruppeZuordnen();
}
function renderGruppeZuordnen(){
  const t=gruppeZuTmp, g=S.gruppen.find(x=>x.id===t.gid); if(!g){ closeSheet(); return; }
  const dseg=(v,l)=>'<button class="'+(t.dom===v?'on':'')+'" data-gzdom="'+v+'">'+l+'</button>';
  let liste=S.karten.filter(k=>k.status!=='archiviert');
  if(t.dom!=='alle') liste=liste.filter(k=>k.domain===t.dom);
  liste.sort((a,b)=>String(a.titel||'').localeCompare(String(b.titel||'')));
  let h='<p class="d">Karten für „<b>'+esc(g.name)+'</b>" wählen — Häkchen = in der Gruppe. <b id="gzCount">'+t.checked.size+'</b> gewählt.</p>';
  h+='<div class="statfilter"><span class="segmini">'+dseg('alle','Alle')+dseg('dfm','DFM')+dseg('privat','Privat')+'</span></div>';
  h+='<div class="gzlist">'+(liste.map(k=>{ const on=t.checked.has(k.id), inAnd=k.gruppeId&&k.gruppeId!==t.gid;
    return '<label class="gzrow"><input type="checkbox" data-gztoggle="'+k.id+'"'+(on?' checked':'')+'>'+
      '<span class="dot" style="background:'+karteFarbe(k)+'"></span>'+
      '<span class="tx">'+esc(k.titel||'(ohne Titel)')+(inAnd?' <small style="color:var(--mut2)">· '+esc(gruppeName(k.gruppeId))+'</small>':'')+'</span></label>';

function gruppeZuordnenAnwenden(){
  const t=gruppeZuTmp; if(!t) return;
  S.karten.forEach(k=>{ if(t.checked.has(k.id)) k.gruppeId=t.gid; else if(k.gruppeId===t.gid) k.gruppeId=null; });
  saveKarten(); gruppeZuTmp=null; closeSheet(); renderEinst(); toast('Gruppe aktualisiert');
}

/* Reset „Alle Karten löschen" (bewusster Nullstand vor dem Gruppen-Seed):
   doppelte Bestätigung, VORHER automatisches Voll-Backup als Download. Löscht
   ausschließlich Karten + Unteraufgaben. Einstellungen, meta.wohlstand,
   Historie, Stapel, Vorlagen, Gruppen bleiben unangetastet. (Ein laufender
   Fokus-Timer wird beendet, weil seine Karte weg ist — nötige Folge, nicht in
   der „behalten"-Liste.) */
function resetKarten(){
  const n=S.karten.length;
  if(!confirm('Alle Karten & Unteraufgaben löschen?\n\nVorher wird automatisch ein Voll-Backup heruntergeladen. Einstellungen, Wohlstand, Historie, Stapel, Vorlagen und Gruppen bleiben erhalten.')) return;
  if(!confirm('Wirklich '+n+' Karten endgültig löschen?\n\nRückgängig nur über das heruntergeladene Backup.')) return;
  backupHtml();                          // Voll-Backup als Download (bestehende Mechanik)
  S.fokus=null; saveFokus();             // laufenden Timer auf gelöschter Karte beenden
  S.karten=[]; S.unteraufgaben=[];
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  renderAlles(); renderEinst();
  toast(n+' Karten gelöscht · Backup geladen'); haptik(20);
}

/* §4 (v1.8.1): Wohlstand-Reset per Button — exakt die Offset-Mechanik der
   151er-Migration, jetzt wiederholbar und mit Rückgängig (solange ein Backup
   vorliegt). Es wird ausschließlich Anzeige-Zustand verschoben. */
function panoramaResetJetzt(){
  if(!confirm('Wohlstand zurücksetzen?\n\nKonto, Kulisse und Lebenswerk-Anzeige starten wieder bei null (Startkulisse, Konto 0), die sechs Zonen-Stufen gehen auf 0.\n\nNICHT angefasst werden: Historie, Intraday-Log, Streaks (auch die Tages-Serie), Statistiken, die gekauften Objekte im Album — und der Leistungs-Rang samt Bestwert (er ist eine Messung, v1.11.0). Der Schritt ist über „Rückgängig" umkehrbar, solange kein neuer Reset folgt.')) return;
  if(!S.belohnung){ S.belohnung={ stufen:{}, ausgegeben:0, kaeufe:[] }; }
  S.belohnung.stufen=S.belohnung.stufen||{};
  const altStufen={}; KAT_KEYS.forEach(k=>{ altStufen[k]=num(S.belohnung.stufen[k],0); });
  const rohVorher=lifetimePunkteRoh();
  S.meta.panoramaResetBackup={
    ts: jetztIso(), offset: num(S.meta.panoramaResetOffset),   // vorheriger Offset (nicht der neue!)
    levelVorher: avatarStufe(), stufen: altStufen,
    wohlstand: num(S.meta.wohlstand), ausgegeben: num(S.belohnung.ausgegeben),
    lifetimeBasis: num(S.meta.lifetimeBasis),
    // §7.2 (v1.9.0): die drei Spiel-Offsets VOR dem Reset — Undo stellt sie her
    rangResetOffset: num(S.meta.rangResetOffset),
    muenzenResetOffset: num(S.meta.muenzenResetOffset),
    ausgabenResetOffset: num(S.meta.ausgabenResetOffset)
  };
  S.meta.panoramaResetOffset=rohVorher;
  // §7.2 (v1.9.0): die neuen Achsen mitnehmen — Anzeige = Rohwert − Offset
  S.meta.rangResetOffset    = num(S.meta.rangPunkte);
  S.meta.muenzenResetOffset = num(S.meta.muenzenGesamt);
  S.meta.ausgabenResetOffset= num(S.meta.ausgegebenGesamt);
  KAT_KEYS.forEach(k=>{ S.belohnung.stufen[k]=0; });
  saveMeta(); saveBelohnung(); renderEinst(); toast('Panorama zurückgesetzt — Level 1');
}
function panoramaResetUndo(){
  const b=S.meta.panoramaResetBackup;
  if(!b){ toast('Kein Reset-Backup vorhanden'); return; }
  if(!confirm('Letzten Wohlstand-Reset rückgängig machen?\n\nOffset und Zonen-Stufen gehen auf den Stand von '+String(b.ts||'?').slice(0,10)+' zurück.')) return;
  S.meta.panoramaResetOffset = (b.offset>0 ? b.offset : null);
  // §7.2 (v1.9.0): alle drei Spiel-Offsets zurück auf den Stand vor dem Reset
  S.meta.rangResetOffset    = num(b.rangResetOffset);
  S.meta.muenzenResetOffset = num(b.muenzenResetOffset);
  S.meta.ausgabenResetOffset= num(b.ausgabenResetOffset);
  KAT_KEYS.forEach(k=>{ S.belohnung.stufen[k]=num(b.stufen&&b.stufen[k],0); });
  delete S.meta.panoramaResetBackup;
  saveMeta(); saveBelohnung(); renderEinst(); toast('Reset rückgängig gemacht');
}

function belohnungInit(){
  if(!S.belohnung){ S.belohnung={ stufen:{}, ausgegeben:0, kaeufe:[] }; }
  if(S.belohnung.ausgegeben==null) S.belohnung.ausgegeben=0;
  if(!S.belohnung.kaeufe) S.belohnung.kaeufe=[];

  // bei fehlendem Wert setzen — nach dem Panorama-Reset steht hier bewusst 0, und
  // ein `!0`-Test hätte das sofort wieder auf 1 hochgezogen (Punkt 3 der Vorgabe).

}
/* Punkte-Konto = Wohlstand live − bereits im Shop ausgegebene Punkte. */
/* §2.2 (v1.9.0): Konto = Münzen-Zufluss − Ausgaben (beide monoton, beide gegen
   ihre Reset-Offsets) + heutiger Live-Zufluss. Ersetzt wohlstandLive−ausgegeben. */
function konto(){ return Math.max(0, muenzenAnzeige() - ausgabenAnzeige()); }
/* Persönlicher Ø-Punktesatz der letzten 7 aktiven Tage.
   §2 (v1.11.0): Null-Minuten-Regel — nur Buchungen mit Dauer ≥1 Min zählen,
   im Zähler UND im Nenner (vorher: alle Punkte ÷ getrackte Zeit — Abhakboni
   ohne Zeit haben die Rate und damit die Shop-Preise aufgebläht). */
function oePStd7(){
  let p=0, min=0;
  aktiveRateTage(7).forEach(d=>{ const r=tagesRate(d); if(r){ p+=r.p; min+=r.min; } });
  if(min>=60) return Math.max(5, p/(min/60));
  return num(S.settings.basisProStdPrivat,120)*1.5;   // Startwert, bis Historie da ist
}
/* Preis ≈ 4 Std Fokuszeit × 7-Tage-Ø × Settings-Faktor × Kategorie-Faktor. */
function preisFuer(kat){
  const basis = 4 * oePStd7() * (S.settings.preisFaktor||1) * (KAT_PREISFAKTOR[kat]||1);
  return Math.max(20, Math.round(basis/5)*5);
}
/* Cross-Kategorie-Voraussetzung: null = frei, sonst Hinweistext. */
function kaufSperre(kat){
  const naechste = BELOHNUNG[kat].stufen[S.belohnung.stufen[kat]];
  if(!naechste) return 'komplett';
  const req=naechste[2];
  if(req && (S.belohnung.stufen[req[0]]||0) < req[1]) return 'braucht '+BELOHNUNG[req[0]].icon+' '+BELOHNUNG[req[0]].name+' Stufe '+req[1];
  return null;
}
function kaufen(kat){
  const idx=S.belohnung.stufen[kat];
  const stufe=BELOHNUNG[kat].stufen[idx];
  if(!stufe || kaufSperre(kat)) return false;
  const preis=preisFuer(kat);
  if(konto()<preis){ toast('Noch '+Math.round(preis-konto())+' P bis zum Freischalten'); return false; }
  const bgVorher=bgStufeAus(ausgabenAnzeige());
  S.belohnung.stufen[kat]=idx+1;
  S.belohnung.ausgegeben=(S.belohnung.ausgegeben||0)+preis;   // Altfeld läuft mit (Backup/Kompatibilität)
  S.belohnung.kaeufe.push({ kat, stufe:idx+1, name:stufe[0], datum:heuteApp(), preis });
  // §2.2 (v1.9.0): Kauf kostet Konto, nicht Biografie — er ERHÖHT sie.
  S.meta.ausgegebenGesamt=num(S.meta.ausgegebenGesamt)+preis;
  // §4.3 (v1.13.0): Ein Kauf hebt den UPGRADE-FAKTOR (+2 %) — die Belohnung
  // ist unmittelbar spürbar (größere Zahlen, mehr Münzen). Derselbe Faktor
  // hebt die Ziele mit → keine Zielinflation. Er wirkt NUR auf der Anzeige-/
  // Spielebene, nie auf Rang-Median, Schätzfaktoren oder oePStd7. Der alte
  // 50-%-Tagesbonus (v1.11.0) ist damit abgelöst; S.tag.spielBonus wird nur
  // noch gelesen (Altbestand des laufenden Tages).
  const fVon=upgradeFaktor();
  S.meta.upgradeFaktor=Math.round(fVon*1.02*10000)/10000;
  if(!Array.isArray(S.meta.upgradeHerkunft)) S.meta.upgradeHerkunft=[];
  S.meta.upgradeHerkunft.push({ ts:jetztIso(), kat, stufe:idx+1, preis, von:fVon, zu:S.meta.upgradeFaktor });
  if(S.meta.upgradeHerkunft.length>100) S.meta.upgradeHerkunft=S.meta.upgradeHerkunft.slice(-100);
  toast('🎁 Upgrade-Faktor: ×'+fVon.toFixed(2).replace('.',',')+' → ×'+S.meta.upgradeFaktor.toFixed(2).replace('.',','));
  saveMeta();
  saveBelohnung(); konfetti(); haptik(25);
  toast('🎉 Freigeschaltet: '+BELOHNUNG[kat].icon+' '+stufe[0]);
  // §4/§6.3 (v1.9.0): öffnet der Kauf eine neue Kulisse → sichtbarer Ortswechsel
  const bgNachher=bgStufeAus(ausgabenAnzeige());
  if(bgNachher>bgVorher){
    S.meta.kulisseErreicht=Object.assign({}, S.meta.kulisseErreicht);
    for(let n=bgVorher+1;n<=bgNachher;n++) if(!S.meta.kulisseErreicht[n]) S.meta.kulisseErreicht[n]=heuteApp();
    saveMeta();
  }
  renderBelohnung();
  if(bgNachher>bgVorher) momentKulisse(bgVorher, bgNachher);
  momentRangCheck();
  return true;
}
/* Vitalität (§6.2): getrieben vom Tages-Akku. */
function vitalitaet(){ if(tagOffen()&&S.tag.akku!=null) return S.tag.akku>=50; return true; }
/* ══════════════════════════════════════════════════════════════════════

/* C: Vitalitäts-Stufe aus dem Tages-Akku (5 Zustände statt binär). Rein
   abgeleitet; ohne laufenden Tag gilt „voll". */
function vitalStufe(){

/* ══════════════════════════════════════════════════════════════════════
   §2–§5 (v1.9.0) · Spiel-Ebene „Rang, Reise, Serie"
   Zwei Achsen statt vier Anzeigen an einer Zahl:
     Leistung  → rangPunkte  → Kleidung (20 Ränge, quadratische Kurve)
     Ausgeben  → ausgegebenGesamt → Kulisse (10 Hintergründe)
   Beide Speicher sind ECHTE, monoton wachsende Akkumulatoren (meta.*) —
   die alte lifetimePunkte()-max-Kaskade bleibt nur als Altdaten-Notnagel
   (Migration-Seed + Level-Anzeige im Info-Panel) bestehen.
   Die MESS-Ebene (Punkte, Statistik, Schätzfaktoren) bleibt unberührt:
   Streakfaktor und Kauf-Bonus wirken ausschließlich hier.
   ══════════════════════════════════════════════════════════════════════ */
const RANG_MAX = 20;
function rangKosten(n){ return 1200*(n-1)*(n-1); }                 // Kosten für Rang n (n≥2)
function rangSchwelle(n){ let s=0; for(let i=2;i<=n;i++) s+=rangKosten(i); return s; }
function rangVon(p){ let n=1; while(n<RANG_MAX && p>=rangSchwelle(n+1)) n++; return n; }
/* Sterne 0–5 im aktuellen Rang, linear interpoliert (§3.2). */
function sterneVon(p){
  const n=rangVon(p);
  if(n>=RANG_MAX) return 5;
  const basis=rangSchwelle(n), kosten=rangKosten(n+1);
  return Math.max(0, Math.min(5, Math.floor((p-basis)/kosten*5)));
}
/* §3.3: Rang n trägt den Namen von Level 5n, Stern k den von Level 5(n−1)+k —
   alle 100 Namen bleiben im Einsatz. */
function rangName(n){ return AVATAR_NAMEN[Math.min(100, n*5)-1] || ('Rang '+n); }
function sternName(n, k){ return AVATAR_NAMEN[Math.min(100, 5*(n-1)+k)-1] || ''; }
/* §5: Tages-Streak (Tage in Folge mit Tagesabschluss; Urlaubstage neutral). */
function streakFaktor(){ return 1 + Math.min(0.5, Math.max(0,num(S.meta&&S.meta.tagesStreak))*0.02); }
function jokerVerfuegbar(){
  return num(S.meta&&S.meta.tagesStreak)>=30 && (S.meta.jokerVerbrauchtMonat||'')!==heuteApp().slice(0,7);
}
/* Live-Zufluss der Spiel-Ebene: heutige Punkte × Faktor + Kauf-Bonus des Tages
   (§6 v1.11.0) — beim Abschluss wird exakt derselbe Betrag festgeschrieben. */
function spielLiveZufluss(){
  // §4.3 (v1.13.0): Münzen sind Spiel-Währung — der Upgrade-Faktor wirkt mit.
  return tagOffen()
    ? Math.max(0, tagesPunkteLive())*streakFaktor()*upgradeFaktor() + Math.max(0,num(S.tag.spielBonus))
    : 0;
}
/* Anzeigen rechnen gegen Rohwert − Reset-Offset (§7.2). */
function rangPunkteAnzeige(){ return Math.max(0, num(S.meta&&S.meta.rangPunkte) - num(S.meta&&S.meta.rangResetOffset) + spielLiveZufluss()); }
function ausgabenAnzeige(){ return Math.max(0, num(S.meta&&S.meta.ausgegebenGesamt) - num(S.meta&&S.meta.ausgabenResetOffset)); }
function muenzenAnzeige(){ return Math.max(0, num(S.meta&&S.meta.muenzenGesamt) - num(S.meta&&S.meta.muenzenResetOffset) + spielLiveZufluss()); }
function spielStand(){
  const rp=rangPunkteAnzeige(), n=rangVon(rp), st=sterneVon(rp);
  const naechste=n<RANG_MAX ? rangSchwelle(n+1) : null;
  return { rp, rang:n, sterne:st, name:rangName(n),
    sternName: st>=1 ? sternName(n, st) : null,
    basis:rangSchwelle(n), naechste,
    anteil: naechste!=null ? Math.max(0,Math.min(1,(rp-rangSchwelle(n))/rangKosten(n+1))) : 1,
    rest: naechste!=null ? Math.max(0, naechste-rp) : 0 };
}
/* §4: Kulisse aus den insgesamt ausgegebenen Münzen — 2500 × n^2,3.
   Unter der ersten Schwelle gilt Kulisse 1 als Startbild. */
function bgSchwelle(n){ return Math.round(2500*Math.pow(n,2.3)); }
function bgStufeAus(ausgegeben){
  let s=1; for(let n=1;n<=10;n++){ if(ausgegeben>=bgSchwelle(n)) s=Math.max(s,Math.min(10,n)); }
  return s;
}
function bgFuerAusgaben(){ return 'img/bg'+String(bgStufeAus(ausgabenAnzeige())).padStart(2,'0')+'.jpg'; }
/* ══════════════════════════════════════════════════════════════════════
   §2–§6 (v1.11.0) · „Der Tag kleidet dich" — die Achsen drehen sich um:
     Kleidung (20 Outfits) → Tagesfortschritt F, resettet morgens
     Rang (1–20)           → P/Std-Median über 14 aktive Tage, resettet nie
     Sterne (1–5)          → Geld-Score/Std-Median, Schwellen aus eigenem Verlauf
   Kulissen, Konto, Serie: unverändert v1.9.0.
   ══════════════════════════════════════════════════════════════════════ */
/* §2 · Null-Minuten-Regel: eine P/Std-Rate zählt ausschließlich Buchungen mit
   einer Dauer von mindestens einer Minute — im Zähler UND im Nenner. Summen
   (Tagesscore, Statistik, Wohlstand) bleiben vollständig.
   AUSLEGUNG für den App-Datenstrom: Die App bucht Zeit (typ timer, punkte 0)
   und Punkte (typ abhaken/tick, minuten 0) GETRENNT. Wörtlich je Buchung
   angewandt fiele der Zähler jedes normalen Tages auf ~0. Deshalb zählen die
   Punkte einer 0-Minuten-Buchung genau dann, wenn DIESELBE KARTE am selben
   Tag ≥1 Minute Zeit gebucht hat — ihre Punkte haben Zeit beigetragen. Die
   Sync-Abhakboni vom 28.08. (Karten ohne jede Tages-Zeit) fallen damit raus,
   ebenso künftige Nachbuchungen und Tick-Punkte zeitloser Karten. Abzüge
   (typ schub) zählen nicht in die Leistungs-Rate. */
function tagesRateDetail(fensterDatum, dom){
  const alle=(S.intraday||[]).filter(e=>e.ts && belFensterDatum(e.ts)===fensterDatum
    && (!dom || dom==='alle' || e.domaene===dom));
  const zeitKarten={}; let min=0;
  alle.forEach(e=>{ if(num(e.minuten)>=1){ min+=num(e.minuten); if(e.kartenId) zeitKarten[e.kartenId]=1; } });
  let p=0, ohneZeitN=0, ohneZeitP=0;
  alle.forEach(e=>{ const pe=num(e.punkte); if(pe<=0) return;
    if(num(e.minuten)>=1 || (e.kartenId && zeitKarten[e.kartenId])) p+=pe;
    else { ohneZeitN++; ohneZeitP+=pe; } });
  return { p, min, ohneZeitN, ohneZeitP, rate: min>=1 ? p/(min/60) : null };
}
function tagesRate(fensterDatum){
  const d=tagesRateDetail(fensterDatum);
  return d.rate!=null ? { p:d.p, min:d.min, rate:d.rate } : null;
}
function medianVon(a){ if(!a||!a.length) return null;
  const s=a.slice().sort((x,y)=>x-y), m=Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function tagIstUrlaub(datum){
  if(tagOffen() && S.tag.datum===datum) return urlaubHeute();
  return (S.historie||[]).some(h=>h.datum===datum && !h.luecke && h.urlaub);
}
/* §3.1 · Aktiver Tag = ≥1 Buchung, die die Null-Minuten-Regel besteht;
   Urlaubstage zählen nicht mit (analog zu den Schätzfaktoren). */
function aktiveRateTage(maxN){
  const tage={}; (S.intraday||[]).forEach(e=>{ if(e.ts && num(e.minuten)>=1) tage[belFensterDatum(e.ts)]=true; });
  const heute=belFensterDatum(jetztIso());
  const out=[];
  Object.keys(tage).filter(d=>d<=heute).sort().reverse().some(d=>{
    if(tagIstUrlaub(d)) return false;
    out.push(d); return out.length>=maxN;
  });
  return out;
}
/* §3.2 · Die Leiter — Formel maßgeblich, Rang 20 ist die Kappe, Rang 1 der
   Boden (unter 150 P/Std fällt niemand aus der Leiter). */
function leistungsSchwelle(n){ return 150 + 46*(n-1) + 2.15*(n-1)*(n-1); }
function leistungsRangVon(rate){
  let n=1; for(let i=2;i<=RANG_MAX;i++){ if(rate>=leistungsSchwelle(i)) n=i; }
  return n;
}
/* §3 · Rang-Maß = Median der Tages-P/Std über die letzten 14 aktiven Tage.
   Memoisiert je Minute — tagesRate() läuft sonst 14× über das Intraday-Log. */
let _rangMemo=null, _rangMemoKey='';
function rangMass(){
  const iv=(S.intraday||[]);
  const key=iv.length+'|'+(iv.length?iv[iv.length-1].ts:'')+'|'+Math.floor(Date.now()/60000);
  if(_rangMemo && _rangMemoKey===key) return _rangMemo;
  const tage=aktiveRateTage(14).map(d=>({datum:d, r:tagesRate(d)})).filter(x=>x.r);
  const n=tage.length;
  const med=n>=3 ? medianVon(tage.map(x=>x.r.rate)) : null;
  const rang=med!=null ? leistungsRangVon(med) : null;
  let naechste=null, rest=null, anteil=1;
  if(rang!=null && rang<RANG_MAX){
    naechste=leistungsSchwelle(rang+1); rest=Math.max(0, naechste-med);
    const basis=rang>1?leistungsSchwelle(rang):0;
    anteil=Math.max(0, Math.min(1, (med-basis)/Math.max(1,(naechste-basis))));
  }
  _rangMemo={ n, median:med, rang, best:Math.max(num(S.meta&&S.meta.rangBest), rang||0)||null,
    naechste, rest, anteil, tage };
  _rangMemoKey=key;
  return _rangMemo;
}
/* §3.3 · Bestwert fällt nie — Pflege zentral in spielMomentCheck(). */
function rangAnzeigeText(rm){
  rm=rm||rangMass();
  if(rm.rang==null) return 'sammelt noch Daten ('+rm.n+'/3)';
  return rm.best>rm.rang ? (rm.rang+' · best '+rm.best) : String(rm.rang);
}
/* §4 · Sterne — Geld-Score abgeschlossener DFM-Aufgaben je Tag ÷ getrackte
   Stunden (Null-Minuten-Regel), Median über dieselben 14 aktiven Tage.
   Historische Tageswerte sammelt meta.sternTage ab v1.11.0 (Abschluss). */
function sternGeldHeute(){
  const tid=aktuelleTagId();
  return S.karten.filter(k=>k.domain==='dfm' && k.status==='erledigt' && k.tagId===tid)
    .reduce((a,k)=>a+Math.max(0,num(k.geldScore)),0);
}
function sternMass(){
  const werte=[];
  aktiveRateTage(14).forEach(d=>{
    let g=null, min=null;
    if(tagOffen() && S.tag.datum===d){ g=sternGeldHeute(); const r=tagesRate(d); min=r?r.min:null; }
    else { const e=S.meta.sternTage && S.meta.sternTage[d]; if(e){ g=num(e.geld); min=num(e.min); } }
    if(g!=null && min>=1) werte.push(g/(min/60));
  });
  return { n:werte.length, median: werte.length?medianVon(werte):null, werte };
}
/* §4 · Schwellen aus dem eigenen Verlauf: Stern 3 = Median, 1/5 = Quartile,
   2/4 interpoliert — EINMAL gesetzt und festgehalten. */
function sternSchwellenAus(werte){
  const s=werte.slice().sort((a,b)=>a-b);
  const q=p=>{ const i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo); };
  const q1=q(0.25), q2=q(0.5), q3=q(0.75);
  return [q1,(q1+q2)/2,q2,(q2+q3)/2,q3].map(x=>Math.round(x*10)/10);
}
function sternKalibrierenPruefen(){
  if(Array.isArray(S.meta.sternSchwellen)) return;
  const m=sternMass(); if(m.n<14) return;
  S.meta.sternSchwellen=sternSchwellenAus(m.werte);
  S.meta.sternKalibriertAm=heuteApp(); saveMeta();
  toast('⭐ Sternschwellen aus deinem Verlauf kalibriert');
}
function sterneAktuell(){
  if(!Array.isArray(S.meta.sternSchwellen)) return null;
  const m=sternMass(); if(m.median==null) return null;
  let st=0; S.meta.sternSchwellen.forEach(x=>{ if(m.median>=x) st++; });
  return Math.max(0, Math.min(5, st));
}
function sterneAnzeigeText(){
  const st=sterneAktuell();
  if(st!=null) return '★'.repeat(st)+'☆'.repeat(5-st);
  return 'sammelt ('+sternMass().n+'/14)';
}
/* §5 · Kleidung — Tagesleiter. F = (Tagespunkte × Streakfaktor + Kauf-Bonus)
   ÷ Tagesziel. Der Kauf-Bonus (§6) ist bereits Spiel-Währung und wird deshalb
   NICHT erneut mit dem Streakfaktor multipliziert. */
function outfitZielHeute(){
  if(!urlaubHeute()) return Math.max(1, belZielGesamt());
  // Urlaubsvorschlag (§5): Ersatzziel = eigener Normaltag — Median der
  // Tagespunkte der letzten 14 aktiven Tage. Der eigene Schnitt ist nie
  // unfair; ein Urlaubstag mit Arbeit kleidet gegen den Normaltag statt
  // gegen ein künstliches Soll. Fallback: reguläres Tagesziel.
  const tage=aktiveRateTage(14).filter(d=>!(tagOffen() && S.tag.datum===d));
  const pkt=tage.map(d=>{ const sn=tagSnapshot(d); return sn?Math.max(0,num(sn.punkteBilanz)):null; })
    .filter(x=>x!=null);
  const med=medianVon(pkt);
  return Math.max(1, med!=null?med:belZielGesamt());
}
function outfitF(){
  // §2.3 (v1.12.0): Am Wochenende teilt sich die Kleidung das Sa+So-Budget —
  // der Sonntag startet auf dem Samstags-Stand (ein Rahmen, ein Ereignis).
  const zi=zielUndIstHeute();
  const mess=zi.we ? zi.ist : Math.max(0, tagesPunkteLive());
  const bonus=tagOffen()?Math.max(0,num(S.tag.spielBonus)):0;
  return (mess*streakFaktor()+bonus)/outfitZielHeute();
}
function outfitVon(F){
  if(!(F>0)) return 1;
  return F<=1 ? Math.min(15, 1+Math.floor(14*F))
              : Math.min(20, 15+Math.floor((F-1)/0.07+1e-9));
}
/* §5 · Das Outfit fällt im Tagesverlauf nicht — Höchststand des Tages
   (S.tag.outfitMax, gepflegt in spielMomentCheck). Morgens startet ein
   frisches S.tag ohne outfitMax → Stufe 1. */
function outfitHeute(){
  const roh=outfitVon(outfitF());
  return Math.max(1, roh, tagOffen()?num(S.tag&&S.tag.outfitMax,1):1);
}
/* Punkte, die bis zur nächsten Outfit-Stufe bzw. bis Stufe 20 fehlen —
   in MESS-Punkten (der Streakfaktor ist herausgerechnet). */
function outfitFehltBis(stufe){
  const ziel=outfitZielHeute(), f=streakFaktor();
  const bonus=tagOffen()?Math.max(0,num(S.tag.spielBonus)):0;
  const Fnoetig = stufe<=15 ? (stufe-1)/14 : 1+(stufe-15)*0.07;
  const messNoetig=(Fnoetig*ziel-bonus)/f;
  return Math.max(0, messNoetig - Math.max(0,tagesPunkteLive()));
}

/* §4.2 (v1.13.0): Prognose je Leiter — wann fällt das nächste Ziel?
   real = Ø-Spiel-Zufluss der letzten 14 aktiven Tage (rangTempo, unter drei
   verwertbaren Tagen keine Angabe) · Ziel = Wochenschnitt bei täglich exakt
   getroffenem Ziel (5 Werktage + WE-Kontingent, ÷7). */
function albumPrognose(rest){
  if(!(rest>0)) return { fertig:true };
  const real=rangTempo();
  const zielRate=((tagesZielDomain('dfm')+tagesZielDomain('privat'))*5
    + num(S.settings.zielWeDfm,2500)+num(S.settings.zielWePrivat,10000))/7 * upgradeFaktor();
  return { fertig:false,
    real: real!=null && real>0 ? Math.ceil(rest/real) : null,
    ziel: zielRate>0 ? Math.ceil(rest/zielRate) : null };
}
function albumLeiterHtml(titel, sub, pct, rest, hinweis){
  const p=albumPrognose(rest);
  let prog;
  if(hinweis) prog=hinweis;
  else if(p.fertig) prog='Ziel erreicht 🏁';
  else prog='fällt real in ~'+(p.real!=null?p.real+' Tg':'— (sammelt '+((S.historie||[]).filter(h2=>!h2.luecke&&!h2.urlaub&&h2.spielZufluss!=null).length)+'/3 Tage)')+
    (p.ziel!=null?' · bei Ziel ~'+p.ziel+' Tg':'');
  return '<div class="albitem breit" style="text-align:left;padding:10px">'+
    '<div class="albn" style="white-space:normal">'+titel+'</div>'+
    '<div class="albs" style="white-space:normal">'+sub+'</div>'+
    '<span style="display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:'+Math.round(Math.max(0,Math.min(1,pct))*100)+'%;background:var(--purple)"></i></span>'+
    '<div class="albs" style="white-space:normal;margin-top:4px">'+prog+'</div></div>';
}
function renderAlbum(){
  const ausg=ausgabenAnzeige();
  const tabs=[['raenge','Ränge'],['kulissen','Kulissen'],['besitz','Besitz']];
  let h='<div class="albtabs">'+tabs.map(t=>'<button class="albtab'+(albumTab===t[0]?' on':'')+'" data-albtab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  h+='<div class="albgrid">';
  if(albumTab==='raenge'){
    // §7 (v1.11.0): Die Rangleiter mit ihren P/Std-Schwellen — erreicht,
    // aktuell, was als nächstes kommt. Outfits sind nichts zum Sammeln mehr.
    const rm=rangMass();
    // §4.2 (v1.13.0): Fortschrittsleiste zur nächsten Rangstufe. Der Rang ist
    // eine RATE (P/Std-Median) — eine Zeit-Prognose aus spielZufluss wäre
    // strukturell falsch; die beiden Schätzungen gibt es bei Kulissen/Besitz.
    h+=albumLeiterHtml(
      'P/Std-Median (14 aktive Tage): <b>'+(rm.median!=null?Math.round(rm.median)+' P/Std':'sammelt noch Daten ('+rm.n+'/3)')+'</b>'+
        (rm.rang!=null?' · Rang '+rangAnzeigeText(rm):''),
      rm.rang!=null && rm.rang<RANG_MAX ? 'Rang '+(rm.rang+1)+' ab '+Math.round(rm.naechste)+' P/Std (noch '+Math.round(rm.rest)+')' : (rm.rang!=null?'Spitze der Leiter':''),
      rm.rang!=null?rm.anteil:0, 0,
      'keine Zeit-Prognose — der Rang misst eine Rate, kein Konto');
    // §8 (v1.11.1): jede Stufe zeigt wieder ihr Outfit-Bild — erreichte in
    // Farbe, aktueller Rang hervorgehoben, höhere gedämpft (Kulissen-Optik):
    // nicht gesperrt, nur noch nicht erreicht.
    for(let n=1;n<=RANG_MAX;n++){
      const erreicht=rm.rang!=null && n<=rm.rang;
      const aktuell=rm.rang===n;
      const datum=(S.meta.rangErreicht&&S.meta.rangErreicht[n])||null;
      h+='<div class="albitem rang'+(erreicht?'':' zu')+'"'+(aktuell?' style="border-color:var(--blue)"':'')+
        ' data-albbild="'+AVATAR_BILDER[n-1]+'" data-albname="Rang '+n+' · '+esc(rangName(n))+'">'+
        '<img src="'+AVATAR_BILDER[n-1]+'" alt="" loading="lazy">'+
        '<div class="albn">'+(aktuell?'▶ ':'')+'Rang '+n+'</div>'+
        '<div class="albs">ab '+Math.round(leistungsSchwelle(n))+' P/Std'+
          (erreicht&&datum?' · '+fmtDatum(datum):'')+'</div></div>';
    }
  } else if(albumTab==='kulissen'){
    // §4.2 (v1.13.0): Fortschritt + Prognose zur nächsten Kulisse (Annahme:
    // die Einnahmen werden ausgegeben — die Reise hängt am Ausgeben).
    {
      const st=bgStufeAus(ausg);
      if(st<10){
        const von=st>1?bgSchwelle(st):0, bis=bgSchwelle(st+1);
        h+=albumLeiterHtml('Nächste Station: Kulisse '+(st+1)+' ab '+fmtKurzP(bis)+' ausgegeben',
          'noch '+fmtKurzP(Math.max(0,bis-ausg))+' auszugeben (aktuell '+fmtKurzP(ausg)+')',
          (ausg-von)/Math.max(1,bis-von), Math.max(0,bis-ausg), null);
      } else h+=albumLeiterHtml('Reise komplett — Kulisse 10/10','',1,0,null);
    }
    for(let n=1;n<=10;n++){
      const frei=(n===1) || ausg>=bgSchwelle(n);
      const datum=(S.meta.kulisseErreicht&&S.meta.kulisseErreicht[n])||null;
      h+='<div class="albitem breit'+(frei?'':' zu')+'"'+(frei?' data-albbild="img/bg'+String(n).padStart(2,'0')+'.jpg" data-albname="Kulisse '+n+' von 10"':'')+'>'+
        '<img src="img/bg'+String(n).padStart(2,'0')+'.jpg" alt="" loading="lazy">'+
        '<div class="albn">Station '+n+'</div>'+
        '<div class="albs">'+(frei?(datum?fmtDatum(datum):(n===1?'Start':'freigeschaltet')):('noch '+Math.round(bgSchwelle(n)-ausg)+' 🪙 ausgeben'))+'</div></div>';
    }
  } else {
    // §4.2 (v1.13.0): Fortschritt + Prognose zum nächsten (günstigsten) Kauf
    {
      const best=naechsterKaufHint();
      if(best){
        const rest=Math.max(0, best.preis-konto());
        h+=albumLeiterHtml('Nächster Kauf: '+BELOHNUNG[best.kat].icon+' '+esc(BELOHNUNG[best.kat].name)+' für '+fmtKurzP(best.preis),
          rest>0?'noch '+fmtKurzP(rest)+' (Konto '+fmtKurzP(konto())+')':'Konto reicht — freischaltbar 🎁',
          konto()/Math.max(1,best.preis), rest, null);
      }
    }
    KAT_KEYS.forEach(kat=>{
      const zone=KAT_ZONE[kat], bs=objBildStufe(kat);
      for(let i=1;i<=5;i++){
        const frei=bs>=i;
        // Name/Datum nur für Freigeschaltetes — gesperrte Stufen bleiben ???
        let name='???', datum=null;
        if(frei){
          const kauf=(S.belohnung.kaeufe||[]).filter(x=>x.kat===kat);
          const k=kauf.length?kauf[Math.min(kauf.length-1, Math.ceil(i/5*kauf.length)-1)]:null;
          name=BELOHNUNG[kat].icon+' '+BELOHNUNG[kat].name; datum=k?k.datum:null;
        }
        h+='<div class="albitem'+(frei?'':' zu')+'"'+(frei?' data-albbild="img/obj-'+zone+i+'.png" data-albname="'+esc(BELOHNUNG[kat].name)+' · Stufe '+i+'"':'')+'>'+
          '<img src="img/obj-'+zone+i+'.png" alt="" loading="lazy">'+
          '<div class="albn">'+(frei?esc(name):'???')+'</div>'+
          '<div class="albs">'+(frei?(datum?fmtDatum(datum):'freigeschaltet'):'über den Shop')+'</div></div>';
      }
    });
  }
  h+='</div>';
  openSheet('🖼 Album', h, '<button class="btn ghost sm" data-close="1">Schließen</button>');
}
/* ══════════════════════════════════════════════════════════════════════
   §6 (v1.9.0) · Momente auf drei Zeitebenen — reine CSS-Transitions/Keyframes,
   keine Bibliothek, kein Canvas. Vollbild-Momente respektieren
   prefers-reduced-motion, blockieren keine Bedienung (ein Tap schließt),
   werden bei laufendem Timer zurückgestellt und sind abschaltbar.
   ══════════════════════════════════════════════════════════════════════ */
let _spielMemo=null, _momentQueue=[];
function momenteAn(){ return !(S.meta && S.meta.momenteAus); }
function motionErlaubt(){ try{ return !window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return true; } }
/* Sekunden-Ebene: Punkte fliegen Richtung Tagesbalken, Faktor blitzt auf. */
function momentBuchung(punkte){
  if(!momenteAn() || !motionErlaubt() || !(punkte>0)) return;
  const f=streakFaktor();
  const d=document.createElement('div');
  d.className='mom-fly';
  d.textContent='+'+Math.round(punkte)+(f>1?' ×'+f.toFixed(2).replace('.',','):'');
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1300);
}
/* Vollbild-Moment — Tap irgendwo schließt; bei laufendem Timer in die Queue. */
function momentVollbild(html){
  if(!momenteAn()) return;
  if(S.fokus && S.fokus.laeuft){ _momentQueue.push(html); return; }
  const o=document.createElement('div');
  o.className='mom-voll'+(motionErlaubt()?'':' still');
  o.innerHTML=html;
  o.addEventListener('click', ()=>o.remove());
  document.body.appendChild(o);
}
function momentQueueFlush(){
  if(_momentQueue.length && !(S.fokus && S.fokus.laeuft)){
    const q=_momentQueue.slice(); _momentQueue=[];
    q.forEach(h=>momentVollbild(h));
  }
}
/* §7 (v1.11.0): Der Vollbild-Moment feiert den RANGAUFSTIEG — selten, echt.
   Der Rang ist eine Messung (P/Std-Median), keine Outfit-Stufe mehr. */
/* §4.1 (v1.13.0): Der Rangaufstieg ZEIGT, was freigeschaltet wurde — das
   Outfit-Bild der neuen Rangstufe, den Rangnamen und die nächste Schwelle. */
function momentRang(vonRang, zuRang){
  momentVollbild('<div class="mv-kern"><div class="mv-titel">Rangaufstieg · R'+zuRang+'</div>'+
    '<div class="mv-bilder"><img src="'+AVATAR_BILDER[Math.max(0,Math.min(19,zuRang-1))]+'" alt="" class="neu"></div>'+
    '<div class="mv-name">Rang '+zuRang+' · '+esc(rangName(zuRang))+'</div>'+
    '<div class="mv-sub">'+(zuRang<RANG_MAX
      ? 'Nächste Schwelle: Rang '+(zuRang+1)+' ab '+Math.round(leistungsSchwelle(zuRang+1))+' P/Std'
      : 'Spitze der Leiter')+' · Tippen zum Schließen</div></div>');
}
/* §7 (v1.11.0): Outfit-Wechsel im Tagesverlauf = KLEINER Moment (Aufblitzen);
   nur der Sprung auf Outfit 20 darf ein Vollbild sein. */
function momentOutfit(von, zu){
  if(zu>=20){
    momentVollbild('<div class="mv-kern"><div class="mv-titel">Outfit 20</div>'+
      '<div class="mv-bilder"><img src="'+AVATAR_BILDER[19]+'" alt="" class="neu"></div>'+
      '<div class="mv-name">Tagesziel weit übertroffen — der Frack.</div>'+
      '<div class="mv-sub">Tippen zum Schließen</div></div>');
    return;
  }
  if(!momenteAn() || !motionErlaubt()) return;
  const d=document.createElement('div'); d.className='mom-stern';
  d.textContent='👔 Outfit '+zu;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1800);
}
/* §4/§6.3: Kulissenwechsel nach einem Kauf — der Kauf ist ein Ortswechsel. */
function momentKulisse(von, zu){
  momentVollbild('<div class="mv-kern"><div class="mv-titel">Neue Kulisse</div>'+
    '<div class="mv-kulisse"><img src="img/bg'+String(zu).padStart(2,'0')+'.jpg" alt=""></div>'+
    '<div class="mv-name">Station '+zu+' von 10</div>'+
    '<div class="mv-sub">Tippen zum Schließen</div></div>');
}
/* §5.3: Streak-Meilenstein-Feier. */
function momentMeilenstein(tage){
  momentVollbild('<div class="mv-kern"><div class="mv-flamme">🔥</div>'+
    '<div class="mv-titel">'+tage+' Tage in Serie</div>'+
    '<div class="mv-name">'+(tage>=365?'Ein ganzes Jahr.':(tage>=100?'Dreistellig.':(tage>=30?'Ein Monat — Joker freigeschaltet.':'Eine Woche.')))+'</div>'+
    '<div class="mv-sub">Tippen zum Schließen</div></div>');
}
/* Zentrale Erkennung — läuft in renderStatusbar (nach jeder Aktion): erkennt
   Rangaufstieg und neuen Stern aus der LIVE-Anzeige, egal aus welcher Quelle
   (Buchung, Kauf-Bonus, Meilenstein). */
function momentRangCheck(){
  // §3/§5/§7 (v1.11.0): zentral erkannt werden Leistungs-Rangaufstieg (Vollbild),
  // Outfit-Wechsel (klein; Stufe 20 Vollbild) und Sternwechsel (klein).
  const rm=rangMass(), st=sterneAktuell();
  // Bestwert fällt nie (§3.3)
  if(rm.rang!=null && rm.rang>num(S.meta.rangBest)){ S.meta.rangBest=rm.rang; saveMeta(); }
  // Outfit-Höchststand des Tages fortschreiben (§5) + Momente
  if(tagOffen()){
    const alt=num(S.tag.outfitMax,1), neu=outfitHeute();
    if(neu>alt){ S.tag.outfitMax=neu; saveTag(); momentOutfit(alt, neu); }
  }
  if(_spielMemo){
    if(rm.rang!=null && _spielMemo.rang!=null && rm.rang>_spielMemo.rang){
      S.meta.rangErreicht=Object.assign({}, S.meta.rangErreicht);
      for(let n=_spielMemo.rang+1;n<=rm.rang;n++) if(!S.meta.rangErreicht[n]) S.meta.rangErreicht[n]=heuteApp();
      saveMeta();
      momentRang(_spielMemo.rang, rm.rang);
    }
    else if(st!=null && _spielMemo.sterne!=null && st>_spielMemo.sterne && momenteAn() && motionErlaubt()){
      const d=document.createElement('div'); d.className='mom-stern';
      d.textContent='✨ Stern '+st;
      document.body.appendChild(d); setTimeout(()=>d.remove(), 1800);
    }
  }
  _spielMemo={rang:rm.rang, sterne:st};
  // aufgeschobene Vollbilder + einmalige Ereignisse aus dem Abschluss
  momentQueueFlush();
  if(S.meta && S.meta.meilensteinMoment){ const t=S.meta.meilensteinMoment; delete S.meta.meilensteinMoment; saveMeta(); momentMeilenstein(t); }
  if(S.meta && S.meta.jokerHinweis){ const n=S.meta.jokerHinweis; delete S.meta.jokerHinweis; saveMeta();
    toast('♦ Joker eingesetzt — deine Serie von '+n+' Tagen steht.'); }
}
/* Level = volle Vielfache der Level-Kosten + 1. Start bei Level 1 mit 0 Punkten;
   jedes weitere Level kostet exakt punkteProLevel() (v1.5.1: 2000 → Level 2,
   20.000 → Level 11). Vorher war das ein ceil(), womit das erste Level einen
   Punkt mehr gekostet hätte und die Fortschrittsleiste im alten Level schon voll
   stand. Kappe bleibt AVATAR_MAX_LEVEL. */
function avatarStufe(){
  return Math.max(1, Math.min(AVATAR_MAX_LEVEL, Math.floor(lifetimePunkte()/punkteProLevel())+1));
}
/* U4: Punkte bis zum nächsten Level (für die Fortschrittsleiste). */
function avatarFortschritt(){
  const lt=lifetimePunkte(), lvl=avatarStufe(), ppl=punkteProLevel();
  if(lvl>=AVATAR_MAX_LEVEL) return { anteil:1, rest:0, imLevel:ppl, lifetime:lt };
  const basis=(lvl-1)*ppl, imLevel=lt-basis;
  return { anteil:Math.max(0,Math.min(1,imLevel/ppl)), rest:Math.max(0,ppl-imLevel), imLevel, lifetime:lt };
}
/* U4: zentrales Mapping Level → Darstellung. Paket 2 tauscht nur AVATAR_BILDER. */
/* §3.4 (v1.9.0): Bild-Slot = RANG (1–20), Farbvariante = aktueller STERN.
   Die Funktion nimmt weiterhin ein „Level"-Äquivalent (5·(Rang−1)+Stern) an,
   damit Alt-Aufrufer (z. B. „nächster Name") funktionieren — die App ruft sie
   über spielStand() mit Rang/Stern auf. */
function avatarAssets(level){
  const lvl=Math.max(1, Math.min(AVATAR_MAX_LEVEL, Math.round(num(level,1))||1));
  const bildSlot=Math.ceil(lvl/(AVATAR_MAX_LEVEL/AVATAR_SLOTS));   // 1…20 = Rang
  const bgVariante=((lvl-1)%5)+1;                                   // 1…5 = Stern
  const t=(lvl-1)/(AVATAR_MAX_LEVEL-1);                             // 0…1 über alle Level
  // Farbton wandert blau → violett → pink → rot/gold; Sättigung und Helligkeit
  // steigen mit dem Level, die Variante versetzt beides leicht.
  const h=Math.round((212 + t*158 + (bgVariante-3)*6 + 360) % 360);
  const s=Math.round(28 + t*38);
  const l1=Math.max(6, Math.round(10 + t*10 + (bgVariante-3)*1.2));
  const l2=l1 + Math.round(8 + t*10);
  const hsl=(hh,ss,ll)=>'hsl('+((hh%360)+360)%360+','+ss+'%,'+ll+'%)';
  const bgStyle='linear-gradient(180deg,'+hsl(h,s,l2)+' 0%,'+hsl(h,s,l1)+' 62%,'+hsl(h+18,s,l1+4)+' 100%)';
  // Funkel-Stufen (reines CSS, kein Dauer-Ticker)
  // §3.4 (v1.9.0): Funkel an Rang 19/15/10/5 (Level-Äquivalent 95/75/50/25)
  const rangFx=Math.ceil(lvl/5);
  const fx = rangFx>=19?'fx-premium' : rangFx>=15?'fx-funkeln' : rangFx>=10?'fx-glitzer' : rangFx>=5?'fx-schimmer' : '';
  return { level:lvl, bildSlot, bgVariante, name:AVATAR_NAMEN[lvl-1]||('Level '+lvl),
           bild:AVATAR_BILDER[bildSlot-1], bgStyle, fx, akzent:hsl(h, Math.min(90,s+30), 62) };
}
/* ══════════════════════════════════════════════════════════════════════
   D7 Diagramme (Punkt 2, v0.38-Port) — Tagesverlauf (kumulative Punkte-Kurve
   + geglättete Energie-Linie + Soll-/Ø-Referenzdiagonale), Woche/Monat-Balken,
   Domänenfilter, Datums-Picker, Kennzahlen, Aufschlüsselung. Quelle: tag.log /
   tag.akkuVerlauf (heute live) bzw. angereicherte Historie-Snapshots. Alle
   Diagramme sind handgeschriebenes SVG (kein CDN, offline-fest).
   ══════════════════════════════════════════════════════════════════════ */
function statDatum(){ return S.ui.statDatum || heuteApp(); }

/* Normierter Tages-Snapshot (heute live, sonst Historie; mehrere Läufe je Datum
   werden zusammengefasst). */
function tagSnapshot(iso){
  if(tagOffen() && S.tag.datum===iso){
    return { datum:iso, istHeute:true, urlaub:urlaubHeute(), startTs:S.tag.startTs, endeTs:null, punkteBilanz:tagesPunkteLive(),
      akku:S.tag.akku, log:(S.tag.log||[]).slice(), akkuVerlauf:(S.tag.akkuVerlauf||[]).slice(),
      zeit:tagesZeitAggregat(S.tag.tagId), erledigtHeute:num(S.tag.erledigtHeute) };
  }
  const snaps=(S.historie||[]).filter(h=>h.datum===iso && !h.luecke);
  if(!snaps.length) return null;
  const log=[], av=[]; let p=0, akkuSum=0, akkuN=0, erl=0, startTs=null, endeTs=null;
  const zeit={dfm:0,privat:0,projekte:{}};
  snaps.forEach(s=>{ p+=num(s.punkteBilanz); (s.log||[]).forEach(e=>log.push(e)); (s.akkuVerlauf||[]).forEach(e=>av.push(e));
    if(s.akku!=null){ akkuSum+=num(s.akku); akkuN++; } erl+=num(s.erledigtHeute);
    if(!startTs || (s.startTs && s.startTs<startTs)) startTs=s.startTs;
    if(!endeTs || (s.endeTs && s.endeTs>endeTs)) endeTs=s.endeTs;
    if(s.zeit){ zeit.dfm+=num(s.zeit.dfm); zeit.privat+=num(s.zeit.privat);
      Object.entries(s.zeit.projekte||{}).forEach(([k,v])=>zeit.projekte[k]=(zeit.projekte[k]||0)+num(v)); } });
  return { datum:iso, istHeute:false, urlaub:snaps.some(x=>x.urlaub), startTs, endeTs, punkteBilanz:p, akku:akkuN?akkuSum/akkuN:null,
    log, akkuVerlauf:av, zeit, erledigtHeute:erl };
}
/* Punkte eines Snapshots unter Domänenfilter (aus log, sonst Bilanz für „alle"). */
function snapPunkte(snap, dom){
  if(!snap) return 0;
  if(dom==='alle') return snap.punkteBilanz;
  if(snap.log && snap.log.length) return snap.log.filter(e=>e.domain===dom).reduce((a,e)=>a+num(e.punkte),0);
  return 0;
}
/* Ø-Punkte pro Stunde über die vergangenen Tage (domänengefiltert). */
function avgProStdVergangen(dom){
  let sumP=0, sumH=0;
  (S.historie||[]).filter(h=>h.datum!==heuteApp() && !h.luecke).map(h=>h.datum)
    .filter((v,i,a)=>a.indexOf(v)===i).forEach(iso=>{ const sn=tagSnapshot(iso); if(!sn) return;
      const hrs=(sn.startTs&&sn.endeTs)?Math.max(0.2,(new Date(sn.endeTs)-new Date(sn.startTs))/3600000):0;
      if(hrs>0){ sumP+=snapPunkte(sn,dom); sumH+=hrs; } });

/* Intraday-Kurve für einen Tages-Snapshot. */

  if(av.length){ const g=glaetten(av); akkuLinie=g.map(e=>X(e.min).toFixed(1)+','+YA(e.p).toFixed(1)).join(' ');

/* Woche/Monat: Balken je Tag (antippbar → Tageswahl). */
function diagrammBalken(zeitraum, dom){

    reihe.push({iso, p: sn?snapPunkte(sn,dom):0, urlaub:!!(sn&&sn.urlaub), luecke:!sn && !(tagOffen()&&S.tag.datum===iso)}); }

  const echte=reihe.filter(x=>!x.luecke); const avg = echte.length ? echte.reduce((a,x)=>a+x.p,0)/echte.length : 0;

    // §1.4 (v1.13.0): Farblegende — jede Farbe benannt

    '<span><i style="background:var(--cyan)"></i>gewählt</span>'+

/* ══ §3.3 (v1.13.0) · Rein/Raus-Diagramme (Aufgaben-Bilanz) ══════════════
   TAGESANSICHT: Die Fläche zwischen Netto-Linie (raus − rein) und X-Achse
   färbt sich LIVE — grün (mehr raus), rot (mehr rein), gelb (gleich) — und
   darf im Tagesverlauf wechseln. GESCHOBEN erscheint ausschließlich als
   ORANGE Marke, nie als Fläche. §3.4: Aufbautage gelten als ausbalanciert. */
function reinRausEventsTag(datum, dom){
  const byId={}; S.karten.forEach(k=>byId[k.id]=k);
  const ok=k=>dom==='alle'||!dom||k.domain===dom;
  const evs=[];
  S.karten.forEach(k=>{
    if(kartenArt(k)!=='Aufgabe' || k.flowBaseline || !ok(k)) return;
    if(k.erstelltTs && belFensterDatum(k.erstelltTs)===datum) evs.push({x:belX(k.erstelltTs), art:'rein'});
  });
  (S.intraday||[]).forEach(e=>{
    if(!e.ts) return; const k=byId[e.kartenId]; if(!k||kartenArt(k)!=='Aufgabe'||!ok(k)) return;
    const da=belFensterDatum(e.ts);
    if(e.typ==='schub' && e.ziel===datum && da!==datum){ evs.push({x:null, art:'rein'}); return; }   // Ankunft: Zeitpunkt unbekannt → Fensterstart
    if(da!==datum) return;
    if(e.typ==='abhaken' && !k.flowDoneBaseline) evs.push({x:belX(e.ts), art:'raus'});
    else if(e.typ==='wiederoffen') evs.push({x:belX(e.ts), art:'rein'});
    else if(e.typ==='schub'){ evs.push({x:belX(e.ts), art:'geschoben'}); if(e.ziel===datum) evs.push({x:belX(e.ts), art:'rein'}); }
  });
  return evs;
}
function reinRausTagHtml(datum, dom){

  const bis=istHeute?Math.max(fn.bis, belX(jetztIso())):fn.bis;
  const evs=reinRausEventsTag(datum, dom).map(e=>({x:e.x==null?von:Math.max(von,Math.min(bis,e.x)), art:e.art}))
    .sort((a,b)=>a.x-b.x);
  let inner;
  if(!evs.length){
    inner='<div class="an-leer">Keine Aufgaben-Bewegung an diesem Tag.</div>';
  } else if(rrt.aufbau){
    inner='<div class="an-leer" style="border-color:var(--warn)">Aufbautag (v1.8.1-Glättung) — gewertet als <b style="color:var(--warn)">ausbalanciert</b>, kein Ausschlag.</div>';
  } else {

    let net=0; const steps=[{x:von, net:0}];
    evs.forEach(e=>{ if(e.art==='raus') net++; else if(e.art==='rein') net--; else return;
      steps.push({x:e.x, net}); });
    steps.push({x:bis, net});
    const maxAbs=Math.max(1, ...steps.map(s=>Math.abs(s.net)));
    const y0=55, Y=v=>y0-(v/maxAbs)*44;
    let g='<line x1="'+pL+'" y1="'+y0+'" x2="'+(W-pR)+'" y2="'+y0+'" stroke="var(--txt)" stroke-width="1"/>';
    for(let i=0;i<steps.length-1;i++){
      const a=steps[i], b=steps[i+1];
      if(b.x-a.x<0.001) continue;
      const farbe=a.net>0?'var(--ok)':a.net<0?'var(--bad)':'var(--warn)';
      if(a.net===0){ g+='<line x1="'+X(a.x).toFixed(1)+'" y1="'+y0+'" x2="'+X(b.x).toFixed(1)+'" y2="'+y0+'" stroke="var(--warn)" stroke-width="2.4"/>'; }
      else g+='<rect x="'+X(a.x).toFixed(1)+'" y="'+Math.min(y0,Y(a.net)).toFixed(1)+'" width="'+(X(b.x)-X(a.x)).toFixed(1)+'" height="'+Math.abs(y0-Y(a.net)).toFixed(1)+'" fill="'+farbe+'" opacity=".55"/>'+
        '<line x1="'+X(a.x).toFixed(1)+'" y1="'+Y(a.net).toFixed(1)+'" x2="'+X(b.x).toFixed(1)+'" y2="'+Y(a.net).toFixed(1)+'" stroke="'+farbe+'" stroke-width="2"/>';
    }
    // §3.3: GESCHOBEN — nur orange Marken, färbt nichts ein
    evs.filter(e=>e.art==='geschoben').forEach(e=>{
      g+='<path d="M'+X(e.x).toFixed(1)+' 8 l4 5 l-4 5 l-4 -5 z" fill="#f08c4b"/>'; });
    g+='<text x="'+pL+'" y="107" fill="var(--mut2)" font-size="8">'+belUhr(von)+'</text>'+
       '<text x="'+(W-38)+'" y="107" fill="var(--mut2)" font-size="8">'+belUhr(bis)+'</text>';
    inner='<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" height="'+Hh+'">'+g+'</svg>';
  }
  const lage=rrt.aufbau?'ausbalanciert (Aufbautag)':(rrt.raus>rrt.rein?'mehr raus als rein':rrt.rein>rrt.raus?'mehr rein als raus':'ausgeglichen');
  return '<div class="card"><h3>Aufgaben rein / raus'+(istHeute?' · heute':'')+'</h3>'+
    '<div class="kv"><span>rein <b>'+rrt.rein+'</b> · raus <b>'+rrt.raus+'</b> · geschoben <b style="color:#f08c4b">'+rrt.geschoben+'</b></span><b style="color:'+(rrt.aufbau?'var(--warn)':rrt.raus>rrt.rein?'var(--ok)':rrt.rein>rrt.raus?'var(--bad)':'var(--warn)')+'">'+lage+'</b></div>'+
    inner+
    '<div class="an-legend"><span><i style="background:var(--ok)"></i>mehr raus (Fläche)</span><span><i style="background:var(--bad)"></i>mehr rein (Fläche)</span><span><i style="background:var(--warn)"></i>ausgeglichen</span><span><i style="background:#f08c4b"></i>geschoben (Marke)</span></div></div>';
}
/* §3.3 · MEHRTAGESANSICHT: Balken folgt derselben Regel (Farbe = Lage, Höhe =
   dominanter Wert); der jeweils andere Wert als kleine farbige Linie auf
   seiner Höhe; geschoben als orange Marke oben. */
function reinRausBalkenHtml(n, dom){
  const fl=anFlowReihe(dom||'alle');
  const heute=heuteApp(), reihe=[];
  for(let i=n-1;i>=0;i--){ const iso=isoMinus(heute,i); reihe.push(Object.assign({iso}, reinRausTag(fl, iso))); }
  const maxV=Math.max(1, ...reihe.map(r=>Math.max(r.rein,r.raus)));
  const W=320,Hh=110,pL=6,pR=6, bw=Math.max(3,Math.floor((W-pL-pR)/n)-2);
  const Y=v=>96-(v/maxV)*76;
  let g='<line x1="'+pL+'" y1="96" x2="'+(W-pR)+'" y2="96" stroke="var(--line)"/>';
  let sumR=0,sumE=0,sumG=0;
  reihe.forEach((r,i)=>{
    sumR+=r.rein; sumE+=r.raus; sumG+=r.geschoben;
    const x=pL+i*((W-pL-pR)/n);
    const balanced=r.aufbau || r.rein===r.raus;
    const haupt=balanced?Math.max(r.raus,r.rein):Math.max(r.rein,r.raus);
    const farbe=balanced?'var(--warn)':(r.raus>r.rein?'var(--ok)':'var(--bad)');
    if(haupt>0){
      const hh=Math.max(2,(haupt/maxV)*76);
      g+='<rect x="'+x.toFixed(1)+'" y="'+(96-hh).toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" rx="2" fill="'+farbe+'"/>';
      if(!balanced){ const anderer=Math.min(r.rein,r.raus);
        if(anderer>0) g+='<line x1="'+x.toFixed(1)+'" y1="'+Y(anderer).toFixed(1)+'" x2="'+(x+bw).toFixed(1)+'" y2="'+Y(anderer).toFixed(1)+'" stroke="'+(r.raus>r.rein?'var(--bad)':'var(--ok)')+'" stroke-width="2"/>'; }
    }
    if(r.geschoben>0) g+='<path d="M'+(x+bw/2).toFixed(1)+' 4 l3.5 4.5 l-3.5 4.5 l-3.5 -4.5 z" fill="#f08c4b"/>';
  });
  g+='<text x="'+pL+'" y="107" fill="var(--mut2)" font-size="8">'+reihe[0].iso.slice(5)+'</text>'+
     '<text x="'+(W-36)+'" y="107" fill="var(--mut2)" font-size="8">'+reihe[reihe.length-1].iso.slice(5)+'</text>';
  return '<div class="card"><h3>Aufgaben rein / raus ('+n+' Tage)</h3>'+
    '<div class="kv"><span>rein <b>'+sumR+'</b> · raus <b>'+sumE+'</b> · geschoben <b style="color:#f08c4b">'+sumG+'</b></span><b>'+(sumE>=sumR?'Σ raus ≥ rein':'Σ rein > raus')+'</b></div>'+
    '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" height="'+Hh+'">'+g+'</svg>'+
    '<div class="an-legend"><span><i style="background:var(--ok)"></i>mehr raus (Balken = raus)</span><span><i style="background:var(--bad)"></i>mehr rein (Balken = rein)</span><span><i style="background:var(--warn)"></i>gleich / Aufbautag</span><span><i style="background:#f08c4b"></i>geschoben (Marke)</span><span style="color:var(--mut2)">Linie = der jeweils andere Wert</span></div></div>';
}
/* Diagramm-Karte: Zeitraum-/Domänen-Umschalter + Picker + Chart + Kennzahlen.
   §5 (v1.7.0): wiederbelebt — war seit dem V2-Umbau nirgends mehr eingehängt
   (die data-statzr/-statpick-Handler liefen ins Leere). Der Domänenfilter ist

function diagrammHtml(){

  const seg=(v,l)=>'<button class="'+(zr===v?'on':'')+'" data-statzr="'+v+'">'+l+'</button>';

  h+='<div class="statfilter"><span class="segmini">'+dseg('alle','Alle')+dseg('dfm','DFM')+dseg('privat','Privat')+'</span>';
  // id statDatum2: das Tagesverlauf-Diagramm (F1) trägt bereits #statDatum auf
