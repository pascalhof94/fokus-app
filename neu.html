/* ══════════════════════════════════════════════════════════════════════
   17b · A10 Spotlight-Suche (Pull-down / 🔍)
   In-Memory-Index über Titel/Notiz/Projekt/Unteraufgaben, fehlertolerant
   (Wortanfang · Substring · Fuzzy), case-/umlaut-insensitiv. Rein additiv –
   nichts wird gespeichert. ESC / Tap-außen / „Abbrechen" schließt.
   ══════════════════════════════════════════════════════════════════════ */
let suchIndex=[], _suchDeb=null;
function normSuche(s){
  return (s==null?'':String(s)).toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function baueSuchIndex(){
  suchIndex = (S.karten||[]).map(k=>{
    const teile=[k.titel, k.notiz, (k.domain==='dfm'?k.projekt:''), k.kommentarClaude]
      .concat(untermenge(k.id).map(u=>u.titel));
    return { id:k.id, norm: normSuche(teile.filter(Boolean).join(' ')) };
  });
}
function fuzzySub(hay, needle){ let i=0; for(let j=0;j<hay.length && i<needle.length;j++){ if(hay[j]===needle[i]) i++; } return i===needle.length; }
function tokenScore(hay, tok){
  if(!tok) return 0;
  const words=hay.split(' ');
  if(words.indexOf(tok)>=0) return 100;                 // exaktes Wort
  if(words.some(w=>w.indexOf(tok)===0)) return 60;      // Wortanfang
  if(hay.indexOf(tok)>=0) return 40;                    // Substring
  if(tok.length>=3 && fuzzySub(hay,tok)) return 15;     // Fuzzy (Teilfolge)
  return 0;
}
function sucheTreffer(q){
  const qn=normSuche(q); if(!qn) return [];
  const toks=qn.split(' '), res=[];
  suchIndex.forEach(e=>{
    let sc=0, ok=true;
    for(const t of toks){ const s=tokenScore(e.norm,t); if(!s){ ok=false; break; } sc+=s; }
    if(ok){ const k=(S.karten||[]).find(x=>x.id===e.id); if(k && k.status!=='archiviert') res.push({k,sc}); }
  });
  res.sort((a,b)=> b.sc-a.sc || String(a.k.titel||'').localeCompare(String(b.k.titel||'')));
  // §11 (v1.12.0): je Karte hoechstens die JUENGSTE erledigte Instanz — bei
  // taeglichen Routinen ist die Version von vor drei Tagen Rauschen.
  const gesehen={}, out=[];
  res.forEach(o=>{
    if(o.k.status!=='erledigt'){ out.push(o); return; }
    const key=normSuche(o.k.titel||'')+'|'+o.k.domain;
    const alt=gesehen[key];
    if(!alt){ gesehen[key]=o; out.push(o); return; }
    if(abschlussZeit(o.k)>abschlussZeit(alt.k)){ alt.k=o.k; alt.sc=o.sc; }
  });
  return out.slice(0,25);
}
function oeffneSuche(){
  baueSuchIndex();
  const o=el('suchOverlay'); o.hidden=false;
  const inp=el('suchInput'); inp.value=''; el('suchList').innerHTML='';
  try{ inp.focus(); }catch(e){}
  setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 40);   // iOS: Tastatur zuverlässig öffnen
}
function schliesseSuche(){ const o=el('suchOverlay'); if(o) o.hidden=true; if(_suchDeb){ clearTimeout(_suchDeb); _suchDeb=null; } }
function renderSuchTreffer(){
  const q=el('suchInput').value, box=el('suchList');
  if(!normSuche(q)){ box.innerHTML=''; return; }
  const tr=sucheTreffer(q);
  if(!tr.length){ box.innerHTML='<div class="such-leer">Kein Treffer für „'+esc(q)+'"</div>'; return; }
  box.innerHTML=tr.map(o=>{ const k=o.k;
    const dom=k.domain==='dfm'?'DFM':'Privat';
    const fa=k.faelligkeit?(fmtDatum(k.faelligkeit)+(k.uhrzeit?' '+esc(k.uhrzeit):'')):'ohne Termin';
    const extra=(k.status==='erledigt'?' · ✓':'')+(k.freeze?' · ❄︎':'');
    return '<div class="such-row">'+
      '<div class="such-main" data-suchdetail="'+k.id+'"><div class="such-t">'+esc(k.titel||'(ohne Titel)')+'</div>'+
      '<div class="such-m">'+esc(kartenArtLabel(k))+' · '+dom+' · '+esc(fa)+extra+'</div></div>'+
      (k.status==='offen'?'<button class="such-b" data-suchkette="'+k.id+'" aria-label="Kette">▤</button>':'')+
      '<button class="such-b" data-suchstart="'+k.id+'" aria-label="Fokus starten">▶</button>'+
      '<button class="such-b" data-suchdetail="'+k.id+'" aria-label="Detail öffnen">≡</button>'+
    '</div>';
  }).join('');
}
function stapelFuerKarte(kid){ for(const st of S.stapel){ try{ if(stapelKarten(st).some(k=>k.id===kid)) return st; }catch(e){} } return null; }
function suchFokusStarten(kid){
  const k=(S.karten||[]).find(x=>x.id===kid); if(!k) return;
  if(k.freeze){ k.freeze=false; saveKarten(); }
  const st=stapelFuerKarte(kid); if(st){ S.ui.aktivStapel=st.id; saveUi(); }
  schliesseSuche();
  if(S.fokus && S.fokus.karteId===kid) fokusToggle(); else fokusStarten(kid);
  setTab('fokus');
}
el('btnSuche').addEventListener('click', oeffneSuche);
el('suchClose').addEventListener('click', schliesseSuche);
el('suchInput').addEventListener('input', ()=>{ if(_suchDeb) clearTimeout(_suchDeb); _suchDeb=setTimeout(renderSuchTreffer, 90); });   // minimaler Debounce
el('suchInput').addEventListener('keydown', e=>{ if(e.key==='Escape'){ e.preventDefault(); schliesseSuche(); } });
el('suchList').addEventListener('click', e=>{
  // §11 (v1.12.0): Kettenfunktionen wie §9.2 (inkl. Uhrstart bei „ganz nach
  // oben" im Aktions-Sheet); Tap auf eine ERLEDIGTE Karte oeffnet den
  // Wiederholen-Dialog (§8).
  const kb=e.target.closest('[data-suchkette]'); if(kb){ schliesseSuche(); oeffneKetteAktion(kb.dataset.suchkette); return; }
  const st=e.target.closest('[data-suchstart]'); if(st){
    const k=(S.karten||[]).find(x=>x.id===st.dataset.suchstart);
    if(k && k.status==='erledigt'){ schliesseSuche(); oeffneWiederholen(k.id); return; }
    suchFokusStarten(st.dataset.suchstart); return; }
  const de=e.target.closest('[data-suchdetail]'); if(de){
    const k=(S.karten||[]).find(x=>x.id===de.dataset.suchdetail);
    schliesseSuche();
    if(k && k.status==='erledigt'){ oeffneWiederholen(k.id); return; }
    oeffneDetail(de.dataset.suchdetail); return; }
});
el('suchOverlay').addEventListener('click', e=>{ if(e.target.id==='suchOverlay') schliesseSuche(); });   // Tap-außen
/* Pull-down bei scrollTop 0 (Fokus/Stapel) öffnet die Suche — ohne pan-y zu
   stören (kein preventDefault; am oberen Rand scrollt ohnehin nichts). */
(function(){
  const m=document.querySelector('main'); if(!m) return;
  let y0=null, active=false;
  m.addEventListener('touchstart', e=>{
    if(e.touches.length!==1){ y0=null; active=false; return; }
    const tab=S.ui.tab; active=(tab==='fokus'||tab==='stapel') && m.scrollTop<=0;
    y0=active?e.touches[0].clientY:null;
  }, {passive:true});
  m.addEventListener('touchmove', e=>{
    if(y0==null || !active) return;
    if((e.touches[0].clientY-y0)>78 && m.scrollTop<=0 && el('suchOverlay').hidden){ y0=null; active=false; oeffneSuche(); }
  }, {passive:true});
  m.addEventListener('touchend', ()=>{ y0=null; active=false; }, {passive:true});
})();

/* ══════════════════════════════════════════════════════════════════════
   17c · B1–B3 Detailanalyse (Profisport-Adaption)
   Datenquelle: Historie (Tages-Snapshots) + heutiger offener Tag. Reine
   Auswertung, nichts wird gespeichert. Charts als SVG (keine Fremdbibliothek).
   Dünne Datenlage → Module zeigen „sammelt noch Daten (X/Y Tage)".
   ══════════════════════════════════════════════════════════════════════ */
function anVorTage(iso,n){ const d=new Date((iso||heuteApp())+'T12:00:00'); d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function anTageDiff(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function anKurzDatum(iso){ return iso?iso.slice(8,10)+'.'+iso.slice(5,7):''; }
function anWochentag(iso){ return (new Date(iso+'T12:00:00').getDay()+6)%7; }   // Mo=0 … So=6
const AN_WT=['Mo','Di','Mi','Do','Fr','Sa','So'];
function anFmt(v){ v=num(v); if(Math.abs(v)>=1000) return (Math.round(v/100)/10)+'k'; return (Math.round(v*10)/10).toString(); }
function anFmtUhr(h){ if(h==null||!isFinite(h)) return '—'; const hh=Math.floor(h), mm=Math.round((h-hh)*60); return String(hh).padStart(2,'0')+':'+String(mm%60).padStart(2,'0'); }

/* ══ §2 (v1.7.0) · Kartenart als dritte Filterebene der Detailanalyse ══
   Alle / Aufgaben / Routinen / Counter — wirkt auf ALLE Module, konsistent
   zum Domänenfilter. Zustand in S.ui.analyseArt (reload-fest). */
const AN_ARTEN=[['alle','Alle'],['aufgabe','Aufgaben'],['routine','Routinen'],['counter','Counter']];
const AN_ART_KARTE={aufgabe:'Aufgabe', routine:'Routine', counter:'Counter'};   // Filterwert → kartenArt()
function analyseArt(){ return ['aufgabe','routine','counter'].indexOf(S.ui.analyseArt)>=0 ? S.ui.analyseArt : 'alle'; }
function analyseArtLabel(){ return (AN_ARTEN.find(a=>a[0]===analyseArt())||AN_ARTEN[0])[1]; }
/* Karte gegen den aktiven Kartenart-Filter prüfen. */
function anArtOk(k){ const a=analyseArt(); return a==='alle' || kartenArt(k)===AN_ART_KARTE[a]; }
/* Roh-Tage: Historie (+ heute, falls offen) nach Kalendertag aggregiert. */
function analyseRohTage(){
  const q=(S.historie||[]).filter(h=>!h.luecke).slice();
  if(tagOffen() && S.tag){
    q.push({ datum:S.tag.datum, startTs:S.tag.startTs, endeTs:jetztIso(), akku:S.tag.akku,
      punkteBilanz:tagesPunkteLive(), abzuege:num(S.tag.abzuegeBilanz),
      zeit:tagesZeitAggregat(S.tag.tagId), log:(S.tag.log||[]), routinenBilanz:(S.tag.routinenBilanz||[]), urlaub:urlaubHeute(), _heute:true });
  }
  const map={};
  // §2 (v1.7.0): Domäne einer Routinen-Bilanz-Zeile über die Karte auflösen
  // (die Bilanz trägt nur id+titel); gelöschte Karten fallen auf 'privat'.
  const kById={}; S.karten.forEach(k=>kById[k.id]=k);
  q.forEach(h=>{ const d=h.datum; if(!d) return;
    let e=map[d]; if(!e){ e=map[d]={ datum:d, punkte:0, punkteDfm:0, punktePrivat:0, minDfm:0, minPrivat:0,
      akku:null, startTs:null, endeTs:null, schub:0, erledigt:0, routErledigt:0, routVerpasst:0, heute:false,
      artPkt:{}, artMin:{},                                        // §2: Punkte/Minuten je "Art|Domäne"
      routErf:{dfm:0,privat:0}, routVerp:{dfm:0,privat:0}, routEnt:{dfm:0,privat:0}, routGes:{dfm:0,privat:0} }; }   // §3: Routinen-Flow (+geschoben v1.13.0)
    e.punkte+=num(h.punkteBilanz);
    if(h.zeit){ e.minDfm+=num(h.zeit.dfm)/60; e.minPrivat+=num(h.zeit.privat)/60; }
    (h.log||[]).forEach(l=>{
      if(l.art==='schub'){ e.schub++; } else { e.erledigt++; }
      e[l.domain==='dfm'?'punkteDfm':'punktePrivat']+=num(l.punkte);
      const ak=(l.art||'?')+'|'+(l.domain==='dfm'?'dfm':'privat');
      e.artPkt[ak]=(e.artPkt[ak]||0)+num(l.punkte);                // §2: Punkt-Buchungen tragen ihre Art
      if(l.art==='Routine' && num(l.punkte)>0){ e.routErledigt++;
        e.routErf[l.domain==='dfm'?'dfm':'privat']++; }
    });
    (h.routinenBilanz||[]).forEach(r=>{
      const kd=kById[r.id], rd=(kd&&kd.domain==='dfm')?'dfm':'privat';
      if(r.verpasst){ e.routVerpasst++; e.routVerp[rd]++; }
      else if(r.entschuldigt){ e.routEnt[rd]++; }                  // §3: getrennt, zählt NICHT als erfüllt
      else if(r.geschoben){ e.routGes[rd]++; }                     // §3.1 (v1.13.0): vierte Kategorie
    });
    if(e.akku==null && h.akku!=null) e.akku=num(h.akku);
    if(!e.startTs || (h.startTs&&h.startTs<e.startTs)) e.startTs=h.startTs;
    if(!e.endeTs || (h.endeTs&&h.endeTs>e.endeTs)) e.endeTs=h.endeTs;
    if(h.urlaub) e.urlaub=true;   // §5 (1.8.1): Urlaubs-Markierung des Tages
    if(h._heute) e.heute=true;
  });
  // §2: Minuten je Art×Domäne aus dem Intraday-Log (existiert seit UP4-B 31.07.;
  // ältere Tage haben hier 0 — die Module weisen darauf hin).
  (S.intraday||[]).forEach(x=>{
    if(!x.ts) return; const e=map[String(x.ts).slice(0,10)]; if(!e) return;
    const m=num(x.minuten); if(m<=0) return;
    const k=kById[x.kartenId];
    const ak=(k?kartenArt(k):'?')+'|'+((k?k.domain:x.domaene)==='dfm'?'dfm':'privat');
    e.artMin[ak]=(e.artMin[ak]||0)+m;
  });
  let arr=Object.keys(map).sort().map(k=>map[k]);
  // §7 (v1.6.0): Bonus-Glättung anwenden — der beim Abschluss gebuchte Bonus
  // wandert vom Abschlusstag auf die Tage, an denen tatsächlich an der Karte
  // gearbeitet wurde (anteilig nach Ist-Minuten). Reine Auswertung: punkteIst
  // und das Export-Paket bleiben unverändert.
  // §3 (v1.7.1): dieselbe Umbuchung in ALLEN Sichten — Tagessumme, Domänen-
  // Aggregate UND Art-Aggregate. Tage ohne Eintrag werden in allen Sichten
  // gleich übersprungen (Konsistenz bleibt gewahrt).
  const gd=glaettungDeltas();
  Object.keys(gd).forEach(d=>{ const e=map[d]; if(!e) return; const o=gd[d];
    e.punkte+=o.gesamt; e.punkteDfm+=o.dom.dfm; e.punktePrivat+=o.dom.privat;
    Object.keys(o.art).forEach(k=>{ e.artPkt[k]=(e.artPkt[k]||0)+o.art[k]; });
  });
  arr.forEach(e=>{ e.min=e.minDfm+e.minPrivat; e.wt=anWochentag(e.datum); });
  // H4.2: Tage ohne jegliche Aktivität (keine Zeit, keine Punkte) fallen komplett
  // aus allen Statistiken/Durchschnitten heraus — kein Verzerren als 0-Tag.
  arr=arr.filter(e=> e.heute || e.min>0.01 || e.punkte!==0);
  return arr;
}
/* §2 (v1.7.0): Die beiden zentralen Tages-Accessoren respektieren den
   Kartenart-Filter. Bei „Alle" exakt das bisherige Verhalten (inkl. Glättung
   und Tagesbilanz); bei gewählter Art die Summe der Punkt-Buchungen bzw.
   Intraday-Minuten dieser Art — dadurch wirkt der Filter auf jedes Modul,
   das über anPunkte/anMin liest. */
function anArtSumme(agg, art, dom){
  const name=AN_ART_KARTE[art]; let s=0;
  Object.keys(agg||{}).forEach(k=>{
    const t=k.split('|');
    if(t[0]===name && (dom==='alle'||t[1]===dom)) s+=agg[k];
  });
  return s;
}
function anPunkte(e,dom){
  const a=analyseArt();
  if(a!=='alle') return anArtSumme(e.artPkt, a, dom);
  return dom==='dfm'?e.punkteDfm : dom==='privat'?e.punktePrivat : e.punkte;
}
function anMin(e,dom){
  const a=analyseArt();
  if(a!=='alle') return anArtSumme(e.artMin, a, dom);
  return dom==='dfm'?e.minDfm : dom==='privat'?e.minPrivat : e.min;
}
/* §2 (v1.8.1): anZiel kannte die Wochenendregel nicht — Sa/So erschienen in
   Leistung und Kalibrierung systematisch als schlechte Tage (Ziel 5000 statt
   des gemeinsamen 3000er-Wochenendziels). Abbildung auf EINZELTAGE: 1500 je
   Wochenendtag — die Summe über Sa+So ergibt exakt die gemeinsamen 3000, und
   die Module behalten ihre Tagesauflösung (das „Wochenende als Einheit" würde
   jede Tages-Trendkurve brechen). Ohne Datum gilt heute. */
/* §2 (v1.12.0): Analyse-Ziele laufen ueber zielTag() — die v1.8.1-Regel
   (1500 je WE-Tag) ist durch das gemeinsame Sa+So-Kontingent ersetzt.
   Je-Tag-Quoten am WE wertet zielQuoten() als EIN Ereignis pro Wochenende. */
function anZielDfmTag(datum){ return zielTag('dfm', datum); }
function anZiel(dom, datum){
  return dom==='dfm'?zielTag('dfm',datum) : dom==='privat'?zielTag('privat',datum) : zielTagGesamt(datum);
}
/* §2.3: Zielerreichungs-Quoten einer Tagesliste — Werktage einzeln; Sa+So
   werden zu EINEM Ereignis gebuendelt (Summe beider Tage / Kontingent). */
function zielQuoten(tage, dom, punkteVon){
  const out=[]; const byDatum={}; (tage||[]).forEach(e=>byDatum[e.datum]=e);
  const gesehen={};
  (tage||[]).forEach(e=>{
    if(gesehen[e.datum]) return;
    if(!istWochenendTag(e.datum)){
      const z=zielTag(dom==='alle'?null:dom, e.datum);
      const zz=dom==='alle'?zielTagGesamt(e.datum):z;
      out.push(zz>0?punkteVon(e)/zz:null); gesehen[e.datum]=1; return;
    }
    // Wochenend-Paar: Samstag suchen (Sa=6, So=0)
    const wt=new Date(e.datum+'T12:00:00').getDay();
    const partnerDatum=wt===6?anVorTage(e.datum,-1):anVorTage(e.datum,1);
    const partner=byDatum[partnerDatum];
    let p=punkteVon(e); if(partner){ p+=punkteVon(partner); gesehen[partner.datum]=1; }
    gesehen[e.datum]=1;
    const zz=dom==='alle'?zielTagGesamt(e.datum):zielTag(dom,e.datum);
    out.push(zz>0?p/zz:null);
  });
  return out.filter(x=>x!=null);
}
/* Fenster gemäß S.ui (Zeitraum-Preset / frei) inkl. Vorperiode gleicher Länge. */
function analyseFenster(){
  const alle=analyseRohTage();
  const zr=S.ui.analyseZeitraum||'7';
  let von, bis, span;
  if(zr==='frei'){ bis=S.ui.analyseBis||heuteApp(); von=S.ui.analyseVon||anVorTage(bis,6); span=anTageDiff(von,bis)+1; }
  else { span=num(zr,7); bis=heuteApp(); von=anVorTage(bis,span-1); }
  const inWin=d=> d>=von && d<=bis;
  // §5.3 (v1.8.1): Urlaubstage (Markierung AM TAG, nicht am Schalter) fliessen
  // nicht in Durchschnitte, Trends, ACWR und Wochentagsprofile ein — sie werden
  // aus cur/prev herausgehalten und im Kopf gezaehlt ausgewiesen.
  const cur=alle.filter(e=>inWin(e.datum) && !e.urlaub);
  const urlaubCur=alle.filter(e=>inWin(e.datum) && e.urlaub).length;
  const pBis=anVorTage(von,1), pVon=anVorTage(von,span);
  const prev=alle.filter(e=>e.datum>=pVon && e.datum<=pBis && !e.urlaub);
  return { alle, cur, prev, von, bis, span, urlaubCur };
}
/* Lückenlose Kalender-Reihe (fehlende Tage = null) — für gleitende Mittel/ACWR. */
function anKalenderReihe(alle, von, bis){
  const map={}; alle.forEach(e=>map[e.datum]=e);
  const out=[]; let d=von, guard=0;
  while(d<=bis && guard++<800){ out.push({datum:d, e:map[d]||null}); d=anVorTage(d,-1); }
  return out;
}
function anMean(a){ const v=a.filter(x=>x!=null); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null; }
function anSum(a){ return a.reduce((s,x)=>s+num(x),0); }
function anDeltaPct(cur,prev){ if(prev==null||prev===0||!isFinite(prev)) return null; return (cur-prev)/Math.abs(prev)*100; }
function anKpi(val,label,deltaPct,unit,invert){
  let d='';
  if(deltaPct!=null && isFinite(deltaPct)){ let cls=Math.abs(deltaPct)<1?'flat':(deltaPct>0?'up':'down'); if(invert&&cls!=='flat') cls=cls==='up'?'down':'up';
    d='<div class="d '+cls+'">'+(deltaPct>0?'+':'')+Math.round(deltaPct)+'%</div>'; }
  return '<div class="ankpi"><div class="v">'+val+(unit?'<span style="font-size:11px;color:var(--mut2)"> '+unit+'</span>':'')+'</div><div class="l">'+esc(label)+'</div>'+d+'</div>';
}
function anLeer(txt){ return '<div class="an-leer">'+esc(txt)+'</div>'; }
function anSammelt(have, need){ return anLeer('Sammelt noch Daten ('+have+'/'+need+' Tage). Ab dem 30.07. wächst die Historie täglich.'); }
function anModul(ic, titel, sub, inner){
  return '<div class="anmod"><div class="anmod-h"><span class="ic">'+ic+'</span><h4>'+esc(titel)+'</h4></div>'+
    (sub?'<div class="anmod-sub">'+sub+'</div>':'')+inner+'</div>';
}

/* ── SVG-Bausteine ─────────────────────────────────────────────────── */
function anSvgLine(labels, series, opts){
  opts=opts||{}; const W=320,H=opts.height||132,pL=30,pR=10,pT=10,pB=18;
  const n=labels.length; if(!n) return anLeer('keine Daten');
  let yMin=opts.yMin, yMax=opts.yMax;
  if(yMin==null||yMax==null){ let lo=Infinity,hi=-Infinity; series.forEach(s=>s.vals.forEach(v=>{ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); } })); (opts.hlines||[]).forEach(h=>{ lo=Math.min(lo,h.y); hi=Math.max(hi,h.y); });
    if(!isFinite(lo)){ lo=0; hi=1; } if(lo===hi){ hi=lo+1; } const pad=(hi-lo)*0.1; yMin=(opts.yMin!=null?opts.yMin:lo-pad); yMax=(opts.yMax!=null?opts.yMax:hi+pad); if(opts.y0) yMin=Math.min(0,yMin); }
  const yr=(yMax-yMin)||1;
  const xAt=i=> pL+(n===1?(W-pL-pR)/2:i/(n-1)*(W-pL-pR));
  const yAt=v=> pT+(1-(v-yMin)/yr)*(H-pT-pB);
  let g='';
  (opts.hlines||[]).forEach(h=>{ const y=yAt(h.y).toFixed(1); g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="'+h.color+'" stroke-width="1" stroke-dasharray="'+(h.dash||'3 3')+'"/>'+(h.label?'<text x="'+(W-pR)+'" y="'+(yAt(h.y)-2).toFixed(1)+'" text-anchor="end" font-size="8" fill="'+h.color+'">'+esc(h.label)+'</text>':''); });
  g+='<text x="'+(pL-3)+'" y="'+(yAt(yMax)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+anFmt(yMax)+'</text>'+
     '<text x="'+(pL-3)+'" y="'+(yAt(yMin)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+anFmt(yMin)+'</text>';
  series.forEach(s=>{ let d='',on=false;
    s.vals.forEach((v,i)=>{ if(v==null){ on=false; return; } d+=(on?'L':'M')+xAt(i).toFixed(1)+' '+yAt(v).toFixed(1)+' '; on=true; });
    if(d) g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
    if(s.dots!==false) s.vals.forEach((v,i)=>{ if(v!=null) g+='<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(v).toFixed(1)+'" r="2.1" fill="'+s.color+'"/>'; });
  });
  g+='<text x="'+xAt(0).toFixed(1)+'" y="'+(H-4)+'" text-anchor="start" font-size="8" fill="var(--mut2)">'+anKurzDatum(labels[0])+'</text>';
  if(n>1) g+='<text x="'+xAt(n-1).toFixed(1)+'" y="'+(H-4)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+anKurzDatum(labels[n-1])+'</text>';
  return '<svg class="an-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>';
}
function anSvgScatter(pts, opts){
  const W=320,H=150,pL=30,pR=10,pT=10,pB=24;
  const xr=(opts.xMax-opts.xMin)||1, yr=(opts.yMax-opts.yMin)||1;
  const xAt=v=>pL+(v-opts.xMin)/xr*(W-pL-pR), yAt=v=>pT+(1-(v-opts.yMin)/yr)*(H-pT-pB);
  let g='';
  // Trendlinie (lineare Regression)
  if(pts.length>=3){ const nx=pts.length, sx=anSum(pts.map(p=>p.x)), sy=anSum(pts.map(p=>p.y)),
      sxx=anSum(pts.map(p=>p.x*p.x)), sxy=anSum(pts.map(p=>p.x*p.y)); const den=nx*sxx-sx*sx;
    if(den!==0){ const m=(nx*sxy-sx*sy)/den, b=(sy-m*sx)/nx;
      g+='<line x1="'+xAt(opts.xMin).toFixed(1)+'" y1="'+yAt(m*opts.xMin+b).toFixed(1)+'" x2="'+xAt(opts.xMax).toFixed(1)+'" y2="'+yAt(m*opts.xMax+b).toFixed(1)+'" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="4 3"/>'; } }
  pts.forEach(p=>{ g+='<circle cx="'+xAt(p.x).toFixed(1)+'" cy="'+yAt(p.y).toFixed(1)+'" r="3.2" fill="var(--blue)" opacity=".85"/>'; });
  g+='<text x="'+pL+'" y="'+(H-4)+'" font-size="8" fill="var(--mut2)">'+esc(opts.xlabel||'')+'</text>';
  g+='<text x="'+(pL-3)+'" y="'+(pT+6)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+esc(opts.ylabel||'')+'</text>';
  return '<svg class="an-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>';
}
/* gleitendes Mittel über die letzten w gefüllten Werte je Position. */
function anGleitend(vals, w){ return vals.map((_,i)=>{ const seg=vals.slice(Math.max(0,i-w+1),i+1).filter(x=>x!=null); return seg.length?anMean(seg):null; }); }

/* ── Modul 1 · Readiness ───────────────────────────────────────────── */
function anModReadiness(F,dom){
  const pts=F.cur.filter(e=>e.akku!=null).map(e=>({x:e.akku, y:anPunkte(e,dom)}));
  let inner;
  if(pts.length<4){ inner=anSammelt(pts.length,4); }
  else{
    const yMax=Math.max.apply(null,pts.map(p=>p.y).concat([anZiel(dom)]));
    inner=anSvgScatter(pts,{xMin:0,xMax:100,yMin:0,yMax:yMax*1.05,xlabel:'Start-Akku %  →',ylabel:'↑ Tagesscore'});
    const rE=anMean(F.cur.filter(e=>e.akku!=null).map(e=>e.akku)), rP=anMean(pts.map(p=>p.y));
    const pE=anMean(F.prev.filter(e=>e.akku!=null).map(e=>e.akku)), pP=anMean(F.prev.map(e=>anPunkte(e,dom)));
    inner+='<div class="anmod-kpis">'+anKpi(Math.round(rE),'Ø Readiness',anDeltaPct(rE,pE),'%')+
      anKpi(anFmt(rP),'Ø Score',anDeltaPct(rP,pP))+'</div>';
  }
  return anModul('🟢','Readiness','Start-Verfassung (Akku) vs. erreichter Tagesscore. Punktewolke rechts-oben = gut erholt & stark geliefert.',inner);
}
/* ── Modul 2 · Belastungssteuerung (ACWR) ──────────────────────────── */
function anAcwrReihe(alle, bis, span, dom, metric){
  // ACWR je Tag = Ø(7 Tage) ÷ Ø(28 Tage), lückenlos (fehlende Tage = 0 Last).
  const startAll=alle.length?alle[0].datum:bis;
  const reihe=anKalenderReihe(alle, startAll, bis);
  const load=reihe.map(x=> x.e ? (metric==='min'?anMin(x.e,dom):anPunkte(x.e,dom)) : 0);
  const acwr=load.map((_,i)=>{ if(i<7) return null; const ac=anMean(load.slice(i-6,i+1)); const ch=anMean(load.slice(Math.max(0,i-27),i+1)); return (ch&&ch>0)?ac/ch:null; });
  // nur die letzten `span` Tage anzeigen
  const from=Math.max(0, reihe.length-span);
  return { labels:reihe.slice(from).map(x=>x.datum), vals:acwr.slice(from), current:acwr[acwr.length-1] };
}
function anModACWR(F,dom){
  let inner;
  if(F.alle.length<8){ inner=anSammelt(F.alle.length,8); }
  else{
    const P=anAcwrReihe(F.alle,F.bis,F.span,dom,'punkte');
    const M=anAcwrReihe(F.alle,F.bis,F.span,dom,'min');
    inner=anSvgLine(P.labels,[{vals:P.vals,color:'var(--blue)'}],{yMin:0,yMax:2,height:132,hlines:[
      {y:0.8,color:'var(--ok)',dash:'2 3'},{y:1.3,color:'var(--warn)',dash:'2 3',label:'Sweet-Spot 0,8–1,3'},{y:1.5,color:'var(--bad)',dash:'2 3'}]});
    const zone=v=> v==null?'—': v<0.8?'Unterlast':v<=1.3?'optimal':v<=1.5?'erhöht':'Overload';
    inner+='<div class="anmod-kpis">'+
      anKpi(P.current!=null?(Math.round(P.current*100)/100):'—','ACWR Punkte')+
      anKpi(zone(P.current),'Zone')+
      anKpi(M.current!=null?(Math.round(M.current*100)/100):'—','ACWR Zeit')+'</div>';
    inner+='<div class="an-legend"><span><i style="background:var(--ok)"></i>0,8–1,3 optimal</span><span><i style="background:var(--warn)"></i>&gt;1,3 erhöht</span><span><i style="background:var(--bad)"></i>&gt;1,5 Overload</span></div>';
  }
  return anModul('📈','Belastungssteuerung','Acute:Chronic Workload Ratio (7-Tage-Last ÷ 28-Tage-Schnitt). 0,8–1,3 = nachhaltiger Aufbau, darüber steigt das Überlastungsrisiko.',inner);
}
/* ── Modul 3 · Leistung ────────────────────────────────────────────── */
function anModLeistung(F,dom){
  let inner;
  if(F.cur.length<3){ inner=anSammelt(F.cur.length,3); }
  else{
    const labels=F.cur.map(e=>e.datum);
    // §2 (v1.11.0): Null-Minuten-Regel — die P/Std-Reihe zählt nur Buchungen
    // mit Dauer ≥1 Min (Zähler UND Nenner, aus dem Intraday-Log). Vorher gingen
    // alle Tagespunkte (inkl. zeitloser Abhakboni) durch die getrackte Zeit —
    // genau so kam der 4.487er-Ausreißer vom 28.08. zustande.
    const anRate=datum=>tagesRateDetail(datum, dom).rate;
    const ph=F.cur.map(e=>anRate(e.datum));
    const avg7=anGleitend(ph,7);
    inner=anSvgLine(labels,[{vals:ph,color:'var(--cyan)'},{vals:avg7,color:'var(--warn)',dots:false,dash:'5 3'}],{y0:true,height:132});
    inner+='<div class="an-legend"><span><i style="background:var(--cyan)"></i>P/Std täglich</span><span><i style="background:var(--warn)"></i>7-Tage-Ø</span></div>';
    // Domänen-Ziel-Erreichung (Bars)
    const doms= dom==='alle'?[['dfm','DFM','var(--warn)'],['privat','Privat','var(--ok)']]:[[dom,dom==='dfm'?'DFM':'Privat',dom==='dfm'?'var(--warn)':'var(--ok)']];
    let bars='<div class="an-bars">';
    doms.forEach(function(d){
      // §2 (v1.8.1): Ø der TAGES-Quoten statt Ø-Punkte ÷ Ein-Ziel — so gilt an
      // Wochenendtagen das 1500er-Teilziel und Sa/So erscheinen nicht mehr als
      // systematisch schlechte Tage.
      // §2.3 (v1.12.0): Ø der Zielerreichungs-Quoten — WE zaehlt als EIN Ereignis
      const pct=Math.max(0,Math.min(1.3, anMean(zielQuoten(F.cur, d[0], e=>anPunkte(e,d[0])))||0));
      bars+='<div class="an-bar"><span class="nm">'+d[1]+'</span><span class="track"><i style="width:'+Math.min(100,pct*100/1.3).toFixed(0)+'%;background:'+d[2]+'"></i></span><span class="vv">'+Math.round(pct*100)+'% Ziel</span></div>'; });
    bars+='</div>';
    inner+=bars;
    const phCur=anMean(ph.filter(x=>x!=null)), phPrev=anMean(F.prev.map(e=>anRate(e.datum)).filter(x=>x!=null));
    const scCur=anMean(F.cur.map(e=>anPunkte(e,dom))), scPrev=anMean(F.prev.map(e=>anPunkte(e,dom)));
    const best=Math.max.apply(null,F.cur.map(e=>anPunkte(e,dom)).concat([0]));
    inner+='<div class="anmod-kpis">'+anKpi(anFmt(phCur||0),'Ø P/Std',anDeltaPct(phCur,phPrev))+
      anKpi(anFmt(scCur||0),'Ø Score',anDeltaPct(scCur,scPrev))+
      anKpi(anFmt(best),'Bestleistung')+
      anKpi(fmtKurzP(rangPunkteAnzeige()),'Lebenswerk 🪙')+'</div>';   // §7 (v1.11.0): rangPunkte lebt hier weiter
  }
  return anModul('🏆','Leistung','Punkte pro Stunde als Effizienz-Trend mit 7-Tage-Schnitt, plus Zielerreichung je Domäne (DFM 5000 / Privat 3000).',inner);
}
/* ── Modul 4 · Konsistenz ──────────────────────────────────────────── */
/* F3.2 (v1.3.3): Aktivität je Tag aus dem Intraday-Log — deckt ALLE getrackten
   Karten ab (Timer-Minuten, Ticks, Abhaken, Nachträge), nicht nur die über
   S.tag.log gebuchten Routinen/Counter. Domänen-gefiltert. */
function anIntradayProTag(dom){
  const out={}, kById={}; S.karten.forEach(k=>kById[k.id]=k);
  (S.intraday||[]).forEach(e=>{ if(!e.ts) return;
    if(dom!=='alle' && e.domaene!==dom) return;
    // §2 (v1.7.0): Kartenart-Filter — Buchungen fremder Arten überspringen
    // (Karte nicht mehr vorhanden → nur bei aktivem Filter ausblenden).
    if(analyseArt()!=='alle'){ const k=kById[e.kartenId]; if(!k || !anArtOk(k)) return; }
    const d=String(e.ts).slice(0,10), o=out[d]||(out[d]={pkt:0,min:0,karten:{}});
    const p=num(e.punkte), m=Math.max(0,num(e.minuten));
    if(p>0) o.pkt+=p;
    o.min+=m;
    if(p>0||m>0) o.karten[e.kartenId]=1;
  });
  return out;
}
function anModKonsistenz(F,dom){
  // Heatmap (immer, auch dünn) + Wochentagsprofil (ab 7 Tagen) + Routinenquote
  const map={}; F.cur.forEach(e=>map[e.datum]=anPunkte(e,dom));
  const minMap={}; F.cur.forEach(e=>minMap[e.datum]=anMin(e,dom));
  const ia=anIntradayProTag(dom);   // F3.2: alle getrackten Aufgaben zählen mit
  // Aktivitätswert eines Tages: Maximum aus gebuchten Tagespunkten und den
  // Intraday-Punkten (letztere erfassen auch reine Timer-Arbeit ohne Abhaken).
  const wert=d=>{ const a=ia[d]; const vL=map[d]==null?null:map[d], vI=a?a.pkt:null;
    if(vL==null && vI==null) return null; return Math.max(vL||0, vI||0); };
  const hatZeit=d=>{ const a=ia[d]; return (num(minMap[d])>0.01) || (a && a.min>0.01); };
  let cells=[]; let d=F.von, guard=0; while(d<=F.bis && guard++<400){ cells.push({datum:d, v:wert(d)}); d=anVorTage(d,-1); }
  const maxS=Math.max.apply(null, cells.map(c=>c.v||0).concat([1]));
  // F3.1: Wochenspalten sind IMMER 7 Zellen hoch (führend/nachlaufend unsichtbar
  // gepolstert) und bekommen eine Mo–So-Beschriftungsspalte — dadurch sitzt jeder
  // Punkt exakt auf seiner Wochentagszeile. Zuvor blieb zusätzlich das letzte
  // .wk-<div> offen, wodurch Wochentagsprofil und KPIs in die Heatmap-Flexzeile
  // gerutscht sind (der sichtbare Versatz).
  const col=v=> v==null?'var(--card2)': v<=0?'#3a2530': 'rgba(62,207,142,'+(0.2+0.8*Math.min(1,v/maxS)).toFixed(2)+')';
  const leer='<span class="cell" style="visibility:hidden"></span>';
  let hm='<div class="an-hmwrap"><div class="an-hmlab">'+AN_WT.map(n=>'<span>'+n+'</span>').join('')+'</div><div class="an-hm">';
  let offenSpalte=false, gefuellt=0;
  cells.forEach((c,i)=>{ const wt=anWochentag(c.datum);
    if(i===0){ hm+='<div class="wk">'; offenSpalte=true; for(let p=0;p<wt;p++){ hm+=leer; gefuellt++; } }
    else if(wt===0){ hm+='</div><div class="wk">'; gefuellt=0; }
    hm+='<span class="cell" title="'+c.datum+' · '+AN_WT[wt]+(c.v==null?'':' · '+anFmt(c.v)+' P')+'" style="background:'+col(c.v)+'"></span>';
    gefuellt++;
  });
  if(offenSpalte){ while(gefuellt<7){ hm+=leer; gefuellt++; } hm+='</div>'; }   // letzte Spalte auffüllen UND schließen
  hm+='</div></div>';
  // Wochentagsprofil — F3.2: über alle Tage mit Aktivität (inkl. reiner Timer-Arbeit)
  let wtBars='';
  const aktivTage=cells.filter(c=>(c.v!=null&&c.v>0)||hatZeit(c.datum));
  if(aktivTage.length>=7){ const byWt=[[],[],[],[],[],[],[]];
    aktivTage.forEach(c=>byWt[anWochentag(c.datum)].push(c.v||0));
    const avgs=byWt.map(a=>anMean(a)||0); const mx=Math.max.apply(null,avgs.concat([1]));
    wtBars='<div class="an-bars" style="margin-top:10px">'+avgs.map((v,i)=>'<div class="an-bar"><span class="nm">'+AN_WT[i]+'</span><span class="track"><i style="width:'+(v/mx*100).toFixed(0)+'%;background:var(--purple)"></i></span><span class="vv">'+anFmt(v)+'</span></div>').join('')+'</div>';
  }
  const rE=anSum(F.cur.map(e=>e.routErledigt)), rV=anSum(F.cur.map(e=>e.routVerpasst));
  const quote=(rE+rV)>0?Math.round(rE/(rE+rV)*100):null;
  const kartenAktiv=cells.reduce((a,c)=>a+(ia[c.datum]?Object.keys(ia[c.datum].karten).length:0),0);
  let inner=hm+wtBars+'<div class="anmod-kpis">'+
    anKpi(quote==null?'—':quote+'%','Routinenquote')+
    anKpi(aktivTage.length+'/'+F.span,'Aktive Tage')+
    anKpi(kartenAktiv,'getrackte Karten')+'</div>'+
    (aktivTage.length<7?'<div class="anmod-sub" style="margin-top:8px">Wochentagsprofil ab 7 aktiven Tagen.</div>':'');
  return anModul('🔥','Konsistenz','Aktivitäts-Heatmap (alle getrackten Karten: Timer-Zeit, Ticks, Abhaken), Routinen-Erfüllung und (ab 7 aktiven Tagen) das Wochentagsprofil — wo liegen deine starken und schwachen Tage?',inner);
}
/* ── Modul 5 · Kalibrierung ────────────────────────────────────────── */
function anModKalibrierung(F,dom){
  let inner;
  // §2 (v1.7.0): Tagesziele existieren nur je Domäne, nicht je Kartenart —
  // Ist÷Soll ist mit Art-Filter strukturell nicht bildbar → Hinweis statt Leere.
  if(analyseArt()!=='alle'){
    return anModul('🎯','Kalibrierung','Ist ÷ Soll pro Tag (1,0 = Ziel exakt getroffen).',
      anLeer('Für einzelne Kartenarten gibt es kein eigenes Tagesziel — Kalibrierung ist nur unter „Alle" aussagekräftig.'));
  }
  if(F.cur.length<3){ inner=anSammelt(F.cur.length,3); }
  else{
    const labels=F.cur.map(e=>e.datum);
    // §2.3 (v1.12.0): WE-Tage werden zu EINEM Ereignis gebuendelt — die Kurve
    // zeigt je Tag die zugehoerige Quote (WE-Tage tragen die Paar-Quote).
    const ratio=F.cur.map(e=>{
      if(!istWochenendTag(e.datum)){ const z=anZiel(dom, e.datum); return z? anPunkte(e,dom)/z : null; }
      const q=zielQuoten([e].concat(F.cur.filter(x=>x!==e)), dom==='alle'?'alle':dom, x=>anPunkte(x,dom));
      return q.length?q[0]:null;
    });
    inner=anSvgLine(labels,[{vals:ratio,color:'var(--blue)'}],{yMin:0,yMax:Math.max(1.4,Math.max.apply(null,ratio.concat([1]))*1.1),height:132,hlines:[{y:1,color:'var(--ok)',dash:'4 3',label:'Ziel 1,0'}]});
    const cur=anMean(zielQuoten(F.cur, dom==='alle'?'alle':dom, e=>anPunkte(e,dom)));
    const prev=anMean(zielQuoten(F.prev, dom==='alle'?'alle':dom, e=>anPunkte(e,dom)));
    const treffer=ratio.filter(r=> r!=null && r>=0.8 && r<=1.2).length;
    inner+='<div class="anmod-kpis">'+
      anKpi(cur!=null?(Math.round(cur*100)/100):'—','Ø Ist÷Soll',anDeltaPct(cur,prev))+
      anKpi(treffer+'/'+F.cur.length,'Tage ±20%')+'</div>';
  }
  return anModul('🎯','Kalibrierung','Ist ÷ Soll pro Tag (1,0 = Ziel exakt getroffen). Dauerhaft ≫1 = Ziele zu niedrig, ≪1 = zu hoch gesteckt.',inner);
}
/* ── Modul 6 · Verhalten ───────────────────────────────────────────── */
/* V1: Aktivitätsfenster-Bausteine. Punkte je Stunde (0–23) + leichte Glättung. */
function anStundenBuckets(entries){ const b=new Array(24).fill(0); entries.forEach(x=>{ const h=new Date(x.ts).getHours(); b[h]+=num(x.punkte); }); return b; }
function anGlaett(arr){ return arr.map((v,i)=>{ const a=i>0?arr[i-1]:arr[i], c=i<arr.length-1?arr[i+1]:arr[i]; return 0.25*a+0.5*v+0.25*c; }); }
/* Uhrzeit-Diagramm 0–24 h mit mehreren geglätteten Kurven (V1). */
function anSvgFenster(series){
  const W=320,H=142,pL=26,pR=10,pT=10,pB=20;
  let yMax=0; series.forEach(s=>s.vals.forEach(v=>{ if(v>yMax) yMax=v; })); if(yMax<=0) yMax=1; yMax*=1.12;
  const xAt=h=>pL+h/24*(W-pL-pR), yAt=v=>pT+(1-v/yMax)*(H-pT-pB);
  let g='';
  [0,6,12,18,24].forEach(h=>{ const x=xAt(h).toFixed(1);
    g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--line)" stroke-width="0.5" opacity=".5"/>'+
       '<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="var(--mut2)">'+h+'</text>'; });
  g+='<text x="'+(pL-3)+'" y="'+(yAt(yMax)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+anFmt(yMax)+'</text>';
  series.forEach(s=>{ let d=''; s.vals.forEach((v,i)=>{ if(v==null) return; d+=(d?'L':'M')+xAt(i).toFixed(1)+' '+yAt(v).toFixed(1)+' '; });
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2)+'"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    // §1 (v1.8.1): dezenter Endpunkt — markiert, wo eine gekürzte Kurve endet
    if(s.endDot){ const li=s.vals.reduce((a,v,i)=>v!=null?i:a,-1);
      if(li>=0) g+='<circle cx="'+xAt(li).toFixed(1)+'" cy="'+yAt(s.vals[li]).toFixed(1)+'" r="3" fill="'+s.color+'"/>'; } });
  return '<svg class="an-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>';
}
function anModVerhalten(F,dom){
  // ── Aktivitätsfenster (Kopf des Moduls): Punkte je Stunde, 3 Kurven ──
  // §2 (v1.7.0): Kartenart-Filter auch hier — Buchungen über die Karte auflösen.
  const kById={}; S.karten.forEach(k=>kById[k.id]=k);
  const ent=(S.intraday||[]).filter(x=>x.ts && num(x.punkte)>0 && (dom==='alle'||x.domaene===dom)
    && (analyseArt()==='alle' || (kById[x.kartenId] && anArtOk(kById[x.kartenId]))));
  let chart;
  if(ent.length<8){
    chart='<div class="an-leer">Aktivitätsfenster: sammelt noch Intraday-Daten ('+ent.length+'/8 Buchungen). Jede Timer-/Tick-/Abhak-Buchung zählt.</div>';
  } else {
    const byDay={}; ent.forEach(x=>{ const d=x.ts.slice(0,10); (byDay[d]=byDay[d]||[]).push(x); });
    const tage=Object.keys(byDay).sort(), heute=heuteApp();
    const profil=keys=>{ if(!keys.length) return null; const acc=new Array(24).fill(0);
      keys.forEach(d=>{ const b=anStundenBuckets(byDay[d]); for(let h=0;h<24;h++) acc[h]+=b[h]; });
      return anGlaett(acc.map(v=>v/keys.length)); };
    const series=[]; const overall=profil(tage); if(overall) series.push({vals:overall,color:'var(--purple)',width:2});
    const hat14plus = tage.some(d=>d<anVorTage(heute,13));
    const g14 = tage.filter(d=>d>=anVorTage(heute,13));
    if(hat14plus && g14.length){ const p14=profil(g14); if(p14) series.push({vals:p14,color:'var(--warn)',width:2,dash:'5 3'}); }
    const heuteHat=!!byDay[heute];
    if(heuteHat){
      // §1 (v1.8.1): Die Heute-Kurve endet an der AKTUELLEN Stunde — die Null-
      // werte dahinter sahen wie ein Einbruch aus. Die Ø-Kurven laufen als
      // Vergleichsmaßstab weiter über die volle Achse; ein Punkt markiert das Ende.
      const jetztH=new Date().getHours();
      const voll=anGlaett(anStundenBuckets(byDay[heute]));
      const bisJetzt=voll.map((v,i)=> i<=jetztH ? v : null);
      series.push({vals:bisJetzt,color:'var(--cyan)',width:2.4,endDot:true});
    }
    chart=anSvgFenster(series)+
      '<div class="an-legend">'+
        (heuteHat?'<span><i style="background:var(--cyan)"></i>Heute</span>':'<span style="color:var(--mut2)">Heute: noch keine Buchung</span>')+
        '<span><i style="background:var(--purple)"></i>Ø Overall</span>'+
        (hat14plus?'<span><i style="background:var(--warn)"></i>Ø 14 Tage</span>':'<span style="color:var(--mut2)">Ø 14 Tage: sammelt noch (≈ Overall)</span>')+
      '</div>';
  }
  // ── Kennzahlen als kompakte Zeile darunter ──
  const schub=anSum(F.cur.map(e=>e.schub)), erl=anSum(F.cur.map(e=>e.erledigt));
  const schiebeQuote=(schub+erl)>0?Math.round(schub/(schub+erl)*100):null;
  const pSchub=anSum(F.prev.map(e=>e.schub)), pErl=anSum(F.prev.map(e=>e.erledigt));
  const pSchiebe=(pSchub+pErl)>0?pSchub/(pSchub+pErl)*100:null;
  // §6.2 (v1.7.0): „Überfällig jetzt" zählte als einzige Kennzahl des Moduls
  // ALLE Karten mit Fälligkeit — jetzt an den Kartenart-Filter gekoppelt.
  const offen=S.karten.filter(k=>k.status==='offen' && (dom==='alle'||k.domain===dom) && k.faelligkeit && anArtOk(k));
  const ueber=offen.filter(k=>k.faelligkeit<heuteApp()).length;
  const ueberQ=offen.length?Math.round(ueber/offen.length*100):null;
  const stH=anMean(F.cur.filter(e=>e.startTs).map(e=>{ const d=new Date(e.startTs); return d.getHours()+d.getMinutes()/60; }));
  const enH=anMean(F.cur.filter(e=>e.endeTs).map(e=>{ const d=new Date(e.endeTs); return d.getHours()+d.getMinutes()/60; }));
  const kpiRow='<div class="anmod-kpis" style="margin-top:10px">'+
    anKpi(schiebeQuote==null?'—':schiebeQuote+'%','Schiebe-Quote',anDeltaPct(schiebeQuote,pSchiebe),'',true)+
    anKpi(ueberQ==null?'—':ueberQ+'%','Überfällig jetzt')+
    anKpi(anFmtUhr(stH),'Ø Start')+
    anKpi(anFmtUhr(enH),'Ø Ende')+'</div>';
  return anModul('🧭','Verhalten','Aktivitätsfenster über den Tag (Punkte je Stunde, geglättet): wann liegen deine produktiven Phasen — und verschieben sie sich über die Zeit (14-Tage- ggü. Overall-Kurve)? Kennzahlen darunter.',chart+kpiRow);
}

/* ── View / Filter / Wiring ────────────────────────────────────────── */
/* ── V3 · Modul „📥📤 Aufgaben-Flow" ──────────────────────────────────
   Zu-/Abgang von Aufgaben: reingekommen (erstelltTs) vs. erledigt (tagId).
   Datenbasis rein aus S.karten; „sammelt noch" bei zu wenig Ereignissen. */
/* H3: Flow je Tag — created (erstelltTs), done (tagId), geschoben (schub-Events)
   und getrackt-offen (getrackt, aber an dem Tag nicht abgeschlossen). */
/* §3.2 (v1.13.0): DIE Bilanz-Kategorien — rein · raus · geschoben.
   REIN = neu angelegt (erstelltTs, Baseline-Karten ausgenommen) + Folgeaufgabe
   (sie IST eine Neuanlage; die Vorgängerin zählt über ihr Abhaken als raus)
   + Wiedereröffnung (typ wiederoffen) + Schub-ANKUNFT am Zieltag (e.ziel).
   RAUS = Abhak-Ereignisse (typ abhaken) — eine wiedereröffnete Karte hebt ihr
   altes raus über das neue rein auf. GESCHOBEN = eigene Kategorie am
   Ausgangstag, KEIN Abgang. §3.4: Aufbautage (meta.flowfix181Log) gelten als
   ausbalanciert. */
function anFlowReihe(dom){
  const ok=k=>dom==='alle'||k.domain===dom, byId={};
  S.karten.forEach(k=>byId[k.id]=k);
  const created={}, done={}, geschoben={}, ankunft={}, wieder={}, abhaken={}, trackedBy={};
  // (v1.13.1, Harness-Diagnosefund): Tageszuordnung über das TAGESFENSTER
  // (belFensterDatum: lokal + 5-Uhr-Grenze) statt rohem UTC-slice — sonst
  // landen Buchungen nach Mitternacht/UTC-Kante im falschen Rein/Raus-Tag.
  S.karten.forEach(k=>{ if(kartenArt(k)!=='Aufgabe'||!ok(k)) return;
    // F2: als Bestandsaufnahme markierte Karten sind KEIN Tageszugang (sie gehen
    // über anFlowStartBestand in den Anfangsbestand des Netto-Backlogs ein).
    if(k.erstelltTs && !k.flowBaseline){ const d=belFensterDatum(k.erstelltTs); created[d]=(created[d]||0)+1; }
    if(k.status==='erledigt' && k.tagId && !k.flowDoneBaseline){ const d=String(k.tagId).slice(0,10); done[d]=(done[d]||0)+1; }   // §3 (1.8.1): tagId ist bereits der App-Tag
  });
  (S.intraday||[]).forEach(e=>{ if(!e.ts) return; const k=byId[e.kartenId]; if(!k||kartenArt(k)!=='Aufgabe'||!ok(k)) return;
    const d=belFensterDatum(e.ts);
    if(e.typ==='schub'){ geschoben[d]=(geschoben[d]||0)+1;
      if(e.ziel) ankunft[e.ziel]=(ankunft[e.ziel]||0)+1;
      return; }
    if(e.typ==='wiederoffen'){ wieder[d]=(wieder[d]||0)+1; return; }
    if(e.typ==='abhaken' && !k.flowDoneBaseline){ abhaken[d]=(abhaken[d]||0)+1; }
    if(num(e.minuten)>0){ (trackedBy[d]=trackedBy[d]||{})[e.kartenId]=1; }
  });
  const trackedOpen={};   // getrackt am Tag, aber nicht an dem Tag abgeschlossen
  Object.keys(trackedBy).forEach(d=>{ let n=0; Object.keys(trackedBy[d]).forEach(id=>{ const k=byId[id]; if(k && String(k.tagId||'').slice(0,10)!==d) n++; }); trackedOpen[d]=n; });
  // §3.4: Aufbautage aus der 1.8.1-Glättung — bereits erfasst, nichts neu bestimmen
  const aufbau={}; (((S.meta||{}).flowfix181Log||{}).tage||[]).forEach(t=>{ if(t&&t.datum) aufbau[t.datum]=true; });
  return {created, done, geschoben, ankunft, wieder, abhaken, trackedOpen, aufbau};
}
/* §3.2: Tageswerte der drei Kategorien (rein/raus/geschoben) für ein Datum. */
function reinRausTag(fl, d){
  return { rein:(fl.created[d]||0)+(fl.wieder[d]||0)+(fl.ankunft[d]||0),
           raus:(fl.abhaken[d]||0), geschoben:(fl.geschoben[d]||0), aufbau:!!fl.aufbau[d] };
}
/* F2.3 (v1.3.3): Bestands-Balken unter dem Flow-Diagramm. 100 % = alle Aufgaben
   des Betrachtungsrahmens (aktuell offen + im Fenster erledigt). Grün = erledigt,
   offene nach Priorität in der App-Farbskala — identisch zum Stapel-Segmentbalken
   (muss #f66d6d · soll #f2b84b · kann/„idee" #b98af7). */
function anFlowBestandsBalken(F,dom){
  const ok=k=>dom==='alle'||k.domain===dom;
  const c={erl:0,muss:0,soll:0,kann:0};
  S.karten.forEach(k=>{
    if(kartenArt(k)!=='Aufgabe' || !ok(k) || k.status==='archiviert') return;
    if(k.status==='erledigt'){
      const t=k.tagId?String(k.tagId).slice(0,10):null;
      if(t && t>=F.von && t<=F.bis) c.erl++;                 // nur im Fenster erledigt
      return;
    }
    const pr=k.prioritaet;
    if(pr==='muss') c.muss++; else if(pr==='idee') c.kann++; else c.soll++;
  });
  const tot=c.erl+c.muss+c.soll+c.kann;
  if(!tot) return '';
  const seg=[['erl','#3ecf8e','erledigt'],['muss','#f66d6d','offen muss'],['soll','#f2b84b','offen soll'],['kann','#b98af7','offen kann']];
  let bar=''; seg.forEach(s=>{ const n=c[s[0]]; if(!n) return; const pct=n/tot*100;
    bar+='<i style="width:'+pct.toFixed(1)+'%;background:'+s[1]+'" title="'+s[2]+': '+n+'">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; });
  return '<div class="anmod-sub" style="margin-top:12px">Aufgaben-Bestand ('+tot+' gesamt · grün = erledigt, offen nach Priorität):</div>'+
    '<div class="stbar">'+bar+'</div>'+
    '<div class="stbar-leg">'+seg.filter(s=>c[s[0]]).map(s=>'<span><i style="background:'+s[1]+'"></i>'+s[2]+' '+c[s[0]]+'</span>').join('')+'</div>';
}
/* F2 (v1.3.3): realer Anfangsbestand des Netto-Backlogs zum Fensterstart —
   Aufgaben, die vor dem Fenster existierten (oder als Bestandsaufnahme markiert
   sind) und zu Fensterbeginn noch offen waren. Ersetzt den alten Nullstart, der
   den Baseline-Zugang außerhalb des Fensters ignorierte und ins Minus lief. */
function anFlowStartBestand(dom, von){
  const ok=k=>dom==='alle'||k.domain===dom; let n=0;
  S.karten.forEach(k=>{
    if(kartenArt(k)!=='Aufgabe' || !ok(k) || k.status==='archiviert') return;
    const erst=k.erstelltTs?String(k.erstelltTs).slice(0,10):null;
    const vorher = k.flowBaseline || (erst && erst<von);      // existierte schon vor dem Fenster
    if(!vorher) return;
    const erlTag = (k.status==='erledigt' && k.tagId) ? String(k.tagId).slice(0,10) : null;
    if(erlTag && erlTag<von) return;                          // war zu Fensterbeginn bereits erledigt
    n++;
  });
  return n;
}
/* H3: Netto-Backlog-SVG mit 0-Anker (0 immer Rand je Vorzeichen) + ≥10 Puffer.
   S4 (v1.3.2): deutliche durchgezogene 0-Linie + blasse Rot-/Grünzone unter/über 0. */
function anSvgBacklog(labels, vals){
  const W=320,H=110,pL=26,pR=8,pT=10,pB=18;
  let mn=Math.min.apply(null,[0].concat(vals)), mx=Math.max.apply(null,[0].concat(vals));
  if(mx>0) mx+=10; if(mn<0) mn-=10; if(mx-mn<10) mx=mn+10;
  const range=(mx-mn)||1, n=labels.length;
  const xAt=i=>pL+(n<2?(W-pL-pR)/2:i/(n-1)*(W-pL-pR)), yAt=v=>pT+(1-(v-mn)/range)*(H-pT-pB);
  const y0=yAt(0);
  let g='<rect x="'+pL+'" y="'+pT+'" width="'+(W-pL-pR)+'" height="'+Math.max(0,y0-pT).toFixed(1)+'" fill="rgba(62,207,142,.09)"/>'+
    '<rect x="'+pL+'" y="'+y0.toFixed(1)+'" width="'+(W-pL-pR)+'" height="'+Math.max(0,(H-pB)-y0).toFixed(1)+'" fill="rgba(246,109,109,.09)"/>'+
    '<line x1="'+pL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y0.toFixed(1)+'" stroke="var(--txt)" stroke-width="1.3"/>'+
    '<text x="'+(pL-3)+'" y="'+(y0+3).toFixed(1)+'" text-anchor="end" font-size="8" font-weight="700" fill="var(--txt)">0</text>'+
    '<text x="'+(pL-3)+'" y="'+(yAt(mx)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+Math.round(mx)+'</text>'+
    (mn<0?'<text x="'+(pL-3)+'" y="'+(yAt(mn)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+Math.round(mn)+'</text>':'');
  let d=''; vals.forEach((v,i)=>{ d+=(i?'L':'M')+xAt(i).toFixed(1)+' '+yAt(v).toFixed(1)+' '; });
  g+='<path d="'+d+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  g+='<text x="'+xAt(0).toFixed(1)+'" y="'+(H-4)+'" font-size="8" fill="var(--mut2)">'+anKurzDatum(labels[0])+'</text>';
  if(n>1) g+='<text x="'+xAt(n-1).toFixed(1)+'" y="'+(H-4)+'" text-anchor="end" font-size="8" fill="var(--mut2)">'+anKurzDatum(labels[n-1])+'</text>';
  return '<svg class="an-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>';
}
function anModAufgabenFlow(F,dom){
  const fl=anFlowReihe(dom), ok=k=>dom==='alle'||k.domain===dom;
  const days=[]; let d=F.von, guard=0; while(d<=F.bis && guard++<400){ days.push(d); d=anVorTage(d,-1); }
  // §3.2 (v1.13.0): DREI Kategorien — rein (neu + Folge + Wiedereröffnung +
  // Schub-Ankunft am Zieltag) · raus (Abhak-Ereignisse) · geschoben (eigene
  // Kategorie am Ausgangstag, kein Abgang). Die H3-Übernahme-Semantik
  // (getrackt-offen wandert als rein/raus) ist damit abgelöst.
  const gesch=days.map(x=>fl.geschoben[x]||0);
  const rArr=days.map(x=>reinRausTag(fl,x).rein);
  const eArr=days.map(x=>reinRausTag(fl,x).raus);
  const sumR=anSum(rArr), sumE=anSum(eArr), sumG=anSum(gesch);
  if(sumR+sumE+sumG<3) return anModul('📥📤','Aufgaben-Flow','Zu- und Abgang von Aufgaben — Trend, Balance, Alter, Deadline-Treue.', anSammelt(F.cur.length,3));
  // Trend rein / raus / geschoben
  let inner=anSvgLine(days,[{vals:rArr,color:'var(--warn)'},{vals:eArr,color:'var(--ok)'},{vals:gesch,color:'#f08c4b',dots:false,dash:'3 2'}],{y0:true,height:118});
  inner+='<div class="an-legend"><span><i style="background:var(--warn)"></i>rein</span><span><i style="background:var(--ok)"></i>raus</span><span><i style="background:#f08c4b"></i>geschoben (Marke)</span></div>';
  // F2.3 (v1.3.3): Bestands-Balken — 100 % = alle Aufgaben des Betrachtungsrahmens
  // (offen + im Fenster erledigt). Grün = erledigt, offene nach Priorität in der
  // App-Farbskala (muss rot · soll gelb · kann/„idee" lila, wie im Stapel-Balken).
  inner+=anFlowBestandsBalken(F,dom);
  // Netto-Backlog: Startbestand (F2) + echte Zugänge (neu + wiedereröffnet)
  // − Abhaken. Schub-Ankünfte zählen NICHT (die Karte existierte schon),
  // geschoben ist kein Abgang (§3.2).
  const start=anFlowStartBestand(dom, F.von);
  let cum=start; const backlog=days.map((x,i)=>{ cum+=((fl.created[x]||0)+(fl.wieder[x]||0))-eArr[i]; return cum; });
  inner+='<div class="anmod-sub" style="margin-top:10px">Netto-Backlog (Startbestand '+start+' + neu/wiedereröffnet − raus; geschoben neutral):</div>'+anSvgBacklog(days, backlog)+
    // §1.4 (v1.13.0): auch die Zonen-Färbung ist benannt
    '<div class="an-legend"><span><i style="background:var(--blue)"></i>Backlog</span><span><i style="background:rgba(62,207,142,.5)"></i>Zone über 0 (normaler Bestand)</span><span><i style="background:rgba(246,109,109,.5)"></i>Zone unter 0 (rechnerisches Minus)</span></div>';
  // Durchsatz & Balance (mit Vorperioden-Δ; H4.2: nur Tage mit Aktivität im Ø)
  const span=F.span, pDays=[]; for(let i=span;i>=1;i--) pDays.push(anVorTage(F.von,i));
  const prR=pDays.map(x=>reinRausTag(fl,x).rein), prE=pDays.map(x=>reinRausTag(fl,x).raus);
  const aktiv=days.filter((x,i)=>rArr[i]+eArr[i]+gesch[i]>0).length || 1;
  const pAktiv=pDays.filter((x,i)=>prR[i]+prE[i]>0).length || 1;
  const avgR=sumR/aktiv, avgE=sumE/aktiv;
  const pAvgR=anSum(prR)/pAktiv, pAvgE=anSum(prE)/pAktiv;
  const ratio=sumR>0?Math.round(sumE/sumR*100):null;
  const pRatio=(anSum(prR)>0)?anSum(prE)/anSum(prR)*100:null;
  // §4 (v1.7.0): Rohzahlen zusätzlich zur Completion-Quote ausweisen
  inner+='<div class="anmod-kpis">'+
    anKpi(sumR,'reingekommen '+span+'T','',null,true)+
    anKpi(sumE,'erledigt '+span+'T')+
    anKpi(Math.round(avgR*10)/10,'Ø rein/aktiver Tag',anDeltaPct(avgR,pAvgR),'',true)+
    anKpi(Math.round(avgE*10)/10,'Ø erledigt/Tag',anDeltaPct(avgE,pAvgE))+'</div>'+
  '<div class="anmod-kpis" style="margin-top:8px">'+
    anKpi((sumG>0?sumG:'0'),'geschoben '+span+'T','',null,true)+
    anKpi(ratio==null?'—':ratio+'%','Completion',anDeltaPct(ratio,pRatio))+'</div>';
  // Wochentagsprofil
  const wtR=[0,0,0,0,0,0,0], wtE=[0,0,0,0,0,0,0];
  days.forEach((x,i)=>{ const w=anWochentag(x); wtR[w]+=rArr[i]; wtE[w]+=eArr[i]; });
  const mx=Math.max(1,Math.max.apply(null,wtR.concat(wtE)));
  inner+='<div class="anmod-sub" style="margin-top:12px">Wochentagsprofil (Balken = rein, Zahl = rein/erledigt):</div><div class="an-bars">'+
    AN_WT.map((n,i)=>'<div class="an-bar"><span class="nm">'+n+'</span><span class="track"><i style="width:'+(wtR[i]/mx*100).toFixed(0)+'%;background:var(--warn)"></i></span><span class="vv">'+wtR[i]+'/'+wtE[i]+'</span></div>').join('')+'</div>';
  // Alters-/Liegezeit
  const heute=heuteApp();
  const offen=S.karten.filter(k=>kartenArt(k)==='Aufgabe'&&ok(k)&&k.status==='offen'&&k.erstelltTs);
  const alter=offen.map(k=>Math.max(0,anTageDiff(k.erstelltTs.slice(0,10),heute)));
  const avgAlter=alter.length?Math.round(anMean(alter)):null;
  let aeltest=null,aeltestT=-1; offen.forEach(k=>{ const t=anTageDiff(k.erstelltTs.slice(0,10),heute); if(t>aeltestT){aeltestT=t;aeltest=k;} });
  const erledigt=S.karten.filter(k=>kartenArt(k)==='Aufgabe'&&ok(k)&&k.status==='erledigt'&&k.erstelltTs&&k.tagId);
  const durch=erledigt.map(k=>Math.max(0,anTageDiff(k.erstelltTs.slice(0,10),String(k.tagId).slice(0,10))));
  const avgDurch=durch.length?Math.round(anMean(durch)*10)/10:null;
  inner+='<div class="anmod-kpis" style="margin-top:12px">'+
    anKpi(avgAlter==null?'—':avgAlter+'d','Ø Alter offen',null,'',true)+
    anKpi(offen.length,'offen')+
    anKpi(avgDurch==null?'—':avgDurch+'d','Ø Durchlaufzeit',null,'',true)+'</div>';
  if(aeltest) inner+='<div class="anmod-sub">Älteste offene: „'+esc(aeltest.titel||'(ohne Titel)')+'" · '+aeltestT+' Tage.</div>';
  // Deadline-Treue + Bestleistungen
  const mitDl=erledigt.filter(k=>k.faelligkeit);
  const puenkt=mitDl.filter(k=>String(k.tagId).slice(0,10)<=k.faelligkeit).length;
  const dlQuote=mitDl.length?Math.round(puenkt/mitDl.length*100):null;
  const bestErl=Math.max(0,Math.max.apply(null,eArr));
  let serie=0,maxSerie=0; days.forEach((x,i)=>{ if((eArr[i]>0||rArr[i]>0)&&eArr[i]>=rArr[i]){ serie++; if(serie>maxSerie)maxSerie=serie; } else serie=0; });
  inner+='<div class="anmod-kpis" style="margin-top:12px">'+
    anKpi(dlQuote==null?'—':dlQuote+'%','pünktlich erledigt')+
    anKpi(bestErl,'bester Erledigt-Tag')+
    anKpi(maxSerie+'T','längste Positiv-Serie')+'</div>';
  return anModul('📥📤','Aufgaben-Flow','Zu- und Abgang von Aufgaben: Trend & Netto-Backlog, Durchsatz/Balance, Wochentage, Alter/Durchlaufzeit, Deadline-Treue und Rekorde. Reingekommen = Erstellzeit, erledigt = Buchungstag.',inner);
}

/* ══ §3 (v1.7.0) · Modul „🔁 Routinen-Flow" — Gegenstück zum Aufgaben-Flow ══
   Für Routinen heißt „reingekommen" FÄLLIG GEWORDEN, „erledigt" GETICKT.
   Datenquellen: routinenBilanz der Historie (verpasst/entschuldigt beim
   Tagesabschluss), das Punkt-Log (erfüllte Routinen je Tag+Domäne, via
   analyseRohTage bereits als routErf/routVerp/routEnt aggregiert) und für den
   laufenden Tag routineFaellig() live. Entschuldigte Tage werden getrennt
   ausgewiesen und zählen NICHT als erfüllt. */
function anModRoutinenFlow(F,dom){
  const dsum=o=> dom==='alle' ? num(o&&o.dfm)+num(o&&o.privat) : num(o&&o[dom]);
  const heute=heuteApp();
  const days=[]; let d=F.von, guard=0; while(d<=F.bis && guard++<400){ days.push(d); d=anVorTage(d,-1); }
  const byDay={}; F.cur.forEach(e=>byDay[e.datum]=e);
  const erf=days.map(x=>{ const e=byDay[x]; return e?dsum(e.routErf):0; });
  const verp=days.map(x=>{ const e=byDay[x]; return e?dsum(e.routVerp):0; });
  const ent=days.map(x=>{ const e=byDay[x]; return e?dsum(e.routEnt):0; });
  const ges=days.map(x=>{ const e=byDay[x]; return e?dsum(e.routGes):0; });   // §3.1 (v1.13.0): geschoben
  // fällig = erfüllt + verpasst + entschuldigt + geschoben; für HEUTE (Tag noch
  // offen, Bilanz leer) zusätzlich die jetzt noch offenen fälligen Routinen.
  const faellig=days.map((x,i)=>{
    let f=erf[i]+verp[i]+ent[i]+ges[i];
    if(x===heute && tagOffen()){
      f+=S.karten.filter(k=>k.rhythmus && k.status==='offen' && (dom==='alle'||k.domain===dom) && routineFaellig(k,heute)).length;
    }
    return f;
  });
  const sumF=anSum(faellig), sumE=anSum(erf), sumV=anSum(verp), sumEnt=anSum(ent), sumGes=anSum(ges);
  if(sumF<3) return anModul('🔁','Routinen-Flow','Fällig vs. erfüllt vs. verpasst — Quote, Wochentage, Streaks, Ausreißer.', anSammelt(F.cur.length,3));
  // Trendkurve je Tag: fällig · erfüllt · verpasst · entschuldigt · geschoben
  let inner=anSvgLine(days,[
    {vals:faellig,color:'var(--warn)'},
    {vals:erf,color:'var(--ok)'},
    {vals:verp,color:'var(--bad)',dots:false,dash:'3 2'},
    {vals:ent,color:'var(--cyan)',dots:false,dash:'2 4'},
    {vals:ges,color:'#f08c4b',dots:false,dash:'1 3'}
  ],{y0:true,height:118});
  inner+='<div class="an-legend"><span><i style="background:var(--warn)"></i>fällig</span><span><i style="background:var(--ok)"></i>erfüllt</span><span><i style="background:var(--bad)"></i>verpasst</span><span><i style="background:var(--cyan)"></i>entschuldigt</span><span><i style="background:#f08c4b"></i>geschoben</span></div>';
  // Erfüllungsquote (entschuldigte raus — wie die bestehende Routinenquote) + Vorperiode
  const quote=(sumE+sumV)>0?Math.round(sumE/(sumE+sumV)*100):null;
  const pE=anSum(F.prev.map(e=>dsum(e.routErf))), pV=anSum(F.prev.map(e=>dsum(e.routVerp)));
  const pQuote=(pE+pV)>0?pE/(pE+pV)*100:null;
  // Wochentagsprofil fällig/erfüllt (Balken = fällig, Zahl = fällig/erfüllt)
  const wtF=[0,0,0,0,0,0,0], wtE=[0,0,0,0,0,0,0];
  days.forEach((x,i)=>{ const w=anWochentag(x); wtF[w]+=faellig[i]; wtE[w]+=erf[i]; });
  const mx=Math.max(1,Math.max.apply(null,wtF));
  inner+='<div class="anmod-sub" style="margin-top:12px">Wochentagsprofil (Balken = fällig, Zahl = fällig/erfüllt):</div><div class="an-bars">'+
    AN_WT.map((n,i)=>'<div class="an-bar"><span class="nm">'+n+'</span><span class="track"><i style="width:'+(wtF[i]/mx*100).toFixed(0)+'%;background:var(--warn)"></i></span><span class="vv">'+wtF[i]+'/'+wtE[i]+'</span></div>').join('')+'</div>';
  // Streak-Übersicht: aktuelle Serie = App-Wert; längste Serie über die gesamte
  // verfügbare Historie rekonstruiert (nie persistiert; entschuldigt bricht nicht).
  const routinen=S.karten.filter(k=>k.rhythmus && k.status!=='archiviert' && (dom==='alle'||k.domain===dom));
  const hist=(S.historie||[]).filter(h=>!h.luecke).slice().sort((a,b)=>a.datum<b.datum?-1:1);
  const laengste={};
  routinen.forEach(k=>{ let run=0, best=0;
    hist.forEach(h=>{
      const erfDa=(h.log||[]).some(l=>l.itemId===k.id && l.art==='Routine' && num(l.punkte)>0);
      const bil=(h.routinenBilanz||[]).find(r=>r.id===k.id);
      if(erfDa){ run++; if(run>best) best=run; }
      else if(bil && bil.verpasst){ run=0; }
    });
    laengste[k.id]=Math.max(best, num(k.streak));
  });
  const topStreak=routinen.slice().sort((a,b)=>num(b.streak)-num(a.streak)).slice(0,8);
  if(topStreak.length){
    inner+='<div class="anmod-sub" style="margin-top:12px">Streaks (aktuell · längste):</div><div class="an-bars">'+
      topStreak.map(k=>{ const l=Math.max(1,laengste[k.id]);
        return '<div class="an-bar"><span class="nm" style="width:auto;min-width:34%;text-align:left">'+esc(k.titel||'?')+'</span>'+
          '<span class="track"><i style="width:'+Math.min(100,num(k.streak)/l*100).toFixed(0)+'%;background:var(--ok)"></i></span>'+
          '<span class="vv">🔥'+num(k.streak)+' · '+laengste[k.id]+'</span></div>'; }).join('')+'</div>';
  }
  // Ausreißer: schlechteste Quote im Zeitraum (mind. 3 fällige Ereignisse)
  const proRoutine={};
  routinen.forEach(k=>proRoutine[k.id]={erf:0,verp:0});
  hist.concat(tagOffen()&&S.tag?[{datum:S.tag.datum,log:S.tag.log||[],routinenBilanz:S.tag.routinenBilanz||[]}]:[]).forEach(h=>{
    if(h.datum<F.von || h.datum>F.bis) return;
    (h.log||[]).forEach(l=>{ if(l.art==='Routine' && num(l.punkte)>0 && proRoutine[l.itemId]) proRoutine[l.itemId].erf++; });
    (h.routinenBilanz||[]).forEach(r=>{ if(r.verpasst && proRoutine[r.id]) proRoutine[r.id].verp++; });
  });
  const ausreisser=routinen
    .map(k=>{ const s=proRoutine[k.id], n=s.erf+s.verp; return {k, n, q:n?s.erf/n:null, verp:s.verp}; })
    .filter(x=>x.n>=3 && x.q!=null).sort((a,b)=>a.q-b.q).slice(0,4);
  if(ausreisser.length){
    inner+='<div class="anmod-sub" style="margin-top:12px">Ausreißer (schlechteste Quote — Kandidaten zum Streichen oder Umbauen):</div><div class="an-bars">'+
      ausreisser.map(x=>'<div class="an-bar"><span class="nm" style="width:auto;min-width:34%;text-align:left">'+esc(x.k.titel||'?')+'</span>'+
        '<span class="track"><i style="width:'+Math.round(x.q*100)+'%;background:var(--bad)"></i></span>'+
        '<span class="vv">'+Math.round(x.q*100)+'% · '+x.verp+'× verpasst</span></div>').join('')+'</div>';
  }
  // Kennzahlen
  const aktiv=days.filter((x,i)=>faellig[i]>0).length||1;
  const besteSerie=Math.max.apply(null,[0].concat(Object.keys(laengste).map(id=>laengste[id])));
  inner+='<div class="anmod-kpis" style="margin-top:12px">'+
    anKpi(Math.round(sumF/aktiv*10)/10,'Ø fällig/Tag')+
    anKpi(Math.round(sumE/aktiv*10)/10,'Ø erfüllt/Tag')+
    anKpi(quote==null?'—':quote+'%','Quote',anDeltaPct(quote,pQuote))+
    anKpi(besteSerie+'T','längste Serie')+'</div>';
  if(sumEnt>0) inner+='<div class="anmod-sub" style="margin-top:8px">'+sumEnt+' entschuldigte Routinentage im Zeitraum — sie zählen weder als erfüllt noch gegen die Quote.</div>';
  if(sumGes>0) inner+='<div class="anmod-sub" style="margin-top:4px">'+sumGes+' geschobene Routinentage (§3.1) — kein Abgang, am Zieltag wieder fällig.</div>';
  return anModul('🔁','Routinen-Flow','Fällig geworden vs. erfüllt vs. verpasst — die Routinenquote als Zeitreihe, Wochentagsprofil, Streaks und die Routinen mit der schlechtesten Quote.',inner);
}

function anZeitraumPresets(){ return [['7','7 T'],['14','14 T'],['30','30 T'],['90','90 T'],['frei','frei']]; }
function renderAnFilter(){
  const zr=S.ui.analyseZeitraum||'7', dm=S.ui.analyseDomain||'alle';
  let h='<div class="an-frow">'+anZeitraumPresets().map(p=>'<button class="seg'+(zr===p[0]?' on':'')+'" data-anzr="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>';
  if(zr==='frei'){ const bis=S.ui.analyseBis||heuteApp(), von=S.ui.analyseVon||anVorTage(bis,6);
    h+='<div class="an-frow"><span class="an-lbl">von</span><input type="date" id="anVon" value="'+von+'" max="'+heuteIso()+'"><span class="an-lbl">bis</span><input type="date" id="anBis" value="'+bis+'" max="'+heuteIso()+'"></div>'; }
  h+='<div class="an-frow">'+[['alle','Alle'],['dfm','DFM'],['privat','Privat']].map(d=>'<button class="seg dom'+(dm===d[0]?' on':'')+'" data-andom="'+d[0]+'">'+d[1]+'</button>').join('')+'</div>';
  // §2 (v1.7.0): dritte Filterzeile — Kartenart, wirkt auf alle Module
  const art=analyseArt();
  h+='<div class="an-frow">'+AN_ARTEN.map(a=>'<button class="seg art'+(art===a[0]?' on':'')+'" data-anart="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
  el('anFilter').innerHTML=h;
}
function renderAnalyseBody(){
  const F=analyseFenster(), dom=S.ui.analyseDomain||'alle', art=analyseArt();
  const von=F.von, bis=F.bis;
  // §2: Kopfzeile nennt die aktive Art zusätzlich zu Zeitraum und Domäne
  let h='<div class="anmod-sub" style="margin:0 2px 12px">Zeitraum '+anKurzDatum(von)+'–'+anKurzDatum(bis)+' · '+F.cur.length+' Tage mit Daten · Domäne '+(dom==='alle'?'Alle':dom==='dfm'?'DFM':'Privat')+' · Art '+analyseArtLabel()+' · Δ% ggü. Vorperiode'+(F.urlaubCur?' · <span style="color:var(--cyan)">'+F.urlaubCur+' Urlaubstag(e) 🏖 ausgenommen</span>':'')+'.</div>';
  if(art!=='alle') h+='<div class="anmod-sub" style="margin:-6px 2px 12px;color:var(--mut2)">Kartenart-Filter aktiv: Punkte je Art aus dem Punkt-Log, Minuten je Art aus dem Intraday-Log (ab 31.07.) — ältere Tage tragen dort 0.</div>';
  if(!F.alle.length){ h+=anLeer('Noch keine abgeschlossenen Tage. Starte einen Tag und schließe ihn ab — dann füllt sich die Analyse.'); }
  else{
    h+=anModReadiness(F,dom)+anModACWR(F,dom)+anModLeistung(F,dom)+anModKonsistenz(F,dom)+anModKalibrierung(F,dom)+anModVerhalten(F,dom);
    // §4 (v1.7.0): der Kartenart-Filter entscheidet, welche Flow-Module laufen.
    // „Alle" = beide untereinander, jedes mit eigener Überschrift.
    if(art==='alle' || art==='aufgabe') h+=anModAufgabenFlow(F,dom);
    if(art==='alle' || art==='routine') h+=anModRoutinenFlow(F,dom);
    if(art==='counter') h+=anModul('📥📤','Zu- & Abgang','Flow für Counter.',
      anLeer('Counter kennen keinen Abschluss und keine Fälligkeit — einen Zu-/Abgangs-Flow gibt es für sie strukturell nicht. Ihre Ticks stecken in Konsistenz, Leistung und Verhalten.'));
  }
  el('anBody').innerHTML=h;
}
function renderAnalyse(){ renderAnFilter(); renderAnalyseBody(); }
function oeffneAnalyse(){ el('analyseOverlay').hidden=false; renderAnalyse(); }
function schliesseAnalyse(){ el('analyseOverlay').hidden=true; }
el('anBack').addEventListener('click', schliesseAnalyse);
el('analyseOverlay').addEventListener('click', e=>{
  const zr=e.target.closest('[data-anzr]'); if(zr){ S.ui.analyseZeitraum=zr.dataset.anzr; saveUi(); renderAnalyse(); return; }
  const dm=e.target.closest('[data-andom]'); if(dm){ S.ui.analyseDomain=dm.dataset.andom; saveUi(); renderAnalyse(); return; }
  const aa=e.target.closest('[data-anart]'); if(aa){ S.ui.analyseArt=aa.dataset.anart; saveUi(); renderAnalyse(); return; }   // §2 (1.7.0)
});
el('analyseOverlay').addEventListener('change', e=>{
  if(e.target.id==='anVon'){ S.ui.analyseVon=e.target.value||null; saveUi(); renderAnalyse(); }
  if(e.target.id==='anBis'){ S.ui.analyseBis=e.target.value||null; saveUi(); renderAnalyse(); }
});

/* ══════════════════════════════════════════════════════════════════════
   18 · Init
   ══════════════════════════════════════════════════════════════════════ */
function init(){
  ladeAlles();
  S.unteraufgaben = DB.get('unteraufgaben', []);
  baueSuchIndex();   // A10: In-Memory-Suchindex bei App-Start
  seedStapel();
  pruefeTagKante();   // §6: vergessenen Abschluss beim Öffnen nachholen
  // Der Timer läuft über Reloads weiter (§7 D1): war er beim Verlassen aktiv,
  // rechnet startMs die verstrichene Zeit korrekt nach.
  if(S.fokus && S.fokus.laeuft) starteTicker();
  if(S.ui.debugTap) document.body.classList.add('debugtap');   // V3: Tap-Debug-Zustand wiederherstellen
  setTab(S.ui.tab||'stapel');
  renderFokusleiste();
  layoutTopbar();
  // Statusleiste driftet mit der Zeit (Pace/Akku/Kauf-Hinweis) — auch ohne
  // laufenden Timer alle 20 s auffrischen, solange ein Tag offen ist.
  setInterval(()=>{ if(tagOffen() && !(S.fokus&&S.fokus.laeuft)) renderStatusbar(); }, 20000);
  window.addEventListener('resize', layoutTopbar);
  // §4 (v1.6.1): jede echte Interaktion stempeln — Taps, Ticks, Seitenwechsel
  // und Sichtbarkeitswechsel. Capture-Phase, damit nichts verlorengeht.
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, interaktion, true));
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ interaktion(); saveMeta(); zeigeAutoPauseDialog(); } });
  interaktion(); saveMeta();
  zeigeMigration160();   // §9.1: Protokoll einmalig anzeigen
  zeigeMigration161();   // §7 (1.6.1): Protokoll einmalig anzeigen
  zeigeMigration180();   // §9.5 (1.8.0): Protokoll einmalig anzeigen
  zeigeMigration190();   // §7 (1.9.0): Protokoll einmalig anzeigen
  zeigeMigration1110();  // §10 (1.11.0): Rang-Protokoll einmalig anzeigen
  zeigeAutoPauseDialog();// §4: offene Rückfrage aus einer Auto-Pause nachholen
}
/* §9.1 (v1.6.0): Migrationsprotokoll genau einmal zeigen, danach abhaken. */

  const L=S.meta.migration160Log;
  if(!L || S.meta.migration160Gezeigt) return;
  const z=[['Tagesabschnitt gesetzt (Privat-Karten)',L.tagesabschnitt],
           ['Abschluss-Verlauf angelegt (Karten)',L.abschluesse],
           ['alte Stapel entfernt',L.stapelEntfernt],
           ['Tageskette „Heute" vorbefüllt (Karten)',L.ketteStart]];
  const h='<p class="d">Die App ist auf das neue Navigationsmodell umgestellt. '+
    '<b>Es wurde nichts gelöscht</b> — keine Karte, kein Punktestand, kein Wohlstand. '+
    'Der Vorzustand liegt gesichert unter <code>karten_bak160</code>, <code>meta_bak160</code> und <code>stapel_bak160</code>.</p>'+
    '<div class="kvblock">'+z.map(([t,n])=>'<div class="kv"><span>'+t+'</span><b>'+num(n)+'</b></div>').join('')+'</div>'+
    '<p class="d" style="margin-top:8px">Die 11 alten Stapel sind durch die drei Filterebenen auf der Fokusseite ersetzt. '+
    'Übrig bleiben die Stapel <b>Heute</b> (steuert die Swipe-Reihenfolge) und <b>Erledigt</b> (zum Zurückholen).</p>';
  openSheet('Update v1.6.0 — Migration', h, '<button class="btn prim" data-close="1">Verstanden</button>');
  S.meta.migration160Gezeigt=true; saveMeta();
}
/* §7 (v1.6.1): Migrationsprotokoll einmalig zeigen. */
function zeigeMigration161(){

/* ── Offline-PWA (§12) ────────────────────────────────────────────────
   neu.html teilt sich den bestehenden network-first Service Worker (sw.js):
   dieselbe scriptURL + Scope wie index.html ⇒ idempotent, index.html und
   dessen SW bleiben komplett unangetastet. Online lädt der SW immer frisch,
   offline aus dem Cache. Nach dem ersten Online-Öffnen sind neu.html +
   manifest-neu.json gecacht (Avatar-Bilder pre-cacht sw.js bereits) ⇒
   neu.html läuft offline als eigenes Homescreen-Icon (manifest-neu.json).
   Zweites root-scoped SW wäre falsch (würde mit index.html um die Kontrolle
   konkurrieren) — daher bewusst geteilt statt separat. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // Beim ersten Besuch kontrolliert der SW die Erst-Anfrage noch nicht →
    // neu.html + manifest-neu.json explizit in den SW-Cache legen, sobald er
    // bereit ist. Damit läuft neu.html schon nach dem ersten Online-Öffnen
    // offline (Avatar-Bilder/Icons pre-cacht sw.js ohnehin).
    navigator.serviceWorker.ready.then(async ()=>{
      try{
        const name=(await caches.keys()).find(k=>k.indexOf('fokus-')===0);
        if(name){ await (await caches.open(name)).addAll(['neu.html','manifest-neu.json','icon-neu-192.png','icon-neu-512.png','apple-touch-icon-neu.png']); }
      }catch(e){}
    });
  });
}

/* ── Auto-Update (v1.1) ───────────────────────────────────────────────
   GitHub Pages liefert die HTML mit 10-Min-Cache aus; der network-first SW
   respektiert diesen Cache, daher erscheint ein frischer Deploy sonst erst
   verzögert. Lösung ohne sw.js anzufassen: beim Start/Foreground die eigene
   Datei cache-frei laden (fetch cache:'reload' umgeht UND aktualisiert den
   HTTP-Cache) und ihren APP_BUILD mit dem laufenden vergleichen. Ist ein
   neuerer Build da, lädt die App sich EINMAL neu — der folgende reload holt
   dank aufgefrischtem HTTP-Cache garantiert die frische Datei. sessionStorage
   verhindert Reload-Schleifen. */
async function updateCheck(){
  if(location.protocol.indexOf('http')!==0) return;   // nur online (nicht file://)
  try{
    const res=await fetch('neu.html', {cache:'reload'});
    const m=(await res.text()).match(/APP_BUILD\s*=\s*'([^']+)'/);
    const latest=m&&m[1];
    if(latest && latest!==APP_BUILD && sessionStorage.getItem('fokus_build')!==latest){
      sessionStorage.setItem('fokus_build', latest);
      location.reload();
    }
  }catch(e){/* offline → ignorieren, Cache genügt */}
}
addEventListener('load', ()=>{ setTimeout(updateCheck, 1500); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') updateCheck(); });
</script>
