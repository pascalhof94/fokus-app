function settingsMerge(gespeichert){
  const s=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  for(const [k,v] of Object.entries(gespeichert||{})){
    if(v && typeof v==='object' && !Array.isArray(v) && typeof s[k]==='object') Object.assign(s[k], v);
    else s[k]=v;
  }
  // Einmalige Migrationen (Punkte-Neukalibrierung 30.07.) — je nur, wenn der
  // ALTE Default noch gesetzt ist (nie einen bewusst geänderten Wert überschreiben):
  if(Array.isArray(s.levelSchwellen) && s.levelSchwellen[11]===40000) s.levelSchwellen = DEFAULT_SETTINGS.levelSchwellen.slice();
  if(s.basisProStd===12)  s.basisProStd = 120;   // A8: Basis 12→120
  if(s.zeitGewicht===1)   s.zeitGewicht = 1.15;  // A8: Zeit-Gewicht 1→1,15
  if(s.preisFaktor===1)   s.preisFaktor = 15;    // Shop-Preis-Faktor 1,0→15 (bestehende 15 unberührt)
  return s;
}
function ladeAlles(){

  S.fokus    = DB.get('fokus', null);
  S.historie = DB.get('historie', []);
  S.intraday = DB.get('intraday', []);   // B0: App-only Intraday-Log
  S.routinenGruppen = DB.get('routinenGruppen', []);   // §3 (1.6.1): Routinen-Gruppen mit Komplett-Bonus
  S.belohnung= DB.get('belohnung', null);

  // U6-B: Erstell-Zeitstempel für Altkarten guarded nachrüsten (VOR der Härtung,
  // damit der Fallback greift statt der neueKarte-Default-Jetztzeit). Idempotent.
  S.karten.forEach(k=>{ if(k && !k.erstelltTs) k.erstelltTs = k.letzteBearbeitung || jetztIso(); });
  // Karten gegen Schema-Drift härten (neue Felder erscheinen automatisch)
  S.karten = S.karten.map(k=>neueKarte(k));
  // U6-E: einmalige Feld-Umbenennung kommentarFuerClaude → kommentarClaude (Wert erhalten).
  if(!S.meta.u6migriert){
    S.karten.forEach(k=>{ if(k.kommentarFuerClaude!==undefined){ if(!k.kommentarClaude) k.kommentarClaude=k.kommentarFuerClaude; delete k.kommentarFuerClaude; } });
    S.meta.u6migriert=true; saveKarten(); saveMeta();
  }
  // H4.1: einmalige interne Sicherung der Historie vor der rückwirkenden Flow-/Ø-
  // Neuberechnung (die Neuberechnung selbst ist rein rechnerisch/live, verändert
  // keine gespeicherten Daten — die Sicherung bleibt als Sicherheitsnetz).
  if(!S.meta.hotfix131){
    DB.set('historie_bak131', S.historie);
    DB.set('intraday_bak131', S.intraday);
    S.meta.hotfix131=true; saveMeta();
  }
  // F2 (v1.3.3): Baseline-Ausreißer im Aufgaben-Flow bereinigen. URSACHE: die
  // U6-B-Nachrüstung weiter oben setzt erstelltTs für ALLE Karten ohne Zeitstempel
  // (= der komplette aus v0.38/Airtable übernommene Bestand) auf dieselbe Jetztzeit
  // des ersten U6-Ladevorgangs. anFlowReihe liest „reingekommen" aus erstelltTs →
  // der gesamte Bestand zählte an genau EINEM Tag als Zugang. Liegt dieser Tag vor
  // dem Analysefenster, werden die Karten darin erledigt, ohne je zugegangen zu sein
  // → der Netto-Backlog rennt künstlich ins Minus. Diese Karten werden als
  // Bestandsaufnahme markiert und zählen ab jetzt als Startbestand statt als Zugang.
  // Guarded + idempotent; Sicherung der betroffenen Keys VOR dem Eingriff.
  if(!S.meta.hotfix133){
    DB.set('karten_bak133', S.karten);
    DB.set('intraday_bak133', S.intraday);
    const proTag={};
    S.karten.forEach(k=>{ if(kartenArt(k)!=='Aufgabe' || !k.erstelltTs) return;
      const d=String(k.erstelltTs).slice(0,10); proTag[d]=(proTag[d]||0)+1; });
    const tage=Object.keys(proTag).sort();
    if(tage.length){
      const erst=tage[0], gesamt=tage.reduce((a,d)=>a+proTag[d],0);
      const rest=tage.slice(1).map(d=>proTag[d]);
      const restSchnitt = rest.length ? rest.reduce((a,b)=>a+b,0)/rest.length : 0;
      // Ausreißer = ältester Erstelltag trägt ≥5 Aufgaben UND ≥40 % des Bestands
      // oder ≥4× den Schnitt der übrigen Tage (Massen-Anlage statt echtem Zugang).
      if(proTag[erst]>=5 && (proTag[erst]>=gesamt*0.4 || proTag[erst]>=Math.max(1,restSchnitt)*4)){
        S.meta.flowBaseline133=erst;
        S.karten.forEach(k=>{ if(kartenArt(k)==='Aufgabe' && k.erstelltTs && String(k.erstelltTs).slice(0,10)===erst) k.flowBaseline=true; });
        saveKarten();
      }
    }
    S.meta.hotfix133=true; saveMeta();
  }
  // FIX1 (v1.5.2): Sync-Bestandsübernahme reparieren. DIAGNOSE: syncImport()
  // legt unbekannte Karten aus dem Rück-Paket per neueKarte() an — erstelltTs
  // = Sync-Moment. anFlowReihe zählt „reingekommen" über erstelltTs, geschützt
  // nur durch flowBaseline; das hat bisher AUSSCHLIESSLICH hotfix133 gesetzt
  // (v0.38-Massendatum). Der Sync-Kanal war ungeschützt — der erste große
  // Airtable-Sync erzeugte an einem Tag ~70 „Zugänge" und verzerrt Flow/
  // Netto-Backlog/Ø. Rückwirkend: jeder Tag, an dem ≥SYNC_BESTAND_SCHWELLE
  // Karten MIT airtableId dasselbe erstelltTs-Datum tragen, gilt als Massen-
  // Anlage (Bestandsübernahme) statt echtem Tageszugang → flowBaseline=true
  // (wandert in anFlowStartBestand). Guarded + idempotent, Sicherung vorher,
  // Ergebnis in meta.flowfix152Log protokolliert (Datum + Anzahl je Tag).
  if(!S.meta.flowfix152){
    DB.set('karten_bak152', S.karten);
    const proTag={};
    S.karten.forEach(k=>{ if(kartenArt(k)!=='Aufgabe' || !k.erstelltTs || !k.airtableId) return;
      const d=String(k.erstelltTs).slice(0,10); (proTag[d]=proTag[d]||[]).push(k); });
    const spikes=[];
    Object.keys(proTag).sort().forEach(d=>{
      const arr=proTag[d];
      if(arr.length>=SYNC_BESTAND_SCHWELLE){
        arr.forEach(k=>{ k.flowBaseline=true; });
        spikes.push({datum:d, anzahl:arr.length});
      }
    });
    if(spikes.length) saveKarten();
    S.meta.flowfix152Log=spikes;
    S.meta.flowfix152=true; saveMeta();
  }
  // ══ §9.1 (v1.6.0) · Migration auf das neue Navigationsmodell ═══════════
  // Guarded über meta.migration160, Sicherung des Vorzustands unter
  // karten_bak160 / meta_bak160. KEINE Karte wird gelöscht, kein Punktestand
  // und kein Wohlstand angefasst. Protokoll landet in meta.migration160Log und
  // wird einmalig in der App angezeigt.
  if(!S.meta.migration160){
    DB.set('karten_bak160', S.karten);
    DB.set('meta_bak160', S.meta);
    DB.set('stapel_bak160', S.stapel);
    const log={ ts:jetztIso(), tagesabschnitt:0, abschluesse:0, stapelEntfernt:0, ketteStart:0 };
    S.karten.forEach(k=>{
      // 1) tagesabschnitt für Privat-Karten setzen (Ableitung §2.1; ein bereits
      //    gesetzter Wert bleibt unangetastet). Ein vorhandenes tageszeit-Feld
      //    wird als Vorgabe übernommen, wo es eindeutig ist — sonst Uhrzeit-Regel.
      // v1.6.1: schreibt bereits das ARRAY-Format (§1), damit nie ein Einzelwert
      // im Datenmodell landet — die 161er-Migration muss dann nichts umformen.
      if(k.domain==='privat' && !(Array.isArray(k.tagesabschnitt) && k.tagesabschnitt.length)){
        const alt={morgens:'morgens', mittags:'tagsueber', abends:'abends'}[k.tageszeit];
        k.tagesabschnitt = [alt || tagesabschnittAbleiten(k)];
        log.tagesabschnitt++;
      }
      // 2) leeres Abschluss-Stack-Feld anlegen (§6.1 nutzt es ab jetzt)
      if(!Array.isArray(k.abschluesse)){ k.abschluesse=[]; log.abschluesse++; }
    });
    // 3) alte Stapel-Definitionen entfernen; nur „Heute" + „Erledigt" bleiben.
    //    Der persistierte Filterzustand der alten Stapel fällt mit weg.
    const alteIds=S.stapel.map(s=>s.id).filter(id=>id!=='sys-heute' && id!=='sys-erledigt');
    log.stapelEntfernt=alteIds.length;
    S.ui.stapelDomain={}; S.ui.stapelStatus={}; S.ui.stapelOffen={};
    syncStandardStapel();
    // 4) Tageskette einmalig aus den heute fälligen Karten vorbefüllen
    // v1.12.0: parameterlose Alt-Aufrufe auf die Zwei-Ketten-API gehoben
    if(!tagesKette().length){ ketteSetzen(ketteAutoIds('dfm').concat(ketteAutoIds('privat')));
      log.ketteStart=tagesKette().length; }
    S.meta.migration160Log=log;
    S.meta.migration160=true;
    saveKarten(); saveMeta(); saveUi();
  }
  // ══ §7 (v1.6.1) · Migration ═══════════════════════════════════════════
  // Ein gemeinsames Flag über alle Teilschritte, Sicherung VORHER, Protokoll
  // einmalig anzeigen. Keine Karte gelöscht, kein Punkte-/Wohlstand-Reset.
  if(!S.meta.migration161){
    DB.set('karten_bak161', S.karten);
    DB.set('meta_bak161', S.meta);
    const log={ ts:jetztIso(), arrayUmstellung:0, ausTageszeit:0, tageszeitEntfernt:0, gruppeAngelegt:0, gruppeFehlend:[] };
    S.karten.forEach(k=>{
      // §1: Einzelwert → einelementiges Array
      if(typeof k.tagesabschnitt==='string' && TAGESABSCHNITTE.indexOf(k.tagesabschnitt)>=0){
        k.tagesabschnitt=[k.tagesabschnitt]; log.arrayUmstellung++;
      } else if(k.tagesabschnitt!=null && !Array.isArray(k.tagesabschnitt)){
        k.tagesabschnitt=null;
      }
      // §2: leeres tagesabschnitt einmalig aus tageszeit ableiten (tagesabschnitt gewinnt)
      const leer=!Array.isArray(k.tagesabschnitt) || !k.tagesabschnitt.length;
      if(leer && k.tageszeit){
        const map={morgens:'morgens', abends:'abends', mittags:'tagsueber', beliebig:'tagsueber'};
        const ta=map[k.tageszeit];
        if(ta){ k.tagesabschnitt=[ta]; log.ausTageszeit++; }

    if(!Array.isArray(S.routinenGruppen)) S.routinenGruppen=[];

  // ══ §9.5 (v1.8.0) · Migration aufs neue Tick-Modell ════════════════════
  // Guarded, Sicherung VORHER. tickKurve → ticksAktiv + tickWert (erster Wert).

  if(!S.meta.migration180){

      if(String(k.titel||'').trim().toLowerCase()==='whatsapp' && k.rhythmus){

  // ══ §3 (v1.8.1) · Flow-Spike aus dem Neuaufbau glätten ═════════════════
  // EINMALIGE rückwirkende Bereinigung: Tage mit >30 Zugängen/Erledigungen
  // werden auf 30 gekappt — die Überzähligen werden als Bestandsübernahme
  // markiert (flowBaseline bzw. flowDoneBaseline), NICHTS wird gelöscht.
  // Für die Zukunft gilt KEINE Begrenzung; SYNC_BESTAND_SCHWELLE bleibt.
  if(!S.meta.flowfix181){
    DB.set('karten_bak181', S.karten);

    const byCreated={}, byDone={};
    S.karten.forEach(k=>{
      if(kartenArt(k)!=='Aufgabe') return;   // der Flow zählt nur Aufgaben
      if(k.erstelltTs && !k.flowBaseline){ const d=String(k.erstelltTs).slice(0,10); (byCreated[d]=byCreated[d]||[]).push(k); }
      if(k.status==='erledigt' && k.tagId){ const d=String(k.tagId).slice(0,10); (byDone[d]=byDone[d]||[]).push(k); }
    });
    Object.keys(byCreated).forEach(d=>{ const a=byCreated[d]; if(a.length<=KAPPE) return;
      a.sort((x,y)=>String(x.erstelltTs)<String(y.erstelltTs)?-1:1);
      a.slice(KAPPE).forEach(k=>{ k.flowBaseline=true; });

    });
    Object.keys(byDone).forEach(d=>{ const a=byDone[d]; if(a.length<=KAPPE) return;

  // ══ §7 (v1.9.0) · Gamification-Migration ═══════════════════════════════
  // Seedet die neuen Akkumulatoren EINMALIG aus dem Bestand — danach laufen
  // sie eigenständig (die alte max-Kaskade würde den Kauf-Bonus sonst wieder
  // einebnen). Der heutige Live-Anteil wird herausgerechnet, weil die Anzeigen

  if(!S.meta.gamify190){
    DB.set('meta_bak190', S.meta);

    const live = tagOffen() ? Math.max(0, tagesPunkteLive()) : 0;
    const ausg = num(S.belohnung && S.belohnung.ausgegeben);
    // Kaskadenwerte VOR dem Setzen der neuen Felder einfrieren — konto() greift
    // sonst mitten im Seed auf halb gesetzte Akkumulatoren zu.
    const rohAlt  = lifetimePunkteRoh();
    const lifeAlt = lifetimePunkte();
    S.meta.muenzenGesamt   = Math.max(0, Math.round(rohAlt  - live));
    S.meta.rangPunkte      = Math.max(0, Math.round(lifeAlt - live));
    S.meta.ausgegebenGesamt= Math.round(ausg);
    S.meta.rangResetOffset=0; S.meta.muenzenResetOffset=0; S.meta.ausgabenResetOffset=0;
    // Tages-Streak aus der Historie rekonstruieren (Urlaubstage neutral)

    (S.historie||[]).forEach(h=>{ if(h.luecke) return; abschluss[h.datum]=true; if(h.urlaub) urlaubT[h.datum]=true; });
    let st=0, letzt=null, d=heuteApp(), guard=0;

    while(guard++<730){
      if(urlaubT[d] && !abschluss[d]){ d=anVorTage(d,1); continue; }
      if(abschluss[d] && !urlaubT[d]){ st++; if(!letzt) letzt=d; d=anVorTage(d,1); continue; }
      if(abschluss[d] && urlaubT[d]){ d=anVorTage(d,1); continue; }   // Urlaubs-Abschluss: neutral

    }
    S.meta.tagesStreak=st; S.meta.tagesStreakBest=st; S.meta.streakLetzterTag=letzt;

      kulisse:bgStufeAus(num(S.meta.ausgegebenGesamt)), streak:st, streakQuelle:(S.historie&&S.historie.length)?'Historie':'leer' };
    S.meta.gamify190=true;
    saveMeta();
  }
  // ══ §4 (v1.10.0) · Akku-Messprotokoll anlegen ═══════════════════════════
  if(!S.meta.akku1100){
    DB.set('karten_bak1100', S.karten);
    if(!Array.isArray(S.meta.akkuMessungen)) S.meta.akkuMessungen=[];

/* ══════════════════════════════════════════════════════════════════════
   5 · Punkte-Engine (§4) + Timer + Farbsystem (§5) — alles live berechnet.
   ══════════════════════════════════════════════════════════════════════ */
/* geldFaktor: nur dfm, gedeckelt; privat = 1.
   geldScoreNorm = geldScore / geldScoreRef (Referenz in Settings; Rückfrage
   an Pascal offen, siehe Zusammenfassung). */
function geldFaktor(k){
  if(k.domain!=='dfm') return 1;
  const norm = num(k.geldScore)/ (S.settings.geldScoreRef||200);
  const f = 1 + norm*(S.settings.geldGewicht||0);
  return Math.min(S.settings.geldDeckel||1.5, Math.max(1, f));
}
/* Wirksamer Stundensatz: Karten-Override punkteProStd schlägt die Treiber-Rate
   (v0.38 effektiveRate); geldFaktor bleibt v1.0-Zusatz (dfm gedeckelt, privat 1). */
function basisRate(k){   // A9: Basis-Rate je Domäne
  return k.domain==='dfm' ? num(S.settings.basisProStdDfm,180) : num(S.settings.basisProStdPrivat,120);
}
function rate(k){
  const base = (k.punkteProStd!=null && Number.isFinite(Number(k.punkteProStd)))
    ? Number(k.punkteProStd)
    : basisRate(k) * num(k.komplex,1) * num(k.energie,1) * num(k.blockade,1);
  return base * geldFaktor(k);
}
/* Akku %/Std dieser Karte (v0.38 akkuRate): Karten-Override sonst Settings. */
/* ══ §4 (v1.10.0) · Der Akku wird GEMESSEN ══════════════════════════════
   Jede Abschluss-Messung landet global in meta.akkuMessungen
   {kid, kat, datum, delta, dauerMin, rate} — global, damit sie eine
   Archivierung überlebt und Kategorie-Mediane möglich sind. Gelernt wird der
   MEDIAN (je Karte, je Kategorie), wirksam ab AKKU_MIN_MESSUNGEN, gekappt auf
   AKKU_RATE_MIN..MAX. Kategorie: DFM = Projekt (wie die Schätzfaktoren);
   Privat = Tagesabschnitt — die Akku-Wirkung privater Karten hängt an ihrer
   Tagesrolle (Morgenroutinen laden, Abendpflichten ziehen), und das Feld
   existiert seit v1.6.0 an jeder Privat-Karte. */
const AKKU_MIN_MESSUNGEN = 5;     // dieselbe Schwelle wie bei den Schätzfaktoren
const AKKU_RATE_MIN = -40, AKKU_RATE_MAX = 20;   // %/Std-Kappung gegen Fehleingaben — §6.2 (1.13.0): bleibt (kappt die RATE, nie den Stand)
const AKKU_MAX = 150;             // §6.2 (v1.13.0): Anzeige deckelt nicht mehr bei 100 — Sanity-Kappe gegen Ausreißer
function akkuKategorie(k){
  if(!k) return '?';
  return k.domain==='dfm' ? 'dfm|'+(k.projekt||'?') : 'privat|'+(tagesabschnitteVon(k)[0]||'?');
}
function akkuMedian(werte){
  if(!werte.length) return null;
  const a=werte.slice().sort((x,y)=>x-y), m=Math.floor(a.length/2);
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
}
function akkuGelernt(k){
  const mess=(S.meta&&S.meta.akkuMessungen)||[];
  const eigene=mess.filter(m=>m.kid===k.id).map(m=>num(m.rate));
  if(eigene.length>=AKKU_MIN_MESSUNGEN)
    return { rate:Math.max(AKKU_RATE_MIN,Math.min(AKKU_RATE_MAX,akkuMedian(eigene))), n:eigene.length, quelle:'Karte' };
  const kat=akkuKategorie(k);
  const katM=mess.filter(m=>m.kat===kat).map(m=>num(m.rate));
  if(katM.length>=AKKU_MIN_MESSUNGEN)
    return { rate:Math.max(AKKU_RATE_MIN,Math.min(AKKU_RATE_MAX,akkuMedian(katM))), n:katM.length, quelle:'Kategorie' };
  return null;
}
/* §4.2: Rangfolge — ausdrücklicher Override → gelernte Karte → gelernte
   Kategorie → Settings-Standard (konsistent zu punkteProStd). */
function akkuRate(k){
  if(k && k.akkuProStd!=null && Number.isFinite(Number(k.akkuProStd))) return Number(k.akkuProStd);
  const g=k?akkuGelernt(k):null;
  if(g) return g.rate;
  return S.settings.akkuProStd!=null?S.settings.akkuProStd:-8;
}
function akkuLetzteMessung(kid){
  const mess=(S.meta&&S.meta.akkuMessungen)||[];
  for(let i=mess.length-1;i>=0;i--) if(mess[i].kid===kid) return mess[i];
  return null;
}
/* Zeit-Punkte, optional zeitgestaffelt (§4-Port punkteFuerZeit): bisMin aufsteigend,
   letzte Stufe bisMin=null = „danach". Ohne Staffel: flache Rate. */
function punkteFuerZeit(k, min){
  const st=k.zeitStufen;
  if(Array.isArray(st) && st.length){
    let p=0, ab=0;
    for(const s of st){ const bis=(s.bisMin==null?Infinity:num(s.bisMin)); p += Math.max(0, Math.min(min,bis)-ab)/60 * num(s.punkteProStd); ab=bis; if(min<=bis) break; }
    return p * geldFaktor(k);
  }
  return min/60 * rate(k);
}
/* Ist-Sekunden inkl. gerade laufendem Timer (nur für die fokussierte Karte). */
function istSekLive(k){
  let s = num(k.istSek);
  if(S.fokus && S.fokus.karteId===k.id && S.fokus.laeuft) s += (Date.now()-S.fokus.startMs)/1000;
  return s;
}
/* Zeitquelle: Ist (inkl. Live-Timer) wenn Uhr lief, sonst Soll;
   Ausnahme idee → Ist gedeckelt auf Soll. */
function zeitquelleMin(k){
  const ist = istSekLive(k);
  let z = (ist>0) ? ist/60 : num(k.sollMin);
  if(k.prioritaet==='idee') z = Math.min(z, num(k.sollMin));
  return z;
}
/* §9 (v1.8.0): Die mehrstufige tickKurve ist abgelöst. Jeder Tick bucht den
   Kartenwert tickWert — je Tick überschreibbar (§9.4), deshalb hält
   tickWerteHeute die heutigen Einzelwerte (Reset beim Tagesstart wie
   ticksHeute). tickSumme summiert die ersten `bis` heutigen Ticks; fehlt für
   Alt-Ticks der Einzelwert, greift der Default tickWert. */
/* ══ §2 (v1.13.0) · EIN Standardwert je Domäne speist Abhakbonus UND
   Tick-Wert jeder Karte OHNE eigenen Wert. Eine Änderung des Standards wirkt
   SOFORT auf alle erbenden Karten (Auswertung zur Laufzeit, kein Kopieren).
   Ein gesetzter Kartenwert ist ein DAUERHAFTER Override (bis er wieder
   geändert/zurückgesetzt wird). ══ */
function standardWert(dom){
  return dom==='dfm' ? num(S.settings && S.settings.standardWertDfm, 0)
                     : num(S.settings && S.settings.standardWertPrivat, 0);
}
function tickWertEff(k){ return (k && k.tickWert!=null) ? num(k.tickWert) : standardWert(k && k.domain); }
function tickSumme(k, bis){
  const w = Array.isArray(k.tickWerteHeute)?k.tickWerteHeute:[];
  let s=0;
  for(let i=0;i<bis;i++) s += (i<w.length) ? num(w[i]) : tickWertEff(k);
  return s;
}
/* Zeit- und Tick-Punkte sind orthogonal (§4): eine Karte kann beides tragen
   (z. B. Counter mit laufender Stoppuhr). */
/* v1.1: einmalige Zusatzpunkte je Unteraufgabe (Spalte „Punkte", nur wenn
   explizit gesetzt; leer = 0). Erreicht = erledigte, Offen = noch offene. */
function subBonusErreicht(k){ return untermenge(k.id).reduce((s,u)=>s+(u.done?num(u.bonusPunkte):0),0); }
function subBonusOffen(k){ return untermenge(k.id).reduce((s,u)=>s+(!u.done?num(u.bonusPunkte):0),0); }
/* §1 (v1.7.1): Dauerlauf-Strafe des Pausentimers — EINE Formel für beide Wege.
   pausenStrafe(k, laufMin) = Wert der Minuten über PAUSENTIMER_MAX_MIN mit
   umgekehrtem Vorzeichen (Differenz = doppelter Wert, Höhe unverändert seit
   v1.6.1). fokusZeitEinbuchen schreibt sie beim Pausieren fest;
   pausenStrafeLive liefert den WACHSENDEN Anteil des gerade laufenden Timers,
   damit der Abzug sofort sichtbar ist statt erst nach der Pause. */
function pausenStrafe(k, laufMin){
  if(!k || !k.keineAutoPause || !(laufMin>PAUSENTIMER_MAX_MIN)) return 0;
  const wert=punkteFuerZeit(k, laufMin)-punkteFuerZeit(k, PAUSENTIMER_MAX_MIN);
  return 2*wert*(S.settings.zeitGewicht!=null?S.settings.zeitGewicht:1);
}
function pausenStrafeLive(k){
  if(!(S.fokus && S.fokus.laeuft && S.fokus.karteId===k.id && S.fokus.startMs)) return 0;
  return pausenStrafe(k, (Date.now()-S.fokus.startMs)/60000);
}
function kartePunkte(k){
  if(k.punkteOverride!=null) return num(k.punkteOverride);   // U6-A: beim Abhaken gewählter Ist-Punktwert schlägt die Berechnung
  const zeitTerm = punkteFuerZeit(k, zeitquelleMin(k)) * (S.settings.zeitGewicht!=null?S.settings.zeitGewicht:1);
  const tickTerm = tickSumme(k, num(k.ticksHeute)) * (S.settings.tickGewicht!=null?S.settings.tickGewicht:1) * geldFaktor(k);
  // §1 (v1.7.1): festgeschriebene + live wachsende Pausentimer-Strafe. Der
  // 1-Sekunden-Ticker rendert kartePunkte-basierte Anzeigen ohnehin sekündlich —
  // damit wächst der Abzug ab Minute 120 sichtbar auf Fokusseite/Statusleiste.
  return zeitTerm + tickTerm + subBonusErreicht(k) - num(k.strafPunkte) - pausenStrafeLive(k);   // + gebuchte Unteraufgaben-Boni
}
/* Prognose inkl. ALLER Unteraufgaben-Boni (erledigt + offen) — für „geplant". */
function kartePunkteGeplant(k){ return kartePunkteBei(k, num(k.sollMin)||istSekLive(k)/60) + subBonusOffen(k); }
/* A3: nur der Tick-Anteil (gebuchte Ticks) — für Counter/Timer, die heute
   getickt, aber weder erledigt noch als Fokus laufend sind. */
function tickPunkte(k){ return tickSumme(k, num(k.ticksHeute)) * (S.settings.tickGewicht!=null?S.settings.tickGewicht:1) * geldFaktor(k); }
/* Abgeleitetes „Art"-Etikett (§2.1) — nur Anzeige. */
/* Kartenart REIN ABGELEITET (v1.0 hat kein typ-Feld; die 74 Bestandskarten
   tragen keins). Regel wie v0.38-Bestand verifiziert (34/9/31):
   Routine = rhythmus gesetzt · Counter = mehrgliedrige Tick-Kurve · sonst Aufgabe.
   timerFlag/Stoppuhr ist ORTHOGONAL (§4: eine Karte kann Zeit UND Ticks tragen). */
function kartenArt(k){
  if(k.rhythmus) return 'Routine';
  if(k.ticksAktiv) return 'Counter';                                    // §9 (1.8.0): neues Tick-Modell
  if(Array.isArray(k.tickKurve) && k.tickKurve.length>1) return 'Counter';   // Altbestand vor Migration
  return 'Aufgabe';
}
/* §11.1 (v1.12.0, F5): Die BESCHRIFTUNG folgt der Grundart — eine Aufgabe mit
   Ticks bleibt „Aufgabe" (die Tick-Flaeche haengt allein an ticksAktiv).
   kartenArt() selbst bleibt unveraendert (Streak, Quote, Flow, Filter). */
function kartenArtLabel(k){
  const a=kartenArt(k);
  if(a!=='Counter') return a;
  return (num(k.sollMin)>0 || k.faelligkeit || untermenge(k.id).length) ? 'Aufgabe' : 'Counter';
}
/* §7 (v1.8.0) BUGFIX: istTickKarte war an kartenArt gekoppelt — und weil dort
   der Rhythmus VOR der Tick-Kurve geprüft wird, wurde eine Routine mit Kurve
   nie als tickbar erkannt (Zähne putzen, Sport, WhatsApp … bekamen ein
   Erledigt-Häkchen statt ＋). Maßgeblich ist jetzt AUSSCHLIESSLICH das Feld
   ticksAktiv (§9); timerFlag löst nur noch Zeitmessung aus, keine Ticks.
   Eine Routine mit ticksAktiv behält Streak und Tagesabschnitte UND ist
   tickbar — Normalfall, kein Sonderfall. */
function istTickKarte(k){ return !!k.ticksAktiv; }
/* §2 (v1.9.1): Zeitmessung ist ein SCHALTER der Karte — kein aus vier Feldern
   abgeleitetes Rätsel (genau diese Ableitung hat in v1.8.0 den Play-Knopf der
   Routinen gekostet). Steuert AUSSCHLIESSLICH, ob die Stoppuhr läuft — nie,
   ob ein Knopf existiert. ▶ heißt „in den Fokus". Punkt. */
function hatZeitmessung(k){ return !(k && k.zeitmessung===false); }

/* ── Timer-Engine (§7 D1: EIN Play/Pause-Toggle) ──────────────────────
   S.fokus = { karteId, laeuft, startMs } — bei Pause/Wechsel/Abschluss
   fließt die laufende Zeit in karte.istSek. Reload läuft weiter (persistiert). */
function fokusKarte(){ return S.fokus ? S.karten.find(k=>k.id===S.fokus.karteId) : null; }
/* Laufende Sekunden der aktuellen (nicht eingebuchten) Session. */
function laufendeSek(){ return (S.fokus && S.fokus.laeuft) ? (Date.now()-S.fokus.startMs)/1000 : 0; }
function fokusZeitEinbuchen(){
  if(!S.fokus || !S.fokus.laeuft) return;
  const k=fokusKarte();
  const sek=(Date.now()-S.fokus.startMs)/1000;
  if(k){ k.istSek=num(k.istSek)+sek; akkuBuchen(k, sek/60); beruehre(k); logIntraday(k,{minuten:sek/60,typ:'timer'}); }   // v1.1: Akku-Drift; A7 berührt; B0 Log
  // §5 (v1.6.1) / §1 (v1.7.1): Beim Pausieren wird die bis dahin live angezeigte
  // Dauerlauf-Strafe festgeschrieben — DIESELBE Formel wie pausenStrafeLive,
  // dadurch springt der Wert beim Pausieren nicht. Reset des Zählers folgt
  // direkt darunter (startMs=0); jede Pause startet die 120 Minuten neu.
  if(k) k.strafPunkte=num(k.strafPunkte)+pausenStrafe(k, sek/60);
  S.fokus.sessionSek=num(S.fokus.sessionSek)+sek;               // v1.1: Session-Summe (v0.38-Port)
  S.fokus.laeuft=false; S.fokus.startMs=0;
  akkuSampleSchreiben();                                        // v1.1: Energie-Stichprobe
  saveKarten(); saveFokus(); saveTag();
}
function fokusStarten(kid, quelle){
  const zk=S.karten.find(x=>x.id===kid);
  // §3.1 (v1.10.0): eine eingefrorene Karte wird beim Start sofort aktiv —
  // freeze fällt ohne Rückfrage (der alte „erst auftauen"-Toast entfällt).
  if(zk && zk.freeze){ zk.freeze=false; saveKarten(); }
  // V1.3: Timer-Start auf einer erledigten Karte öffnet IMMER ein frisches Duplikat
  // (ersetzt das UP6b-„in-place wieder öffnen"). Ein Codepfad über karteNeuStarten.
  if(zk && zk.status==='erledigt'){ karteNeuStarten(kid, {starten:true}); return; }
  if(S.fokus && S.fokus.karteId!==kid) fokusZeitEinbuchen();  // alten Fokus pausieren+buchen
  if(!S.fokus || S.fokus.karteId!==kid) S.fokus={ karteId:kid, laeuft:false, startMs:0, sessionSek:0 };
  // §3 (v1.9.1): ▶ öffnet den Fokus IMMER; die Stoppuhr läuft nur an, wenn die
  // Karte Zeit misst. Ohne Uhr: kein laeuft, keine Buchung, kein Intraday.
  if(hatZeitmessung(zk)){ S.fokus.laeuft=true; S.fokus.startMs=Date.now(); }
  else { S.fokus.laeuft=false; S.fokus.startMs=0; }
  // §3.1 (v1.10.0): merken, aus welcher Liste die Karte kam — Quelle des
  // Nachrückens nach einem Abschluss. Die Swipe-Navigation bleibt davon
  // unberührt (sie läuft weiter über die Tageskette/fokusKandidaten).
  if(quelle!==undefined) S.fokus.quelle=quelle||null;
  beruehre(zk);              // A7: Timer-Start zählt als Interaktion
  fokusNavReset();           // U2: aktive Auswahl beendet die Swipe-Navigation
  fokusKarteNachOben(kid);   // U1: in den Fokus genommene Karte rückt auf Position 1
  saveFokus(); saveUi(); if(S.fokus.laeuft) starteTicker(); renderAlles();
}
/* §3.1 (v1.10.0): Nach dem Abschluss der aktiven Fokus-Karte rückt die
   nächste OFFENE Karte aus derselben Quelle nach (gewählt, Uhr aus —
   gestartet wird bewusst per ▶). Quelle leer/unbekannt → altes Verhalten. */
function fokusNachruecken(kid){
  if(!(S.fokus && S.fokus.karteId===kid)) return false;
  const q=S.fokus.quelle;
  if(!q) return false;
  let liste = (q==='sys-heute'||q==='kette') ? ketteKarten() : ansichtsListe(q);
  const next=(liste||[]).find(x=>x.id!==kid && x.status==='offen' && !x.freeze);
  if(!next) return false;
  S.fokus={ karteId:next.id, laeuft:false, startMs:0, sessionSek:0, quelle:q };
  saveFokus();
  toast('Nächste: '+(next.titel||'(ohne Titel)'));
  return true;
}
/* U1: die Fokus-Karte an Position 1 des aktiven Stapels (echte Umsortierung —
   manueller Modus, aktuelle Reihenfolge festschreiben, Ziel-Karte sortIndex 0). */
function fokusKarteNachOben(kid){
  const st=S.stapel.find(s=>s.id===S.ui.aktivStapel); if(!st) return;
  const ks=stapelKarten(st); if(!ks.length) return;
  st.sortierung={feld:'manuell', richtung:'asc'};
  let n=1; ks.forEach(k=>{ k.sortIndex=Object.assign({}, k.sortIndex); k.sortIndex[st.id]=(k.id===kid?0:n++); });
  saveKarten(); saveStapel();
}
function fokusToggle(){
  if(!S.fokus){ return; }
  const fk=fokusKarte();
  if(fk && !hatZeitmessung(fk)){ toast('Zeitmessung ist für diese Karte aus'); return; }   // §3 (1.9.1)
  if(S.fokus.laeuft){ fokusZeitEinbuchen(); }
  else { S.fokus.laeuft=true; S.fokus.startMs=Date.now(); saveFokus(); starteTicker(); }
  renderAlles();
}
function fokusBeenden(){ fokusZeitEinbuchen(); S.fokus=null; saveFokus(); }
function saveFokus(){ DB.set('fokus', S.fokus); }
/* ── Energie/Akku live (v1.1, v0.38-Port) ────────────────────────────
   Der Tag trägt einen einzigen Akku-Stand (%); Fokuszeit driftet ihn über
   akkuRate(karte). akkuLive() = gebuchter Stand + laufende (noch nicht
   eingebuchte) Drift der aktiven Karte. akkuBuchen() schreibt die Drift beim
   Einbuchen fest und deckelt auf 0..100. */
function akkuBuchen(k, min){
  if(!S.tag || S.tag.akku==null || !min) return;
  S.tag.akku = Math.max(0, Math.min(AKKU_MAX, num(S.tag.akku) + akkuRate(k)*min/60));   // §6.2 (1.13.0): kein 100er-Deckel mehr
}
function akkuLive(){
  if(!S.tag || S.tag.akku==null) return null;
  let a=num(S.tag.akku);
  if(S.fokus && S.fokus.laeuft){ const k=fokusKarte(); if(k) a += akkuRate(k)*(laufendeSek()/60)/60; }
  return Math.max(0, Math.min(AKKU_MAX, a));   // §6.2 (1.13.0)
}
/* Energie-Stichprobe (für die Belohnungs-Kurve): Zeit + Akku-Stand. */
function akkuSampleSchreiben(){
  if(!S.tag || S.tag.akku==null) return;
  (S.tag.akkuVerlauf=S.tag.akkuVerlauf||[]).push({ ts:jetztIso(), akku:Math.round(num(S.tag.akku)*10)/10 });
}
/* ══ §6.1 (v1.13.0) · Akku-Schnellzugriff — jederzeit live anpassbar, MIT
   Kommentar. Läuft eine Karte, hängt der Eintrag an ihr (die Karten-Mediane
   lernen weiter); läuft keine, hängt er am Tag. Kommentare reisen im Export
   mit — für Pascal Notizen, für die Planung die Gründe. ══ */
function oeffneAkkuQuick(){
  if(!tagOffen()){ toast('Kein offener Tag'); return; }
  const a=akkuLive(); if(a==null){ toast('Kein Akku-Stand gesetzt (Tagesstart)'); return; }
  const fk=fokusKarte();
  const h='<p class="d">Akku-Stand JETZT setzen. '+
    (fk?'Der Eintrag hängt an „<b>'+esc(fk.titel||'?')+'</b>" — ihre Akku-Mediane lernen weiter.'
       :'Es läuft keine Karte — der Eintrag hängt am Tag (Einbrüche ohne Aufgabenbezug gehen nicht verloren).')+'</p>'+
    '<div class="field"><label>Akku jetzt <b id="akkuQv">'+Math.round(a)+'%</b></label>'+
    '<input type="range" min="0" max="'+AKKU_MAX+'" step="5" id="akkuQ" value="'+Math.round(a)+'">'+
    '<div class="hint">über 100 % erlaubt — auch der gute Tag darf sichtbar sein (§6.2)</div></div>'+
    '<div class="field"><label>Kommentar (reist im Export mit)</label>'+
    '<textarea id="akkuQk" placeholder="z. B. „schlecht geschlafen" · „Anruf hat mich zerlegt" · „Spaziergang hat geladen"></textarea></div>';
  openSheet('🔋 Akku anpassen', h,
    '<button class="btn ghost sm" data-close="1">Abbrechen</button><button class="btn prim" data-akkuqgo="1">Speichern</button>');
}
function akkuQuickSpeichern(){
  if(!tagOffen()){ closeSheet(); return; }
  const inp=el('akkuQ'), kom=((el('akkuQk')||{}).value||'').trim();
  const vorher=akkuLive();
  const neu=Math.max(0, Math.min(AKKU_MAX, num(inp?inp.value:vorher)));
  // Laufende (noch nicht gebuchte) Drift herausrechnen, damit der Live-Wert
  // nach dem Setzen exakt `neu` zeigt — ohne den Timer anzuhalten.
  const pending=vorher-num(S.tag.akku);
  const fk=fokusKarte();
  const delta=Math.round((neu-vorher)*10)/10;
  S.tag.akku=Math.max(0, Math.min(AKKU_MAX, neu-pending));
  akkuSampleSchreiben();
  if(!Array.isArray(S.meta.akkuEintraege)) S.meta.akkuEintraege=[];
  S.meta.akkuEintraege.push({ ts:jetztIso(), datum:heuteApp(), kid:(fk&&S.fokus&&S.fokus.laeuft)?fk.id:null,
    titel:(fk&&S.fokus&&S.fokus.laeuft)?(fk.titel||''):null,
    vorher:Math.round(vorher), nachher:Math.round(neu), delta, kommentar:kom });
  if(S.meta.akkuEintraege.length>300) S.meta.akkuEintraege=S.meta.akkuEintraege.slice(-300);
  // Karten-Median lernt nur bei nennenswerter Sitzung (≥5 Min) — sonst würde
  // ein Tages-Einbruch der Karte eine absurde Rate anhängen.
  if(fk && S.fokus && S.fokus.laeuft){
    const dauer=(num(S.fokus.sessionSek)+laufendeSek())/60;
    if(dauer>=5){
      if(!Array.isArray(S.meta.akkuMessungen)) S.meta.akkuMessungen=[];
      S.meta.akkuMessungen.push({ kid:fk.id, kat:akkuKategorie(fk), datum:heuteApp(),
        delta:Math.round(delta), dauerMin:Math.round(dauer), rate:Math.round(delta/(dauer/60)*10)/10 });
      if(S.meta.akkuMessungen.length>500) S.meta.akkuMessungen=S.meta.akkuMessungen.slice(-500);
    }
  }
  saveMeta(); saveTag(); closeSheet(); renderAlles();
  toast('🔋 '+Math.round(neu)+' %'+(kom?' · Kommentar gespeichert':''));
}
/* Heute in eine Karte investierte Minuten (ab Tagesbasis, gedeckelt 16 h). */
function heuteInvestiertMin(k){
  const basis = (S.tag && S.tag.istMinutenStart && S.tag.istMinutenStart[k.id]!=null) ? num(S.tag.istMinutenStart[k.id]) : 0;
  return Math.max(0, Math.min(16*60, istSekLive(k)/60 - basis));
}

/* ── Farbsystem §5 (berechnet, nie gespeichert) ──────────────────────
   Treiber = Rangposition rank/(n−1) unter offenen Karten derselben Farbgruppe
   → stufenloses Spektrum (≥36 Töne bei genug Karten). */
function farbGruppe(k){
  if(k.uhrzeit) return 'termin';                                   // schlägt alle Regeln
  if(k.rhythmus || (Array.isArray(k.tickKurve)&&k.tickKurve.length>1)) return 'wdh';
  return k.domain==='dfm' ? 'dfm' : 'privat';
}
function farbTreiber(k){
  const g=farbGruppe(k);
  if(g==='dfm')    return num(k.geldScore);       // Geld-Score
  if(g==='privat') return kartePunkte(k);         // Punkte-Prognose
  if(g==='wdh')    return num(k.streak);          // Streak
  return 0;
}
let _rangCache=null;
function rangInvalidieren(){ _rangCache=null; }
function rangCacheBauen(){
  _rangCache={};
  const grp={};
  S.karten.forEach(k=>{ if(k.status!=='offen') return; const g=farbGruppe(k); if(g==='termin') return; (grp[g]=grp[g]||[]).push(k); });
  Object.values(grp).forEach(ks=>{
    const w=ks.map(k=>({id:k.id, v:farbTreiber(k)})).sort((a,b)=>a.v-b.v);
    const n=w.length;
    w.forEach((x,i)=> _rangCache[x.id] = n>1 ? i/(n-1) : 0.5);
  });
}
function karteNorm(k){
  if(!_rangCache) rangCacheBauen();
  return _rangCache[k.id]!=null ? _rangCache[k.id] : 0.5;
}
function hsl(h,s,l){ return 'hsl('+Math.round(h)+','+Math.round(s)+'%,'+Math.round(l)+'%)'; }
function karteFarbe(k){
  const g=farbGruppe(k);
  if(g==='termin') return hsl(215,80,62);                  // blau
  const t=karteNorm(k);                                    // 0..1 rang-normiert
  if(g==='dfm')    return hsl(50-50*t, 88, 56);            // gelb(50)→orange→rot(0)
  if(g==='privat') return hsl(140, 28+52*t, 64-16*t);      // grün hell→satt
  if(g==='wdh')    return hsl(270+50*t, 72, 64);           // lila(270)→pink(320)
  return hsl(215,10,50);
}

/* ══════════════════════════════════════════════════════════════════════
   6 · Feld-Katalog (§3.5: „JEDES Kartenfeld nach Typ filterbar",
       neue Felder erscheinen automatisch)
   ══════════════════════════════════════════════════════════════════════ */
const FELDER = {
  domain:     {label:'Domäne',    typ:'select', opt:()=>[['dfm','DFM'],['privat','Privat']]},
  kartenArt:  {label:'Kartenart', typ:'select', wert:k=>kartenArt(k), opt:()=>[['Routine','Routine'],['Counter','Counter'],['Aufgabe','Aufgabe']]},
  titel:      {label:'Titel',     typ:'text'},
  notiz:      {label:'Notiz',     typ:'text'},
  projekt:    {label:'Projekt',   typ:'select', wert:k=>k.projekt||'', opt:()=>[['','(kein Projekt)']].concat(distinct('projekt').map(v=>[v,v]))},
  geldScore:  {label:'Geld-Score',typ:'zahl'},
  faelligkeit:{label:'Fälligkeit',typ:'datum'},
  uhrzeit:    {label:'Termin',    typ:'select', wert:k=>k.uhrzeit?'ja':'nein', opt:()=>[['ja','hat Uhrzeit'],['nein','ohne']]},
  sollMin:    {label:'Soll-Min',  typ:'zahl'},
  istSek:     {label:'Ist-Min',   typ:'zahl', wert:k=>Math.round(num(k.istSek)/60)},
  komplex:    {label:'Komplexität',typ:'zahl'},
  energie:    {label:'Energie',   typ:'zahl'},
  blockade:   {label:'Blockade',  typ:'zahl'},
  prioritaet: {label:'Priorität', typ:'select', opt:()=>[['muss','muss'],['soll','soll'],['idee','idee']]},
  timerFlag:  {label:'Timer',     typ:'select', wert:k=>k.timerFlag?'ja':'nein', opt:()=>[['ja','ja'],['nein','nein']]},
  freeze:     {label:'Freeze',    typ:'select', wert:k=>k.freeze?'ja':'nein', opt:()=>[['ja','ja'],['nein','nein']]},
  letzteBearbeitung:{label:'Bearbeitet', typ:'datum', wert:k=>k.letzteBearbeitung?String(k.letzteBearbeitung).slice(0,10):null},
  rhythmus:   {label:'Wiederholung',typ:'select', wert:k=>k.rhythmus?'ja':'nein', opt:()=>[['ja','ja'],['nein','nein']]},
  status:     {label:'Status',    typ:'select', opt:()=>[['offen','offen'],['erledigt','erledigt'],['archiviert','archiviert']]},
  streak:     {label:'Streak',    typ:'zahl'},
  tagId:      {label:'Buchungstag',typ:'datum', wert:k=>k.tagId?String(k.tagId).slice(0,10):null},
  gruppeId:   {label:'Gruppe',    typ:'select', wert:k=>k.gruppeId||'', opt:()=>[['','(keine Gruppe)']].concat(S.gruppen.map(g=>[g.id,g.name]))}
};
/* Auto-Discovery: jedes weitere primitive Kartenfeld wird automatisch filterbar. */
function feldKatalog(){
  const muster = neueKarte();
  Object.keys(muster).forEach(key=>{
    if(FELDER[key]) return;
    if(['id','airtableId','herkunftId','sortIndex','tickKurve','erstelltTs','ticksHeute'].includes(key)) return;
    const v = muster[key];
    if(typeof v==='boolean') FELDER[key]={label:key, typ:'select', wert:k=>k[key]?'ja':'nein', opt:()=>[['ja','ja'],['nein','nein']]};
    else if(typeof v==='number') FELDER[key]={label:key, typ:'zahl'};
    else if(typeof v==='string' || v==null) FELDER[key]={label:key, typ:'text'};
  });
  return FELDER;
}
function feldTyp(f){ return (FELDER[f]&&FELDER[f].typ)||'text'; }
function feldLabel(f){ return (FELDER[f]&&FELDER[f].label)||f; }
function feldWert(k, f){ const m=FELDER[f]; return (m&&m.wert)?m.wert(k):k[f]; }
function distinct(f){ const s=new Set(); S.karten.forEach(k=>{ if(k[f]!=null && k[f]!=='') s.add(k[f]); }); return [...s].sort(); }

/* ══════════════════════════════════════════════════════════════════════
   7 · Filter- & Sortier-Engine (§3.5)
   Mehrere Filter = UND über Felder, ODER innerhalb eines Feldes.
   ══════════════════════════════════════════════════════════════════════ */
function datumMatch(v, f){
  const dv = v ? String(v).slice(0,10) : null, h=heuteApp();
  switch(f.op){
    case 'heute':       return dv===h;
    case 'ueberfaellig':return !!dv && dv<h;
    case 'zukunft':     return !!dv && dv>h;
    case 'keine':       return !dv;
    case 'zeitraum':    return !!dv && (!f.von||dv>=f.von) && (!f.bis||dv<=f.bis);
    default: return true;
  }
}
function filterEinzel(k, f){
  const typ=feldTyp(f.feld), v=feldWert(k, f.feld);
  if(typ==='select'){
    const set=(f.werte||[]).map(String), cur=String(v==null?'':v);
    return f.op==='istNicht' ? !set.includes(cur) : set.includes(cur);
  }
  if(typ==='zahl'){
    const n=num(v), w=num(f.wert);
    return f.op==='lte' ? n<=w : n>=w;   // Default: gte
  }
  if(typ==='datum') return datumMatch(v, f);
  // text
  return String(v==null?'':v).toLowerCase().includes(String(f.wert||'').toLowerCase());
}
function stapelKarten(st){
  // §10 (v1.12.0): „Geplant DFM/Privat" = alle offenen Karten der Domäne,
  // sortiert nach Fälligkeit; „Erledigt" chronologisch. (Alt-IDs sys-heute/
  // sys-schnell existieren nach der Migration nicht mehr.)
  if(st && (st.id==='sys-dfm' || st.id==='sys-privat')){
    const d=st.id==='sys-privat'?'privat':'dfm';
    let ks=S.karten.filter(k=>k.status==='offen' && k.domain===d);
    const art=(S.ui.stapelArt&&S.ui.stapelArt[st.id])||'alle';   // §10: Art-Filter bleibt
    if(art==='aufgabe') ks=ks.filter(k=>kartenArt(k)==='Aufgabe');
    else if(art==='routine') ks=ks.filter(k=>{ const a=kartenArt(k); return a==='Routine'||a==='Counter'; });
    return sortiereStapel(ks, st);
  }
  if(st && st.id==='sys-erledigt') return erledigtKarten();
  const byFeld={};
  (st.filter||[]).forEach(f=>{ (byFeld[f.feld]=byFeld[f.feld]||[]).push(f); });
  const gruppen=Object.values(byFeld);
  let ks=S.karten.filter(k=>{
    if(k.status==='archiviert' && !filterNenntArchiv(st)) return false;
    return gruppen.every(g=> g.some(f=>filterEinzel(k,f)));
  });
  return sortiereStapel(ks, st);
}
/* §2.3 (v1.6.0): „Erledigt" — alle abgeschlossenen Karten chronologisch,
   jüngste zuerst. Sortierschlüssel ist der jüngste Abschluss-Snapshot (§6.1),
   ersatzweise der Buchungstag bzw. die letzte Bearbeitung. */
function abschlussZeit(k){
  const a=Array.isArray(k.abschluesse)&&k.abschluesse.length ? k.abschluesse[k.abschluesse.length-1] : null;
  return (a && a.ts) || k.letzteBearbeitung || (k.tagId?String(k.tagId).slice(0,10)+'T23:59:59':'') || '';
}
function erledigtKarten(){
  return S.karten.filter(k=>k.status==='erledigt')
    .slice().sort((a,b)=> abschlussZeit(a)<abschlussZeit(b)?1:-1);
}
function filterNenntArchiv(st){
  return (st.filter||[]).some(f=>f.feld==='status' && (f.werte||[]).includes('archiviert'));
}
const PRI_RANK={muss:0, soll:1, idee:2};
function sortiereStapel(ks, st){
  const so=st.sortierung||{feld:'auto',richtung:'asc'};
  const dir=(so.richtung==='desc')?-1:1;
  const erl=k=>k.status==='erledigt'?1:0;   // Abgehakte ans Ende (§3.5)
  ks.sort((a,b)=>{
    // V1.2: im manuellen Modus KEINE Zusatzregeln — die manuelle Reihenfolge gilt absolut
    // (auch erledigte Karten bleiben, wo sie hingeschoben wurden). Sonst „erledigt ans Ende".
    if(so.feld!=='letzteBearbeitung' && so.feld!=='manuell' && erl(a)!==erl(b)) return erl(a)-erl(b);
    if(so.feld==='manuell'){
      const sa=num(a.sortIndex&&a.sortIndex[st.id], 9e9), sb=num(b.sortIndex&&b.sortIndex[st.id], 9e9);
      if(sa!==sb) return (sa-sb)*dir;   // U3: Richtungs-Toggle wirkt in jedem Modus
    } else if(so.feld==='letzteBearbeitung'){
      // A7: nach Zeitstempel (asc = am längsten her zuerst), per Richtung umkehrbar
      const la=a.letzteBearbeitung||'', lb=b.letzteBearbeitung||'';
      if(la!==lb) return (la<lb?-1:1)*dir;
    } else if(so.feld && so.feld!=='auto'){
      let va=feldWert(a,so.feld), vb=feldWert(b,so.feld);
      if(feldTyp(so.feld)==='zahl'){ va=num(va); vb=num(vb); }
      else { va=String(va==null?'':va); vb=String(vb==null?'':vb); }
      if(va<vb) return -1*dir; if(va>vb) return 1*dir;
    } else {
      // A5 auto: Fälligkeit inkl. Uhrzeit früh→spät (Überfällige zuerst, ohne Termin ans Ende) → Priorität
      const fa=(a.faelligkeit||'9999-99-99')+'T'+(a.uhrzeit||'99:99');
      const fb=(b.faelligkeit||'9999-99-99')+'T'+(b.uhrzeit||'99:99');
      if(fa!==fb) return (fa<fb?-1:1)*dir;      // U3: Richtungs-Toggle wirkt auch auf die Auto-Sortierung
      const pa=PRI_RANK[a.prioritaet]??1, pb=PRI_RANK[b.prioritaet]??1;
      if(pa!==pb) return (pa-pb)*dir;
    }
    return String(a.titel).localeCompare(String(b.titel));
  });
  return ks;
}
/* A5: Karte im Stapel eine Position hoch/runter. Überführt den Stapel in den
   manuellen Modus und schreibt die aktuelle Anzeige-Reihenfolge als sortIndex
   fest, dann Tausch mit dem Nachbarn. */
/* §1 (v1.8.0) BUGFIX: schrieb sortIndex[stapelId], das seit v1.6.0 niemand
   mehr las. Jetzt je Kontext: „Heute" ordnet die Tageskette direkt um;
   Fokus-Liste/Schnellauswahl tauschen über den Ansichts-Schlüssel; „Erledigt"
   hat keine Pfeile (Chronologie). */
function karteSortieren(kid, dir, kontext){
  if(kontext==='sys-erledigt') return;
  // §1 (v1.12.0): Ketten-Kontexte ordnen die Kette der Karten-Domäne um.
  if(kontext==='kette' || kontext==='sys-heute'){
    if(ketteBewegen(kid, dir)) renderAlles();
    return;
  }
  const key=String(kontext||'');
  if(key.indexOf('fl|')!==0) return;
  const ks=ansichtsListe(key);
  const i=ks.findIndex(k=>k.id===kid), j=i+dir;
  if(i<0 || j<0 || j>=ks.length) return;
  const a=ks[i], b=ks[j];
  a.sortIndex=Object.assign({}, a.sortIndex); a.sortIndex[key]=j;
  b.sortIndex=Object.assign({}, b.sortIndex); b.sortIndex[key]=i;
  saveKarten(); renderAlles();
}
/* §3.5 KPI: offen/alle · Punktesumme (offen=Prognose/Soll, erledigt=Ist) · Ø-Dauer */
function stapelKpi(ks){
  const alle=ks.length, offen=ks.filter(k=>k.status==='offen').length;
  let punkte=0, dauerSum=0, dauerN=0;
  ks.forEach(k=>{
    punkte += kartePunkte(k);
    const min = (num(k.istSek)>0)?num(k.istSek)/60:num(k.sollMin);
    if(min>0){ dauerSum+=min; dauerN++; }
  });
  return { alle, offen, punkte:Math.round(punkte), avgMin: dauerN?Math.round(dauerSum/dauerN):0 };
}

/* ══════════════════════════════════════════════════════════════════════
   8 · Seeds — 3 vorangelegte Stapel (§3.5). Nur beim ersten Start,
       danach normal editier-/löschbar (keine Systemlogik).
   ══════════════════════════════════════════════════════════════════════ */
/* §2 (v1.6.0): Die 11 Standardstapel entfallen. Es bleiben genau ZWEI Stapel —
   „Heute" (die einzige Kette der App, steuert die Swipe-Reihenfolge) und
   „Erledigt" (chronologisch, zum Zurückholen). Beide werden NICHT über die
   Filter-Engine gespeist, sondern in stapelKarten() gesondert behandelt.
   Eigene Stapel sind nicht mehr anlegbar; die Filterung läuft über die drei
   Navigationsebenen auf der Fokusseite. */
/* §10 (v1.12.0): Drei Stapel — „Geplant DFM" und „Geplant Privat" (verfestigte
   Ebene 1, Karten außerhalb der Kette erscheinen an ihrem Fälligkeitsdatum)
   plus „Erledigt" (chronologisch). „Heute" ist in den beiden Ketten
   aufgegangen; die Schnellauswahl ist entfallen (§1.3). */
function standardStapelDefs(){
  return [
    {id:'sys-dfm',      name:'Geplant DFM',    farbe:'#4f8ef7', filter:[], sortierung:{feld:'faelligkeit', richtung:'asc'}},
    {id:'sys-privat',   name:'Geplant Privat', farbe:'#f2b84b', filter:[], sortierung:{feld:'faelligkeit', richtung:'asc'}},
    {id:'sys-erledigt', name:'Erledigt', farbe:'#3ecf8e', filter:[], sortierung:{feld:'abschluss',richtung:'desc'}}
  ];
}
/* ══ §1 (v1.8.0) · Manuelle Position je ANSICHT ══════════════════════════
   Hoch/Runter schrieb sortIndex[stapelId] — aber seit v1.6.0 liest kein
   Sonderstapel das Feld mehr (Kette/Chronologie), und in der Fokus-Liste gab
   es gar keinen Stapel. Jetzt: „Heute" ordnet die Tageskette selbst um; jede
   andere Ansicht bekommt einen eigenen sortIndex-Schlüssel
   (fl|Domäne|Art|Ebene3 bzw. sys-schnell). Manuell platzierte Karten schlagen
   die Auto-Sortierung, unverschobene behalten ihre Auto-Position. */
function ansichtsKey(gruppe){
  const d=navDomain();
  return 'fl|'+d+'|'+navArt()+'|'+(d==='dfm'?navSort():String(gruppe||''));
}
function anwendenManuell(ks, key){
  const mit=[], ohne=[];
  ks.forEach(k=>{ const i=k.sortIndex&&k.sortIndex[key]; if(i!=null) mit.push(k); else ohne.push(k); });
  if(!mit.length) return ks;
  mit.sort((a,b)=>num(a.sortIndex[key])-num(b.sortIndex[key]));
  const out=ohne.slice();
  mit.forEach(k=>out.splice(Math.max(0,Math.min(num(k.sortIndex[key]), out.length)), 0, k));
  return out;
}
/* Render-Reihenfolge einer Ansicht — dieselbe Funktion nutzt karteSortieren
   als LESESEITE, damit Schreiben und Lesen nie wieder auseinanderlaufen. */
function ansichtsListe(key){
  if(String(key).indexOf('fl|')===0){
    const t=String(key).split('|');
    const basis=navFilter(S.karten.filter(k=>k.status==='offen'));
    if(t[1]==='privat' && t[3]){
      const g=navGruppen(basis).find(x=>x.key===t[3]);
      return g?anwendenManuell(g.karten, key):[];
    }
    return anwendenManuell(navSortiere(basis), key);
  }
  return [];
}
/* §1.3 (v1.12.0): Die Schnellauswahl ist entfallen — die Migration hat ihre
   Karten in die Ketten übernommen. */
/* ══════════════════════════════════════════════════════════════════════
   §2.2 (v1.6.0) · Tageskette „Heute" — ein Array von App-IDs je Kalendertag
   mit Rollover nicht erledigter Einträge auf den Folgetag. Sie ist die
   einzige Kette der App und bestimmt die Swipe-Reihenfolge im Fokus.
   ══════════════════════════════════════════════════════════════════════ */
/* §1 (v1.12.0) · ZWEI Ketten statt einer — ketteDfm und kettePrivat, beide mit
   Rollover, Umsortierung und Entfernen wie die bisherige Tageskette. Persistenz
   in meta.ketten={dfm:{datum,ids,entfernt}, privat:{...}}. */
function ketteState(dom){
  const d=(dom==='privat')?'privat':'dfm';
  if(!S.meta.ketten || typeof S.meta.ketten!=='object') S.meta.ketten={};
  if(!S.meta.ketten[d] || !Array.isArray(S.meta.ketten[d].ids))
    S.meta.ketten[d]={ datum:null, ids:[], entfernt:[] };
  return S.meta.ketten[d];
}
/* Auto-Vorschlag: offene Karten DER DOMÄNE, die heute (oder überfällig) dran
   sind. §12.1: privat stehen die Morgenroutinen vorn. */
function ketteAutoIds(dom){
  const d=(dom==='privat')?'privat':'dfm', h=heuteApp();
  let ks=S.karten.filter(k=>k.status==='offen' && k.domain===d && k.faelligkeit && k.faelligkeit<=h);
  if(d==='privat') ks=ks.slice().sort((a,b)=>{
    const ma=tagesabschnittHat(a,'morgens')?0:1, mb=tagesabschnittHat(b,'morgens')?0:1;
    return ma-mb;
  });
  return ks.map(k=>k.id);
}
/* Kette einer Domäne für heute — Rollover offener Einträge, Auto-Nachzug ans
   Ende, verwaiste/fremddomänige IDs still aussortiert. */
function tagesKetteDom(dom){
  const d=(dom==='privat')?'privat':'dfm';
  const st=ketteState(d), h=heuteApp();
  if(st.datum!==h){
    const uebrig=(st.ids||[]).filter(id=>{ const k=S.karten.find(x=>x.id===id); return k && k.status==='offen'; });
    const auto=ketteAutoIds(d).filter(id=>uebrig.indexOf(id)<0);
    st.datum=h; st.ids=uebrig.concat(auto); st.entfernt=[]; saveMeta();
    ketteHistLog(d);   // §2 (v1.13.1): auch der Rollover ist eine Kettenänderung
  } else {
    const bekannt=new Set(st.ids), entfernt=new Set(st.entfernt||[]);
    const neu=ketteAutoIds(d).filter(id=>!bekannt.has(id) && !entfernt.has(id));
    if(neu.length){ st.ids=st.ids.concat(neu); saveMeta();
      ketteHistLog(d);   // §2 (v1.13.1): der Auto-Nachzug schrieb NIE Historie — genau er hat die 4→41-Änderung unprotokolliert gelassen
      // §5.5 (v1.13.0): Nachzug WÄHREND des laufenden Tages = ungeplante Last
      if(tagOffen()){ let dirty=false;
        neu.forEach(id=>{ const k=S.karten.find(x=>x.id===id); if(k && !k.ungeplant){ k.ungeplant=true; dirty=true; } });
        if(dirty) saveKarten(); }
    }
  }
  const lebt=st.ids.filter(id=>{ const k=S.karten.find(x=>x.id===id); return k && k.domain===d; });
  if(lebt.length!==st.ids.length){ st.ids=lebt; saveMeta(); }
  return st.ids;
}
/* Beide Ketten in einer Reihe (DFM zuerst) — für Sheet, Export, Übersichten. */
function tagesKette(){ return tagesKetteDom('dfm').concat(tagesKetteDom('privat')); }
function ketteKarten(dom){
  const by={}; S.karten.forEach(k=>by[k.id]=k);
  return (dom?tagesKetteDom(dom):tagesKette()).map(id=>by[id]).filter(Boolean);
}
function ketteHat(id){ return tagesKette().indexOf(id)>=0; }
/* Manuelles Ergänzen/Entfernen — immer in der Kette der Karten-Domäne. */
function ketteToggle(id){
  const k=S.karten.find(x=>x.id===id); if(!k) return false;
  const st=ketteState(k.domain); tagesKetteDom(k.domain);
  const i=st.ids.indexOf(id);
  if(!Array.isArray(st.entfernt)) st.entfernt=[];
  if(i>=0){ st.ids.splice(i,1); if(st.entfernt.indexOf(id)<0) st.entfernt.push(id); }
  else { st.ids.push(id); st.entfernt=st.entfernt.filter(x=>x!==id);
    if(tagOffen() && !k.ungeplant){ k.ungeplant=true; saveKarten(); } }   // §5.5 (v1.13.0)
  saveMeta(); ketteHistLog(k.domain); return i<0;
}
/* Reihenfolge setzen. Mit dom: genau diese Kette. Ohne dom (Tagesplanung,
   Alt-Import): IDs nach Karten-Domäne aufteilen, Reihenfolge erhalten. */
function ketteSetzen(ids, dom){
  if(dom){
    const d=(dom==='privat')?'privat':'dfm', st=ketteState(d);
    st.datum=heuteApp();
    st.ids=(ids||[]).filter((id,i,a)=>a.indexOf(id)===i && S.karten.some(k=>k.id===id && k.domain===d));
    // §1 (v1.13.1): Explizites Setzen ERSETZT die Kette wirklich — alles
    // Fällige, das NICHT genannt ist, gilt als bewusst draußen. Vorher wurde
    // entfernt geleert und der Auto-Nachzug (tagesKetteDom) holte jede
    // fällige Karte sofort zurück (DFM: 4 gesetzt → 41 in der Kette).
    st.entfernt=ketteAutoIds(d).filter(id=>st.ids.indexOf(id)<0);
    saveMeta(); ketteHistLog(d); return;
  }
  const by={}; S.karten.forEach(k=>by[k.id]=k);
  ketteSetzen((ids||[]).filter(id=>by[id] && by[id].domain!=='privat'), 'dfm');
  ketteSetzen((ids||[]).filter(id=>by[id] && by[id].domain==='privat'), 'privat');
}
/* §9.2: Karte in ihrer Kette bewegen. dir −1/+1 = eine Position, 'top' = ganz
   nach oben (startet gem. §6 die Uhr — Uhr folgt der Handlung des Aufrufers). */
function ketteBewegen(id, dir){
  const k=S.karten.find(x=>x.id===id); if(!k) return false;
  const st=ketteState(k.domain); tagesKetteDom(k.domain);
  const i=st.ids.indexOf(id); if(i<0) return false;
  if(dir==='top'){ st.ids.splice(i,1); st.ids.unshift(id); }
  else { const j=i+dir; if(j<0||j>=st.ids.length) return false;
    const t=st.ids[i]; st.ids[i]=st.ids[j]; st.ids[j]=t; }
  saveMeta(); ketteHistLog(k.domain); return true;
}
/* §13: Kettenhistorie des laufenden Tages — jede Umsortierung wird lokal
   festgehalten (unbegrenzt; ins Sync-Paket reist nur der aktuelle Tag). */
function ketteHistLog(dom){
  try{
    if(!S.meta.kettenHistorie) S.meta.kettenHistorie={};
    const h=heuteApp();
    if(!Array.isArray(S.meta.kettenHistorie[h])) S.meta.kettenHistorie[h]=[];
    S.meta.kettenHistorie[h].push({ ts:jetztIso(), dom:(dom==='privat')?'privat':'dfm',
      ids:ketteState(dom).ids.slice() });
    if(S.meta.kettenHistorie[h].length>500) S.meta.kettenHistorie[h]=S.meta.kettenHistorie[h].slice(-500);
    saveMeta();
  }catch(e){}
}
const STD_STAPEL_IDS = standardStapelDefs().map(d=>d.id);
/* Standardstapel-Set herstellen: Reihenfolge fix, eigene Stapel bleiben darunter,
   alte System-Stapel (die nicht mehr in der Liste sind) entfallen. Reine Config
   (Karten-sortIndex bleibt unberührt). */
/* v1.6.0: Es gibt nur noch die beiden festen Stapel. Frühere System- UND eigene
   Stapel fallen aus der Konfiguration (Sicherung liegt in stapel_bak160). */
function syncStandardStapel(){
  S.stapel = standardStapelDefs().map(d=>neuerStapel(Object.assign({}, d, { vorangelegt:true })));
  if(STD_STAPEL_IDS.indexOf(S.ui.aktivStapel)<0) S.ui.aktivStapel='sys-dfm';
  saveStapel(); saveUi();
}
function seedStapel(){
  if(!S.meta.stapelV4){ syncStandardStapel(); S.meta.stapelV4=true; }   // A6: einmalige Umstellung
  if(!S.meta.stapelV6){ syncStandardStapel(); S.meta.stapelV6=true; }   // U6-B: +„Zuletzt hinzugefügt"
  if(!S.meta.stapelV8){ syncStandardStapel(); S.meta.stapelV8=true; }   // §4 (1.8.0): +„Schnellauswahl"
  S.meta.seeded=true; saveMeta();
}

/* ══════════════════════════════════════════════════════════════════════
   9 · Rendering — D2 Stapelübersicht
   ══════════════════════════════════════════════════════════════════════ */
function mmss(sek){ sek=Math.max(0,Math.round(sek)); const m=Math.floor(sek/60), s=sek%60; return m+':'+String(s).padStart(2,'0'); }
/* H:MM:SS für den großen Fokus-Timer (v0.38-Tacho). */
function hms(sek){ sek=Math.max(0,Math.round(sek)); const h=Math.floor(sek/3600), m=Math.floor(sek%3600/60), s=sek%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
/* Kompakte Dauer „3h00" / „45m" für KPI-Subtexte. */
function tZeitKurz(min){ min=Math.max(0,Math.round(min)); return min>=60 ? Math.floor(min/60)+'h'+String(min%60).padStart(2,'0') : min+'m'; }
/* Punkte-Prognose der Karte bei genau `min` investierten Minuten (Engine 1:1). */
function kartePunkteBei(k, min){ return kartePunkte(Object.assign({}, k, { istSek: Math.max(0,min)*60 })); }
const RING_C = 2*Math.PI*58;    // Umfang Timer-Ring
const RING_CP = 2*Math.PI*48;   // Umfang Fortschritts-Ring
/* ══ §5.1 (v1.8.0) · P/h-Pfeil gegen den Gruppenschnitt ══════════════════
   Vier getrennte Schnitte (Domäne × Aufgaben/Routinen, Counter zählen zu den
   Routinen wie überall seit v1.6.0). Grundlage: tatsächlich erreichte P/h aller
   Karten der Gruppe mit nennenswerter Ist-Zeit. Beim Rendern berechnet, nie
   persistiert; unter PH_MIN_KARTEN Datenpunkten wird der Pfeil weggelassen. */
const PH_MIN_KARTEN = 3;     // Mindestzahl Karten je Schnitt, sonst kein Pfeil
const PH_MIN_MIN    = 10;    // Karten unter 10 Ist-Minuten verzerren nur — raus
const PH_NEUTRAL    = 0.15;  // ±15 % um den Schnitt = neutral (→)
let _phCache=null;
function phGruppe(k){ return (k.domain==='dfm'?'dfm':'privat')+'|'+(kartenArt(k)==='Aufgabe'?'A':'R'); }
function phSchnitte(){
  if(_phCache) return _phCache;
  const agg={};
  S.karten.forEach(k=>{
    if(k.status==='archiviert') return;
    const min=num(k.istSek)/60; if(min<PH_MIN_MIN) return;
    const p=kartePunkte(k); if(!(p>0)) return;
    const g=phGruppe(k), o=agg[g]||(agg[g]={sum:0,n:0});
    o.sum+=p/(min/60); o.n++;
  });
  _phCache={};
  Object.keys(agg).forEach(g=>{ _phCache[g]={ schnitt:agg[g].sum/agg[g].n, n:agg[g].n }; });
  return _phCache;
}
function phBadge(k){
  const sollM=num(k.sollMin);
  const planPh = sollM>0 ? kartePunkteGeplant(k)/(sollM/60) : null;
  const min=istSekLive(k)/60;
  let pfeil='', farbe='var(--mut2)';
  if(min>=PH_MIN_MIN){
    const s=phSchnitte()[phGruppe(k)];
    if(s && s.n>=PH_MIN_KARTEN){
      const eigen=kartePunkte(k)/(min/60);
      if(eigen>s.schnitt*(1+PH_NEUTRAL)){ pfeil='▲'; farbe='var(--ok)'; }
      else if(eigen<s.schnitt*(1-PH_NEUTRAL)){ pfeil='▼'; farbe='var(--bad)'; }
      else { pfeil='→'; farbe='var(--warn)'; }
    }
  }
  if(!pfeil && planPh==null) return '';
  return '<span style="color:'+farbe+'">'+pfeil+(planPh!=null?' '+Math.round(planPh)+' P/h':'')+'</span>';
}
function istBadge(k){
  const laeuft = S.fokus && S.fokus.karteId===k.id && S.fokus.laeuft;
  const min = istSekLive(k)/60;
  if(laeuft) return '<span class="tag">▶ '+mmss(istSekLive(k))+'</span>';
  if(min>0.05) return '<span><b>'+Math.round(min)+'</b>′ ist</span>';
  return '';
}
function kartenreiheHtml(k, stapelId){
  const meta=[];
  meta.push('<span class="art">'+esc(kartenArtLabel(k))+'</span>');   // §11.1: Label folgt Grundart
  if(k.faelligkeit) meta.push('<span class="tag">'+esc(fmtDatum(k.faelligkeit))+'</span>');
  if(k.uhrzeit) meta.push('<span class="tag">🕐 '+esc(k.uhrzeit)+'</span>');
  // §5 (v1.8.0): Ist/Soll-Zeit kombiniert, Punkte ist/geplant, P/h-Pfeil gegen
  // den Schnitt der eigenen Gruppe (Domäne × Art) — jeweils nur wenn vorhanden.
  const istMin=istSekLive(k)/60, sollM=num(k.sollMin);
  const laeuftJetzt = S.fokus && S.fokus.karteId===k.id && S.fokus.laeuft;
  if(laeuftJetzt) meta.push('<span class="tag">▶ '+mmss(istSekLive(k))+(sollM>0?' / '+sollM+'′':'')+'</span>');
  else if(istMin>0.05 && sollM>0) meta.push('<span><b>'+Math.round(istMin)+'</b>′ / '+sollM+'′</span>');
  else if(istMin>0.05) meta.push('<span><b>'+Math.round(istMin)+'</b>′ ist</span>');
  else if(sollM>0) meta.push('<span><b>'+sollM+'</b>′</span>');
  const istRout = kartenArt(k)==='Routine' || kartenArt(k)==='Counter';
  {
    const pIst=Math.round(kartePunkte(k)), pPlan=Math.round(kartePunkteGeplant(k));
    if(pPlan>0 && pPlan!==pIst) meta.push('<span><b>'+pIst+'</b> / '+pPlan+' P</span>');
    else if(pIst>0 || !istRout) meta.push('<span><b>'+pIst+'</b> P</span>');
  }
  const phb=phBadge(k); if(phb) meta.push(phb);
  if(k.prioritaet==='muss') meta.push('<span class="pri-muss">muss</span>');
  if(k.domain==='dfm' && k.projekt) meta.push('<span>'+esc(k.projekt)+'</span>');
  if(k.rhythmus && num(k.streak)>0) meta.push('<span>🔥'+num(k.streak)+'</span>');
  const subCount = untermenge(k.id).length;
  if(subCount) meta.push('<span>☰ '+subCount+'</span>');
  if(k.freeze) meta.push('<span class="frost">❄︎ eingefroren</span>');   // A4
  if(k.ungeplant && k.status==='offen') meta.push('<span style="color:var(--warn)">⚡ ungeplant</span>');   // §5.5 (v1.13.0)
  if(stapelId==='sys-bearbeitet' && k.letzteBearbeitung) meta.push('<span class="vor">'+fmtVor(k.letzteBearbeitung)+'</span>');   // A7
  const laeuft = S.fokus && S.fokus.karteId===k.id && S.fokus.laeuft;
  // §1/§3 (v1.9.1): ▶ BEDINGUNGSLOS auf jeder Karte — er heißt „in den Fokus".
  // Ob dabei eine Stoppuhr läuft, entscheidet fokusStarten über hatZeitmessung.
  const startBtn = (k.status==='erledigt'
    ? '<button class="kstart auftau" data-fokusstart="'+k.id+'" data-stapel="'+esc(stapelId||'')+'" aria-label="Wieder öffnen &amp; Timer">▶</button>'   // Mini-6b B: erledigte Karte reaktivieren
    : (k.freeze
      ? '<button class="kstart auftau" data-fokusstart="'+k.id+'" data-stapel="'+esc(stapelId||'')+'" aria-label="Auftauen &amp; in den Fokus">▶</button>'   // A4: auftauen + Fokus
      : '<button class="kstart'+(laeuft?' laeuft':'')+'" data-fokusstart="'+k.id+'" data-stapel="'+esc(stapelId||'')+'" aria-label="In den Fokus starten">'+(laeuft?'⏸':'▶')+'</button>'));
  // §1.3 (v1.8.0): im Erledigt-Stapel keine Pfeile — Chronologie bleibt Chronologie
  const sortCtrl = stapelId==='sys-erledigt' ? '' :
    '<div class="ksort"><button class="sar" data-sortup="'+k.id+'" data-stapel="'+esc(stapelId||'')+'" aria-label="hoch">▲</button>'+
    '<button class="sar" data-sortdown="'+k.id+'" data-stapel="'+esc(stapelId||'')+'" aria-label="runter">▼</button></div>';
  // §4 (v1.9.1): Ticks sind eine Ebene OBENDRAUF, kein Ersatz — eine getickte
  // Karte kann auch fertig sein. Bei ticksAktiv stehen ＋ und ✓ nebeneinander.
  const rechts = (istTickKarte(k)
    ? '<button class="kcheck ktick" data-tickplus="'+k.id+'" aria-label="Tick +">＋</button>' : '')
    + '<div class="kcheck" data-check="'+k.id+'"><div class="box">✓</div></div>';
  // §2 (v1.8.0): Schieben + Archivieren neu in der Karte
  const schiebBtn = k.status==='offen'
    ? '<button class="kstart kschieb" data-schieb="'+k.id+'" aria-label="Schieben">⏭</button>' : '';
  const archivBtn = k.status!=='archiviert'
    ? '<button class="karchiv" data-archiv="'+k.id+'" aria-label="Archivieren">🗑</button>' : '';
  // §1.2/§1.3 (v1.12.0): Pin- und Schnellauswahl-Toggles sind entfallen.
  // A4: Freeze-Toggle ❄︎ (eingefroren hervorgehoben)
  const freezeBtn = '<button class="kfreeze'+(k.freeze?' on':'')+'" data-freeze="'+k.id+'" aria-label="Einfrieren">❄︎</button>';
  // §9.2 (v1.12.0): Ketten-Knopf mit voller Funktion (Aktions-Sheet)
  const ketteBtn = k.status==='offen'
    ? '<button class="kkette'+(ketteHat(k.id)?' on':'')+'" data-kette="'+k.id+'" aria-label="Kette">▤</button>' : '';
  // v1.7.2 Hotfix: Die Karte ist ein BLOCK mit zwei Zeilen. Zeile 1 = Titel+Meta
  // über die volle Breite (acht 44px-Elemente daneben ließen dem Titel auf dem
  // iPhone ~34px — er brach buchstabenweise um). Zeile 2 = ALLE Bedienelemente
  // in drei Gruppen (Sortieren | Toggles | Start/Abhaken), dieselben
  // data-Attribute und Handler, reine Umplatzierung. Umrandung umlaufend in
  // karteFarbe(k) statt nur linker Kante.
  // §2.1 (v1.8.0): zwei Werkzeugzeilen — PRIMÄR groß (Start · Schieben ·
  // Erledigt/Tick, tragen den Arbeitsfluss, ≥44px), SEKUNDÄR kleiner (Position,
  // Zu Heute, Pin, Wartend, Schnellauswahl, Archivieren — 40px). Fehlende
  // Elemente lassen die Zeile symmetrisch zusammenrücken.
  // §8 (v1.8.0): heute nicht Fälliges (Zukunfts-Deadline, Routine am freien
  // Tag) wird wie Wartendes ausgegraut — rein visuell, EIN Erscheinungsbild.
  const gedimmt = (k.freeze || istNichtFaellig(k)) && !(S.fokus && S.fokus.karteId===k.id);   // §3.1 (1.10.0): gestartete Karte nie gedimmt
  return '<div class="krow '+(k.status==='erledigt'?'erledigt ':'')+(gedimmt?'eingefroren ':'')+(istRout?'routinezeile ':'')+'" data-kid="'+k.id+'" style="border-color:'+karteFarbe(k)+'">'+
    '<div class="kmain" data-detail="'+k.id+'">'+
      '<div class="ktitle">'+esc(k.titel||'(ohne Titel)')+'</div>'+
      '<div class="kmeta">'+meta.join('')+'</div>'+
    '</div>'+
    '<div class="ktools">'+
      '<div class="trow tprim">'+startBtn+schiebBtn+rechts+'</div>'+
      '<div class="trow tsek">'+sortCtrl+ketteBtn+freezeBtn+archivBtn+'</div>'+   // §1 (v1.12.0): Pin/Schnellauswahl entfallen
    '</div>'+
  '</div>';
}
/* §8 (v1.8.0): heute nicht fällig = Zukunfts-Deadline ODER Routine, die laut
   Rhythmus heute nicht dran ist. Vergleich gegen den App-Tag, nicht die
   Systemuhr-Mitternacht. Rein visuell — keinerlei Logik-Wirkung. */
function istNichtFaellig(k){
  if(k.status!=='offen') return false;
  const h=heuteApp();
  if(k.rhythmus) return !routineFaellig(k, h) && !(num(k.ticksHeute)>0 || k.zuletztRoutine===h);
  return !!k.faelligkeit && k.faelligkeit>h;
}
/* Karten eines Stapels rendern — Gruppen-Mitglieder als einklappbaren Block
   an der Position ihrer besten (erstsortierten) Karte (§3.3). */
function stapelRowsHtml(st, ks){
  if(!ks.length) return '<div class="leer">keine Karten</div>';
  let rows=''; const gezeigt=new Set();
  ks.forEach(k=>{
    if(gezeigt.has(k.id)) return;
    if(k.gruppeId && S.gruppen.some(g=>g.id===k.gruppeId)){
      const mit=ks.filter(x=>x.gruppeId===k.gruppeId);
      mit.forEach(x=>gezeigt.add(x.id));
      const key=st.id+':'+k.gruppeId, zu=S.ui.gruppeZu[key];
      rows+='<div class="kgruppe '+(zu?'zu':'')+'">'+
        '<div class="kgkopf" data-gtoggle="'+key+'"><span class="caret">▾</span>📦 '+esc(gruppeName(k.gruppeId))+
          ' <span class="ganz">'+mit.length+'</span><span class="sp"></span>'+
          '<button class="kg-edit" data-gruppeaktion="'+k.gruppeId+'">⚙︎</button></div>'+
        '<div class="kgbody">'+mit.map(x=>kartenreiheHtml(x, st.id)).join('')+'</div></div>';
    } else { gezeigt.add(k.id); rows+=kartenreiheHtml(k, st.id); }
  });
  return rows;
}
function stapelHtml(st){

/* ══════════════════════════════════════════════════════════════════════
   9b · D1 Fokus-View + Fokus-Leiste + Farbstreifen (§7 D1)
   ══════════════════════════════════════════════════════════════════════ */
/* Durchwechsel-Set: begonnene offene Karten PLUS alle Muss-Karten (offen). */
/* Fokus-Karussell = ausschließlich die offenen Karten des GEWÄHLTEN Stapels
   (in Stapel-Reihenfolge). Keine karten aus anderen Stapeln. */
/* §2.2 (v1.6.0): Das Fließband ist die Tageskette „Heute" — sie bestimmt die
   Swipe-Reihenfolge, unabhängig von den drei Navigationsebenen (die filtern nur
   die Liste darunter). Ist die Kette leer, greift ersatzweise die aktuelle
   Navigationsauswahl, damit die Fokusseite nie leer dasteht. */
function fokusKandidaten(){
  // §9.1 (v1.12.0): Das Fliessband folgt der Kette der AKTIVEN Domaene,
  // ersatzweise beiden Ketten, zuletzt dem Filter.
  const eigene=ketteKarten(navDomain()).filter(k=>k.status==='offen');
  if(eigene.length) return eigene;
  const beide=ketteKarten().filter(k=>k.status==='offen');
  if(beide.length) return beide;
  return navSortiere(navFilter(S.karten.filter(k=>k.status==='offen')));
}
/* U2 (v1.4.0): heute bearbeitete Karten, zuletzt bearbeitete zuerst —
   Datenbasis der Rückwärts-Navigation (stapelunabhängig). */
function fokusVerlaufHeute(){
  const h=heuteApp();
  return S.karten.filter(k=>k.letzteBearbeitung && String(k.letzteBearbeitung).slice(0,10)===h && k.status!=='archiviert')
    .slice().sort((a,b)=> a.letzteBearbeitung<b.letzteBearbeitung?1:-1);
}
/* Immer DASSELBE Objekt zurückgeben — sonst zeigen Aufrufer auf eine Kopie und
   ihre Änderungen verpuffen. */
function fokusNav(){
  if(!S.ui.fokusNav || typeof S.ui.fokusNav!=='object') S.ui.fokusNav={hist:0, stapel:null};
  if(S.ui.fokusNav.hist==null) S.ui.fokusNav.hist=0;
  if(S.ui.fokusNav.stapel===undefined) S.ui.fokusNav.stapel=null;
  return S.ui.fokusNav;
}
/* U2: Navigation zurücksetzen, sobald wieder aktiv eine Karte gewählt/gestartet wird. */
function fokusNavReset(){ S.ui.fokusNav={hist:0, stapel:null}; }
function aktiveFokusKarte(){
  // U1: Fokus-Karte = laufende Karte (falls im aktiven Stapel), sonst Position 1.
  // U2: eine aktive Swipe-Navigation (Verlauf zurück / Stapel vor) hat Vorrang.
  const nav=fokusNav(), kand=fokusKandidaten();
  if(num(nav.hist)>0){
    const vl=fokusVerlaufHeute(), k=vl[nav.hist-1];
    if(k) return k;
    nav.hist=0;   // Verlauf ist kürzer geworden → zurück auf den Stapel
  }
  if(!kand.length) return null;
  if(nav.stapel!=null){ const k=kand[Math.min(num(nav.stapel), kand.length-1)]; if(k) return k; }
  if(S.fokus){ const fk=kand.find(k=>k.id===S.fokus.karteId); if(fk) return fk; }
  return kand[0];
}
/* U2: ein Navigationsschritt. richtung −1 = links (vorwärts im Stapel bzw. aus dem
   Verlauf heraus), +1 = rechts (weiter zurück im heutigen Bearbeitungsverlauf).
   Zusammen verhalten sich beide wie eine Zeitleiste: rechts geht Schritt für
   Schritt zurück, links nimmt die Schritte in gleicher Reihenfolge zurück und
   springt am vorderen Ende auf die nächste Stapel-Karte. */
function fokusSwipeSchritt(richtung){
  const nav=fokusNav();
  if(richtung>0){
    const vl=fokusVerlaufHeute();
    if(!vl.length){ toast('Heute noch nichts bearbeitet'); return false; }
    if(num(nav.hist)>=vl.length){ toast('Anfang des Tagesverlaufs'); return false; }
    nav.hist=num(nav.hist)+1;
  } else {
    if(num(nav.hist)>0){ nav.hist=num(nav.hist)-1; }
    else {
      const kand=fokusKandidaten();
      if(kand.length<2){ toast('Keine weitere Karte im Stapel'); return false; }
      const cur=aktiveFokusKarte();
      let i=cur?kand.findIndex(x=>x.id===cur.id):0; if(i<0) i=0;
      nav.stapel=(i+1)%kand.length;
    }
  }
  saveUi(); haptik(8); renderFokus();
  return true;
}

    ' · <span id="tGesamtP">'+Math.round(kartePunkteGeplant(k))+'</span> P gesamt</div></div>'+
    '<div class="tzeile2">'+
    '<button class="tpp" data-fktoggle="'+k.id+'" aria-label="Play/Pause">'+(laeuft?'⏸':'▶')+'</button>'+
    '<span class="tgrp">'+
    '<button class="tedit" data-detail="'+k.id+'" aria-label="Bearbeiten">✎</button>'+

/* Live-Aktualisierung des Fokus-Tachos (v0.38-Port): Ring-Bögen, Restzeit,
   Unteraufgaben-Panel, Akku/Punkte/Zeit-Kacheln, 4 KPIs, Plan-Balken. */
function setzeKopf(dot, halo, frac, farbe){
  const w=frac*2*Math.PI-Math.PI/2, x=(66+58*Math.cos(w)).toFixed(1), y=(66+58*Math.sin(w)).toFixed(1);
  dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('opacity','1');
  halo.setAttribute('cx',x); halo.setAttribute('cy',y); halo.setAttribute('opacity','.5'); halo.setAttribute('fill',farbe);
}
function fokusTacho(k){
  if(S.ui.tab!=='fokus') return;
  if(!k) k=aktiveFokusKarte();
  const zeitArc=el('tZeitArc'); if(!zeitArc || !k) return;
  const rotArc=el('tRotArc'), progArc=el('tProgArc'), dot=el('tKopfDot'), halo=el('tKopfHalo');
  const geplant=num(k.sollMin), min=istSekLive(k)/60;
  let farbeKlasse='gruen', kopf='var(--ok)';
  if(geplant>0){
    const pct=min/geplant;
    if(pct>=1.1){ farbeKlasse='rot'; kopf='var(--bad)'; } else if(pct>=0.8){ farbeKlasse='gelb'; kopf='var(--warn)'; }
    zeitArc.setAttribute('stroke', pct>=0.8?'url(#gGelb)':'url(#gLauf)');
    zeitArc.setAttribute('stroke-dashoffset','0');
    zeitArc.setAttribute('stroke-dasharray',(Math.min(1,pct)*RING_C).toFixed(1)+' '+RING_C);
    const ueber=pct>1?Math.min(1,pct-1):0;
    rotArc.setAttribute('stroke', pct>=1.1?'url(#gRot)':'url(#gGelb)');
    rotArc.setAttribute('stroke-dasharray',(ueber*RING_C).toFixed(1)+' '+RING_C);
    const rest=geplant-min;
    el('tRest').textContent = rest>=0 ? hms(rest*60) : '+'+hms(-rest*60);
    el('tRest').className='trest '+farbeKlasse;
    el('tRestSub').textContent='von '+geplant+' min · '+Math.round(pct*100)+'% verbraucht';
    setzeKopf(dot,halo,(pct%1),kopf);
  } else {
    const frac=(min*60%60)/60;
    zeitArc.setAttribute('stroke','url(#gLauf)');
    zeitArc.setAttribute('stroke-dasharray','52 '+RING_C);
    zeitArc.setAttribute('stroke-dashoffset',(-frac*RING_C).toFixed(1));
    rotArc.setAttribute('stroke-dasharray','0 '+RING_C);
    el('tRest').textContent=hms(min*60); el('tRest').className='trest';
    el('tRestSub').textContent='keine Zeit geplant — Stoppuhr';
    setzeKopf(dot,halo,frac,'var(--cyan)');
  }
  // Fortschritts-Ring + Ticks aus Unteraufgaben-Sollzeiten
  const subs=untermenge(k.id);
  const zeiten=subs.map(u=>num(u.sollMin)); const summe=zeiten.reduce((s,z)=>s+z,0);
  let progFrac=0;
  if(subs.length){ const fz=subs.reduce((s,u,i)=>s+(u.done?zeiten[i]:0),0);
    progFrac = summe>0 ? fz/summe : subs.filter(u=>u.done).length/subs.length; }
  progArc.setAttribute('stroke-dasharray',(Math.min(1,progFrac)*RING_CP).toFixed(1)+' '+RING_CP);
  let ticks='';
  if(subs.length>1 && summe>0){ let cum=0; subs.slice(0,-1).forEach((u,i)=>{ cum+=zeiten[i]; const w=cum/summe*2*Math.PI-Math.PI/2;
    ticks+='<line x1="'+(66+53*Math.cos(w)).toFixed(1)+'" y1="'+(66+53*Math.sin(w)).toFixed(1)+'" x2="'+(66+63*Math.cos(w)).toFixed(1)+'" y2="'+(66+63*Math.sin(w)).toFixed(1)+'" stroke="var(--bg)" stroke-width="3"/>'; }); }
  el('tTicks').innerHTML=ticks;
  // aktuelle (erste offene) Unteraufgabe + ihr Zeitfenster
  const aktIdx=subs.findIndex(u=>!u.done);
  const uaBox=el('tUaBox');
  if(aktIdx>=0){ uaBox.hidden=false; el('tUaNum').textContent=(aktIdx+1)+'/'+subs.length; el('tUaName').textContent=subs[aktIdx].titel||'Teilschritt';
    if(summe>0 && geplant>0){ const cumEnde=zeiten.slice(0,aktIdx+1).reduce((s,z)=>s+z,0); const segRest=cumEnde-min;
      el('tUaRest').textContent = segRest>=0 ? 'Abschnitt: noch '+hms(segRest*60) : 'Abschnitt: '+hms(-segRest*60)+' drüber';
      el('tUaRest').style.color = segRest>=0?'var(--mut)':'var(--bad)'; } else el('tUaRest').textContent='';
  } else uaBox.hidden=true;
  // UI-A (v1.5.2): Pace-Färbung des Ring-Hintergrunds. Verhältnis = aktuelle
  // Ist-Rate (P/h, dieselbe Größe hinter der Statusleisten-Anzeige) ÷ benötigte
  // Rest-Pace zum Tagesziel (Restpunkte ÷ Reststunden im Belohnungsfenster,
  // U1-Fenster Tagesstart→24:00/Abschluss). ≥1 → grün, ~0,5 → gelb/orange,
  // →0 → rot; Ziel erreicht → dauerhaft grün; ohne Tag/Ziel/Restzeit → neutral.
  const rbg=el('tRingBg');
  if(rbg){
    let bg='var(--card2)';
    if(tagOffen()){
      const ziel=belZielGesamt(), rest=Math.max(0, ziel-belIstGesamt());
      if(ziel>0){
        if(rest<=0){ bg='hsl(135,48%,24%)'; }             // Ziel erreicht
        else{
          // §2 (v1.12.0): Restzeit = aktive Fensterstunden (Treppe), benötigte
          // Rate gegen das eigene Median-Tempo (rangMass) statt der Uhrzeit-Rate.
          const restStd=restFensterStd();
          if(restStd>0.05){
            const need=rest/restStd, med=rangMass().median;
            const ratio=Math.max(0, Math.min(1, (need>0 && med!=null) ? med/need : 1));
            bg='hsl('+Math.round(ratio*120)+',48%,'+(20+Math.round(ratio*5))+'%)';   // 0 rot · 0,5 gelb · 1 grün
          }                                               // WE/keine Restzeit → neutral
        }
      }
    }
    rbg.style.backgroundColor=bg;
  }
  // Kacheln + Balken
  fokusStats(k); fokusKpis(k); fokusPlanbar(k);
}
/* 3 Tages-Kacheln: Akku · Punkte heute/Ziel · Zeit heute/geplant. */
function fokusStats(k){
  const a=akkuLive(); if(el('tAkku')) el('tAkku').textContent = a!=null?Math.round(a)+'%':'–%';
  // §2 (v1.12.0): Konsument 3 — Kachel „Punkte heute / Ziel" ueber zielUndIstHeute()
  // §4.3 (v1.13.0): Anzeige über den Upgrade-Faktor (Ist UND Ziel — Quote bleibt)
  const upF=upgradeFaktor();
  const zi=zielUndIstHeute(), istHeute=(zi.we?zi.ist:punkteHeuteAnzeige())*upF, ziel=zi.ziel*upF;
  if(el('tPktW')){ el('tPktW').textContent=Math.round(istHeute)+'/'+fmtKurzP(ziel); el('tPktSub').textContent=Math.round(istHeute/ziel*100)+'% · Pkt'; }   // §2 (v1.12.0): 12k statt 12000 — passt in die Kachel
  let zeitIst=0, zeitPlan=0; S.karten.forEach(x=>{ if(!imTagesstrom(x)) return; zeitIst+=heuteInvestiertMin(x); zeitPlan+=num(x.sollMin); });
  if(el('tZeitW')){ el('tZeitW').textContent=tZeitKurz(zeitIst)+'/'+tZeitKurz(zeitPlan); el('tZeitSub').textContent='Aufg '+(zeitPlan>0?Math.round(num(k.sollMin)/zeitPlan*100):0)+'%'; }
}
/* 4 aufgabenbezogene KPIs (P/Std ø · Punkte · bearbeitet · Unteraufgaben). */
function fokusKpis(k){
  const box=el('tKpis'); if(!box) return;
  const min=istSekLive(k)/60, geplant=num(k.sollMin), ziel=basisRate(k);   // A9: Rate-Benchmark = Domänen-Basisrate
  const r=rate(k)*(S.settings.zeitGewicht!=null?S.settings.zeitGewicht:1);
  const f1 = (r>=ziel && ziel>0) ? 'gut' : 'warn';
  const planP=Math.max(0, kartePunkteGeplant(k)), earnedP=Math.max(0,kartePunkte(k));
  const proz = planP>0?Math.min(100,Math.round(earnedP/planP*100)):0;
  const restMin=Math.max(0,geplant-min);
  const subs=untermenge(k.id), fertig=subs.filter(u=>u.done).length;
  const kp=(cls,h,l,s)=>'<div class="tkpi'+(cls?' '+cls:'')+'"><div class="tkpi-h">'+h+'</div><div class="tkpi-l">'+l+'</div><div class="tkpi-s">'+s+'</div></div>';
  box.innerHTML = kp(f1, Math.round(r), 'P/Std ⌀', 'Ziel '+Math.round(ziel))
    + kp('', Math.round(earnedP), 'Punkte', proz+'% v. '+Math.round(planP))
    + kp('', tZeitKurz(min), 'bearbeitet', geplant>0?'Rest '+tZeitKurz(restMin):'Stoppuhr')
    + kp('', fertig+'/'+subs.length, 'Unteraufg.', (subs.length-fertig)+' offen');
}
/* Aufgabenbezogener Punkte-Balken: grün erhalten · gelb offen · rot Überzug. */
function fokusPlanbar(k){
  if(!el('tpbG')) return;
  const min=istSekLive(k)/60, geplant=num(k.sollMin);
  const planP=Math.max(0, kartePunkteGeplant(k)), earnedP=Math.max(0,kartePunkte(k));
  const maxP=Math.max(planP,earnedP,1), gruen=Math.min(earnedP,planP), gelb=Math.max(0,planP-earnedP), rot=Math.max(0,earnedP-planP);
  el('tpbG').style.width=(gruen/maxP*100).toFixed(1)+'%'; el('tpbY').style.width=(gelb/maxP*100).toFixed(1)+'%'; el('tpbR').style.width=(rot/maxP*100).toFixed(1)+'%';
  let marks='';
  if(S.belohnung){ const bank=konto()-earnedP; KAT_KEYS.forEach(kk=>{ if(kaufSperre(kk)) return; const need=preisFuer(kk)-bank;
    if(need>0 && need<=maxP) marks+='<span class="tpb-mark" style="left:'+(need/maxP*100).toFixed(1)+'%"></span>'; }); }
  if(el('tpbMarks')) el('tpbMarks').innerHTML=marks;
  let info='erhalten '+Math.round(gruen)+' · geplant '+Math.round(planP)+' · offen '+Math.round(gelb)+' P';
  if(rot>0) info+=' · +'+Math.round(rot)+' über Plan';
  if(el('tpbInfo')) el('tpbInfo').textContent=info;
}
/* Unteraufgaben-Block unter dem Tacho (v0.38-Look): Häkchen · Titel · Minuten

    '<button class="uax" data-uadel="'+u.id+'">✕</button></div>').join('');
  // §9.4 (v1.8.0): Tick-Zeile OBERHALB der ersten Unteraufgabe — ＋ bucht mit
  // dem eingegebenen Wert (leer = Karten-Default), rechts der Tagesstand.

  const tickZeile = k.ticksAktiv

      '<input class="uamin" type="number" inputmode="numeric" step="5" id="fkTickWert" placeholder="'+tickWertEff(k)+'" title="§2 (v1.13.0): Eingabe setzt den DAUERHAFTEN Override dieser Karte (leer = '+(k.tickWert!=null?'Override '+num(k.tickWert):'Standard '+standardWert(k.domain))+')">'+
      '<span class="tickstand" id="fkTickStand">'+num(k.ticksHeute)+' × · '+Math.round(tickSumme(k, num(k.ticksHeute)))+' P</span></div>'

  return '<div class="tacc'+(zu?' zu':'')+'"><div class="tacckopf" data-tacctoggle="1">☑ Unteraufgaben'+
    (k.ticksAktiv?' + Ticks':'')+

    '<div class="taccinhalt">'+
    tickZeile+
    (subs.length?'<div class="thinweis">Spalten: Minuten (→ Kartenzeit) · Punkte (einmalige Zusatzpunkte, leer = 0)</div>':'<div class="thinweis">Noch keine Unteraufgaben.</div>')+
    rows+
    // §4 (v1.6.0): Unteraufgabe an Ort und Stelle anlegen — Titel + Soll-Minuten

      '<input id="fkUaMin" class="uaminneu" type="number" inputmode="numeric" min="1" placeholder="Min">'+
      '<button data-uaadd="'+k.id+'">+</button></div>'+
    '<div class="thinweis">Soll-Minuten sind Pflicht — sie erhöhen die Kartenzeit.</div>'+

/* §4: gemeinsamer Pfad für Button und Enter. Ohne Minuten kein Anlegen. */
