const BELOHNUNG = JSON.parse(decodeURIComponent(escape(atob(BELOHNUNG_B64))));
const KAT_KEYS = Object.keys(BELOHNUNG);
const KAT_PREISFAKTOR = { fahrzeuge:1.3, wohnen:1.2, reisen:1.1, mobilitaet:1.0, begleiter:0.9, soziales:0.8 };
function belohnungInit(){
  if(!S.belohnung){ S.belohnung={ stufen:{}, ausgegeben:0, kaeufe:[] }; }
  if(S.belohnung.ausgegeben==null) S.belohnung.ausgegeben=0;
  if(!S.belohnung.kaeufe) S.belohnung.kaeufe=[];
  S.belohnung.stufen = S.belohnung.stufen || {};
  KAT_KEYS.forEach(k=>{ if(!S.belohnung.stufen[k]) S.belohnung.stufen[k]=1; });  // Stufe 1 (Schwelle 0) immer offen
  saveBelohnung();
}
/* Punkte-Konto = Wohlstand live − bereits im Shop ausgegebene Punkte. */
function konto(){ return Math.max(0, wohlstandLive() - ((S.belohnung&&S.belohnung.ausgegeben)||0)); }
/* Persönlicher Ø-Punktesatz der letzten 7 abgeschlossenen Tage (aus Historie). */
function oePStd7(){
  const h=(S.historie||[]).slice(-7);
  const punkte=h.reduce((s,d)=>s+num(d.punkteBilanz),0);
  const sek=h.reduce((s,d)=>s+(d.zeit?(num(d.zeit.dfm)+num(d.zeit.privat)):0),0);
  if(sek>=3600) return Math.max(5, punkte/(sek/3600));
  return (S.settings.basisProStd||12)*1.5;   // Startwert, bis Historie da ist
}
/* Preis ≈ 4 Std Fokuszeit × 7-Tage-Ø × Settings-Faktor × Kategorie-Faktor. */
function preisFuer(kat){
  const basis = 4 * oePStd7() * (S.settings.preisFaktor||1) * (KAT_PREISFAKTOR[kat]||1);
  return Math.max(20, Math.round(basis/5)*5);
}
/* Cross-Kategorie-Voraussetzung: null = frei, sonst Hinweistext. */
function kaufSperre(kat){
  const naechste = BELOHNUNG[kat].stufen[S.belohnung.stufen[kat]];
  if(!naechste) return 'komplett';
  const req=naechste[2];
  if(req && (S.belohnung.stufen[req[0]]||0) < req[1]) return 'braucht '+BELOHNUNG[req[0]].icon+' '+BELOHNUNG[req[0]].name+' Stufe '+req[1];
  return null;
}
function kaufen(kat){
  const idx=S.belohnung.stufen[kat];
  const stufe=BELOHNUNG[kat].stufen[idx];
  if(!stufe || kaufSperre(kat)) return false;
  const preis=preisFuer(kat);
  if(konto()<preis){ toast('Noch '+Math.round(preis-konto())+' P bis zum Freischalten'); return false; }
  S.belohnung.stufen[kat]=idx+1;
  S.belohnung.ausgegeben=(S.belohnung.ausgegeben||0)+preis;
  S.belohnung.kaeufe.push({ kat, stufe:idx+1, name:stufe[0], datum:heuteApp(), preis });
  saveBelohnung(); konfetti(); haptik(25);
  toast('🎉 Freigeschaltet: '+BELOHNUNG[kat].icon+' '+stufe[0]);
  renderBelohnung();
  return true;
}
/* Vitalität (§6.2): getrieben vom Tages-Akku. */
function vitalitaet(){ if(tagOffen()&&S.tag.akku!=null) return S.tag.akku>=50; return true; }
function avatarBild(lvl, vital){
  const tier = lvl>=10?3 : lvl>=7?2 : lvl>=4?1 : 0;
  const bild = !vital ? 'muede' : ['hoodie','rollkragen','blazer','anzug'][tier];
  return 'img/avatar-'+bild+'.jpg';
}
/* Gekaufte Kategorien wachsen als Objekte in der Szene (Aufbauspiel-Stil §6.1). */
function szeneObjekteHtml(){
  const st=kk=>(S.belohnung.stufen[kk]||1); const obj=[];
  if(st('wohnen')>1){ const w=st('wohnen'); obj.push(['hinten', w>=7?'🏙️':w>=4?'🏠':'🛖','left:8%;bottom:14px',44+w*5,w]); }
  if(st('reisen')>1) obj.push(['hinten', st('reisen')>=6?'🏝️':'🌄','left:6%;top:8%',18+st('reisen')*2,st('reisen')]);
  if(st('mobilitaet')>1) obj.push(['vorne schwebt', st('mobilitaet')>=7?'✈️':st('mobilitaet')>=4?'🚤':'🛴','right:8%;top:12%',14+st('mobilitaet')*2,st('mobilitaet')]);
  if(st('fahrzeuge')>1) obj.push(['vorne', st('fahrzeuge')>=7?'🏎️':st('fahrzeuge')>=3?'🚗':'🚲','right:5%;bottom:14px',18+st('fahrzeuge')*3,st('fahrzeuge')]);
  if(st('begleiter')>1) obj.push(['vorne', st('begleiter')>=4?'🐕':'🐈','left:30%;bottom:14px',12+st('begleiter')*2,st('begleiter')]);
  if(st('soziales')>1) obj.push(['vorne', '👥','right:26%;bottom:16px',12+st('soziales')*2,st('soziales')]);
  return obj.map(o=>'<span class="szobj '+o[0]+'" style="'+o[2]+';font-size:'+o[3]+'px">'+o[1]+'<i>'+o[4]+'</i></span>').join('');
}
/* Shop-Karten: aktuelle (freigeschaltete) Stufe sichtbar, nächste „???". */
function shopHtml(){
  const k=konto();
  return KAT_KEYS.map(kk=>{
    const kat=BELOHNUNG[kk], offen=S.belohnung.stufen[kk]||1, aktuell=kat.stufen[offen-1];
    const sperre=kaufSperre(kk), preis=preisFuer(kk); let unten;
    if(sperre==='komplett'){ unten='<div class="knext">🏁 Alles freigeschaltet!</div>'; }
    else if(sperre){ unten='<div class="knext">🔒 ??? · '+esc(sperre)+'</div><div class="rankbar"><i style="width:0"></i></div>'; }
    else if(k>=preis){ unten='<button class="kaufbtn" data-kauf="'+kk+'">🎁 ??? für '+Math.round(preis)+' P freischalten</button>'; }
    else { unten='<div class="knext">??? · noch '+Math.round(preis-k)+' P (Preis '+Math.round(preis)+' P)</div><div class="rankbar"><i style="width:'+Math.min(100,k/preis*100).toFixed(0)+'%"></i></div>'; }
    return '<div class="katcard"><div class="kzeile"><span>'+kat.icon+'</span><span class="kname">'+esc(kat.name)+'</span><span class="kstufe">Stufe '+offen+'/'+kat.stufen.length+'</span></div>'+
      '<div class="kaktuell">'+esc(aktuell[0])+'</div>'+unten+'</div>';
  }).join('');
}

function fmtMin(sek){ const m=Math.round(sek/60); return m>=60 ? (Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')) : m+'′'; }
/* Avatar-Stufe aus Wohlstand (Level-Schwellen §3.8). */
function avatarStufe(){
  const sw=S.settings.levelSchwellen||DEFAULT_SETTINGS.levelSchwellen; let lvl=1;
  sw.forEach((s,i)=>{ if(wohlstandLive()>=s) lvl=i+1; }); return lvl;
}
function renderBelohnung(){

  let h='';
  // ── Avatar-Szene (§7 D7 + §6.1): Foto nach Level/Vitalität, gekaufte
  //    Kategorien wachsen als Objekte in der Szene. Hintergrund-Verlauf.
  belohnungInit();
  const lvl=avatarStufe(), maxLvl=(S.settings.levelSchwellen||[]).length;
  const vital=vitalitaet(), kontoP=konto();
  h+='<div class="avcard"><div class="avscene'+(vital?'':' erschoepft')+'">'+
    '<div class="avground"></div>'+szeneObjekteHtml()+

      '<div class="rankpts">Konto '+Math.round(kontoP)+' P</div></div>'+
    '<div class="av-bar"><i style="width:'+Math.round(Math.max(0,Math.min(1,(lvl-1)/Math.max(1,maxLvl-1)))*100)+'%"></i></div></div>';

  // ── Stat 1: Tages-Score-Ring + Pace ──────────────────────────────
  const heuteP=Math.round(tagesPunkteLive());
  const stundenLief = tagOffen()? Math.max(0.1,(Date.now()-new Date(S.tag.startTs).getTime())/3600000) : 0;
  const pace = stundenLief? heuteP/stundenLief : 0;
  const ziel = num(S.settings.tageszielPunkteProStd,100);
  const zielTag = ziel*8;                          // Tagesziel ≈ Ziel-P/Std × 8h
  const ringPct = Math.max(0,Math.min(1, zielTag? heuteP/zielTag : 0));
  const R=52, U=2*Math.PI*R, off=U*(1-ringPct);
  const paceGut = pace>=ziel;
  h+='<div class="card"><h3>Heute</h3><div class="statring">'+

      '<text x="65" y="60" text-anchor="middle" fill="var(--txt)" font-size="24" font-weight="800">'+heuteP+'</text>'+

      '<div class="ps">'+(tagOffen()?('Tag läuft · '+stundenLief.toFixed(1)+' h'):'kein Tag offen')+'</div></div></div></div>';

  // ── Stat 2: Punkteverlauf 7/30 Tage (Balken je tagId, Lücken ausgegraut) ──
  const tage=S.ui.statTage||7;

  const heuteIsoD=heuteIso(); const reihe=[];
  for(let i=tage-1;i>=0;i--){ const d=new Date(heuteIsoD+'T12:00:00'); d.setDate(d.getDate()-i); const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const snaps=S.historie.filter(x=>x.datum===iso); const p=snaps.reduce((a,x)=>a+num(x.punkteBilanz),0);

  h+='<div class="stathint">Ø '+Math.round(reihe.filter(x=>!x.luecke).reduce((a,x)=>a+x.p,0)/Math.max(1,reihe.filter(x=>!x.luecke).length))+' P · Lücken ausgegraut</div></div>';

let toastTimer=null;
function toast(msg){
  const t=el('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'), 1900);
}
function konfetti(){
  const cv=el('konfetti'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const farben=['#4f8ef7','#3ecf8e','#f2b84b','#f66d6d','#b98af7','#6dd3e0'];
  const parts=Array.from({length:70},()=>({
    x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.5,
    vx:(Math.random()-.5)*9, vy:-(Math.random()*10+5),
    g:.32+Math.random()*.15, s:5+Math.random()*5,
    c:farben[(Math.random()*farben.length)|0], r:Math.random()*6, vr:(Math.random()-.5)*.4
  }));
  let f=0;
  (function anim(){
    ctx.clearRect(0,0,cv.width,cv.height); f++;
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
    if(f<70) requestAnimationFrame(anim); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* Detail: einzelnes gebundenes Feld in den Entwurf schreiben */
function detailFeld(bind, input){
  const v=input.value;
  if(bind==='geldScore'||bind==='sollMin'){ entwurf[bind]=num(v); }
  else if(bind==='rhythmusN'){ if(entwurf.rhythmus) entwurf.rhythmus.n=Math.max(1,num(v)); }
  else { entwurf[bind]= (v===''&&(bind==='faelligkeit'||bind==='uhrzeit'||bind==='projekt')) ? null : v; }
}
/* Detail: gesamten Formularstand aus dem DOM in den Entwurf lesen (vor Save/Aktion) */
function detailLies(){
  document.querySelectorAll('#sheetBody [data-bind]').forEach(inp=>detailFeld(inp.dataset.bind, inp));
  document.querySelectorAll('#sheetBody [data-tick]').forEach(inp=>{ entwurf.tickKurve[num(inp.dataset.tick)]=num(inp.value); });
  document.querySelectorAll('#sheetBody [data-subtitel]').forEach(inp=>{ const u=entwurfSubs.find(x=>x.id===inp.dataset.subtitel); if(u) u.titel=inp.value; });
  document.querySelectorAll('#sheetBody [data-submin]').forEach(inp=>{ const u=entwurfSubs.find(x=>x.id===inp.dataset.submin); if(u) u.sollMin=num(inp.value); });
  subParentAngleichen();
}
function stapelFeld(bind, val){
  if(bind==='name') stapelEntwurf.name=val;
  else if(bind==='sortFeld'){ stapelEntwurf.sortierung=stapelEntwurf.sortierung||{}; stapelEntwurf.sortierung.feld=val; }
  else if(bind==='sortRichtung'){ stapelEntwurf.sortierung=stapelEntwurf.sortierung||{}; stapelEntwurf.sortierung.richtung=val; }
}
/* Stapel-Editor: Filterzeilen aus dem DOM in den Entwurf lesen */
function stapelLiesEditor(){
  const st=stapelEntwurf; if(!st.filter) return;
  document.querySelectorAll('#fbWrap .fbrow').forEach(row=>{
    const i=num(row.dataset.fbi); const f=st.filter[i]; if(!f) return;
    const fs=row.querySelector('[data-fbfeld]'); if(fs) f.feld=fs.value;
    const op=row.querySelector('[data-fbop]'); if(op) f.op=op.value;
    const nu=row.querySelector('[data-fbnum]'); if(nu) f.wert=num(nu.value);
    const tx=row.querySelector('[data-fbtext]'); if(tx) f.wert=tx.value;
    const vo=row.querySelector('[data-fbvon]'); if(vo) f.von=vo.value||null;
    const bi=row.querySelector('[data-fbbis]'); if(bi) f.bis=bi.value||null;
  });
}

// Belohnung/Statistik: 7/30-Tage-Umschalter + Shop-Kauf
el('belohnungBody').addEventListener('click', e=>{
  const st=e.target.closest('[data-stattage]'); if(st){ S.ui.statTage=num(st.dataset.stattage); saveUi(); renderBelohnung(); return; }
  const kf=e.target.closest('[data-kauf]'); if(kf){ kaufen(kf.dataset.kauf); return; }
});

// Einstellungen (Sync / Migration / Backup / Regler)
el('einstBody').addEventListener('click', e=>{
  if(e.target.closest('#btnSync')) oeffneSync();
  else if(e.target.closest('#btnMig')) oeffneMigration();
  else if(e.target.closest('#btnBackup')) backupHtml();
  const vd=e.target.closest('[data-vorlagedel]'); if(vd){ if(confirm('Vorlage löschen?')){ vorlageLoeschen(vd.dataset.vorlagedel); renderEinst(); } }
});
el('einstBody').addEventListener('change', e=>{
  const t=e.target; if(t.dataset.setting){ S.settings[t.dataset.setting]=num(t.value); saveSettings(); }
});

/* ── Offline-PWA (§12) ────────────────────────────────────────────────
   neu.html teilt sich den bestehenden network-first Service Worker (sw.js):
   dieselbe scriptURL + Scope wie index.html ⇒ idempotent, index.html und
   dessen SW bleiben komplett unangetastet. Online lädt der SW immer frisch,
   offline aus dem Cache. Nach dem ersten Online-Öffnen sind neu.html +
   manifest-neu.json gecacht (Avatar-Bilder pre-cacht sw.js bereits) ⇒
   neu.html läuft offline als eigenes Homescreen-Icon (manifest-neu.json).
   Zweites root-scoped SW wäre falsch (würde mit index.html um die Kontrolle
   konkurrieren) — daher bewusst geteilt statt separat. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // Beim ersten Besuch kontrolliert der SW die Erst-Anfrage noch nicht →
    // neu.html + manifest-neu.json explizit in den SW-Cache legen, sobald er
    // bereit ist. Damit läuft neu.html schon nach dem ersten Online-Öffnen
    // offline (Avatar-Bilder/Icons pre-cacht sw.js ohnehin).
    navigator.serviceWorker.ready.then(async ()=>{
      try{
        const name=(await caches.keys()).find(k=>k.indexOf('fokus-')===0);
        if(name){ await (await caches.open(name)).addAll(['neu.html','manifest-neu.json']); }
      }catch(e){}
    });
  });
}
</script>
