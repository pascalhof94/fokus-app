/* Tag-Bezug (§3.7): aktuelle Tag-ID + „Tag offen?". */
function aktuelleTagId(){ return S.tag ? S.tag.tagId : heuteApp(); }
function tagOffen(){ return !!(S.tag && !S.tag.endeTs); }
/* Heute erreichte Punkte (live, inkl. laufendem Timer) minus Schiebe-Abzüge. */
/* A1: heutige Punkte EINER Domäne (erledigt heute + laufender Fokus dieser
   Domäne + Schiebe-Strafen dieser Domäne als negative Log-Einträge, A4). */
/* Heutiger Punkt-Beitrag EINER Karte (V1.1): erledigt/laufend/reaktiviert oder
   heute getrackt (auch pausiert) → volle Kartenpunkte, bei mehrtägigen Aufgaben
   minus der an Vortagen gezählten Zeit; sonst nur heutige Tick-Punkte. */
function kartePunkteHeute(k){
  const tid=aktuelleTagId();
  const laeuftId = S.fokus ? S.fokus.karteId : null;
  const erl = k.status==='erledigt' && k.tagId===tid;
  const laeuft = k.id===laeuftId && k.status==='offen';
  const reaktiviert = k.status==='offen' && k.punkteOverride!=null && k.tagId===tid;
  const gearbeitet = k.status==='offen' && k.punkteOverride==null && heuteInvestiertMin(k)>0;
  if(!(erl || laeuft || reaktiviert || gearbeitet)){
    return (num(k.ticksHeute)>0 && istTickKarte(k)) ? tickPunkte(k) : 0;
  }
  let pk = kartePunkte(k);
  if(k.punkteOverride==null && S.tag && S.tag.istMinutenStart){
    const basisMin=num(S.tag.istMinutenStart[k.id],0);
    if(basisMin>0 && num(k.istSek)/60 > basisMin) pk -= punkteFuerZeit(k, basisMin)*(S.settings.zeitGewicht!=null?S.settings.zeitGewicht:1);
  }
  return Math.max(0, pk);
}
function tagesPunkteDomain(dom){
  let p=0;
  S.karten.forEach(k=>{ if(k.domain===dom) p+=kartePunkteHeute(k); });
  if(S.tag && Array.isArray(S.tag.log)) S.tag.log.forEach(e=>{ if(e.art==='schub' && e.domain===dom) p+=num(e.punkte); });
  return p;
}
function tagesPunkteLive(){
  return tagesPunkteDomain('dfm') + tagesPunkteDomain('privat') - (S.tag ? num(S.tag.abzuegeBilanz) : 0);
}
/* A1: getrenntes Tagesziel je Domäne (Punkte) + Anteil des wachen Tages (16 h
   linear ab Tagesstart) für die Pace. */
function tagesZielDomain(dom){ return dom==='dfm' ? num(S.settings.tagesZielDfm,5000) : num(S.settings.tagesZielPrivat,3000); }
function wachTagAnteil(){ return Math.max(0, Math.min(1, tagStundenVergangen()/16)); }
/* S1 (v1.3.2): Soll-Kurve der Statusleiste läuft rein nach Uhrzeit 8:30–22:00 Uhr
   (unabhängig vom manuellen Tagesstart) — nur für die Anzeige der Soll-Linie im
   Fortschrittsbalken; Punkte-Buchungen/Statistiken zählen unverändert ganztägig,
   auch außerhalb des Fensters. */
function sbFensterAnteil(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
  return Math.max(0, Math.min(1, (h-8.5)/(22-8.5)));
}
function punkteHeuteDomain(dom){ return Math.max(0, tagesPunkteDomain(dom)); }
/* Wohlstand live = eingefrorener Stand + heutiger (noch offener) Tag. */
function wohlstandLive(){ return num(S.meta.wohlstand) + (tagOffen() ? tagesPunkteLive() : 0); }
/* Zeit-Aggregat (§9 Stat 3): Ist-Sekunden je Domäne + Projekt für einen Tag.
   Unteraufgaben-Anteile stecken bereits in der Parent-Ist-Zeit. */
function tagesZeitAggregat(tid){
  const agg={ dfm:0, privat:0, projekte:{} };
  S.karten.forEach(k=>{
    // V1.1: HEUTE getrackte Minuten jeder Karte (läuft, pausiert ODER erledigt) —
    // heuteInvestiertMin zieht die Tagesbasis ab, zählt also nur die heutige Zeit
    // (laufender Timer via istSekLive sofort inklusive).
    const sek = heuteInvestiertMin(k) * 60;
    if(sek<=0) return;
    agg[k.domain==='dfm'?'dfm':'privat'] += sek;
    const p = k.domain==='dfm' ? (k.projekt||'(ohne Projekt)') : 'Privat';
    agg.projekte[p]=(agg.projekte[p]||0)+sek;
  });
  return agg;
}
/* ── Statusleiste-/Fokus-Kennzahlen (v1.1, v0.38-Port) ───────────────
   Heute erreichte Punkte für die Anzeige: nie negativ, keine Obergrenze
   (Schiebe-Abzüge mindern, können aber nicht unter 0 drücken). */
function punkteHeuteAnzeige(){ return Math.max(0, tagesPunkteLive()); }
/* Verstrichene Stunden seit Tagesbeginn (manueller Tag, uhrzeitunabhängig). */
function tagStundenVergangen(){
  if(!S.tag || !S.tag.startTs) return 0;
  return Math.max(0, (Date.now()-new Date(S.tag.startTs).getTime())/3600000);
}
/* Pace (A2): Ø IST-Punkte/Stunde (Tagespunkte ÷ Stunden seit Tagesstart) vs.
   SOLL-Rate (Gesamt-Tagesziel ÷ 16 h Wachfenster). ist/soll bleiben kumulativ
   (Balken/Pfeil-Zonen), istRate/sollRate/deltaRate treiben die Anzeige. */
function paceWerte(){
  const zielGes=tagesZielDomain('dfm')+tagesZielDomain('privat');
  const std=tagStundenVergangen(), ist=punkteHeuteAnzeige();
  const istRate = std>0.05 ? ist/std : 0;
  const sollRate = zielGes/16;
  return { ist, soll: zielGes*wachTagAnteil(), istRate, sollRate, deltaRate: istRate-sollRate };
}
/* Pace je Domäne: Ø IST-P/Std vs. Domänen-SOLL-Rate (Domänen-Ziel ÷ 16 h). */
function paceDomain(dom){
  const ziel=tagesZielDomain(dom), std=tagStundenVergangen(), ist=punkteHeuteDomain(dom);
  const istRate = std>0.05 ? ist/std : 0, sollRate = ziel/16;
  return { ist, soll: ziel*wachTagAnteil(), ziel, istRate, sollRate, deltaRate: istRate-sollRate };
}
/* Karte gehört in den heutigen Energie-/Pace-Horizont: offen + heute fällig
   oder überfällig, oder die aktuell laufende Fokus-Karte. */
function imTagesstrom(k){
  if(k.status!=='offen') return false;
  if(S.fokus && S.fokus.karteId===k.id) return true;
  if(!k.faelligkeit) return false;
  return k.faelligkeit <= heuteApp();
}
/* 3-teilige Energie-Batterie (v0.38-Port): dunkel = verbraucht (100−Akku),
   gelb = im Tagesstrom verplante Energie (Verbrauch offener Karten über ihre
   Rest-Zeit, ladende Karten verkleinern es), grün = frei. */
function energieBatterie(){
  const akku=akkuLive();
  let verplant=0, laden=0;
  S.karten.forEach(k=>{
    if(!imTagesstrom(k)) return;
    const restMin=Math.max(0, num(k.sollMin) - heuteInvestiertMin(k));
    if(restMin<=0) return;
    const delta=akkuRate(k)*restMin/60;       // % über die Rest-Zeit (negativ = Verbrauch)
    if(delta<0) verplant += -delta; else laden += delta;
  });
  const p = akku==null ? 0 : akku;
  const dunkel=Math.max(0, 100-p);
  const netto=Math.max(0, verplant-laden);
  const gelb=Math.max(0, Math.min(p, netto));
  const gruen=Math.max(0, p-gelb);
  return { akku, gruen, gelb, dunkel };
}
function renderAlles(){
  rangCacheBauen();
  renderFokusleiste();
  if(S.ui.tab==='stapel') renderStapel();
  else if(S.ui.tab==='fokus') renderFokus();
  else if(S.ui.tab==='einst') renderEinst();
}
/* 1-Sekunden-Ticker nur solange der Timer läuft — aktualisiert Text in-place. */
let tickerId=null, _sekTakt=0;
function starteTicker(){
  if(tickerId) return;
  tickerId=setInterval(()=>{
    if(!(S.fokus && S.fokus.laeuft)){ clearInterval(tickerId); tickerId=null; return; }
    if(S.tag){ S.tag.letzteAktivitaetTs=jetztIso(); }   // Aktivitäts-Stempel (Kanten §6)
    renderFokusleiste();
    if(tagOffen()) renderStatusbar();                   // V1.1: Live-Punkte/-Minuten/-Pace in der Statusleiste sekündlich
    // Fokus-Tacho live nachziehen (Ring/Timer/Kennzahlen/Balken der angezeigten Karte)
    if(S.ui.tab==='fokus') fokusTacho(aktiveFokusKarte());
    else if(S.ui.tab==='belohnung' && _sekTakt%5===0) renderBelohnung();   // V1.1: Belohnungsseite live (alle 5 s, Perf)
    _sekTakt++;
  }, 1000);
}

/* ══════════════════════════════════════════════════════════════════════
   5c · Tageslogik (§6) — Tag-Start · Routinen-Reset · Tagesabschluss ·
        Streaks · Punkteabzug · Kanten. Tag rein manuell (uhrzeitunabhängig).
   ══════════════════════════════════════════════════════════════════════ */
/* Ist eine Routine am Kalenderdatum fällig? (v1.0-Rhythmustypen §3.1) */
function routineFaellig(k, datum){
  if(!k.rhythmus) return false;
  const d=new Date(datum+'T12:00:00'), typ=k.rhythmus.typ;
  if(typ==='taeglich') return true;
  if(typ==='wochentage'){ const wt=((d.getDay()+6)%7)+1; return (k.rhythmus.tage||[]).includes(wt); } // Mo=1..So=7
  if(typ==='alleNTage'){
    const n=Math.max(1, num(k.rhythmus.n));
    if(!k.zuletztRoutine) return true;
    const diff=Math.round((d-new Date(k.zuletztRoutine+'T12:00:00'))/86400000);
    return diff>=n;
  }
  return false;
}
function naechsterLaufindex(datum){
  // Jeder abgeschlossene Tag steht in der Historie (Finalisieren pusht dorthin),
  // ein noch offener Tag desselben Datums ebenfalls berücksichtigen, falls (Kante)
  // ausnahmsweise nicht in der Historie.
  let n=0; (S.historie||[]).forEach(h=>{ if(h.datum===datum) n++; });
  if(S.tag && S.tag.datum===datum && !(S.historie||[]).some(h=>h.tagId===S.tag.tagId)) n++;
  return n+1;
}
/* Tag-Start (§6): neue tagId, Akku, fällige Routinen zurücksetzen. */
function tagStarten(akkuProzent){
  if(tagOffen()) tagAbschlussAuto('Start-Tap');   // Kante: neuer Start beendet alten Tag
  const datum=heuteIso();
  S.tag = neuerTag(datum, naechsterLaufindex(datum));
  S.tag.akku = (akkuProzent==null?null:Math.round(akkuProzent));
  S.karten.forEach(k=>{
    if(k.rhythmus && routineFaellig(k, datum)){
      k.faelligkeit=datum; k.status='offen';
      k.ticksHeute=0; k.istSek=0; k.tagId=null; k.punkteOverride=null;   // Tages-Ist 0 (V1.3: Override zurücksetzen), Historie bleibt
      untermenge(k.id).forEach(u=>u.done=false);
    }
  });
  // v1.1: Tagesbasis der Ist-Minuten je Karte (heute-investiert startet bei 0,
  // mehrtägige Aufgaben behalten ihre bisherige Zeit) + erste Akku-Stichprobe.
  S.tag.istMinutenStart={}; S.karten.forEach(k=>{ S.tag.istMinutenStart[k.id]=istSekLive(k)/60; });
  S.tag.streak = tagesStreakStand(false);   // Stand VOR heute (heute wird beim Abschluss gebucht)
  akkuSampleSchreiben();
  saveTag(); saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  renderAlles();
}
/* Tages-Streak (v0.38-Art, additiv): Anzahl unmittelbar zusammenhängender
   abgeschlossener Tage mit positiver Bilanz. inklHeute=true zählt den offenen
   Tag mit, wenn seine Live-Bilanz > 0 ist (für die Live-Anzeige). */
function tagesStreakStand(inklHeute){
  const tage=(S.historie||[]).filter(h=>!h.luecke).slice().sort((a,b)=> (a.datum<b.datum?1:a.datum>b.datum?-1:(num(b.laufindex)-num(a.laufindex))) );
  let s=0;
  for(const h of tage){ if(num(h.punkteBilanz)>0) s++; else break; }
  if(inklHeute && tagOffen() && tagesPunkteLive()>0) s++;
  return s;
}
/* Streak-Buchung bei Routinen-Erledigung (aus karteAbhaken). */
function routineErledigtBuchen(k){
  if(!k.rhythmus) return;
  if(k.zuletztRoutine!==aktuelleTagId().slice(0,10)){ k.streak=num(k.streak)+1; }
  k.zuletztRoutine = heuteApp();
}
/* Generierter Abzug-Vorschlag beim Schieben (§4): grob nach Priorität/Punkten. */
function abzugVorschlag(k){
  const basis = Math.round(kartePunkte(Object.assign({},k,{istSek:0,ticksHeute:0})));
  const faktor = k.prioritaet==='muss' ? 1 : k.prioritaet==='soll' ? 0.5 : 0;
  return Math.round(Math.min(100, basis*faktor) / 10) * 10;   // auf 10 gerundet, max 100
}
/* Karte im Abschluss schieben — mit sofort gebuchtem Punkteabzug. */
function karteSchieben(k, datum, uhrzeit, abzug){
  k.faelligkeit = datum || null;
  k.uhrzeit = uhrzeit || null;
  if(num(abzug)>0 && S.tag){ S.tag.abzuegeBilanz = num(S.tag.abzuegeBilanz) + num(abzug); }
}
/* Routinen-Bilanz im Abschluss: „Verpasst" (Streak bricht) / „Heute nicht nötig". */
function routineBilanz(k, verpasst){
  if(verpasst){ k.streak=0; }
  (S.tag.routinenBilanz=S.tag.routinenBilanz||[]).push({ id:k.id, titel:k.titel, verpasst:!!verpasst, entschuldigt:!verpasst });
}
/* Tagesabschluss finalisieren: Timer stoppen, Bilanz einfrieren, Wohlstand
   buchen, Snapshot in Historie. */
function tagAbschlussFinalisieren(){
  if(S.fokus && S.fokus.laeuft) fokusZeitEinbuchen();   // laufenden Timer stoppen+buchen
  const bilanz = tagesPunkteLive();                      // erledigte heute − Abzüge (+ nichts Laufendes mehr)
  S.tag.punkteBilanz = Math.round(bilanz);
  S.tag.endeTs = jetztIso();
  S.tag.streak = bilanz>0 ? tagesStreakStand(false)+1 : 0;   // v1.1: Tages-Streak einfrieren
  S.meta.wohlstand = num(S.meta.wohlstand) + bilanz;     // §4: kumulativ, nie Reset
  // Snapshot für Statistiken (§9) + Belohnungs-Diagramme (v1.1: log/akkuVerlauf/streak)
  S.historie.push({
    tagId:S.tag.tagId, datum:S.tag.datum, laufindex:S.tag.laufindex,
    startTs:S.tag.startTs, endeTs:S.tag.endeTs, akku:S.tag.akku,
    punkteBilanz:S.tag.punkteBilanz, abzuege:num(S.tag.abzuegeBilanz),
    routinenBilanz:S.tag.routinenBilanz||[], zeit:tagesZeitAggregat(S.tag.tagId), luecke:false,
    log:(S.tag.log||[]).slice(), akkuVerlauf:(S.tag.akkuVerlauf||[]).slice(),
    streak:S.tag.streak, erledigtHeute:num(S.tag.erledigtHeute)
  });
  saveTag(); saveHistorie(); saveMeta(); saveKarten();
}
/* Automatischer Abschluss (Kante §6: vergessen / Start-Tap / Lücke). */
function tagAbschlussAuto(grund){
  if(!tagOffen()) return;
  // offene fällige Routinen = „Verpasst"
  const datum=S.tag.datum;
  S.karten.forEach(k=>{ if(k.rhythmus && k.status==='offen' && !k.freeze && routineFaellig(k, datum)) routineBilanz(k, true); });   // A4: Eingefrorene nicht als „verpasst"
  tagAbschlussFinalisieren();
}
/* Beim Öffnen: vergessenen Abschluss / Lücke erkennen (§6 Kanten). */
function pruefeTagKante(){
  if(!S.tag) return;
  if(!tagOffen()) return;                       // schon abgeschlossen
  if(S.tag.datum===heuteIso()) return;          // Tag über Mitternacht ok, gleicher Start-Tag
  // Offener Tag + neues Kalenderdatum → Abschluss nachholen (Ende = letzte Aktivität).
  tagAbschlussAuto('vergessen');
  toast('Vergessener Tagesabschluss nachgeholt');
}

function morgenIso(){ const d=new Date(heuteApp()+'T12:00:00'); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* Unteraufgaben-Balance (§3.2) */
function subBalanceNachAdd(){
  // Neue Unteraufgabe: Parent-Gesamtzeit gleichmäßig auf alle aufteilen.
  const n=entwurfSubs.length; if(!n) return;
  const total=num(entwurf.sollMin);
  const je=Math.round(total/n);
  entwurfSubs.forEach((u,i)=> u.sollMin = (i===n-1) ? (total-je*(n-1)) : je );
}
function subParentAngleichen(){
  // Parent-Soll = Σ Unteraufgaben (Differenz wird mit dem Parent verrechnet).
  if(entwurfSubs.length) entwurf.sollMin = entwurfSubs.reduce((a,u)=>a+num(u.sollMin),0);
}
function detailSpeichern(){
  entwurf.titel = (entwurf.titel||'').trim();
  if(!entwurf.titel){ toast('Titel fehlt'); return; }
  if(entwurf.domain!=='dfm'){ entwurf.projekt=null; entwurf.geldScore=0; }
  if(!Array.isArray(entwurf.tickKurve)||!entwurf.tickKurve.length) entwurf.tickKurve=[0];
  subParentAngleichen();
  // U6-D: Zeit-Ist-Nachtrag — Differenz zur bisher getrackten Zeit auf heute buchen
  if(entwurf._istMinEdit!=null){
    const delta = num(entwurf._istMinEdit) - Math.round(num(entwurf.istSek)/60);
    if(delta!==0){ entwurf.istSek=Math.max(0, num(entwurf.istSek)+delta*60); if(delta>0) logIntraday(entwurf,{minuten:delta,typ:'nachtrag'}); }
  }
  delete entwurf._istMinEdit;
  const idx=S.karten.findIndex(k=>k.id===entwurf.id);
  if(idx>=0) S.karten[idx]=entwurf; else S.karten.push(entwurf);
  // Unteraufgaben ersetzen
  S.unteraufgaben = S.unteraufgaben.filter(u=>u.parentId!==entwurf.id).concat(
    entwurfSubs.map(u=>Object.assign(neueUnteraufgabe(entwurf.id), u, {parentId:entwurf.id}))
  );
  // Erledigt/archiviert + war im Fokus → Fokus beenden.
  if((entwurf.status==='erledigt'||entwurf.status==='archiviert') && S.fokus && S.fokus.karteId===entwurf.id){ S.fokus=null; saveFokus(); }
  beruehre(entwurf);                                     // A7: Edit zählt als Interaktion
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  closeSheet(); renderAlles();
  toast(entwurfNeu?'Karte angelegt':'Gespeichert'); haptik(12);
}
/* A3: einen Tick buchen (Timer-/Counter-Karten). Erhöht ticksHeute; Punkte
   kommen über die Tick-Kurve (tickSumme) in tickPunkte/kartePunkte. */
function karteTick(kid, fromDetail){
  const k = kid ? S.karten.find(x=>x.id===kid) : entwurf;
  if(!k) return;
  const vor=tickPunkte(k);
  k.ticksHeute = num(k.ticksHeute)+1;
  if(S.tag) S.tag.letzteAktivitaetTs=jetztIso();
  beruehre(k); logIntraday(k,{punkte:tickPunkte(k)-vor,typ:'tick'});   // A7 + B0
  haptik(12);
  if(!fromDetail){ saveKarten(); saveTag(); renderAlles(); }
}
/* A4: Schieben um +24 h. Datum +1 Tag ab aktueller Fälligkeit (sonst heute);
   Uhrzeit bleibt. Vorschlag Minuspunkte = 10 % der Punkte-Prognose (sollMin/60
   × Rate), auf 5 gerundet, min. 10. */
function datumPlus1(iso){ const d=new Date((iso||heuteApp())+'T12:00:00'); d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function schiebeVorschlag(k){ const prog=num(k.sollMin)/60*rate(k); return Math.max(10, Math.round(prog*0.1/5)*5); }
function oeffneSchieben(kid){
  const k=S.karten.find(x=>x.id===kid); if(!k) return;
  const neu=datumPlus1(k.faelligkeit), v=schiebeVorschlag(k);
  let h='<p class="d">„<b>'+esc(k.titel||'(ohne Titel)')+'</b>" auf <b>'+fmtDatum(neu)+'</b> schieben (+24 h'+(k.uhrzeit?' · '+esc(k.uhrzeit)+' bleibt':'')+').</p>'+
    '<div class="field"><label>Minuspunkte (nur bei „mit Punktverlust")</label>'+
    '<input type="number" inputmode="numeric" id="schiebAbzug" value="'+v+'">'+
    '<div class="hint">Vorschlag = 10 % der Punkte-Prognose, auf 5 gerundet (min. 10). Wird sofort vom '+(k.domain==='dfm'?'DFM':'Privat')+'-Tagesscore abgezogen (nicht in der Kartenleistung).</div></div>';
  openSheet('Aufgabe schieben', h,
    '<button class="btn ghost sm" data-schiebohne="'+k.id+'">ohne Punktverlust</button>'+
    '<button class="btn warn sm" data-schiebmit="'+k.id+'">mit Punktverlust</button>');
}
function karteSchiebenA4(kid, mitAbzug, abzug){
  const k=S.karten.find(x=>x.id===kid); if(!k) return;
  k.faelligkeit = datumPlus1(k.faelligkeit);   // +24 h, Uhrzeit unverändert
  if(mitAbzug && num(abzug)>0 && S.tag){
    (S.tag.log=S.tag.log||[]).push({ itemId:k.id, titel:k.titel||'', domain:k.domain, art:'schub', punkte:-Math.abs(num(abzug)), ts:jetztIso() });
    logIntraday(k,{punkte:-Math.abs(num(abzug)),typ:'schub'});   // B0
  }
  beruehre(k);                                                    // A7
  saveKarten(); saveTag(); closeSheet(); renderAlles();
  toast('Auf '+fmtDatum(k.faelligkeit)+' geschoben'+(mitAbzug&&num(abzug)>0?' · −'+Math.abs(num(abzug))+' P':'')); haptik(15);
}
function karteAbhaken(kid, fromDetail){
  const k = kid ? S.karten.find(x=>x.id===kid) : entwurf;
  if(!k) return;
  // A3: Timer-/Counter-Karten werden nie erledigt — „Abhaken" bucht einen Tick.
  if(istTickKarte(k) && k.status!=='erledigt'){ karteTick(kid, fromDetail); return; }
  if(k.status==='erledigt'){
    logPunktEntfernen(k);                                 // v1.1: Punkt-Ereignis zurücknehmen (VOR override-Reset, damit der gebuchte Wert stimmt)
    k.status='offen'; k.tagId=null; k.punkteOverride=null;   // U6-A: Override zurücknehmen → Punkte wieder automatisch
    if(k.rhythmus && k.zuletztRoutine===heuteApp()){ k.streak=Math.max(0,num(k.streak)-1); k.zuletztRoutine=null; }
    if(k.tickKurve && k.tickKurve.length===1) k.ticksHeute=0;
  } else {
    // Läuft der Timer auf dieser Karte → erst Zeit einbuchen, Fokus beenden (§6 Kante).
    if(!fromDetail && S.fokus && S.fokus.karteId===k.id) fokusBeenden();
    k.status='erledigt'; k.tagId=aktuelleTagId();
    if(k.tickKurve && k.tickKurve.length===1) k.ticksHeute=1;
    if(k.rhythmus) routineErledigtBuchen(k);              // Streak + zuletztRoutine
    if(S.tag) S.tag.letzteAktivitaetTs=jetztIso();
    logPunktSchreiben(k);                                 // v1.1: Punkt-Ereignis (Verlauf/Kennzahlen)
    logIntraday(k,{punkte:kartePunkte(k),typ:'abhaken'}); // B0: Intraday-Buchung
    konfetti(); haptik(20);
  }
  beruehre(k);                                             // A7: jede Interaktion zählt
  if(!fromDetail){ saveKarten(); saveTag(); renderAlles(); }
}
/* v1.1: Punkt-Ereignisse des Tages (für Intraday-Kurve & Kennzahlen). Ein
   Eintrag je Abschluss mit Zeitstempel + Punktwert; Rücknahme entfernt den
   letzten passenden Eintrag. Rein additiv, nicht im §8-Sync-Export. */
function logPunktSchreiben(k){
  if(!S.tag) return;
  (S.tag.log=S.tag.log||[]).push({ itemId:k.id, titel:k.titel||'', domain:k.domain, art:kartenArt(k),
                                    punkte:Math.round(kartePunkte(k)), ts:jetztIso() });
  S.tag.erledigtHeute=num(S.tag.erledigtHeute)+1;
}
function logPunktEntfernen(k){
  if(!S.tag || !S.tag.log) return;
  for(let i=S.tag.log.length-1;i>=0;i--){ if(S.tag.log[i].itemId===k.id){ S.tag.log.splice(i,1); break; } }
  S.tag.erledigtHeute=Math.max(0, num(S.tag.erledigtHeute)-1);
}
/* V1.3 (vereinheitlicht mit U6-A6): erledigte/beliebige Karte wieder öffnen =
   IMMER ein frisches, offenes Duplikat — inkl. aller Unteraufgaben (neu,
   unabgehakt, neue App-IDs), ohne airtableId (nächster Sync = Neuanlage),
   Ist/Punkte/Override zurückgesetzt. Das Original bleibt vollständig erhalten
   (Statistik/Punkte/Zeiten unangetastet, kein Punktabzug). opts.starten=true
   nimmt das Duplikat direkt in den Fokus (Timer läuft). Ein Codepfad für
   „🔄 Neu starten", ▶ auf erledigter Zeile und Timer-Start. */
function karteNeuStarten(kid, opts){
  opts=opts||{};
  const o=S.karten.find(k=>k.id===kid); if(!o) return;
  const kopie=neueKarte({
    domain:o.domain, titel:o.titel, prioritaet:o.prioritaet, projekt:o.projekt, geldScore:num(o.geldScore),
    sollMin:num(o.sollMin), komplex:o.komplex, energie:o.energie, blockade:o.blockade,
    punkteProStd:o.punkteProStd, akkuProStd:o.akkuProStd, abhakbonus:o.abhakbonus,
    zeitStufen:o.zeitStufen?JSON.parse(JSON.stringify(o.zeitStufen)):null,
    tickKurve:Array.isArray(o.tickKurve)?o.tickKurve.slice():[0], timerFlag:o.timerFlag,
    rhythmus:o.rhythmus?JSON.parse(JSON.stringify(o.rhythmus)):null, tageszeit:o.tageszeit,
    notiz:o.notiz, kommentarClaude:o.kommentarClaude, gruppeId:o.gruppeId,
    faelligkeit:heuteApp()
    // airtableId/id/erstelltTs/istSek(0)/status(offen)/punkteOverride(null) → aus neueKarte-Defaults
  });
  untermenge(o.id).forEach(u=>{ S.unteraufgaben.push(neueUnteraufgabe(kopie.id, { titel:u.titel, sollMin:num(u.sollMin), bonusPunkte:u.bonusPunkte, done:false })); });
  S.karten.push(kopie);
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  closeSheet();
  if(opts.starten){ fokusStarten(kopie.id); setTab('fokus'); toast('Als neue Karte geöffnet — Timer läuft'); }
  else { renderAlles(); toast('🔄 Als neue Karte geöffnet'); }
  haptik(15);
}
/* ── U6-A/V1.3: Abhak-Dialog (Punktejustierung beim Erledigen) ────────
   Erscheint beim Abschließen JEDER abhakbaren Karte — Aufgaben UND Routinen.
   Counter/Timer-Ticks (istTickKarte) bleiben schnelles ＋-Ticken ohne Dialog,
   und Un-Abhaken läuft direkt. Abbrechen = nichts passiert. */
let abhakTmp=null;
function karteAbhakenAuto(kid, fromDetail){
  const k = kid ? S.karten.find(x=>x.id===kid) : entwurf;
  if(!k) return;
  if(k.status==='offen' && !istTickKarte(k)){ abhakDialog(k.id, fromDetail); return; }   // Aufgaben + Routinen
  karteAbhaken(kid, fromDetail);   // Ticks (＋) / Un-Abhaken direkt
}
function abhakbonusDefault(k){ return k.abhakbonus!=null ? num(k.abhakbonus)
  : (k.domain==='dfm' ? num(S.settings.abhakbonusDfm,0) : num(S.settings.abhakbonusPrivat,0)); }
function abhakDialog(kid, fromDetail){
  const k=S.karten.find(x=>x.id===kid); if(!k) return;
  const hatOverride=k.punkteOverride!=null;                 // Re-Abhaken einer reaktivierten Karte
  const basis=Math.round(kartePunkte(k));                   // bei Override = bereits gebuchte Punkte, sonst berechnet
  abhakTmp={ kid, fromDetail, folge:false, basis, max:Math.max(10, basis*2),
    bonusDef: hatOverride ? 0 : abhakbonusDefault(k),       // Bonus steckt beim Re-Abhaken schon im Override → 0 vorbelegt
    istMin:Math.round(istSekLive(k)/60),
    offeneSubs:untermenge(k.id).filter(u=>!u.done).length };
  renderAbhakDialog();
}
function renderAbhakDialog(){
  const t=abhakTmp, k=S.karten.find(x=>x.id===t.kid); if(!k) return;
  const restMin=Math.max(0, num(k.sollMin)-t.istMin);
  let h='<p class="d">„<b>'+esc(k.titel||'(ohne Titel)')+'</b>" erledigen — Werte anpassen oder direkt ✅.</p>';
  h+='<div class="field"><label>Punkte</label>'+
     '<input type="range" id="abPkt" min="0" max="'+t.max+'" step="5" value="'+Math.min(t.basis,t.max)+'">'+
     '<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="number" inputmode="numeric" min="0" step="5" id="abPktN" value="'+t.basis+'" style="width:120px">'+
       '<span class="hint" style="margin:0">Standard '+t.basis+' P · Regler bis '+t.max+', Direkteingabe auch darüber</span></div></div>';
  h+='<div class="grid2">'+
     '<div class="field"><label>Ist-Zeit (Min)</label><input type="number" inputmode="numeric" id="abIst" value="'+t.istMin+'"><div class="hint">Differenz wird auf heute gebucht</div></div>'+
     '<div class="field"><label>Abhakbonus</label><input type="number" inputmode="numeric" id="abBonus" value="'+t.bonusDef+'"><div class="hint">0 = kein Bonus</div></div>'+
     '</div>';
  h+='<div class="field"><label>Folgeaufgabe</label><div class="chips"><button class="chip '+(t.folge?'on lila':'')+'" data-abfolge="1">'+(t.folge?'✓ wird angelegt':'＋ anlegen')+'</button></div>';
  if(t.folge){
    h+='<div style="margin-top:8px">'+
       '<input id="abFolgeTitel" value="'+esc((k.titel||'')+' — Fortsetzung')+'" style="width:100%;margin-bottom:6px" placeholder="Titel der Folgeaufgabe">'+
       '<div style="display:flex;align-items:center;gap:8px"><span class="mlab">Soll-Min</span><input type="number" inputmode="numeric" id="abFolgeSoll" value="'+restMin+'" style="width:90px"></div>'+
       '<div class="hint">'+t.offeneSubs+' offene Unteraufgabe(n) wandern mit; abgehakte bleiben bei der alten. Neue Karte ohne airtableId.</div></div>';
  }
  h+='</div>';
  const foot='<button class="btn ghost sm" data-close="1">Abbrechen</button><button class="btn prim" data-abgo="1">✅ Erledigen</button>';
  openSheet('Aufgabe erledigen', h, foot);
  // Regler ↔ Zahlenfeld bidirektional (Direkteingabe darf das Regler-Maximum überschreiten)
  const r=el('abPkt'), n=el('abPktN');
  if(r&&n){
    r.addEventListener('input',()=>{ n.value=r.value; });
    n.addEventListener('input',()=>{ const v=Math.max(0,Math.floor(num(n.value))); r.value=String(Math.min(v,t.max)); });
  }
  el('sheetBody').querySelectorAll('input[type="number"]').forEach(x=>x.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); abhakDialogConfirm(); } }));
}
function folgeAufgabeAnlegen(k, titel, sollMin){
  titel=(titel||'').trim() || ((k.titel||'')+' — Fortsetzung');
  const neu=neueKarte({ domain:k.domain, titel, prioritaet:k.prioritaet, projekt:k.projekt, geldScore:num(k.geldScore),
    komplex:k.komplex, energie:k.energie, blockade:k.blockade, abhakbonus:k.abhakbonus, tageszeit:k.tageszeit, faelligkeit:heuteApp() });
  const offene=untermenge(k.id).filter(u=>!u.done);
  offene.forEach(u=>{ u.parentId=neu.id; });   // offene Subs wandern in die Folgeaufgabe
  neu.sollMin=Math.max(num(sollMin)||0, offene.reduce((s,u)=>s+num(u.sollMin),0));
  S.karten.push(neu); DB.set('unteraufgaben', S.unteraufgaben);
  return neu;
}
function abhakDialogConfirm(){
  const t=abhakTmp; if(!t) return;
  const k=S.karten.find(x=>x.id===t.kid); if(!k){ abhakTmp=null; closeSheet(); return; }
  const raw=el('abPktN')?el('abPktN').value.trim():'';           // Zahlenfeld ist führend (auch > Regler-Max)
  const pkt=raw==='' ? t.basis : Math.max(0, Math.floor(num(raw)));   // leer = Default, sonst ganze Zahl ≥ 0
  const bonus=num(el('abBonus')?el('abBonus').value:t.bonusDef);
  const istMin=num(el('abIst')?el('abIst').value:t.istMin);
  const deltaMin=istMin-Math.round(istSekLive(k)/60);
  if(deltaMin!==0){ k.istSek=Math.max(0,num(k.istSek)+deltaMin*60); logIntraday(k,{minuten:deltaMin,typ:'nachtrag'}); }   // Zeit-Nachtrag auf heute
  k.abhakbonus=bonus;                                   // Wahl je Karte merken
  k.punkteOverride=Math.max(0, pkt+bonus);              // gebuchte Ist-Punkte (Slider + Bonus)
  if(t.folge) folgeAufgabeAnlegen(k, el('abFolgeTitel')?el('abFolgeTitel').value:'', num(el('abFolgeSoll')?el('abFolgeSoll').value:0));
  abhakTmp=null; closeSheet();
  karteAbhaken(k.id, false);                            // eigentliches Erledigen (Punkte=Override, Konfetti, Intraday, Speichern)
}

function stapelSpeichern(){
  stapelEntwurf.name=(stapelEntwurf.name||'').trim()||'Stapel';
  const idx=S.stapel.findIndex(s=>s.id===stapelEntwurf.id);
  if(idx>=0) S.stapel[idx]=stapelEntwurf; else S.stapel.push(stapelEntwurf);
  // Ordner-Zuordnung spiegeln (Ordner hält stapelIds)
  S.ordner.forEach(o=>{
    const soll=(stapelEntwurf.ordnerIds||[]).includes(o.id);
    const drin=(o.stapelIds||[]).includes(stapelEntwurf.id);
    if(soll && !drin) o.stapelIds.push(stapelEntwurf.id);
    if(!soll && drin) o.stapelIds=o.stapelIds.filter(id=>id!==stapelEntwurf.id);
  });
  saveStapel(); saveOrdner(); closeSheet(); renderStapel(); toast('Stapel gespeichert');
}
function stapelLoeschen(){
  S.stapel=S.stapel.filter(s=>s.id!==stapelEntwurf.id);
  S.ordner.forEach(o=>{ o.stapelIds=(o.stapelIds||[]).filter(id=>id!==stapelEntwurf.id); });
  saveStapel(); saveOrdner(); closeSheet(); renderStapel(); toast('Stapel gelöscht');
}

/* ══════════════════════════════════════════════════════════════════════
   13 · Migration §10 (aus alten fokus2.* Keys, read-only, idempotent)
   ══════════════════════════════════════════════════════════════════════ */
function altGeldScore(impact){
  const map={hoch:300, mittel:200, niedrig:100};
  return map[impact]!=null ? map[impact] : 0;
}
/* v0.38-Rhythmus → v1.0 (taeglich | alleNTage | wochentage). Die v1.0-Modelle
   sind bewusst schlanker (§2): Monats-/Zufalls-Rhythmen gibt es nicht, sie
   werden auf „alle N Tage" angenähert (Näherung wird im Import gezählt). */
function altRhythmusApprox(it){ return ['monatstage','zufallWoche','zufallMonat'].includes(it.rhythmusModus); }
function altRhythmus(it){
  if(it.typ!=='routine') return null;
  const modus=it.rhythmusModus, wt=it.rhythmusWochentage;
  if((modus==='wochentage'||!modus) && Array.isArray(wt) && wt.length)
    return {typ:'wochentage', tage: wt.map(d=>num(d)+1).filter(n=>n>=1&&n<=7)};
  if(modus==='monatstage'){ const c=(it.rhythmusMonatstage||[]).length; return {typ:'alleNTage', n: c>0?Math.max(1,Math.round(30/c)):30}; }
  if(modus==='zufallWoche'){ const c=num(it.rhythmusZufallAnzahl,2); return {typ:'alleNTage', n: Math.max(1,Math.round(7/Math.max(1,c)))}; }
  if(modus==='zufallMonat'){ const c=num(it.rhythmusZufallAnzahl,2); return {typ:'alleNTage', n: Math.max(1,Math.round(30/Math.max(1,c)))}; }
  const n=num(it.rhythmusTage, 1);
  if(n<=1) return {typ:'taeglich'};
  return {typ:'alleNTage', n};
}
function altTickKurve(it){
  if(it.typ!=='counter') return [0];
  if(Array.isArray(it.tickStufen) && it.tickStufen.length){
    // grobe Übernahme: je Stufe ihr punkteProTick
    return it.tickStufen.map(s=>num(s.punkteProTick)).slice(0,12) || [0];
  }
  const schwelle=num(it.tickSchwelle,3), vor=num(it.punkteJeTickVorSchwelle,1), nach=num(it.punkteJeTickNachSchwelle,-2);
  return Array(Math.max(1,schwelle)).fill(vor).concat([nach]);
}
function mapAltKarte(it){
  const domain = it.domain==='dfm' ? 'dfm' : 'privat';
  // §10: ort/streamSlot → Fälligkeit (heute→heute, Warteschlange→null).
  // Vorhandene Deadline bleibt als Fälligkeit erhalten (Fälligkeit ist die
  // einzige Wahrheit §2) — sonst würden Termine verloren gehen.
  let faelligkeit = (it.streamSlot!=null) ? heuteApp() : (it.deadline || null);
  const k = neueKarte({
    id: it.id || uuid(),
    herkunftId: it.id || null,
    airtableId: (domain==='dfm' && it.id && /^rec/i.test(it.id)) ? it.id : null,
    domain,
    titel: it.titel || '',
    notiz: it.notiz || '',
    kommentarClaude: it.kommentarClaude || it.kommentarFuerClaude || '',   // U6-E
    projekt: domain==='dfm' ? (it.projekt||null) : null,
    geldScore: domain==='dfm' ? altGeldScore(it.geldImpact) : 0,
    faelligkeit,
    uhrzeit: null,
    tageszeit: 'beliebig',
    sollMin: num(it.aufwandGeplantMin),
    istSek: Math.round(num(it.istMinuten)*60),
    komplex: num(it.komplexitaet,1), energie: num(it.energie,1), blockade: num(it.blockade,1),
    // v1.1 §4-Port: Raten-Override, Akku-Rate und zeitgestaffelte Rate mitnehmen
    // (in v0.38 pro Item vorhanden). Re-Import stellt so Pausen-/Meeting-Timer wieder her.
    punkteProStd: (it.punkteProStd!=null && Number.isFinite(Number(it.punkteProStd))) ? Number(it.punkteProStd) : null,
    akkuProStd:   (it.akkuProStd!=null && Number.isFinite(Number(it.akkuProStd))) ? Number(it.akkuProStd) : null,
    zeitStufen:   (Array.isArray(it.zeitStufen) && it.zeitStufen.length) ? it.zeitStufen.map(s=>({bisMin:s.bisMin==null?null:num(s.bisMin), punkteProStd:num(s.punkteProStd)})) : null,
    prioritaet: ['muss','soll','idee'].includes(it.prioritaet)?it.prioritaet:'soll',
    tickKurve: altTickKurve(it),
    ticksHeute: num(it.tickStandHeute),
    timerFlag: !!it.timerFlag,
    rhythmus: altRhythmus(it),
    status: (it.status==='erledigt') ? 'erledigt' : 'offen',
    streak: num(it.routineStreak || it.streak),
  });
  // v1.0-Direktfelder (Seed-Format Weg 2): NUR wenn im Item vorhanden — sonst
  // bleibt die v0.38-Ableitung/das Default unverändert.
  if(Array.isArray(it.tickKurve) && it.tickKurve.length) k.tickKurve = it.tickKurve.map(num);
  if(it.rhythmus && it.rhythmus.typ) k.rhythmus = it.rhythmus;      // direktes v1.0-Format
  if(it.uhrzeit)        k.uhrzeit   = it.uhrzeit;                    // "HH:MM"
  if(it.tageszeit)      k.tageszeit = it.tageszeit;                  // morgens|mittags|abends|beliebig
  if(it.geldScore!=null) k.geldScore = num(it.geldScore);           // direkte Zahl (statt geldImpact)
  return k;
}
function migrationVorschau(){
  const items=altLese(ALT.ITEMS, []);
  if(!Array.isArray(items)) return {items:[], offen:0, routinen:0, counter:0, wohlstand:0};
  const offen=items.filter(i=>i.status!=='erledigt').length;
  const routinen=items.filter(i=>i.typ==='routine').length;
  const counter=items.filter(i=>i.typ==='counter').length;
  const tag=altLese(ALT.TAG, null);
  const hist=altLese(ALT.HISTORIE, []);
  let wohlstand = tag && tag.wohlstandStand!=null ? tag.wohlstandStand : 0;
  if(Array.isArray(hist)) hist.forEach(h=>{ if(h && h.wohlstandStand>wohlstand) wohlstand=h.wohlstandStand; });
  return {items, offen, routinen, counter, wohlstand};
}
function migrationBackupHref(){
  const paket={ typ:'alt-backup', exportZeit:jetztIso(),
    tag:altLese(ALT.TAG,null), historie:altLese(ALT.HISTORIE,[]) };
  return 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(paket,null,2));
}
/* Gemeinsamer Kern: mappt alte Items (aus localStorage ODER aus einem
   v0.38-Export) auf v1.0-Karten. Idempotent über herkunftId/id. */
function importItems(items, opts){
  opts=opts||{};
  let neu=0, upd=0, erl=0, approx=0, subs=0;
  items.forEach(it=>{
    // Ohne mitErledigte: erledigte Einmal-Aufgaben überspringen (§10 = nur offen).
    if(!opts.mitErledigte && it.status==='erledigt' && it.typ==='aufgabe') return;
    if(altRhythmusApprox(it)) approx++;
    const k=mapAltKarte(it);
    // Erledigt-Import: NICHT auf den Import-/Export-Tag umdatieren (sonst zählt
    // eine alte Erledigung als „heute" und flutet Erledigt-heute/Tagesbilanz).
    // Nur den echten v0.38-Erledigungstag übernehmen, sonst undatiert lassen.
    if(k.status==='erledigt') k.tagId = it.zuletztErledigt || null;
    const exist = S.karten.find(x=> (k.herkunftId && x.herkunftId===k.herkunftId) || x.id===k.id );
    let ziel;
    if(exist){
      // idempotent: nur Definition auffrischen, App-Hoheit (Status/Ist) lassen
      Object.assign(exist, { titel:k.titel, projekt:k.projekt, geldScore:k.geldScore, notiz:k.notiz,
        rhythmus:k.rhythmus, tickKurve:k.tickKurve, streak:k.streak,
        komplex:k.komplex, energie:k.energie, blockade:k.blockade, prioritaet:k.prioritaet,
        punkteProStd:k.punkteProStd, akkuProStd:k.akkuProStd, zeitStufen:k.zeitStufen });
      // v1.0-Direktfelder NUR bei Vorhandensein übernehmen (Seed-Format Weg 2)
      if(Array.isArray(it.tickKurve) && it.tickKurve.length) exist.tickKurve = it.tickKurve.map(num);
      if(it.rhythmus && it.rhythmus.typ) exist.rhythmus = it.rhythmus;
      if(it.uhrzeit)        exist.uhrzeit   = it.uhrzeit;
      if(it.tageszeit)      exist.tageszeit = it.tageszeit;
      if(it.geldScore!=null) exist.geldScore = num(it.geldScore);
      ziel=exist; upd++;
    } else { S.karten.push(k); ziel=k; neu++; if(k.status==='erledigt') erl++; }
    // Unteraufgaben — Match ausschließlich über App-id
    if(Array.isArray(it.unteraufgaben)){
      it.unteraufgaben.forEach(u=>{
        const uid=u.id||uuid();
        if(S.unteraufgaben.find(x=>x.id===uid)) return;
        S.unteraufgaben.push(neueUnteraufgabe(ziel.id, {id:uid, titel:u.titel||'', sollMin:num(u.geplantMin), done:!!u.erledigt, bonusPunkte:(u.bonusPunkte!=null?num(u.bonusPunkte):null)}));
        subs++;
      });
    }
  });
  return {neu, upd, erledigt:erl, approx, subs};
}

function syncExport(typ){
  const dfm=S.karten.filter(k=>k.domain==='dfm' && k.status!=='archiviert');
  return {
    typ: typ||'sync', appVersion:VERSION, tagId: aktuelleTagId(), exportZeit:jetztIso(),
    karten: dfm.map(k=>{
      const o={
        id:k.id, airtableId:k.airtableId||null, titel:k.titel, projekt:k.projekt||null, geldScore:num(k.geldScore),
        faelligkeit:k.faelligkeit||null, uhrzeit:k.uhrzeit||null, sollMin:num(k.sollMin), istMin:Math.round(num(k.istSek)/60),
        komplex:num(k.komplex,1), energie:num(k.energie,1), blockade:num(k.blockade,1),
        prioritaet:k.prioritaet, status:k.status, punkteIst:Math.round(kartePunkte(k)),
        notiz:k.notiz||'',
        unteraufgaben: untermenge(k.id).map(u=>({ id:u.id, titel:u.titel, sollMin:num(u.sollMin), done:!!u.done }))
      };
      if(k.freeze) o.freeze=true;                          // M1 (1.1.0): nur eingefrorene Karten senden das Feld
      if(k.kommentarClaude) o.kommentarClaude=k.kommentarClaude;   // U6-F (1.2.0): nur wenn nicht leer
      return o;
    })
  };
}
function syncExportText(typ){ return JSON.stringify(syncExport(typ), null, 2); }

/* Import eines Pakets aus dem Claude-Chat (§8-Hoheitsregeln). */
function syncImport(text){
  let paket; try{ paket=JSON.parse(text); }catch(e){ return {fehler:'Ungültiges JSON'}; }
  const arr = Array.isArray(paket) ? paket : (paket && paket.karten) || null;
  if(!Array.isArray(arr) || !arr.length) return {fehler:'Keine Karten im Paket'};
  let neu=0, upd=0, arch=0;
  arr.forEach(inc=>{
    // Anker: App-id; sekundär airtableId (§8: airtableId→id-Match)
    let lok = (inc.id && S.karten.find(k=>k.id===inc.id)) ||
              (inc.airtableId && S.karten.find(k=>k.airtableId===inc.airtableId)) || null;
    if(!lok){ lok=neueKarte({ id: inc.id||uuid(), domain:'dfm', airtableId: inc.airtableId||null }); S.karten.push(lok); neu++; }
    else upd++;
    // Airtable-Hoheit → übernehmen
    if(inc.airtableId!=null) lok.airtableId=inc.airtableId;
    if(inc.titel!=null) lok.titel=inc.titel;
    if(inc.projekt!==undefined) lok.projekt=inc.projekt;
    if(inc.geldScore!=null) lok.geldScore=num(inc.geldScore);
    if(inc.notiz!=null) lok.notiz=inc.notiz;
    if(inc.kommentarClaude!=null) lok.kommentarClaude=inc.kommentarClaude;             // U6-F (1.2.0)
    else if(inc.kommentarFuerClaude!=null) lok.kommentarClaude=inc.kommentarFuerClaude; // Abwärtskompat.: 1.1.0-Pakete
    // Archivierung ist Airtable-Hoheit (Teil des Status); No-delete: nur archivieren, nie löschen
    if(inc.status==='archiviert' && lok.status!=='archiviert'){ lok.status='archiviert'; arch++; }
    // Beidseitige Felder → letzter Stand (Import bringt den abgestimmten Stand)
    if(inc.sollMin!=null) lok.sollMin=num(inc.sollMin);
    if(inc.prioritaet!=null) lok.prioritaet=inc.prioritaet;
    if(inc.komplex!=null) lok.komplex=num(inc.komplex);
    if(inc.energie!=null) lok.energie=num(inc.energie);
    if(inc.blockade!=null) lok.blockade=num(inc.blockade);
    if(inc.faelligkeit!==undefined) lok.faelligkeit=inc.faelligkeit;   // Deadline↔Fälligkeit
    if(inc.uhrzeit!==undefined) lok.uhrzeit=inc.uhrzeit;               // Uhrzeit↔Airtable-Deadline
    if(inc.freeze!==undefined) lok.freeze=!!inc.freeze;               // M1 (v1.1.0): freeze true setzt / false löst; fehlend = unverändert
    // App-Hoheit (Status offen/erledigt, Ist, Punkte) wird NIE vom Import überschrieben.
    // Unteraufgaben — Match ausschließlich über App-id, nie über Titel.
    if(Array.isArray(inc.unteraufgaben)){
      inc.unteraufgaben.forEach(iu=>{
        let lu = S.unteraufgaben.find(u=>u.parentId===lok.id && u.id===iu.id);
        if(!lu){ lu=neueUnteraufgabe(lok.id, { id: iu.id||uuid() }); S.unteraufgaben.push(lu); }
        if(iu.titel!=null) lu.titel=iu.titel;        // Definition beidseitig
        if(iu.sollMin!=null) lu.sollMin=num(iu.sollMin);
        // done = App-Hoheit → nicht überschreiben
      });
    }
  });
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  return {neu, upd, arch};
}

const VORLAGE_WEG = ['id','airtableId','herkunftId','faelligkeit','uhrzeit','istSek','ticksHeute','status','tagId','streak','zuletztRoutine','sortIndex','gruppeId','erstelltTs'];

function detailAusVorlage(vid){

  entwurfSubs = (v.unteraufgaben||[]).map(u=>neueUnteraufgabe(entwurf.id, { titel:u.titel, sollMin:num(u.sollMin) }));

}

/* Reset „Alle Karten löschen" (bewusster Nullstand vor dem Gruppen-Seed):
   doppelte Bestätigung, VORHER automatisches Voll-Backup als Download. Löscht
   ausschließlich Karten + Unteraufgaben. Einstellungen, meta.wohlstand,
   Historie, Stapel, Vorlagen, Gruppen bleiben unangetastet. (Ein laufender
   Fokus-Timer wird beendet, weil seine Karte weg ist — nötige Folge, nicht in
   der „behalten"-Liste.) */
function resetKarten(){
  const n=S.karten.length;
  if(!confirm('Alle Karten & Unteraufgaben löschen?\n\nVorher wird automatisch ein Voll-Backup heruntergeladen. Einstellungen, Wohlstand, Historie, Stapel, Vorlagen und Gruppen bleiben erhalten.')) return;
  if(!confirm('Wirklich '+n+' Karten endgültig löschen?\n\nRückgängig nur über das heruntergeladene Backup.')) return;
  backupHtml();                          // Voll-Backup als Download (bestehende Mechanik)
  S.fokus=null; saveFokus();             // laufenden Timer auf gelöschter Karte beenden
  S.karten=[]; S.unteraufgaben=[];
  saveKarten(); DB.set('unteraufgaben', S.unteraufgaben);
  renderAlles(); renderEinst();
  toast(n+' Karten gelöscht · Backup geladen'); haptik(20);
}
/* ══════════════════════════════════════════════════════════════════════
   14 · D6 Einstellungen (Regler · Migration · Sync · Backup)
   ══════════════════════════════════════════════════════════════════════ */
function renderEinst(){
  const s=S.settings;
  let h='';
  h+='<div class="card"><h3>Daten &amp; Sync</h3><p class="d">Sync mit dem Claude-Chat (nur DFM, Copy-Paste), Migration aus der alten App, lokales Backup.</p>'+
    '<div class="btnrow"><button class="btn sm prim" id="btnSync">⇄ Sync (DFM)</button></div>'+
    '<div class="btnrow"><button class="btn sm" id="btnMig">⇪ Migration (v0.38)</button>'+
    '<button class="btn sm" id="btnBackup">⬇︎ Backup</button></div>'+
    '<div class="btnrow"><button class="btn warn sm" id="btnReset">🗑 Alle Karten löschen</button></div>'+

const KAT_PREISFAKTOR = { fahrzeuge:1.3, wohnen:1.2, reisen:1.1, mobilitaet:1.0, begleiter:0.9, soziales:0.8 };
function belohnungInit(){
  if(!S.belohnung){ S.belohnung={ stufen:{}, ausgegeben:0, kaeufe:[] }; }
  if(S.belohnung.ausgegeben==null) S.belohnung.ausgegeben=0;
  if(!S.belohnung.kaeufe) S.belohnung.kaeufe=[];
  S.belohnung.stufen = S.belohnung.stufen || {};
  KAT_KEYS.forEach(k=>{ if(!S.belohnung.stufen[k]) S.belohnung.stufen[k]=1; });  // Stufe 1 (Schwelle 0) immer offen
  saveBelohnung();
}
/* Punkte-Konto = Wohlstand live − bereits im Shop ausgegebene Punkte. */
function konto(){ return Math.max(0, wohlstandLive() - ((S.belohnung&&S.belohnung.ausgegeben)||0)); }
/* Persönlicher Ø-Punktesatz der letzten 7 abgeschlossenen Tage (aus Historie). */
function oePStd7(){
  const h=(S.historie||[]).slice(-7);
  const punkte=h.reduce((s,d)=>s+num(d.punkteBilanz),0);
  const sek=h.reduce((s,d)=>s+(d.zeit?(num(d.zeit.dfm)+num(d.zeit.privat)):0),0);
  if(sek>=3600) return Math.max(5, punkte/(sek/3600));
  return num(S.settings.basisProStdPrivat,120)*1.5;   // Startwert, bis Historie da ist
}
/* Preis ≈ 4 Std Fokuszeit × 7-Tage-Ø × Settings-Faktor × Kategorie-Faktor. */
function preisFuer(kat){
  const basis = 4 * oePStd7() * (S.settings.preisFaktor||1) * (KAT_PREISFAKTOR[kat]||1);
  return Math.max(20, Math.round(basis/5)*5);
}
/* Cross-Kategorie-Voraussetzung: null = frei, sonst Hinweistext. */
function kaufSperre(kat){
  const naechste = BELOHNUNG[kat].stufen[S.belohnung.stufen[kat]];
  if(!naechste) return 'komplett';
  const req=naechste[2];
  if(req && (S.belohnung.stufen[req[0]]||0) < req[1]) return 'braucht '+BELOHNUNG[req[0]].icon+' '+BELOHNUNG[req[0]].name+' Stufe '+req[1];
  return null;
}
function kaufen(kat){
  const idx=S.belohnung.stufen[kat];
  const stufe=BELOHNUNG[kat].stufen[idx];
  if(!stufe || kaufSperre(kat)) return false;
  const preis=preisFuer(kat);
  if(konto()<preis){ toast('Noch '+Math.round(preis-konto())+' P bis zum Freischalten'); return false; }
  S.belohnung.stufen[kat]=idx+1;
  S.belohnung.ausgegeben=(S.belohnung.ausgegeben||0)+preis;
  S.belohnung.kaeufe.push({ kat, stufe:idx+1, name:stufe[0], datum:heuteApp(), preis });
  saveBelohnung(); konfetti(); haptik(25);
  toast('🎉 Freigeschaltet: '+BELOHNUNG[kat].icon+' '+stufe[0]);
  renderBelohnung();
  return true;
}
/* Vitalität (§6.2): getrieben vom Tages-Akku. */
function vitalitaet(){ if(tagOffen()&&S.tag.akku!=null) return S.tag.akku>=50; return true; }
function avatarBild(lvl, vital){
  const tier = lvl>=10?3 : lvl>=7?2 : lvl>=4?1 : 0;
  const bild = !vital ? 'muede' : ['hoodie','rollkragen','blazer','anzug'][tier];
  return 'img/avatar-'+bild+'.jpg';
}
/* Gekaufte Kategorien wachsen als Objekte in der Szene (Aufbauspiel-Stil §6.1). */
function szeneObjekteHtml(){
  const st=kk=>(S.belohnung.stufen[kk]||1); const obj=[];
  if(st('wohnen')>1){ const w=st('wohnen'); obj.push(['hinten', w>=7?'🏙️':w>=4?'🏠':'🛖','left:8%;bottom:14px',44+w*5,w]); }
  if(st('reisen')>1) obj.push(['hinten', st('reisen')>=6?'🏝️':'🌄','left:6%;top:8%',18+st('reisen')*2,st('reisen')]);
  if(st('mobilitaet')>1) obj.push(['vorne schwebt', st('mobilitaet')>=7?'✈️':st('mobilitaet')>=4?'🚤':'🛴','right:8%;top:12%',14+st('mobilitaet')*2,st('mobilitaet')]);
  if(st('fahrzeuge')>1) obj.push(['vorne', st('fahrzeuge')>=7?'🏎️':st('fahrzeuge')>=3?'🚗':'🚲','right:5%;bottom:14px',18+st('fahrzeuge')*3,st('fahrzeuge')]);
  if(st('begleiter')>1) obj.push(['vorne', st('begleiter')>=4?'🐕':'🐈','left:30%;bottom:14px',12+st('begleiter')*2,st('begleiter')]);
  if(st('soziales')>1) obj.push(['vorne', '👥','right:26%;bottom:16px',12+st('soziales')*2,st('soziales')]);

}
/* Shop-Karten: aktuelle (freigeschaltete) Stufe sichtbar, nächste „???". */
function shopHtml(){
  const k=konto();
  return KAT_KEYS.map(kk=>{
    const kat=BELOHNUNG[kk], offen=S.belohnung.stufen[kk]||1, aktuell=kat.stufen[offen-1];
    const sperre=kaufSperre(kk), preis=preisFuer(kk); let unten;
    if(sperre==='komplett'){ unten='<div class="knext">🏁 Alles freigeschaltet!</div>'; }
    else if(sperre){ unten='<div class="knext">🔒 ??? · '+esc(sperre)+'</div><div class="rankbar"><i style="width:0"></i></div>'; }
    else if(k>=preis){ unten='<button class="kaufbtn" data-kauf="'+kk+'">🎁 ??? für '+Math.round(preis)+' P freischalten</button>'; }
    else { unten='<div class="knext">??? · noch '+Math.round(preis-k)+' P (Preis '+Math.round(preis)+' P)</div><div class="rankbar"><i style="width:'+Math.min(100,k/preis*100).toFixed(0)+'%"></i></div>'; }
    return '<div class="katcard"><div class="kzeile"><span>'+kat.icon+'</span><span class="kname">'+esc(kat.name)+'</span><span class="kstufe">Stufe '+offen+'/'+kat.stufen.length+'</span></div>'+
      '<div class="kaktuell">'+esc(aktuell[0])+'</div>'+unten+'</div>';
  }).join('');
}

function fmtMin(sek){ const m=Math.round(sek/60); return m>=60 ? (Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')) : m+'′'; }
/* Avatar-Stufe aus Wohlstand (Level-Schwellen §3.8). */
function avatarStufe(){

  sw.forEach((s,i)=>{ if(wohlstandLive()>=s) lvl=i+1; }); return lvl;
}

function isoMinus(iso, tage){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-tage);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* Normierter Tages-Snapshot (heute live, sonst Historie; mehrere Läufe je Datum
   werden zusammengefasst). */
function tagSnapshot(iso){
  if(tagOffen() && S.tag.datum===iso){
    return { datum:iso, istHeute:true, startTs:S.tag.startTs, endeTs:null, punkteBilanz:tagesPunkteLive(),
      akku:S.tag.akku, log:(S.tag.log||[]).slice(), akkuVerlauf:(S.tag.akkuVerlauf||[]).slice(),
      zeit:tagesZeitAggregat(S.tag.tagId), erledigtHeute:num(S.tag.erledigtHeute) };
  }
  const snaps=(S.historie||[]).filter(h=>h.datum===iso && !h.luecke);
  if(!snaps.length) return null;
  const log=[], av=[]; let p=0, akkuSum=0, akkuN=0, erl=0, startTs=null, endeTs=null;
  const zeit={dfm:0,privat:0,projekte:{}};
  snaps.forEach(s=>{ p+=num(s.punkteBilanz); (s.log||[]).forEach(e=>log.push(e)); (s.akkuVerlauf||[]).forEach(e=>av.push(e));
    if(s.akku!=null){ akkuSum+=num(s.akku); akkuN++; } erl+=num(s.erledigtHeute);
    if(!startTs || (s.startTs && s.startTs<startTs)) startTs=s.startTs;
    if(!endeTs || (s.endeTs && s.endeTs>endeTs)) endeTs=s.endeTs;
    if(s.zeit){ zeit.dfm+=num(s.zeit.dfm); zeit.privat+=num(s.zeit.privat);
      Object.entries(s.zeit.projekte||{}).forEach(([k,v])=>zeit.projekte[k]=(zeit.projekte[k]||0)+num(v)); } });
  return { datum:iso, istHeute:false, startTs, endeTs, punkteBilanz:p, akku:akkuN?akkuSum/akkuN:null,
    log, akkuVerlauf:av, zeit, erledigtHeute:erl };
}
/* Punkte eines Snapshots unter Domänenfilter (aus log, sonst Bilanz für „alle"). */
function snapPunkte(snap, dom){
  if(!snap) return 0;
  if(dom==='alle') return snap.punkteBilanz;
  if(snap.log && snap.log.length) return snap.log.filter(e=>e.domain===dom).reduce((a,e)=>a+num(e.punkte),0);
  return 0;
}
/* Ø-Punkte pro Stunde über die vergangenen Tage (domänengefiltert). */
function avgProStdVergangen(dom){
  let sumP=0, sumH=0;
  (S.historie||[]).filter(h=>h.datum!==heuteApp() && !h.luecke).map(h=>h.datum)
    .filter((v,i,a)=>a.indexOf(v)===i).forEach(iso=>{ const sn=tagSnapshot(iso); if(!sn) return;
      const hrs=(sn.startTs&&sn.endeTs)?Math.max(0.2,(new Date(sn.endeTs)-new Date(sn.startTs))/3600000):0;
      if(hrs>0){ sumP+=snapPunkte(sn,dom); sumH+=hrs; } });
  return sumH>0 ? sumP/sumH : 0;
}
/* Intraday-Kurve für einen Tages-Snapshot. */
function diagrammKurveTag(snap, dom){
  if(!snap || !snap.startTs) return '<div class="akkukarte"><div class="leer">Keine Daten für diesen Tag.</div></div>';
  const startMs=new Date(snap.startTs).getTime();
  const endMs=snap.istHeute ? Date.now() : (snap.endeTs?new Date(snap.endeTs).getTime():Date.now());
  const xEndMin=Math.max(1,(endMs-startMs)/60000);
  const evAll=(snap.log||[]).map(e=>({min:(new Date(e.ts).getTime()-startMs)/60000, p:num(e.punkte), domain:e.domain}))
    .filter(e=>e.min>=0).sort((a,b)=>a.min-b.min);
  const ev=dom==='alle'?evAll:evAll.filter(e=>e.domain===dom);
  let kum=0; const pts=[[0,0]];
  ev.forEach(e=>{ kum+=e.p; pts.push([Math.min(xEndMin,Math.max(0,e.min)),kum]); });
  if(snap.istHeute){ const ges=snapPunkte(snap,dom); if(ges>kum) kum=ges; pts.push([xEndMin,kum]); }  // Live-Endpunkt inkl. laufendem Fokus
  // A1/A7: Soll-Diagonale = Domänen-Tagesziel über den wachen Tag (16 h)
  const visionTag = dom==='alle' ? (tagesZielDomain('dfm')+tagesZielDomain('privat')) : tagesZielDomain(dom);
  const sollEnd=visionTag*Math.min(1, xEndMin/(16*60));
  const avgEnd=avgProStdVergangen(dom)*(xEndMin/60);
  const peak=pts.reduce((m,p)=>Math.max(m,p[1]),0);
  const maxY=Math.max(peak, sollEnd, avgEnd, 10)*1.15;
  const X=m=>6+(m/xEndMin)*288, Y=p=>98-(p/maxY)*88;
  const linie=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const yTop=Y(Math.max(peak,sollEnd,avgEnd,1)); const YA=p=>98-(p/100)*(98-yTop);
  const glaetten=arr=>arr.map((e,i)=>{ let s=0,n=0; for(let j=Math.max(0,i-2);j<=Math.min(arr.length-1,i+2);j++){ s+=arr[j].p; n++; } return {min:e.min,p:s/n}; });
  let akkuLinie='', aJetzt=null;
  const av=(snap.akkuVerlauf||[]).map(e=>({min:(new Date(e.ts).getTime()-startMs)/60000,p:num(e.akku)})).filter(e=>e.min>=0&&e.min<=xEndMin);
  if(av.length){ const g=glaetten(av); akkuLinie=g.map(e=>X(e.min).toFixed(1)+','+YA(e.p).toFixed(1)).join(' ');
    if(snap.istHeute){ aJetzt=akkuLive(); if(aJetzt!=null) akkuLinie+=(akkuLinie?' ':'')+X(xEndMin).toFixed(1)+','+YA(aJetzt).toFixed(1); } else aJetzt=snap.akku; }
  else if(snap.akku!=null){ aJetzt=snap.akku; akkuLinie=X(0).toFixed(1)+','+YA(snap.akku).toFixed(1)+' '+X(xEndMin).toFixed(1)+','+YA(snap.akku).toFixed(1); }
  const uhr=m=>{ const t=new Date(startMs+m*60000); return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); };
  return '<div class="akkukarte"><div class="lbl"><span>'+(snap.istHeute?'Tagesverlauf':'Verlauf '+snap.datum.slice(5))+'</span><span>'+Math.round(kum)+' P</span></div>'+
    '<svg viewBox="0 0 300 108" width="100%" height="108">'+
    '<line x1="6" y1="98" x2="294" y2="98" stroke="var(--line)"/>'+
    (sollEnd>0?'<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(xEndMin).toFixed(1)+'" y2="'+Y(sollEnd).toFixed(1)+'" stroke="#c23a3a" stroke-width="1.3" stroke-dasharray="4 4"/><text x="'+(X(xEndMin)-54).toFixed(1)+'" y="'+Math.max(9,Y(sollEnd)-3).toFixed(1)+'" fill="#c23a3a" font-size="8">Soll '+Math.round(sollEnd)+'</text>':'')+
    (avgEnd>0?'<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(xEndMin).toFixed(1)+'" y2="'+Y(avgEnd).toFixed(1)+'" stroke="#b58a2e" stroke-width="1.3" stroke-dasharray="4 4"/><text x="'+(X(xEndMin)-54).toFixed(1)+'" y="'+Math.max(9,Y(avgEnd)-3).toFixed(1)+'" fill="#b58a2e" font-size="8">Ø '+Math.round(avgEnd)+'</text>':'')+
    (akkuLinie?'<polyline points="'+akkuLinie+'" fill="none" stroke="var(--ok)" stroke-width="1.6" stroke-linejoin="round" opacity=".8"/><text x="273" y="'+(YA(aJetzt!=null?aJetzt:50)-4).toFixed(1)+'" fill="var(--ok)" font-size="8">'+(aJetzt!=null?Math.round(aJetzt)+'%':'')+'</text>':'')+
    '<polyline points="'+linie+'" fill="none" stroke="var(--purple)" stroke-width="2.4" stroke-linejoin="round"/>'+
    (pts.length?'<circle cx="'+X(pts[pts.length-1][0]).toFixed(1)+'" cy="'+Y(pts[pts.length-1][1]).toFixed(1)+'" r="3.2" fill="var(--purple)"/>':'')+
    '<text x="6" y="107" fill="var(--mut2)" font-size="8">'+uhr(0)+'</text>'+
    '<text x="268" y="107" fill="var(--mut2)" font-size="8">'+uhr(xEndMin)+'</text>'+
    '</svg></div>';
}
/* Woche/Monat: Balken je Tag (antippbar → Tageswahl). */
function diagrammBalken(zeitraum, dom){
  const n=zeitraum==='woche'?7:30, heute=heuteApp(), sel=statDatum(), reihe=[];
  for(let i=n-1;i>=0;i--){ const iso=isoMinus(heute,i); const sn=tagSnapshot(iso);
    reihe.push({iso, p: sn?snapPunkte(sn,dom):0, luecke:!sn && !(tagOffen()&&S.tag.datum===iso)}); }
  // A7: Vision-/Ziel-Linie (aus den Tageszielen) + Ø-Linie der gezeigten Tage
  const vision = dom==='alle' ? (tagesZielDomain('dfm')+tagesZielDomain('privat')) : tagesZielDomain(dom);
  const echte=reihe.filter(x=>!x.luecke); const avg = echte.length ? echte.reduce((a,x)=>a+x.p,0)/echte.length : 0;
  const maxP=Math.max(10, vision, ...reihe.map(x=>x.p)), bw=Math.max(3,Math.floor(288/n)-2);
  const Y=v=>90-(v/maxP)*80;
  let balken='';
  reihe.forEach((d,i)=>{ const hgt=Math.max(2,(d.p/maxP)*80), x=6+i*(288/n);
    balken+='<rect x="'+x.toFixed(1)+'" y="'+(90-hgt).toFixed(1)+'" width="'+bw+'" height="'+hgt.toFixed(1)+'" rx="2" fill="'+(d.iso===sel?'var(--cyan)':d.luecke?'var(--line)':'var(--purple)')+'" data-statpick="'+d.iso+'"/>'; });
  const summe=reihe.reduce((a,d)=>a+d.p,0);
  const avgLine = avg>0 ? '<line x1="6" y1="'+Y(avg).toFixed(1)+'" x2="294" y2="'+Y(avg).toFixed(1)+'" stroke="#b58a2e" stroke-width="1.2" stroke-dasharray="3 3"/><text x="8" y="'+Math.max(8,Y(avg)-2).toFixed(1)+'" fill="#b58a2e" font-size="8">Ø '+Math.round(avg)+'</text>' : '';
  const visLine = vision>0 ? '<line x1="6" y1="'+Y(vision).toFixed(1)+'" x2="294" y2="'+Y(vision).toFixed(1)+'" stroke="var(--blue)" stroke-width="1.6"/><text x="252" y="'+Math.max(8,Y(vision)-2).toFixed(1)+'" fill="var(--blue)" font-size="8">Ziel '+Math.round(vision)+'</text>' : '';
  return '<div class="akkukarte"><div class="lbl"><span>Punkte je Tag ('+n+')</span><span>Σ '+Math.round(summe)+' P</span></div>'+
    '<svg viewBox="0 0 300 100" width="100%" height="100">'+'<line x1="6" y1="90" x2="294" y2="90" stroke="var(--line)"/>'+balken+visLine+avgLine+
    '<text x="6" y="99" fill="var(--mut2)" font-size="8">'+reihe[0].iso.slice(5)+'</text>'+
    '<text x="256" y="99" fill="var(--mut2)" font-size="8">'+reihe[reihe.length-1].iso.slice(5)+'</text></svg></div>';
}
/* Kennzahlen zum gewählten Tag (domänengefiltert). */
function kennzahlenHtml(snap, dom){
  if(!snap) return '<p class="d" style="color:var(--mut2)">Kein Tag für dieses Datum.</p>';
  const p=snapPunkte(snap,dom);
  const hrs=snap.startTs?((snap.istHeute?Date.now():new Date(snap.endeTs||snap.startTs).getTime())-new Date(snap.startTs).getTime())/3600000:0;
  const zeitSek=dom==='alle'?(snap.zeit.dfm+snap.zeit.privat):(dom==='dfm'?snap.zeit.dfm:snap.zeit.privat);
  const anzahl=(snap.log&&snap.log.length)?(dom==='alle'?snap.log.length:snap.log.filter(e=>e.domain===dom).length):snap.erledigtHeute;
  return '<div class="kennz">'+
    '<div><b>'+Math.round(p)+'</b><span>Punkte</span></div>'+
    '<div><b>'+(hrs>0.05?(p/hrs).toFixed(0):'0')+'</b><span>P/Std</span></div>'+
    '<div><b>'+(zeitSek>60?(p/(zeitSek/60)).toFixed(1):'0')+'</b><span>P/min</span></div>'+
    '<div><b>'+fmtMin(zeitSek)+'</b><span>Zeit</span></div>'+
    '<div><b>'+anzahl+'</b><span>erledigt</span></div>'+
    '<div><b>'+(snap.akku!=null?Math.round(snap.akku)+'%':'–')+'</b><span>Ø Akku</span></div></div>';
}
/* Aufschlüsselung: nach Kartenart + Top-Karten (aus dem Punkt-Log). */
function aufschluesselungHtml(snap, dom){
  if(!snap || !snap.log || !snap.log.length) return '<p class="d" style="color:var(--mut2)">Keine Aufschlüsselung (Tag ohne Punkt-Log).</p>';
  const log=dom==='alle'?snap.log:snap.log.filter(e=>e.domain===dom);
  if(!log.length) return '<p class="d" style="color:var(--mut2)">Keine Punkte in dieser Domäne.</p>';
  const ges=log.reduce((a,e)=>a+num(e.punkte),0)||1;
  const artAgg={}; log.forEach(e=>{ artAgg[e.art||'?']=(artAgg[e.art||'?']||0)+num(e.punkte); });
  let h='<div class="aufl">';
  Object.entries(artAgg).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>h+='<div class="arow"><span>'+esc(k)+'</span><span class="bwrap2"><i style="width:'+Math.round(v/ges*100)+'%"></i></span><b>'+Math.round(v)+'</b></div>');
  h+='</div>';
  const kAgg={}; log.forEach(e=>{ const t=e.titel||'(ohne Titel)'; kAgg[t]=(kAgg[t]||0)+num(e.punkte); });
  h+='<div class="aufl" style="margin-top:8px">';
  Object.entries(kAgg).sort((a,b)=>b[1]-a[1]).slice(0,6).forEach(([t,v])=>h+='<div class="arow"><span>'+esc(t)+'</span><span class="bwrap2"><i style="width:'+Math.round(v/ges*100)+'%"></i></span><b>'+Math.round(v)+'</b></div>');
  return h+'</div>';
}

/* A1: ein Domänen-Score-Ring (heutige Punkte der Domäne ÷ Domänen-Tagesziel),
   Pace-Pfeil = liegt die Domäne über ihrem anteiligen Soll? */
function scoreRingDomain(dom, label, farbe){
  const ist=Math.round(punkteHeuteDomain(dom)), ziel=tagesZielDomain(dom), p=paceDomain(dom);
  const imSoll = p.ist>=p.soll;
  const pct=Math.max(0,Math.min(1, ziel? ist/ziel : 0));
  const R=42, U=2*Math.PI*R, off=U*(1-pct);
  return '<div class="statring-dom"><svg viewBox="0 0 104 104" width="104" height="104">'+
      '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
      '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="'+farbe+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+U.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 52 52)"/>'+
      '<text x="52" y="48" text-anchor="middle" fill="var(--txt)" font-size="19" font-weight="800">'+ist+'</text>'+
      '<text x="52" y="67" text-anchor="middle" fill="var(--mut)" font-size="9">von '+ziel+'</text></svg>'+
    '<div class="srd-lab">'+label+' <span class="'+(imSoll?'gut':'schlecht')+'">'+(imSoll?'▲':'▼')+'</span></div>'+
    '<div class="srd-sub">'+Math.round(pct*100)+'% · '+Math.round(p.istRate)+'/'+Math.round(p.sollRate)+' P/h</div></div>';   // A2
}
/* ══════════════════════════════════════════════════════════════════════
   V2 · Belohnungsseite neu — Tages-Diagramm 5→5, KPI-Felder mit Farbverlauf,
   Punkte-Aufschlüsselung, Stapel-100%-Balken. Alles Inline-SVG/HTML.
   ══════════════════════════════════════════════════════════════════════ */
const AN_WT_LANG=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];   // getDay-Index
function belX(ts){ const d=new Date(ts); let hh=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; return hh<5?hh+24:hh; }   // 5..29
function belFensterDatum(ts){ const d=new Date(ts); if(d.getHours()<5) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function belWochentag(datum){ return new Date(datum+'T12:00:00').getDay(); }
function belUhr(x){ x=((x%24)+24)%24; const h=Math.floor(x), m=Math.round((x-h)*60); return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
/* Kumulative Punkte-Kurve eines 5→5-Fensters aus dem Intraday-Log. */
function belTagKurve(fensterDatum, dom){
  const ent=(S.intraday||[]).filter(e=>e.ts && num(e.punkte)>0 && (dom==='alle'||e.domaene===dom) && belFensterDatum(e.ts)===fensterDatum)
    .slice().sort((a,b)=> a.ts<b.ts?-1:1);
  let c=0; const pts=[{x:5,p:0}];
  ent.forEach(e=>{ c+=num(e.punkte); pts.push({x:belX(e.ts), p:c}); });
  return pts;
}
function belKurveWert(pts, x){ let v=0; for(let i=0;i<pts.length;i++){ if(pts[i].x<=x) v=pts[i].p; else break; } return v; }
/* Farbverlauf rot(−1) → lila(0) → grün(+1). */
function belGrad(v){ v=Math.max(-1,Math.min(1,isFinite(v)?v:0));
  const R=[246,109,109],P=[185,138,247],G=[62,207,142], a=v<0?R:P, b=v<0?P:G, t=v<0?v+1:v;
  const c=a.map((x,i)=>Math.round(x+(b[i]-x)*t)); return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
/* H4.3: Wochenend-Regel — DFM-Ziel Sa+So gemeinsam 3000 (kombinierte DFM-Punkte
   des Wochenendes zählen gegen 3000). Privat-Ziel bleibt normales Tagesziel. */
function belIstWochenende(){ const d=new Date().getDay(); return d===0||d===6; }
function belZielDfm(){ return belIstWochenende() ? 3000 : tagesZielDomain('dfm'); }
function belIstDfm(){
  let s=Math.max(0, tagesPunkteDomain('dfm'));
  if(new Date().getDay()===0){ const sn=tagSnapshot(anVorTage(heuteApp(),1)); if(sn) s+=Math.max(0,snapPunkte(sn,'dfm')); }   // Sonntag: Samstag dazu
  return s;
}
function belZielGesamt(){ return belZielDfm()+tagesZielDomain('privat'); }
function belIstGesamt(){ return belIstDfm()+Math.max(0, tagesPunkteDomain('privat')); }

/* V2.1: Tages-Diagramm 5:00→5:00 mit 3 Heute- + 3 Wochentags-Ø-Linien + Ziel-Linie. */
function belTagesDiagramm(){
  const nowIso=jetztIso(), heuteF=belFensterDatum(nowIso), nowX=belX(nowIso), wt=belWochentag(heuteF);
  const liveGes = k=>Math.max(0, tagesPunkteDomain(k));
  function heuteKurve(dom){ const pts=belTagKurve(heuteF,dom);
    const live=dom==='alle'?(liveGes('dfm')+liveGes('privat')):liveGes(dom);
    const last=pts[pts.length-1].p; pts.push({x:nowX, p:Math.max(last,live)}); return pts; }
  const kD=heuteKurve('dfm'), kP=heuteKurve('privat'), kG=heuteKurve('alle');
  const fenster={}; (S.intraday||[]).forEach(e=>{ if(e.ts && num(e.punkte)>0) fenster[belFensterDatum(e.ts)]=true; });
  const wtF=Object.keys(fenster).filter(fd=>fd!==heuteF && belWochentag(fd)===wt);
  function wtAvg(dom){ if(wtF.length<1) return null; const out=[];   // H1: schon 1 Vergleichstag genügt (als gedimmter Ø)
    for(let x=5;x<=29;x+=0.5){ const vals=wtF.map(fd=>belKurveWert(belTagKurve(fd,dom),x)); out.push({x, p: vals.reduce((a,b)=>a+b,0)/vals.length}); } return out; }
  const wD=wtAvg('dfm'), wP=wtAvg('privat'), wG=wtAvg('alle');
  const ziel=belZielGesamt();   // H4.3: Wochenende → DFM-Ziel 3000 gemeinsam
  const heuteGes=kG[kG.length-1].p, std=Math.max(0.02, nowX-5), pace=heuteGes/std;
  const restZiel=Math.max(0, belZielGesamt()-belIstGesamt());   // am Wochenende zählt Sa+So kombiniert
  const zielX = pace>0 ? nowX+restZiel/pace : null;
  let maxY=ziel*1.05; [kD,kP,kG,wD,wP,wG].forEach(s=>{ if(s) s.forEach(pt=>{ if(pt.p>maxY) maxY=pt.p; }); }); maxY=(maxY||10)*1.08;
  const W=320,H=176,pL=8,pR=8,pT=12,pB=20;
  const X=x=>pL+((x-5)/24)*(W-pL-pR), Y=p=>pT+(1-p/maxY)*(H-pT-pB);
  function poly(pts,color,width,dash,clip){ if(!pts||!pts.length) return '';
    const seg=clip?pts.filter(p=>p.x<=nowX+0.001):pts; if(seg.length<1) return '';
    const d=seg.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.p).toFixed(1)).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+width+'"'+(dash?' stroke-dasharray="'+dash+'" opacity="0.5"':'')+' stroke-linejoin="round" stroke-linecap="round"/>'; }
  let g='';
  [5,11,17,23,29].forEach(hx=>{ const x=X(hx).toFixed(1); g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--line)" stroke-width="0.5" opacity=".5"/><text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="var(--mut2)">'+(hx%24)+'</text>'; });
  g+='<line x1="'+pL+'" y1="'+Y(ziel).toFixed(1)+'" x2="'+(W-pR)+'" y2="'+Y(ziel).toFixed(1)+'" stroke="var(--mut2)" stroke-width="0.7" stroke-dasharray="2 3"/><text x="'+(W-pR)+'" y="'+(Y(ziel)-2).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut2)">Ziel '+Math.round(ziel)+'</text>';
  g+=poly(wD,'var(--blue)',1.4,'4 3')+poly(wP,'var(--warn)',1.4,'4 3')+poly(wG,'#f08c4b',1.4,'4 3');
  g+=poly(kD,'var(--blue)',2,null,true)+poly(kP,'var(--warn)',2,null,true)+poly(kG,'#f08c4b',2.4,null,true);
  if(zielX!=null && zielX<=29){ const x=X(zielX).toFixed(1); g+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(H-pB)+'" stroke="var(--ok)" stroke-width="1.4" stroke-dasharray="3 2"/><text x="'+x+'" y="'+(pT+8)+'" text-anchor="middle" font-size="8" fill="var(--ok)">🎯 ~'+belUhr(zielX)+'</text>'; }
  else { g+='<text x="'+(W-pR-2)+'" y="'+(pT+8)+'" text-anchor="end" font-size="8" fill="var(--bad)">🎯 außer Reichweite ▸</text>'; }
  const legende='<div class="an-legend"><span><i style="background:var(--blue)"></i>DFM</span><span><i style="background:var(--warn)"></i>Privat</span><span><i style="background:#f08c4b"></i>Gesamt</span><span style="color:var(--mut2)">— heute · - - Ø '+AN_WT_LANG[wt]+'</span></div>';
  const hint = wtF.length===0 ? '<div class="stathint">Noch kein Vergleichstag ('+AN_WT_LANG[wt]+') — Ø erscheint ab dem ersten getrackten '+AN_WT_LANG[wt]+'.</div>'
    : (wtF.length===1 ? '<div class="stathint">Ø basiert auf 1 Vergleichstag ('+AN_WT_LANG[wt]+').</div>' : '');   // H1
  return '<div class="card"><h3>Tagesverlauf · 5→5 Uhr</h3><svg class="an-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>'+legende+hint+'</div>';
}

/* V2.2: KPI-Felder mit Farbverläufen. */
function belKpiFelder(){
  const we=belIstWochenende();
  const zielD=belZielDfm(), zielP=tagesZielDomain('privat'), ziel=zielD+zielP;   // H4.3: DFM-Ziel am WE = 3000 (Sa+So)
  const pD=Math.round(belIstDfm()), pP=Math.round(tagesPunkteDomain('privat')), pGes=pD+pP;
  const paceD=paceDomain('dfm').istRate, paceP=paceDomain('privat').istRate;
  const dz=v=>v>=0?'+'+Math.round(v):''+Math.round(v);
  // Reihe 1: ein Feld, intern DFM | Privat
  let h='<div class="belkpi-r1"><div class="belkpi-col dfm"><div class="bk-h">DFM'+(we?' · WE (Sa+So/3000)':'')+'</div>'+
      '<div class="bk-row"><b>'+pD+'</b> P · <b>'+Math.round(paceD)+'</b> P/h · Δ '+dz(pD-zielD)+'</div></div>'+
    '<div class="belkpi-col priv"><div class="bk-h">Privat</div>'+
      '<div class="bk-row"><b>'+pP+'</b> P · <b>'+Math.round(paceP)+'</b> P/h · Δ '+dz(pP-zielP)+'</div></div></div>';
  // Reihe 2: drei Verlaufs-Felder
  const nowIso=jetztIso(), heuteF=belFensterDatum(nowIso), nowX=belX(nowIso), wt=belWochentag(heuteF);
  const fenster={}; (S.intraday||[]).forEach(e=>{ if(e.ts&&num(e.punkte)>0) fenster[belFensterDatum(e.ts)]=true; });
  const wtF=Object.keys(fenster).filter(fd=>fd!==heuteF && belWochentag(fd)===wt);
  const wtBei = wtF.length? wtF.map(fd=>belKurveWert(belTagKurve(fd,'alle'),nowX)).reduce((a,b)=>a+b,0)/wtF.length : null;
  // 1) Noch benötigte Punkte (Verlauf: heute vs Wochentags-Ø zur selben Uhrzeit)
  const noch=Math.max(0, ziel-pGes);
  let s1=0; if(wtBei!=null && wtBei>0) s1=Math.max(-1,Math.min(1,(pGes-wtBei)/Math.max(1,wtBei)));
  // 2) Benötigter Pace bis 22:00
  const nowH=new Date(nowIso).getHours()+new Date(nowIso).getMinutes()/60;
  const hBis22=Math.max(0.25, 22-nowH);
  const needPace = noch/hBis22, ownPace=(pGes)/Math.max(0.25,(nowX-5));
  let s2 = ownPace>0 ? Math.max(-1,Math.min(1,(ownPace-needPace)/Math.max(1,needPace))) : (needPace<=0?1:-1);
  if(noch<=0) s2=1;
  // 3) Aufgaben erledigt vs reingekommen heute
  const tid=aktuelleTagId();
  const erlAuf=S.karten.filter(k=>k.status==='erledigt'&&k.tagId===tid&&kartenArt(k)==='Aufgabe').length;
  const reinAuf=S.karten.filter(k=>k.erstelltTs && belFensterDatum(k.erstelltTs)===heuteF && kartenArt(k)==='Aufgabe').length;
  const dAuf=erlAuf-reinAuf; let s3 = dAuf>2?1 : dAuf<-2?-1 : dAuf/2*0.5;   // −2..+2 = lila-Bereich
  const feld=(val,sub,score)=>'<div class="belkpi-v" style="background:linear-gradient(180deg,'+belGrad(score)+'22, transparent);border-color:'+belGrad(score)+'55"><b style="color:'+belGrad(score)+'">'+val+'</b><span>'+sub+'</span></div>';
  h+='<div class="belkpi-r2">'+
    feld(noch>0?Math.round(noch):'✓', 'noch nötig', s1)+
    feld((noch<=0?'0':Math.round(needPace)), 'P/h bis 22:00', s2)+
    feld(dz(dAuf), 'erledigt−rein', s3)+'</div>';
  return '<div class="card"><h3>Heute</h3>'+h+'</div>';
}

/* V2.3: Punkte-Aufschlüsselung (DFM-Projekte / Private Routinen / Private Aufgaben). */
function belAufschluesselung(){
  const gesamt=Math.max(1, tagesPunkteDomain('dfm')+tagesPunkteDomain('privat'));
  function ph(pkt,min){ return min>0.5 ? (pkt/(min/60)) : 0; }
  function karteZeile(k, offen){
    const pkt=kartePunkteHeute(k), min=heuteInvestiertMin(k);
    if(pkt<=0 && min<=0) return '';
    return '<div class="aufl-k"><span class="nm">'+esc(k.titel||'(ohne Titel)')+'</span>'+
      '<span class="v">'+Math.round(pkt)+' P · '+Math.round(ph(pkt,min))+' P/h · '+Math.round(pkt/gesamt*100)+'%</span></div>';
  }
  // Gruppen bauen
  const groups=[];
  // DFM-Projekte
  const dfmK=S.karten.filter(k=>k.domain==='dfm' && (kartePunkteHeute(k)>0||heuteInvestiertMin(k)>0));
  const proj={}; dfmK.forEach(k=>{ const p=k.projekt||'(ohne Projekt)'; (proj[p]=proj[p]||[]).push(k); });
  Object.keys(proj).sort().forEach(p=>groups.push({key:'dfm:'+p, label:'DFM · '+p, karten:proj[p]}));
  // Private Routinen + Aufgaben
  const prR=S.karten.filter(k=>k.domain==='privat' && k.rhythmus && (kartePunkteHeute(k)>0||heuteInvestiertMin(k)>0));
  const prA=S.karten.filter(k=>k.domain==='privat' && !k.rhythmus && (kartePunkteHeute(k)>0||heuteInvestiertMin(k)>0));
  if(prR.length) groups.push({key:'priv:rout', label:'Privat · Routinen', karten:prR});
  if(prA.length) groups.push({key:'priv:auf', label:'Privat · Aufgaben', karten:prA});
  let h='<div class="card"><h3>Punkte-Aufschlüsselung</h3>';
  if(!groups.length){ h+='<p class="d" style="color:var(--mut2)">Heute noch keine Punkte gesammelt.</p></div>'; return h; }
  // Gruppenfarben + Gruppenpunkte
  const PAL=['#4f8ef7','#f2b84b','#3ecf8e','#b98af7','#6dd3e0','#f66d6d','#f78ad0','#8fa1b8'];
  groups.forEach((gr,i)=>{ gr.color=PAL[i%PAL.length]; gr.pkt=gr.karten.reduce((a,k)=>a+kartePunkteHeute(k),0); gr.min=gr.karten.reduce((a,k)=>a+heuteInvestiertMin(k),0); });
  const gesG=Math.max(1, groups.reduce((a,g)=>a+g.pkt,0));
  // H2.1: Gesamtbalken (Verteilung auf die Gruppen)
  h+='<div class="stbar" style="margin-bottom:5px">'+groups.map(gr=>{ const pct=gr.pkt/gesG*100; if(pct<=0) return '';
    return '<i style="width:'+pct.toFixed(1)+'%;background:'+gr.color+'" title="'+esc(gr.label)+': '+Math.round(pct)+'%">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; }).join('')+'</div>';
  h+='<div class="stbar-leg" style="margin-bottom:8px">'+groups.map(gr=>'<span><i style="background:'+gr.color+'"></i>'+esc(gr.label)+'</span>').join('')+'</div>';
  groups.forEach(gr=>{
    const auf=S.ui.auflAuf&&S.ui.auflAuf[gr.key];
    h+='<div class="aufl-g"><div class="aufl-gh" data-aufltoggle="'+gr.key+'"><span class="caret">'+(auf?'▾':'▸')+'</span>'+
      '<span class="nm">'+esc(gr.label)+'</span><span class="v">'+Math.round(gr.pkt)+' P · '+Math.round(ph(gr.pkt,gr.min))+' P/h · '+Math.round(gr.pkt/gesamt*100)+'%</span></div>';
    // H2.2: Balken je Gruppe (Verteilung auf die Einzelkarten)
    const gsum=Math.max(1, gr.pkt), cards=gr.karten.slice().sort((a,b)=>kartePunkteHeute(b)-kartePunkteHeute(a));
    h+='<div class="stbar aufl-cardbar">'+cards.map((k,ci)=>{ const p=kartePunkteHeute(k), pct=p/gsum*100; if(pct<=0) return '';
      const op=(0.55+0.45*(1-ci/Math.max(1,cards.length))).toFixed(2);
      return '<i style="width:'+pct.toFixed(1)+'%;background:'+gr.color+';opacity:'+op+'" title="'+esc(k.titel||'(ohne Titel)')+': '+Math.round(pct)+'%">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; }).join('')+'</div>';
    if(auf){ h+='<div class="aufl-body">'+cards.map(k=>karteZeile(k)).join('')+'</div>'; }
    h+='</div>';
  });
  return h+'</div>';
}

/* V2.4: Stapel-100%-Segmentbalken. */
function belStapelBalken(){
  const seg=[['erl','#3ecf8e','erledigt/bearbeitet'],['muss','#f66d6d','offen muss'],['sk','#f2b84b','offen soll/kann'],['freeze','#4f8ef7','wartet'],['idee','#b98af7','idee']];
  let h='<div class="card"><h3>Stapel-Übersicht</h3>';
  h+='<div class="stbar-leg">'+seg.map(s=>'<span><i style="background:'+s[1]+'"></i>'+s[2]+'</span>').join('')+'</div>';
  S.stapel.forEach(st=>{
    const ks=stapelKarten(st); if(!ks.length) return;
    const c={erl:0,muss:0,sk:0,freeze:0,idee:0};
    ks.forEach(k=>{ if(k.status==='erledigt' || (k.letzteBearbeitung&&String(k.letzteBearbeitung).slice(0,10)===heuteApp() && k.status!=='offen')) { c.erl++; return; }
      if(k.freeze){ c.freeze++; return; }
      if(k.status==='erledigt'){ c.erl++; return; }
      const pr=k.prioritaet; if(pr==='muss') c.muss++; else if(pr==='idee') c.idee++; else c.sk++; });
    const tot=ks.length;
    let bar=''; seg.forEach(s=>{ const n=c[s[0]]; if(!n) return; const pct=n/tot*100;
      bar+='<i style="width:'+pct.toFixed(1)+'%;background:'+s[1]+'" title="'+s[2]+': '+n+'">'+(pct>=8?Math.round(pct)+'%':'')+'</i>'; });
    h+='<div class="stbar-row"><div class="stbar-nm">'+esc(st.name)+' <span>'+tot+'</span></div><div class="stbar">'+bar+'</div></div>';
  });
  return h+'</div>';
}

  // ── V2.1 Tages-Diagramm 5→5 + V2.2 KPI-Felder ────────────────────
  h+=belTagesDiagramm();
  h+=belKpiFelder();

  // ── Stat 3: Zeitverteilung je Domäne + Projekt (heute) ───────────
  const zh=tagesZeitAggregat(aktuelleTagId()); const gesZ=zh.dfm+zh.privat;
  h+='<div class="card"><h3>Zeit heute</h3>';

    h+='<div class="split"><span class="dfm">DFM '+fmtMin(zh.dfm)+'</span><span class="priv">Privat '+fmtMin(zh.privat)+'</span></div>'+
      '<div class="splitbar"><i class="dfm" style="width:'+Math.round(zh.dfm/gesZ*100)+'%"></i><i class="priv" style="width:'+Math.round(zh.privat/gesZ*100)+'%"></i></div>';
    const projekte=Object.entries(zh.projekte).sort((a,b)=>b[1]-a[1]).slice(0,6);
    projekte.forEach(([p,sek])=>{ h+='<div class="projrow"><span>'+esc(p)+'</span><span class="bwrap2"><i style="width:'+Math.round(sek/gesZ*100)+'%"></i></span><b>'+fmtMin(sek)+'</b></div>'; });
  }
  h+='</div>';

  // ── V2.3 Punkte-Aufschlüsselung (aufklappbar) ────────────────────
  h+=belAufschluesselung();

  // ── Stat 4: Routinen-Erfüllungsquote + Streaks ───────────────────
  let erf=0, verp=0; S.historie.forEach(x=>(x.routinenBilanz||[]).forEach(r=>{ if(r.entschuldigt) return; if(r.verpasst) verp++; else erf++; }));
  // erfüllte = in Historie als nicht-verpasst gebucht; zusätzlich heute erledigte Routinen
  const routKarten=S.karten.filter(k=>k.rhythmus && k.status!=='archiviert');
  const quote = (erf+verp)>0 ? Math.round(erf/(erf+verp)*100) : null;
  h+='<div class="card"><h3>Routinen</h3>';
  h+='<div class="kv"><span>Erfüllungsquote (entschuldigte Tage raus)</span><b>'+(quote==null?'—':quote+'%')+'</b></div>';
  if(!routKarten.length) h+='<p class="d" style="color:var(--mut2)">Keine Routinen angelegt.</p>';
  routKarten.sort((a,b)=>num(b.streak)-num(a.streak)).slice(0,8).forEach(k=>{ h+='<div class="kv"><span>'+esc(k.titel)+'</span><b>🔥 '+num(k.streak)+'</b></div>'; });
  h+='</div>';

  // ── V2.4 Stapel-100%-Segmentbalken (ersetzt die alte Stapel-KPI) ──
  h+=belStapelBalken();

  // ── Shop — nächste Stufen (§7 D7, voller Port) ───────────────────
  h+='<div class="card"><h3>Shop — nächste Stufen</h3><p class="d">Konto '+Math.round(konto())+' P (Wohlstand − Ausgaben). Der Inhalt der nächsten Stufe bleibt „???" bis zum Freischalten.</p>'+shopHtml()+'</div>';

  el('belohnungBody').innerHTML=h;
}

function konfetti(){
  const cv=el('konfetti'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const farben=['#4f8ef7','#3ecf8e','#f2b84b','#f66d6d','#b98af7','#6dd3e0'];
  const parts=Array.from({length:70},()=>({
    x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.5,
    vx:(Math.random()-.5)*9, vy:-(Math.random()*10+5),
    g:.32+Math.random()*.15, s:5+Math.random()*5,
    c:farben[(Math.random()*farben.length)|0], r:Math.random()*6, vr:(Math.random()-.5)*.4
  }));
  let f=0;
  (function anim(){
    ctx.clearRect(0,0,cv.width,cv.height); f++;
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
    if(f<70) requestAnimationFrame(anim); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
