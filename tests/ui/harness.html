<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fokus UI-Harness</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f18;height:100%}
  #app{border:0;width:375px;height:812px;display:block}
  #result{position:fixed;left:-9999px;top:0;white-space:pre}
</style>
<script src="fixture.js"></script>
</head>
<body>
<iframe id="app"></iframe>
<pre id="result"></pre>
<script>
/* Same-origin-Harness: schreibt die Fixture in localStorage, lädt /neu.html im
   iframe, führt je ?view= die nötigen Aktionen aus, fährt die Layout-Checks
   und den Konsolen-Wächter und legt das Ergebnis als JSON in #result ab.
   run.sh liest es über chrome --dump-dom. */
(function(){
  var Q=new URLSearchParams(location.search);
  var VIEW=Q.get('view')||'stapel';
  /* Headless-Chrome layoutet Fenster unter ~500px Breite trotzdem breiter —
     darum bekommt das iframe die Zielgroesse HART per Query-Param. Der
     Screenshot (window-size identisch) zeigt dann exakt das iframe. */
  var FW=parseInt(Q.get('w')||'375',10), FH=parseInt(Q.get('h')||'812',10);
  var ergebnis={ view:VIEW, fatal:[], findings:[], warnungen:[], checks:0, fertig:false };
  function fatal(t){ ergebnis.fatal.push(t); }
  function finding(t){ ergebnis.findings.push(t); }
  function abschluss(){
    ergebnis.fertig=true;
    document.getElementById('result').textContent='UIRESULT:'+JSON.stringify(ergebnis)+':ENDRESULT';
    document.title='HARNESS-FERTIG';
  }

  /* ── Tap-Ausnahmen: die EINZIGE Stelle für erlaubte Untergrößen ──
     (Sekundärzeile 40px seit v1.8.0 §2.1; Unteraufgaben-Kästchen 34px seit
     v1.10.0 §3.4; Chips 30px sind seit v1.0 der Dialog-/Detail-Standard;
     Unteraufgaben-Inline-Felder und Karten-Streifen-Elemente sind Bestand.) */
  var TAP_AUSNAHMEN=[
    { sel:'.trow.tsek button, .trow.tsek .sar', min:40 },
    { sel:'.uacheck, .uacheck .box',            min:32 },
    { sel:'.chip',                              min:26 },
    { sel:'.uamin, .uabonus, .uax, .uaneu button, .uaneu input', min:24 },
    { sel:'.tstreifen *, #fkNav *, .pql-b, .pql-chip', min:0 },   // Karten-Streifen/Quick-Leiste: Bestand
    { sel:'.st-edit, .st-groesse, .caret, .segmini button, .seg', min:24 },
    { sel:'.minibtn, .kg-edit, .albtab, .albitem', min:24 },
    { sel:'.tb-btn, .btn.sm, .btn.ghost.sm', min:30 },
    { sel:'#fkPP', min:38 },      // Play/Pause der Fokus-Leiste: bewusst kompakt (Bestand)
    { sel:'#sheetX, .x', min:34 } // Schliessen-X der Sheets: bewusst kompakt (Bestand)
  ];
  var TAP_MIN=44;

  function sichtbar(elm){
    if(!elm.getClientRects().length) return false;
    var st=getComputedStyle(elm);
    if(st.visibility==='hidden'||st.display==='none'||parseFloat(st.opacity||'1')===0) return false;
    var r=elm.getBoundingClientRect();
    return r.width>0.5 && r.height>0.5;
  }
  function tapMin(elm){
    for(var i=0;i<TAP_AUSNAHMEN.length;i++){
      try{ if(elm.matches(TAP_AUSNAHMEN[i].sel)) return TAP_AUSNAHMEN[i].min; }catch(e){}
    }
    return TAP_MIN;
  }
  function beschreibe(elm){
    var id=elm.id?'#'+elm.id:'';
    var cls=(elm.className&&elm.className.baseVal===undefined)?('.'+String(elm.className).trim().split(/\s+/).slice(0,2).join('.')):'';
    var txt=(elm.textContent||'').trim().slice(0,26);
    return elm.tagName.toLowerCase()+id+cls+(txt?' „'+txt+'“':'');
  }

  function layoutChecks(fw){
    var doc=fw.document, W=fw.innerWidth;
    /* 1) kein waagerechter Überlauf */
    ergebnis.checks++;
    if(doc.documentElement.scrollWidth>W+1)
      fatal('Waagerechter Überlauf: scrollWidth '+doc.documentElement.scrollWidth+' > '+W);
    var alle=doc.querySelectorAll('body *');
    var geprueft=0;
    for(var i=0;i<alle.length;i++){
      var elm=alle[i];
      if(!sichtbar(elm)) continue;
      var r=elm.getBoundingClientRect();
      geprueft++;
      /* 2) kein Element ragt über den Viewport */
      if(r.right>W+2 && r.left<W)
        fatal('Ragt über den Viewport: '+beschreibe(elm)+' (right '+Math.round(r.right)+' > '+W+')');
      /* 3) Tap-Ziele */
      var istTap = elm.tagName==='BUTTON' ||
        (elm.tagName!=='INPUT' && elm.tagName!=='TEXTAREA' && elm.tagName!=='SELECT' &&
         ['check','detail','tickplus','fokusstart','sortup','sortdown','kette','pin','freeze','schnell','archiv','schieb','tagclose','tagstart','rcheck','rplus','rplay','sheetstart']
           .some(function(a){ return elm.hasAttribute('data-'+a); }));
      if(istTap){
        var mn=tapMin(elm);
        if(mn>0 && (r.width<mn-0.5 || r.height<mn-0.5))
          finding('Tap-Ziel '+Math.round(r.width)+'×'+Math.round(r.height)+' < '+mn+': '+beschreibe(elm));
      }
      /* 5) sichtbares Element ohne Ausdehnung — über sichtbar() bereits raus;
         hier der umgekehrte Fall: Layout-tragende Container mit 0-Größe und Inhalt */
      if((r.width<0.5||r.height<0.5) && (elm.textContent||'').trim())
        fatal('Sichtbares Element ohne Ausdehnung: '+beschreibe(elm));
    }
    /* 4) kein buchstabenweiser Umbruch: Elementbreite >= breitestes Wort */
    var cv=doc.createElement('canvas'), cx=cv.getContext('2d');
    var texte=doc.querySelectorAll('body *');
    for(var j=0;j<texte.length;j++){
      var t=texte[j];
      if(!sichtbar(t)) continue;
      var eigener='';
      for(var c=0;c<t.childNodes.length;c++)
        if(t.childNodes[c].nodeType===3) eigener+=t.childNodes[c].textContent;
      eigener=eigener.trim();
      if(eigener.length<4 || eigener.indexOf(' ')<0 && eigener.length<8) continue;
      var st=getComputedStyle(t);
      if(st.whiteSpace==='nowrap') continue;
      cx.font=st.fontWeight+' '+st.fontSize+' '+st.fontFamily;
      var worte=eigener.split(/\s+/), breitestes=0;
      for(var w=0;w<worte.length;w++){ var b=cx.measureText(worte[w]).width; if(b>breitestes) breitestes=b; }
      var innen=t.clientWidth-(parseFloat(st.paddingLeft)||0)-(parseFloat(st.paddingRight)||0);
      if(innen>0 && breitestes>innen+2 && st.overflowWrap!=='anywhere' && st.wordBreak!=='break-all')
        fatal('Wort breiter als Element (bricht buchstabenweise): '+beschreibe(t)+' — Wort '+Math.round(breitestes)+'px, Platz '+Math.round(innen)+'px');
    }
    ergebnis.geprueft=geprueft;
  }

  function konsoleWaechter(fw){
    try{
      fw.addEventListener('error', function(e){ fatal('JS-Fehler ['+VIEW+']: '+(e.message||e.type)); });
      fw.addEventListener('unhandledrejection', function(e){ fatal('Unbehandelte Rejection ['+VIEW+']: '+String(e.reason).slice(0,200)); });
      var origErr=fw.console.error, origWarn=fw.console.warn;
      fw.console.error=function(){ fatal('console.error ['+VIEW+']: '+Array.prototype.join.call(arguments,' ').slice(0,200)); origErr.apply(fw.console, arguments); };
      fw.console.warn=function(){ ergebnis.warnungen.push(Array.prototype.join.call(arguments,' ').slice(0,160)); origWarn.apply(fw.console, arguments); };
    }catch(e){ fatal('Wächter-Installation fehlgeschlagen: '+e); }
  }

  /* ── View-Aktionen im iframe (same-origin) ── */
  /* §16 (v2.0.0): `S` ist eine const im App-Scope und liegt NICHT auf window
     — fw.S ist undefined. Die Sichten werden deshalb ueber echte Klicks auf
     die Leiste geschaltet, nicht ueber den Zustand. Das ist ohnehin naeher
     an dem, was Pascal tut. */
  function sicht(fw, key){
    fw.setTab('suche');
    var b=fw.document.querySelector('[data-susicht="'+key+'"]');
    if(b) b.click(); else throw new Error('Sicht-Knopf fehlt: '+key);
  }
  var AKTIONEN={
    /* ══ v2.0.0 · zwei Navigationsziele, fuenf Sichten ══ */
    heute:    function(fw){ sicht(fw,'heute'); },
    matrix:   function(fw){ sicht(fw,'matrix');
                            var q=fw.document.querySelector('[data-sumx="werkzeug"]'); if(q) q.click(); },
    oft:      function(fw){ sicht(fw,'oft'); },
    faellig:  function(fw){ sicht(fw,'faellig'); },
    art:      function(fw){ sicht(fw,'art'); },
    freitext: function(fw){ fw.setTab('suche');
                            var i=fw.document.getElementById('suFreitext');
                            i.value='a'; i.dispatchEvent(new fw.Event('input',{bubbles:true})); },
    /* Die laufende Karte liegt UEBER der Suche (§6) */
    fokus:    function(fw){ fw.setTab('suche'); fw.fokusStarten('k-lang', null); fw.closeSheet(); fw.fokusLayerPflegen(); },
    leiste:   function(fw){ fw.setTab('suche'); fw.renderAlles(); fw.closeSheet(); },
    sheet:    function(fw){ fw.setTab('suche'); fw.renderAlles(); fw.oeffneStatusSheet(); },
    /* §1.2 · der EINE Dialog fuer Matrix und Akku */
    mxdialog: function(fw){ fw.setTab('suche'); fw.oeffneMatrixDialog('k-lang','abhaken'); },
    /* §9 · der Vorschlag direkt nach dem Matrix-Tap */
    vorschlag:function(fw){ fw.setTab('suche'); fw.matrixPosSetzen(-0.7,0.1,null,'test'); fw.zeigeVorschlag(); },
    /* §6 · Kettensortierung aus der Suche heraus */
    kpos:     function(fw){ fw.setTab('suche'); fw.oeffneKettePosition('k-lang'); },
    abschluss:function(fw){ fw.setTab('suche'); fw.abhakDialog('k-lang', false); },
    tagab:    function(fw){ fw.setTab('suche'); fw.oeffneTagAbschluss(); },
    routinen: function(fw){ fw.setTab('suche'); fw.renderAlles(); fw.oeffneRoutinen(); },
    /* §13 · Shop haengt hinter der FIGUR, kein Tab */
    belohnung:function(fw){ var b=fw.document.getElementById('btnFigur'); if(b) b.click(); fw.closeSheet(); },
    albumR:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum(); },
    albumK:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum();
                            var b=fw.document.querySelector('[data-albtab="kulissen"]'); if(b) b.click(); },
    albumB:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum();
                            var b=fw.document.querySelector('[data-albtab="besitz"]'); if(b) b.click(); },
    detail:   function(fw){ fw.setTab('suche'); fw.oeffneDetail('k-ticks'); },
    /* §12 · Statistik ist ein eigenes Navigationsziel */
    statistik:function(fw){ fw.setTab('statistik'); },
    /* §11 · Delta-Export */
    sync:     function(fw){ fw.setTab('suche'); fw.oeffneSync(); },
    /* §0 · das Export-Gate (die Fixture gilt als migriert — hier gezielt an) */
    gate:     function(fw){ fw.setTab('suche'); fw.zeigeV200Gate2Test ? fw.zeigeV200Gate2Test() : fw.zeigeV200Gate(); },
    einst:    function(fw){ var b=fw.document.getElementById('btnEinst'); if(b) b.click(); }
  };

  /* ── localStorage-Sequenz (view=storage): drei Punkte, die der Stub nie
     zeigen konnte — Persistenz über Reload, Migration genau einmal, Timer
     überlebt Reload. Läuft über zwei iframe-Generationen. ── */
  function storageSequenz(){
    /* Fixture OHNE Migrations-Flags → die App migriert beim 1. Laden. */
    fixtureSchreiben();
    var metaRoh=JSON.parse(localStorage.getItem('fokus2_meta'));
    ['migration180','zeit191','gamify190','akku1100','flowfix181'].forEach(function(f){ delete metaRoh[f]; });
    delete metaRoh.migration180Gezeigt; delete metaRoh.gamify190Gezeigt;
    localStorage.setItem('fokus2_meta', JSON.stringify(metaRoh));
    localStorage.setItem('fokus2_uiharness_probe', JSON.stringify({wert:'überlebt-reload'}));

    ladeIframe(function(fw){
      konsoleWaechter(fw);
      ergebnis.checks++;
      var meta1=JSON.parse(localStorage.getItem('fokus2_meta'));
      if(meta1.zeit191!==true || meta1.gamify190!==true) fatal('Migrationen liefen beim 1. Laden nicht (zeit191/gamify190 fehlen)');
      var bak1=localStorage.getItem('fokus2_karten_bak191');
      if(!bak1) fatal('Migrations-Sicherung karten_bak191 fehlt nach dem 1. Laden');
      var log1=JSON.stringify(meta1.zeit191Log||null);
      /* Timer starten, dann Reload */
      fw.fokusStarten('k-lang', null);
      var fokus1=JSON.parse(localStorage.getItem('fokus2_fokus'));
      ergebnis.checks++;
      if(!fokus1 || fokus1.karteId!=='k-lang' || fokus1.laeuft!==true) fatal('Laufender Timer wurde nicht persistiert');

      ladeIframe(function(fw2){
        konsoleWaechter(fw2);
        ergebnis.checks++;
        var probe=JSON.parse(localStorage.getItem('fokus2_uiharness_probe')||'null');
        if(!probe || probe.wert!=='überlebt-reload') fatal('localStorage-Wert hat den Reload NICHT überlebt');
        var meta2=JSON.parse(localStorage.getItem('fokus2_meta'));
        ergebnis.checks++;
        if(JSON.stringify(meta2.zeit191Log||null)!==log1) fatal('Migration lief beim 2. Laden ERNEUT (zeit191Log verändert)');
        if(localStorage.getItem('fokus2_karten_bak191')!==bak1) fatal('Migrations-Sicherung wurde beim 2. Laden überschrieben');
        ergebnis.checks++;
        /* const S liegt nicht auf window — Zustand über localStorage plus
           laufendeSek() (Top-Level-Funktion, läuft im App-Scope) prüfen. */
        var fokus2=JSON.parse(localStorage.getItem('fokus2_fokus')||'null');
        if(!(fokus2 && fokus2.karteId==='k-lang' && fokus2.laeuft===true))
          fatal('Laufender Timer hat den Reload nicht überlebt (fokus='+JSON.stringify(fokus2)+')');
        var sek=fw2.laufendeSek?fw2.laufendeSek():null;
        ergebnis.checks++;
        if(sek==null || !(sek>0)) fatal('Timer im neuen Frame nicht aktiv (laufendeSek='+sek+')');
        ergebnis.timerSekNachReload=sek;
        localStorage.removeItem('fokus2_uiharness_probe');
        abschluss();
      });
    });
  }

  /* ── §8 (v1.13.0) · Diagnose-Sequenz (view=diag): synthetische Klicks plus
     Zustandsvergleich für §1.3 (Verschieben in der Stapelansicht), §3.2
     (Rein/Raus-Bilanz) und §6.1 (Akku-Schnellzugriff). Kein Screenshot —
     der Harness ist hier Diagnosewerkzeug, nicht Abnahmeinstrument. ── */
  /* ══════════════════════════════════════════════════════════════════
     §8 · KLICK-DIAGNOSE (view=diag) — synthetische Klicks plus
     Zustandsvergleich, kein Screenshot.
     v2.0.0: komplett neu geschrieben. Die alte Sequenz prueft den
     v1.13-Vertrag (Stapelansicht, ketteDfm, Tagesabschnitte) — den gibt es
     nicht mehr. Durchgeklickt werden jetzt die Wege, die der Auftrag nennt:
     Matrix-Tap, Vorschlag, Kettensortierung aus der Suche, Sichtwechsel,
     Shop ueber die Figur, Tagesabschluss, Delta-Export.
     ══════════════════════════════════════════════════════════════════ */
  function diagSequenz(){
    fixtureSchreiben();
    ladeIframe(function(fw){
      konsoleWaechter(fw);
      var d=fw.document;
      function pruef(bed, txt){ ergebnis.checks++; if(!bed) fatal('diag '+txt); }
      function klick(sel){ var e=d.querySelector(sel); if(e) e.click(); return e; }
      try{
        /* ── §6 · Sichtwechsel: jede der fuenf Sichten ist per Tap erreichbar ── */
        fw.setTab('suche');
        ['heute','matrix','oft','faellig','art'].forEach(function(v){
          var b=d.querySelector('[data-susicht="'+v+'"]');
          pruef(!!b, '§6: Sicht-Knopf „'+v+'" fehlt');
          if(b){ b.click();
            pruef(d.querySelector('[data-susicht="'+v+'"]').className.indexOf('on')>=0,
                  '§6: Sicht „'+v+'" wird nach dem Tap nicht aktiv'); }
        });
        /* Heute-Sicht traegt die Kette in Reihenfolge */
        klick('[data-susicht="heute"]');
        var zeilen=d.querySelectorAll('#suBody .kettenzeile');
        pruef(zeilen.length>0, '§6: Heute-Sicht zeigt keine Kettenzeilen');

        /* ── §6 · Kettensortierung AUS DER SUCHE heraus ── */
        var vorher=fw.tagesKette().slice();
        pruef(vorher.length>=3, '§6: zu kurze Kette fuer den Sortiertest');
        if(vorher.length>=3){
          var letzte=vorher[vorher.length-1];
          fw.oeffneKettePosition(letzte);
          var pos1=d.querySelector('[data-kpos="'+letzte+'"][data-n="1"]');
          pruef(!!pos1, '§6: Positionswahl bietet keine Position 1');
          if(pos1){
            pos1.click();
            pruef(fw.tagesKette()[0]===letzte,
                  '§6: Tap auf Position 1 verschiebt die Karte nicht (Kette '+fw.tagesKette().slice(0,2).join(',')+')');
          }
          fw.closeSheet();
        }
        /* Keine Pfeile mehr in der Kartenzeile */
        pruef(d.querySelectorAll('#suBody [data-sortup]').length===0,
              '§6: Kartenzeile traegt noch Sortier-Pfeile');

        /* ── §1.2 · Matrix-Tap: EIN Dialog fuer Matrix UND Akku ── */
        var kid=fw.tagesKette()[0];
        fw.fokusStarten(kid, null);
        var posVor=fw.matrixPos();
        fw.oeffneMatrixDialog(kid, 'abhaken');
        var pad=d.getElementById('mxPad');
        pruef(!!pad, '§1.2: Matrix-Pad fehlt im Dialog');
        pruef(!!d.getElementById('mxAkku'), '§1.2: Akku steckt NICHT im selben Dialog');
        pruef(!!d.querySelector('[data-mxskip]'), '§1.2: Ueberspringen fehlt');
        /* Der Punkt liegt frei: ein Zeigerdruck rechts unten setzt x>0 */
        if(pad){
          var r=pad.getBoundingClientRect();
          var ev=new fw.PointerEvent('pointerdown', {clientX:r.left+r.width*0.8,
                  clientY:r.top+r.height*0.7, bubbles:true, pointerId:1});
          pad.dispatchEvent(ev);
          klick('[data-mxgo]');
          var posNach=fw.matrixPos();
          pruef(posNach && posNach.x>0.3,
                '§1.2: Tap rechts setzt die Position nicht nach rechts (x='+(posNach&&posNach.x)+')');
          pruef(posNach && posNach.y<0, '§1.2: Tap unten setzt y nicht nach innen');
          /* §2: die Bewegung nach rechts hat einen Bonus gebucht */
          if(posVor && posNach && posNach.x>posVor.x){
            var k0=null; fw.S ? null : null;
            var spur=fw.matrixSpur();
            pruef(spur.length>=1, '§2: keine Spur nach dem Tap');
          }
        }
        /* Die Abfrage wurde gezaehlt */
        pruef(fw.matrixSkipQuote()>=0, '§1.2: Skip-Quote nicht berechenbar');

        /* ── §1.2 · Ueberspringen wird GEZAEHLT ── */
        fw.oeffneMatrixDialog(kid, 'pause');
        var skipVor=fw.matrixSkipQuote();
        klick('[data-mxskip]');
        pruef(fw.matrixSkipQuote()>skipVor || fw.matrixSkipQuote()>0,
              '§1.2: Ueberspringen wird nicht mitgezaehlt');

        /* ── §9 · Der Vorschlag nach dem Matrix-Tap ──
           Der Matrix-Dialog oben hat fuer DIESE Karte schon einen Vorschlag
           gezeigt; §9 sagt „genau einmal pro Karte". Geprueft wird deshalb
           mit einer ZWEITEN Karte. */
        /* closeSheet nimmt nur die Klasse weg, das Markup bleibt im DOM —
           massgeblich ist deshalb, ob das Sheet OFFEN ist, nicht ob der
           Knopf noch existiert. */
        function sheetAuf(){ var sh=d.getElementById('sheet');
          return !!(sh && sh.className.indexOf('on')>=0); }
        var kid2=fw.tagesKette()[1] || kid;
        fw.matrixPosSetzen(-0.8, 0, null, 'diag');
        fw.zeigeVorschlag(kid2);
        pruef(sheetAuf() && !!d.querySelector('[data-vsgo]'), '§9: links erzeugt keinen Vorschlag');
        pruef(d.querySelector('.vsBox') && d.querySelector('.vs-w').textContent.length>0,
              '§9: Vorschlag ohne Begruendung');
        fw.closeSheet();
        /* genau EINMAL je Karte: dieselbe Karte liefert keinen zweiten */
        fw.zeigeVorschlag(kid2);
        pruef(!sheetAuf(), '§9: Vorschlag erscheint fuer dieselbe Karte mehrfach');
        /* ... eine ANDERE Karte aber schon */
        var kid3=fw.tagesKette()[2];
        if(kid3){ fw.zeigeVorschlag(kid3);
          pruef(sheetAuf(), '§9: andere Karte bekommt KEINEN eigenen Vorschlag');
          fw.closeSheet(); }

        /* ── §13 · Shop haengt hinter der FIGUR ── */
        var fig=d.getElementById('btnFigur');
        pruef(!!fig, '§13: Figur im Kopf fehlt');
        if(fig){ fig.click();
          pruef(d.getElementById('v-belohnung').className.indexOf('on')>=0,
                '§13: Tap auf die Figur oeffnet den Shop nicht'); }
        pruef(d.querySelectorAll('#nav button').length===2,
              '§6: Navigationsleiste traegt nicht genau zwei Ziele');

        /* ── §10 · Tagesabschluss: nur abraeumen und exportieren ── */
        fw.setTab('suche');
        fw.oeffneTagAbschluss();
        pruef(!!d.querySelector('[data-abfinish]'), '§10: Abschluss-Knopf fehlt');
        pruef(!d.querySelector('[data-abweiter]'), '§10: es gibt noch einen zweiten Schritt');
        fw.closeSheet();

        /* ── §11 · Delta-Export ── */
        fw.oeffneSync();
        pruef(!!d.querySelector('[data-syncmode="delta"]') && !!d.querySelector('[data-syncmode="voll"]'),
              '§11: Delta/Voll-Umschalter fehlt');
        pruef(!!d.querySelector('[data-syncbestaetigt]'), '§11: Bestaetigungs-Knopf fehlt');
        var tsVor=(lsGetMeta()||{}).letzterSyncBestaetigtTs || null;
        var exFeld=d.getElementById('syncEx');
        pruef(!!exFeld && exFeld.value.indexOf('"appVersion": "2.0.0"')>=0,
              '§11: Export traegt nicht appVersion 2.0.0');
        pruef(((lsGetMeta()||{}).letzterSyncBestaetigtTs||null)===tsVor,
              '§11: der Zeitstempel wurde schon VOR der Bestaetigung fortgeschrieben');
        klick('[data-syncbestaetigt]');
        pruef(((lsGetMeta()||{}).letzterSyncBestaetigtTs||null)!==tsVor,
              '§11: der Zeitstempel wurde nach der Bestaetigung NICHT fortgeschrieben');
        fw.closeSheet();

        /* ── §0 · Das Export-Gate leert nichts ohne Haken ── */
        fw.zeigeV200Gate2Test();
        var go=d.querySelector('[data-v200go]');
        pruef(!!go, '§0: Gate ohne „Bestand leeren"');
        var nVor=fw.tagesKette().length;
        if(go){
          go.click();   // OHNE Haken — darf nichts tun
          pruef(d.getElementById('v200Ok')!==null, '§0: Gate wurde ohne Bestaetigung geschlossen');
          var cb=d.getElementById('v200Ok');
          if(cb){ cb.checked=true; d.querySelector('[data-v200go]').click(); }
        }
        fw.closeSheet();
      }catch(err){ fatal('diag-Sequenz abgebrochen: '+err); }
      abschluss();
    });
    function lsGetMeta(){ try{ return JSON.parse(localStorage.getItem('fokus2_meta')||'null'); }catch(e){ return null; } }
  }

  var frame=document.getElementById('app');
  function ladeIframe(cb){
    var f=document.getElementById('app');
    var neu=document.createElement('iframe'); neu.id='app';
    neu.style.width=FW+'px'; neu.style.height=FH+'px';
    f.parentNode.replaceChild(neu, f);
    neu.addEventListener('load', function(){
      /* der App etwas Zeit für init() geben (virtuelle Zeit im Headless) */
      setTimeout(function(){
        try{ cb(neu.contentWindow); }
        catch(e){ fatal('Aktion fehlgeschlagen: '+e); abschluss(); }
      }, 900);
    });
    neu.src='/neu.html';
  }

  if(VIEW==='storage'){ storageSequenz(); return; }
  if(VIEW==='diag'){ diagSequenz(); return; }   // §8 (v1.13.0): Klick-Diagnose

  fixtureSchreiben();
  ladeIframe(function(fw){
    konsoleWaechter(fw);
    /* const S liegt nicht auf window — Initialisierung über die
       Top-Level-Funktionen und den gerenderten DOM feststellen. */
    if(typeof fw.setTab!=='function' || typeof fw.laufendeSek!=='function')
      fatal('App nicht initialisiert (Top-Level-Funktionen fehlen)');
    if(!fw.document.body || fw.document.body.children.length===0)
      fatal('App nicht initialisiert (leerer body)');
    try{ (AKTIONEN[VIEW]||AKTIONEN.stapel)(fw); }
    catch(e){ fatal('View-Aktion „'+VIEW+'“ fehlgeschlagen: '+e); }
    setTimeout(function(){
      try{ layoutChecks(fw); }catch(e){ fatal('Layout-Checks fehlgeschlagen: '+e); }
      abschluss();
    }, 700);
  });
})();
