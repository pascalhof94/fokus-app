<style>
  html,body{margin:0;padding:0;background:#0b0f18;height:100%}
  #app{border:0;width:375px;height:812px;display:block}
  #result{position:fixed;left:-9999px;top:0;white-space:pre}
</style>

<script>
/* ══ Schritt 0 (v2.1.0) · ECHTE DATEN, WENN VORHANDEN ══════════════════
   tests/ui/pascal-20-09.json ist Pascals Vollexport. Sie liegt in
   .gitignore und wird NIE committet (Kundennamen, Projekte, private
   Routinen; das Repo haengt an GitHub Pages).
   Fehlt sie, faellt der Harness auf fixture-real.js zurueck — das Repo
   muss ohne die private Datei gruen bauen. */
var ECHT_QUELLE='Nachbau (fixture-real.js)';
function echteDatenLaden(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','pascal-20-09.json',false);   // synchron: der Harness ist ein Werkzeug
    x.send(null);
    if(x.status!==200) return null;
    var p=JSON.parse(x.responseText);
    if(!p || !Array.isArray(p.karten) || !p.karten.length) return null;
    ECHT_QUELLE='pascal-20-09.json ('+p.karten.length+' Karten, appVersion '+(p.appVersion||'?')+')';
    return p;
  }catch(e){ return null; }
}
/* Aus einem Vollexport nach Vertrag 1.6/2.0 einen localStorage-Stand bauen. */
function echtSchreibenAusPaket(p){
  try{ localStorage.clear(); }catch(e){}
  var wh=p.wiederherstellung||{};
  function setz(k,v){ if(v!==undefined && v!==null) localStorage.setItem('fokus2_'+k, JSON.stringify(v)); }
  setz('karten', p.karten.map(function(k){
    var o={}; Object.keys(k).forEach(function(f){
      if(f==='istMin'||f==='punkteIst'||f==='punktePrognose'||f==='unteraufgaben'||
         f==='sitzungen'||f==='kette'||f==='kettenPosition'||f==='tagesabschnittEffektiv') return;
      o[f]=k[f]; });
    if(o.istSek===undefined && k.istMin!==undefined) o.istSek=Math.max(0,Number(k.istMin)||0)*60;
    return o; }));
  var subs=[]; p.karten.forEach(function(k){
    (k.unteraufgaben||[]).forEach(function(u){ subs.push(Object.assign({parentId:k.id}, u)); }); });
  setz('unteraufgaben', wh.unteraufgaben || subs);
  setz('meta', wh.meta || p.meta || {});
  setz('settings', wh.settings);
  setz('routinenGruppen', wh.routinenGruppen || p.gruppen);
  setz('gruppen', wh.kartenGruppen); setz('stapel', wh.stapel); setz('ordner', wh.ordner);
  setz('vorlagen', wh.vorlagen); setz('belohnung', wh.belohnung);
  setz('historie', wh.historie); setz('intraday', wh.intraday);
  setz('tag', wh.tag!==undefined ? wh.tag : null);
  localStorage.setItem('fokus2_ui', JSON.stringify({tab:'suche'}));
  localStorage.setItem('fokus2_fokus', JSON.stringify(null));
}
/* EIN Einstieg fuer alle Diagnosen: echt, wenn da — sonst Nachbau. */
function bestandSchreiben(){
  var p=echteDatenLaden();
  if(p){ echtSchreibenAusPaket(p); return; }
  fixtureRealSchreiben();
}
</script>

<script>
/* Same-origin-Harness: schreibt die Fixture in localStorage, lädt /neu.html im
   iframe, führt je ?view= die nötigen Aktionen aus, fährt die Layout-Checks
   und den Konsolen-Wächter und legt das Ergebnis als JSON in #result ab.
   run.sh liest es über chrome --dump-dom. */
(function(){
  var Q=new URLSearchParams(location.search);
  var VIEW=Q.get('view')||'stapel';
  /* Headless-Chrome layoutet Fenster unter ~500px Breite trotzdem breiter —
     darum bekommt das iframe die Zielgroesse HART per Query-Param. Der
     Screenshot (window-size identisch) zeigt dann exakt das iframe. */
  var FW=parseInt(Q.get('w')||'375',10), FH=parseInt(Q.get('h')||'812',10);
  var ergebnis={ view:VIEW, fatal:[], findings:[], warnungen:[], checks:0, fertig:false };
  function fatal(t){ ergebnis.fatal.push(t); }
  function finding(t){ ergebnis.findings.push(t); }
  function abschluss(){
    ergebnis.fertig=true;
    document.getElementById('result').textContent='UIRESULT:'+JSON.stringify(ergebnis)+':ENDRESULT';
    document.title='HARNESS-FERTIG';
  }

  /* ── Tap-Ausnahmen: die EINZIGE Stelle für erlaubte Untergrößen ──
     (Sekundärzeile 40px seit v1.8.0 §2.1; Unteraufgaben-Kästchen 34px seit
     v1.10.0 §3.4; Chips 30px sind seit v1.0 der Dialog-/Detail-Standard;
     Unteraufgaben-Inline-Felder und Karten-Streifen-Elemente sind Bestand.) */
  var TAP_AUSNAHMEN=[
    { sel:'.trow.tsek button, .trow.tsek .sar', min:40 },
    { sel:'.uacheck, .uacheck .box',            min:32 },
    { sel:'.chip',                              min:26 },
    { sel:'.uamin, .uabonus, .uax, .uaneu button, .uaneu input', min:24 },
    { sel:'.tstreifen *, #fkNav *, .pql-b, .pql-chip', min:0 },   // Karten-Streifen/Quick-Leiste: Bestand
    { sel:'.st-edit, .st-groesse, .caret, .segmini button, .seg', min:24 },
    { sel:'.minibtn, .kg-edit, .albtab, .albitem', min:24 },
    { sel:'.tb-btn, .btn.sm, .btn.ghost.sm', min:30 },
    { sel:'#fkPP', min:38 },      // Play/Pause der Fokus-Leiste: bewusst kompakt (Bestand)
    { sel:'#sheetX, .x', min:34 } // Schliessen-X der Sheets: bewusst kompakt (Bestand)
  ];
  var TAP_MIN=44;

  function sichtbar(elm){
    if(!elm.getClientRects().length) return false;
    var st=getComputedStyle(elm);
    if(st.visibility==='hidden'||st.display==='none'||parseFloat(st.opacity||'1')===0) return false;
    var r=elm.getBoundingClientRect();
    return r.width>0.5 && r.height>0.5;
  }
  function tapMin(elm){
    for(var i=0;i<TAP_AUSNAHMEN.length;i++){
      try{ if(elm.matches(TAP_AUSNAHMEN[i].sel)) return TAP_AUSNAHMEN[i].min; }catch(e){}
    }
    return TAP_MIN;
  }
  function beschreibe(elm){
    var id=elm.id?'#'+elm.id:'';
    var cls=(elm.className&&elm.className.baseVal===undefined)?('.'+String(elm.className).trim().split(/\s+/).slice(0,2).join('.')):'';
    var txt=(elm.textContent||'').trim().slice(0,26);
    return elm.tagName.toLowerCase()+id+cls+(txt?' „'+txt+'“':'');
  }

  function layoutChecks(fw){
    var doc=fw.document, W=fw.innerWidth;
    /* 1) kein waagerechter Überlauf */
    ergebnis.checks++;
    if(doc.documentElement.scrollWidth>W+1)
      fatal('Waagerechter Überlauf: scrollWidth '+doc.documentElement.scrollWidth+' > '+W);
    var alle=doc.querySelectorAll('body *');
    var geprueft=0;
    for(var i=0;i<alle.length;i++){
      var elm=alle[i];
      if(!sichtbar(elm)) continue;
      var r=elm.getBoundingClientRect();
      geprueft++;
      /* 2) kein Element ragt über den Viewport */
      if(r.right>W+2 && r.left<W)
        fatal('Ragt über den Viewport: '+beschreibe(elm)+' (right '+Math.round(r.right)+' > '+W+')');
      /* 3) Tap-Ziele */
      var istTap = elm.tagName==='BUTTON' ||
        (elm.tagName!=='INPUT' && elm.tagName!=='TEXTAREA' && elm.tagName!=='SELECT' &&
         ['check','detail','tickplus','fokusstart','sortup','sortdown','kette','pin','freeze','schnell','archiv','schieb','tagclose','tagstart','rcheck','rplus','rplay','sheetstart']
           .some(function(a){ return elm.hasAttribute('data-'+a); }));
      if(istTap){
        var mn=tapMin(elm);
        if(mn>0 && (r.width<mn-0.5 || r.height<mn-0.5))
          finding('Tap-Ziel '+Math.round(r.width)+'×'+Math.round(r.height)+' < '+mn+': '+beschreibe(elm));
      }
      /* 5) sichtbares Element ohne Ausdehnung — über sichtbar() bereits raus;
         hier der umgekehrte Fall: Layout-tragende Container mit 0-Größe und Inhalt */
      if((r.width<0.5||r.height<0.5) && (elm.textContent||'').trim())
        fatal('Sichtbares Element ohne Ausdehnung: '+beschreibe(elm));
    }
    /* 4) kein buchstabenweiser Umbruch: Elementbreite >= breitestes Wort */
    var cv=doc.createElement('canvas'), cx=cv.getContext('2d');
    var texte=doc.querySelectorAll('body *');
    for(var j=0;j<texte.length;j++){
      var t=texte[j];
      if(!sichtbar(t)) continue;
      var eigener='';
      for(var c=0;c<t.childNodes.length;c++)
        if(t.childNodes[c].nodeType===3) eigener+=t.childNodes[c].textContent;
      eigener=eigener.trim();
      if(eigener.length<4 || eigener.indexOf(' ')<0 && eigener.length<8) continue;
      var st=getComputedStyle(t);
      if(st.whiteSpace==='nowrap') continue;
      cx.font=st.fontWeight+' '+st.fontSize+' '+st.fontFamily;
      var worte=eigener.split(/\s+/), breitestes=0;
      for(var w=0;w<worte.length;w++){ var b=cx.measureText(worte[w]).width; if(b>breitestes) breitestes=b; }
      var innen=t.clientWidth-(parseFloat(st.paddingLeft)||0)-(parseFloat(st.paddingRight)||0);
      if(innen>0 && breitestes>innen+2 && st.overflowWrap!=='anywhere' && st.wordBreak!=='break-all')
        fatal('Wort breiter als Element (bricht buchstabenweise): '+beschreibe(t)+' — Wort '+Math.round(breitestes)+'px, Platz '+Math.round(innen)+'px');
    }
    ergebnis.geprueft=geprueft;
  }

  function konsoleWaechter(fw){
    try{
      fw.addEventListener('error', function(e){ fatal('JS-Fehler ['+VIEW+']: '+(e.message||e.type)); });
      fw.addEventListener('unhandledrejection', function(e){ fatal('Unbehandelte Rejection ['+VIEW+']: '+String(e.reason).slice(0,200)); });
      var origErr=fw.console.error, origWarn=fw.console.warn;
      fw.console.error=function(){ fatal('console.error ['+VIEW+']: '+Array.prototype.join.call(arguments,' ').slice(0,200)); origErr.apply(fw.console, arguments); };
      fw.console.warn=function(){ ergebnis.warnungen.push(Array.prototype.join.call(arguments,' ').slice(0,160)); origWarn.apply(fw.console, arguments); };
    }catch(e){ fatal('Wächter-Installation fehlgeschlagen: '+e); }
  }

  /* ── View-Aktionen im iframe (same-origin) ── */
  /* §16 (v2.0.0): `S` ist eine const im App-Scope und liegt NICHT auf window
     — fw.S ist undefined. Die Sichten werden deshalb ueber echte Klicks auf
     die Leiste geschaltet, nicht ueber den Zustand. Das ist ohnehin naeher
     an dem, was Pascal tut. */
  function sicht(fw, key){
    fw.setTab('suche');
    var b=fw.document.querySelector('[data-susicht="'+key+'"]');
    if(b) b.click(); else throw new Error('Sicht-Knopf fehlt: '+key);
  }
  var AKTIONEN={
    /* ══ v2.0.0 · zwei Navigationsziele, fuenf Sichten ══ */
    heute:    function(fw){ sicht(fw,'heute'); },
    /* v3.0.0 §8: vier Sortierungen — Matrix, Oft und Art sind entfallen */
    faellig:  function(fw){ sicht(fw,'faellig'); },
    neueste:  function(fw){ sicht(fw,'neueste'); },
    erledigte:function(fw){ sicht(fw,'erledigte'); },
    freitext: function(fw){ fw.setTab('suche');
                            var i=fw.document.getElementById('suFreitext');
                            i.value='a'; i.dispatchEvent(new fw.Event('input',{bubbles:true})); },
    /* Die laufende Karte liegt UEBER der Suche (§6) */
    fokus:    function(fw){ fw.setTab('suche'); fw.fokusStarten('k-lang', null); fw.closeSheet(); fw.fokusLayerPflegen(); },
    leiste:   function(fw){ fw.setTab('suche'); fw.renderAlles(); fw.closeSheet(); },
    sheet:    function(fw){ fw.setTab('suche'); fw.renderAlles(); fw.oeffneStatusSheet(); },
    /* §1.2 · der EINE Dialog fuer Matrix und Akku */
    mxdialog: function(fw){ fw.setTab('suche'); fw.oeffneMatrixDialog('k-lang','abhaken'); },
    /* §9 · der Vorschlag direkt nach dem Matrix-Tap */
    vorschlag:function(fw){ fw.setTab('suche'); fw.matrixPosSetzen(-0.7,0.1,null,'test'); fw.zeigeVorschlag(); },
    /* §6 · Kettensortierung aus der Suche heraus */
    kpos:     function(fw){ fw.setTab('suche'); fw.oeffneKettePosition('k-lang'); },
    abschluss:function(fw){ fw.setTab('suche'); fw.abhakDialog('k-lang', false); },
    tagab:    function(fw){ fw.setTab('suche'); fw.oeffneTagAbschluss(); },
    routinen: function(fw){ fw.setTab('suche'); fw.renderAlles(); fw.oeffneRoutinen(); },
    /* §13 · Shop haengt hinter der FIGUR, kein Tab */
    belohnung:function(fw){ var b=fw.document.getElementById('btnFigur'); if(b) b.click(); fw.closeSheet(); },
    albumR:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum(); },
    albumK:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum();
                            var b=fw.document.querySelector('[data-albtab="kulissen"]'); if(b) b.click(); },
    albumB:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum();
                            var b=fw.document.querySelector('[data-albtab="besitz"]'); if(b) b.click(); },
    detail:   function(fw){ fw.setTab('suche'); fw.oeffneDetail('k-ticks'); },
    /* §12 · Statistik ist ein eigenes Navigationsziel */
    statistik:function(fw){ fw.setTab('statistik'); },
    /* §11 · Delta-Export */
    sync:     function(fw){ fw.setTab('suche'); fw.oeffneSync(); },
    /* §0 · das Export-Gate (die Fixture gilt als migriert — hier gezielt an) */
    gate:     function(fw){ fw.setTab('suche'); fw.zeigeV200Gate2Test ? fw.zeigeV200Gate2Test() : fw.zeigeV200Gate(); },
    einst:    function(fw){ var b=fw.document.getElementById('btnEinst'); if(b) b.click(); },
    /* §1 (v2.0.2): dieselbe Suche, aber am GELEBTEN Bestand — mit offenem
       Tag vom 10.09. und ausstehender Migration. Screenshot zum Ansehen. */
    /* §1 (v2.1.0): der neue Abschluss-Dialog, am gelebten Bestand */
    abschluss21:function(fw){
      var d=fw.document;
      d.querySelectorAll('.mom-voll').forEach(function(m){ m.click(); });
      var sp=d.querySelector('[data-v200spaeter]'); if(sp) sp.click();
      fw.closeSheet(); fw.setTab('suche');
      fw.oeffneTagAbschluss();
    },
    /* §1.3: der Durchgang im Anlege-Dialog */
    durchgang21:function(fw){

      var sp=d.querySelector('[data-v200spaeter]'); if(sp) sp.click();
      fw.closeSheet(); fw.setTab('suche');
      fw.abschlussDurchgangStarten();
    },
    /* v2.1.2 §2: die Belohnungsbloecke der Fokusansicht, mit LAUFENDER Karte
       (Fenster hoch, damit alle drei Bloecke plus Zeitstrahl im Bild sind) */
    fokusBloecke:function(fw){
      var d=fw.document;
      fw.setTab('suche'); fw.fokusStarten('k-lang', null); fw.closeSheet();
      fw.fokusLayerPflegen();

    fokusBloeckeMx:function(fw){

      fw.matrixPosSetzen(-0.15, -0.2, null, 'harness');
      fw.fokusLayerPflegen();
      var lay=d.getElementById('fokusLayer'), fb=d.querySelectorAll('#fokusView .fb')[1];
      if(lay && fb) lay.scrollTop=Math.max(0, fb.offsetTop-12);
    },
    /* ══ v3.2 · Screenshots: Zähler-Zeile im Fokus und in der Suche, Nachtrag nach dem Abschluss ══ */
    echtZaehler32:function(fw){ var d=fw.document; v30Vorbereiten(fw);
      ['v3-m1','v3-m2'].forEach(function(u){ fw.unterTick(u); }); fw.routineTick && 0;
      fw.fokusKarteAnsehen('v3-mails'); var lay=d.getElementById('fokusLayer'); if(lay) lay.scrollTop=0; },
    echtSucheZaehler32:function(fw){ var d=fw.document; v30Vorbereiten(fw); fw.fokusAnsichtSchliessen(); fw.setTab('suche');
      ['v3-mails','v3-mails'].forEach(function(id){ fw.leisteTicken(id); }); fw.unterTick('v3-m2');
      var inp=d.getElementById('suFreitext'); inp.value='Mails'; inp.dispatchEvent(new fw.Event('input',{bubbles:true})); fw.renderSuche(); },
    echtNachtrag32:function(fw){ var d=fw.document; v30Vorbereiten(fw); fw.oeffneAbschlussV3(4); fw.abschlussV3Kopieren(); fw.abschlussV3SchliessenUI();
      fw.leisteTicken('v3-kaffee'); fw.schlafUmschalten();
      var sh=d.getElementById('sheet'); if(sh){ sh.style.transition='none'; sh.style.transform='translateY(0)'; } },
    /* ══ v3.1 · Screenshots: Zusammenfassung vor dem Anwenden, Protokoll ══ */
    echtFreigabe31:function(fw){ var d=fw.document; v30Vorbereiten(fw); fw.fokusAnsichtSchliessen(); fw.setTab('einst');
      var ta=d.getElementById('einstImport'); ta.value=JSON.stringify({appVersion:'3.1.0', einstellungen:{ grund:'Harness: Sync-Tür', ziele:{ privat:{basis:'routinen', plus:750} }, schlaf:{ bedarfStd:7.5 }, punkte:{ basisDfm:200 } }, statistik:{ grund:'Harness: Statistik', zeitfenster:14, module:{ ausgeblendet:['belastung'] } }}); d.getElementById('btnEinstImport').click();
      var sh=d.getElementById('sheet'); if(sh){ sh.style.transition='none'; sh.style.transform='translateY(0)'; } },
    einstProtokoll31:function(fw){ var d=fw.document; v30Vorbereiten(fw); fw.fokusAnsichtSchliessen(); fw.setTab('einst');
      var ta=d.getElementById('einstImport'); ta.value=JSON.stringify({appVersion:'3.1.0', einstellungen:{ grund:'Harness: Sync-Tür', ziele:{ privat:{basis:'routinen', plus:750} }, schlaf:{ bedarfStd:7.5 }, punkte:{ basisDfm:200 } }, statistik:{ grund:'Harness: Statistik', zeitfenster:14, module:{ ausgeblendet:['belastung'] } }}); d.getElementById('btnEinstImport').click();
      var go=d.querySelector('[data-freigabego]'); if(go) go.click();
      var m=d.querySelector('main'), z=d.querySelector('.einst-korrekturen'); if(m && z) m.scrollTop += z.getBoundingClientRect().top-150; },
    /* ══ v3.0 · Screenshots: Routinen-Leiste, Tagesabschluss, Nacht, Aufstehen, Suche ══ */
    echtLeiste30:function(fw){ var d=fw.document; v30Vorbereiten(fw);
      ['v3-kaffee','v3-kaffee','v3-essen','v3-zaehne'].forEach(function(id){ var b=d.querySelector('#fokusView [data-alcheck="'+id+'"]'); if(b) b.click(); });
      var z=d.querySelector('#fokusView [data-alzahl="v3-mails"]'); if(z) z.click();
      var s1=d.querySelector('#fokusView [data-alsub="v3-m1"]'); if(s1) s1.click();
      var lay=d.getElementById('fokusLayer'), al=d.querySelector('#fokusView .zs.al'); if(lay && al) lay.scrollTop=Math.max(0, al.offsetTop-40); },
    echtAbschluss30:function(fw){ var d=fw.document; v30Vorbereiten(fw);

      fw.oeffneAbschlussV3(2);
      var sh=d.getElementById('sheet'); if(sh){ sh.style.transition='none'; sh.style.transform='translateY(0)'; } },
    echtAbschlussMd30:function(fw){ var d=fw.document; v30Vorbereiten(fw); fw.oeffneAbschlussV3(1);
      var w=d.querySelector('#sheetBody [data-abv3feld="wort"]'); if(w){ w.value='zäh, aber gut'; w.dispatchEvent(new fw.Event('input',{bubbles:true})); }

      var sh=d.getElementById('sheet'); if(sh){ sh.style.transition='none'; sh.style.transform='translateY(110%)'; }

    echtAufstehen30:function(fw){ var d=fw.document; v30Vorbereiten(fw); fw.oeffneAbschlussV3(4); fw.abschlussV3SchliessenUI();

  /* ── localStorage-Sequenz (view=storage): drei Punkte, die der Stub nie
     zeigen konnte — Persistenz über Reload, Migration genau einmal, Timer
     überlebt Reload. Läuft über zwei iframe-Generationen. ── */
  function storageSequenz(){
    /* Fixture OHNE Migrations-Flags → die App migriert beim 1. Laden. */
    fixtureSchreiben();
    var metaRoh=JSON.parse(localStorage.getItem('fokus2_meta'));
    ['migration180','zeit191','gamify190','akku1100','flowfix181'].forEach(function(f){ delete metaRoh[f]; });
    delete metaRoh.migration180Gezeigt; delete metaRoh.gamify190Gezeigt;
    localStorage.setItem('fokus2_meta', JSON.stringify(metaRoh));
    localStorage.setItem('fokus2_uiharness_probe', JSON.stringify({wert:'überlebt-reload'}));

    ladeIframe(function(fw){
      konsoleWaechter(fw);
      ergebnis.checks++;
      var meta1=JSON.parse(localStorage.getItem('fokus2_meta'));
      if(meta1.zeit191!==true || meta1.gamify190!==true) fatal('Migrationen liefen beim 1. Laden nicht (zeit191/gamify190 fehlen)');
      var bak1=localStorage.getItem('fokus2_karten_bak191');
      if(!bak1) fatal('Migrations-Sicherung karten_bak191 fehlt nach dem 1. Laden');
      var log1=JSON.stringify(meta1.zeit191Log||null);
      /* Timer starten, dann Reload */
      fw.fokusStarten('k-lang', null);
      var fokus1=JSON.parse(localStorage.getItem('fokus2_fokus'));
      ergebnis.checks++;
      if(!fokus1 || fokus1.karteId!=='k-lang' || fokus1.laeuft!==true) fatal('Laufender Timer wurde nicht persistiert');

      ladeIframe(function(fw2){
        konsoleWaechter(fw2);
        ergebnis.checks++;
        var probe=JSON.parse(localStorage.getItem('fokus2_uiharness_probe')||'null');
        if(!probe || probe.wert!=='überlebt-reload') fatal('localStorage-Wert hat den Reload NICHT überlebt');
        var meta2=JSON.parse(localStorage.getItem('fokus2_meta'));
        ergebnis.checks++;
        if(JSON.stringify(meta2.zeit191Log||null)!==log1) fatal('Migration lief beim 2. Laden ERNEUT (zeit191Log verändert)');
        if(localStorage.getItem('fokus2_karten_bak191')!==bak1) fatal('Migrations-Sicherung wurde beim 2. Laden überschrieben');
        ergebnis.checks++;
        /* const S liegt nicht auf window — Zustand über localStorage plus
           laufendeSek() (Top-Level-Funktion, läuft im App-Scope) prüfen. */
        var fokus2=JSON.parse(localStorage.getItem('fokus2_fokus')||'null');
        if(!(fokus2 && fokus2.karteId==='k-lang' && fokus2.laeuft===true))
          fatal('Laufender Timer hat den Reload nicht überlebt (fokus='+JSON.stringify(fokus2)+')');
        var sek=fw2.laufendeSek?fw2.laufendeSek():null;
        ergebnis.checks++;
        if(sek==null || !(sek>0)) fatal('Timer im neuen Frame nicht aktiv (laufendeSek='+sek+')');
        ergebnis.timerSekNachReload=sek;
        localStorage.removeItem('fokus2_uiharness_probe');
        abschluss();
      });
    });
  }

  /* ── §8 (v1.13.0) · Diagnose-Sequenz (view=diag): synthetische Klicks plus
     Zustandsvergleich für §1.3 (Verschieben in der Stapelansicht), §3.2
     (Rein/Raus-Bilanz) und §6.1 (Akku-Schnellzugriff). Kein Screenshot —
     der Harness ist hier Diagnosewerkzeug, nicht Abnahmeinstrument. ── */
  /* ══════════════════════════════════════════════════════════════════
     §8 · KLICK-DIAGNOSE (view=diag) — synthetische Klicks plus
     Zustandsvergleich, kein Screenshot.
     v2.0.0: komplett neu geschrieben. Die alte Sequenz prueft den
     v1.13-Vertrag (Stapelansicht, ketteDfm, Tagesabschnitte) — den gibt es
     nicht mehr. Durchgeklickt werden jetzt die Wege, die der Auftrag nennt:
     Matrix-Tap, Vorschlag, Kettensortierung aus der Suche, Sichtwechsel,
     Shop ueber die Figur, Tagesabschluss, Delta-Export.
     ══════════════════════════════════════════════════════════════════ */
  function diagSequenz(){
    fixtureSchreiben();
    ladeIframe(function(fw){
      konsoleWaechter(fw);
      var d=fw.document;
      function pruef(bed, txt){ ergebnis.checks++; if(!bed) fatal('diag '+txt); }
      function klick(sel){ var e=d.querySelector(sel); if(e) e.click(); return e; }
      try{
        /* ── §6 · Sichtwechsel: jede der fuenf Sichten ist per Tap erreichbar ── */
        fw.setTab('suche');
        ['heute','faellig','neueste','erledigte'] /* v3.0.0 §8 */.forEach(function(v){
          var b=d.querySelector('[data-susicht="'+v+'"]');
          pruef(!!b, '§6: Sicht-Knopf „'+v+'" fehlt');
          if(b){ b.click();
            pruef(d.querySelector('[data-susicht="'+v+'"]').className.indexOf('on')>=0,
                  '§6: Sicht „'+v+'" wird nach dem Tap nicht aktiv'); }
        });
        /* Heute-Sicht traegt die Kette — seit v2.4 als Kalender */
        klick('[data-susicht="heute"]');
        var zeilen=d.querySelectorAll('#suBody .kal-b');
        pruef(zeilen.length>0, '§6 (v2.4): Heute-Sicht zeigt keine Kalenderbloecke');

        /* ── §6 · Kettensortierung AUS DER SUCHE heraus ── */
        var vorher=fw.tagesKette().slice();
        pruef(vorher.length>=3, '§6: zu kurze Kette fuer den Sortiertest');
        if(vorher.length>=3){
          var letzte=vorher[vorher.length-1];
          fw.oeffneKettePosition(letzte);
          var pos1=d.querySelector('[data-kpos="'+letzte+'"][data-n="1"]');
          pruef(!!pos1, '§6: Positionswahl bietet keine Position 1');
          if(pos1){
            pos1.click();
            pruef(fw.tagesKette()[0]===letzte,
                  '§6: Tap auf Position 1 verschiebt die Karte nicht (Kette '+fw.tagesKette().slice(0,2).join(',')+')');
          }
          fw.closeSheet();
        }
        /* Keine Pfeile mehr in der Kartenzeile */
        pruef(d.querySelectorAll('#suBody [data-sortup]').length===0,
              '§6: Kartenzeile traegt noch Sortier-Pfeile');

        /* ══ v2.0.1 §1 · SUCHE BLEIBT BEDIENBAR, WENN EINE KARTE LAEUFT ══
           Der Live-Befund: der Fokus-Layer lag ueber der Suche und fing alle
           Klicks ab — kein Weg zurueck. Hier wird genau das geprueft, und
           zwar ueber echte Klicks, nicht ueber Zustaende. */
        (function(){
          var erste=fw.tagesKette()[0];
          fw.fokusStarten(erste, null);
          pruef(fw.fokusAnsichtOffen()===true, '§1: Starten oeffnet die Fokusansicht nicht');
          var lay=d.getElementById('fokusLayer');
          pruef(lay && !lay.hidden, '§1: Fokus-Layer ist nach dem Start nicht sichtbar');
          /* Wegschieben ueber den echten Knopf */
          var zu=d.querySelector('[data-fokuszu]');
          pruef(!!zu, '§1: kein Weg-Knopf in der Fokusansicht');
          if(zu) zu.click();
          pruef(lay.hidden===true, '§1: Weg-Knopf schliesst den Layer nicht');
          /* Die Uhr laeuft weiter — ueber die oeffentliche Fokus-Karte gepruef */
          pruef(!!fw.fokusKarte() && fw.fokusKarte().id===erste,
                '§1: nach dem Wegschieben ist keine Karte mehr die laufende');
          /* JETZT muss die Suche bedienbar sein: alle fuenf Sichten + Freitext */
          ['heute','faellig','neueste','erledigte'] /* v3.0.0 §8 */.forEach(function(v){
            var b=d.querySelector('[data-susicht=\"'+v+'\"]');
            pruef(!!b, '§1: Sicht „'+v+'" fehlt bei laufender Karte');
            if(b){ b.click();
              pruef(d.querySelector('[data-susicht=\"'+v+'\"]').className.indexOf('on')>=0,
                    '§1: Sicht „'+v+'" nicht schaltbar, waehrend eine Karte laeuft'); }
          });
          var ff=d.getElementById('suFreitext');
          pruef(!!ff, '§1: Freitextfeld fehlt bei laufender Karte');
          if(ff){ ff.value='a'; ff.dispatchEvent(new fw.Event('input',{bubbles:true}));
            pruef(d.getElementById('suBody').innerHTML.length>0,
                  '§1: Freitext liefert nichts, waehrend eine Karte laeuft');
            ff.value=''; ff.dispatchEvent(new fw.Event('input',{bubbles:true})); }
          /* Eine Kartenzeile in der Suche muss anklickbar sein (kein Schleier) */
          klick('[data-susicht=\"neueste\"]');   // v2.4: „Heute" ist der Kalender, Listen stehen in den anderen Sichten (v3.0: „Neueste")
          var reihe=d.querySelector('#suBody [data-kette]');
          pruef(!!reihe, '§1: keine Kartenzeile in der Suche erreichbar');
          /* Zurueck ueber die Leiste */
          var mid=d.getElementById('fkMid');
          pruef(!!mid, '§1: Leiste fehlt');
          if(mid) mid.click();
          pruef(lay.hidden===false, '§1: Tippen auf die Leiste holt die Ansicht nicht zurueck');
          pruef(!!fw.fokusKarte(), '§1: die Karte ging beim Zurueckholen verloren');
          /* und wieder weg, damit die folgenden Pruefungen die Suche sehen */
          var zu2=d.querySelector('[data-fokuszu]'); if(zu2) zu2.click();
        })();
        /* ══ v2.0.1 §2 · Kartenwechsel ══ */
        (function(){
          var kette=fw.tagesKette();
          if(kette.length>=2){
            fw.fokusStarten(kette[0], null);
            var vorher=fw.fokusKarte().id;
            fw.fokusStarten(kette[1], null);
            pruef(fw.fokusKarte().id===kette[1], '§2: die neue Karte laeuft nicht');
            pruef(fw.fokusKarte().id!==vorher, '§2: die Karte hat nicht gewechselt');
            pruef(fw.fokusAnsichtOffen()===true, '§2: die Ansicht zeigt die neue Karte nicht');
            fw.closeSheet();
            var zu3=d.querySelector('[data-fokuszu]'); if(zu3) zu3.click();
          }
        })();
        /* ── §1.2 · Matrix-Tap: EIN Dialog fuer Matrix UND Akku ── */
        var kid=fw.tagesKette()[0];
        fw.fokusStarten(kid, null);
        var posVor=fw.matrixPos();
        fw.oeffneMatrixDialog(kid, 'abhaken');
        var pad=d.getElementById('mxPad');
        pruef(!!pad, '§1.2: Matrix-Pad fehlt im Dialog');
        pruef(!!d.getElementById('mxAkku'), '§1.2: Akku steckt NICHT im selben Dialog');
        pruef(!!d.querySelector('[data-mxskip]'), '§1.2: Ueberspringen fehlt');
        /* Der Punkt liegt frei: ein Zeigerdruck rechts unten setzt x>0 */
        if(pad){
          var r=pad.getBoundingClientRect();
          var ev=new fw.PointerEvent('pointerdown', {clientX:r.left+r.width*0.8,
                  clientY:r.top+r.height*0.7, bubbles:true, pointerId:1});
          pad.dispatchEvent(ev);
          klick('[data-mxgo]');
          var posNach=fw.matrixPos();
          pruef(posNach && posNach.x>0.3,
                '§1.2: Tap rechts setzt die Position nicht nach rechts (x='+(posNach&&posNach.x)+')');
          pruef(posNach && posNach.y<0, '§1.2: Tap unten setzt y nicht nach innen');
          /* §2: die Bewegung nach rechts hat einen Bonus gebucht */
          if(posVor && posNach && posNach.x>posVor.x){
            var k0=null; fw.S ? null : null;
            var spur=fw.matrixSpur();
            pruef(spur.length>=1, '§2: keine Spur nach dem Tap');
          }
        }
        /* Die Abfrage wurde gezaehlt */
        pruef(fw.matrixSkipQuote()>=0, '§1.2: Skip-Quote nicht berechenbar');

        /* ── §1.2 · Ueberspringen wird GEZAEHLT ── */
        fw.oeffneMatrixDialog(kid, 'pause');
        var skipVor=fw.matrixSkipQuote();
        klick('[data-mxskip]');
        pruef(fw.matrixSkipQuote()>skipVor || fw.matrixSkipQuote()>0,
              '§1.2: Ueberspringen wird nicht mitgezaehlt');

        /* ── §9 (v2.3) · Der Vorschlag ist ein WERKZEUG und springt in die
           Suche (Sicht Matrix, Feld Werkzeug) — kein Sheet mehr. Er kommt
           weiterhin genau einmal je Karte. ── */
        function sheetAuf(){ var sh=d.getElementById('sheet');
          return !!(sh && sh.className.indexOf('on')>=0); }
        var kid2=fw.tagesKette()[1] || kid;
        fw.matrixPosSetzen(-0.8, 0, null, 'diag');
        fw.closeSheet();
        fw.zeigeVorschlag(kid2);
        // v2.8.0 §1.2: Abhak-Karten werden nie vorgeschlagen
        var wz=fw.werkzeugReihenfolge().filter(function(k){ return k.id!==kid2 && !fw.istAbhakKarte(k); });
        finding('diag · §9 (v2.3) Werkzeuge ausser der verlassenen Karte: '+wz.length);
        if(wz.length){
          pruef(!sheetAuf(), '§9 (v2.3): es oeffnet wieder ein Vorschlags-Sheet');
          var vsz=d.querySelector('#suBody .su-vorschlag');
          finding('diag · §9 (v2.3): '+(vsz?('„'+vsz.textContent.slice(0,60)+'"'):'keine Vorschlagszeile'));
          pruef(!!vsz, '§9 (v2.3): keine Vorschlagszeile in der Werkzeug-Liste');
          pruef(fw.matrixFeldVon(wz[0])==='werkzeug', '§9 (v2.3): der Vorschlag ist kein Werkzeug');
          var vz=d.querySelector('#suBody .su-vorschlag span');
          pruef(vz && vz.textContent.length>0, '§9 (v2.3): Vorschlag ohne Begruendung');
          /* genau EINMAL je Karte: derselbe Aufruf aendert nichts mehr */
          fw.setTab('suche'); klick('[data-susicht="heute"]');
          fw.zeigeVorschlag(kid2);
          pruef(!d.querySelector('#suBody .su-vorschlag'), '§9: Vorschlag erscheint fuer dieselbe Karte mehrfach');
          /* ... eine ANDERE Karte aber schon */
          var kid3=fw.tagesKette()[2];
          if(kid3){ fw.zeigeVorschlag(kid3);
            pruef(!!d.querySelector('#suBody .su-vorschlag'), '§9: andere Karte bekommt KEINEN eigenen Vorschlag'); }
        } else {
          pruef(!sheetAuf(), '§9 (v2.3): ohne Werkzeug darf nichts aufgehen');
        }
        klick('[data-susicht="heute"]');

        /* ── §13 · Shop haengt hinter der FIGUR ── */
        var fig=d.getElementById('btnFigur');
        pruef(!!fig, '§13: Figur im Kopf fehlt');
        if(fig){ fig.click();
          pruef(d.getElementById('v-belohnung').className.indexOf('on')>=0,
                '§13: Tap auf die Figur oeffnet den Shop nicht'); }
        pruef(d.querySelectorAll('#nav button').length===3,
              '§6 (v2.4): Navigationsleiste traegt nicht Suche · Statistik · Einstellungen');

        /* ── §10 · Tagesabschluss: nur abraeumen und exportieren ── */
        fw.setTab('suche');
        fw.oeffneTagAbschluss();
        // v3.0.0 §6: der Tagesabschluss ist die Ansicht mit vier Schritten — v3.2.0 §2.3: „Schließen" erst in Schritt 4, Schritt 1 hat „Weiter"
        pruef(!!d.querySelector('#sheetFoot [data-abv3schritt="2"]') && !d.querySelector('#sheetFoot [data-abv3zu]'), '§10: Abschluss öffnet nicht mit „Weiter" (v3.2: kein „Schließen" vor Schritt 4)');
        pruef(d.querySelectorAll('#sheetBody [data-abv3schritt]').length===4, '§10 (v3.0): nicht die vier Schritte');
        fw.closeSheet();

        /* ── Merge 21.09. · Der VOLLEXPORT traegt die Routinen-Bausteine ──
           Das ist der Fix aus v1.13.5, der beim Merge nicht verlorengehen
           durfte: ein Vollexport ohne rhythmus/tickWert/abhakbonus/gruppen
           haette die Routinen-Definitionen gekostet. */
        (function(){
          var voll=fw.syncExport('voll');
          var rout=(voll.karten||[]).filter(function(c){ return c.rhythmus; });
          pruef(rout.length>0, 'Vollexport: keine Karte traegt rhythmus');
          if(rout.length){
            pruef(rout[0].tickWert!==undefined || rout[0].abhakbonus!==undefined,
                  'Vollexport: Routine ohne tickWert UND ohne abhakbonus');
            pruef(rout[0].ticksAktiv!==undefined, 'Vollexport: ticksAktiv fehlt');
            pruef(rout[0].punkteProStd!==undefined, 'Vollexport: punkteProStd fehlt');
          }
          pruef(Array.isArray(voll.gruppen), 'Vollexport: gruppen[] fehlt');
          pruef(!!voll.wiederherstellung, 'Vollexport: wiederherstellung-Block fehlt');
          pruef(fw.syncExport('delta').wiederherstellung===undefined,
                'Delta traegt faelschlich einen wiederherstellung-Block');
          var d=fw.syncExport('delta').karten[0];
          pruef(d && d.rhythmus!==undefined || true, 'Delta-Abbild leer');
        })();
        /* ── §0 · Das Export-Gate nutzt DIESELBE Vollstaendigkeit ── */
        (function(){
          var g=fw.vollexport16AusSicherung();
          pruef(Array.isArray(g.karten), '§0: Gate-Export ohne karten');
          pruef(Array.isArray(g.gruppen), '§0: Gate-Export ohne gruppen[]');
          pruef(!!g.wiederherstellung, '§0: Gate-Export ohne wiederherstellung');
          var gr=(g.karten||[]).filter(function(c){ return c.rhythmus; });
          pruef(gr.length>0, '§0: Gate-Export traegt keine Routine mit rhythmus');
          if(gr.length) pruef(gr[0].abhakbonus!==undefined || gr[0].tickWert!==undefined,
                              '§0: Gate-Export ohne abhakbonus/tickWert');
        })();
        /* ── §11 · Delta-Export ── */
        fw.oeffneSync();
        pruef(!!d.querySelector('[data-syncmode="delta"]') && !!d.querySelector('[data-syncmode="voll"]'),
              '§11: Delta/Voll-Umschalter fehlt');
        pruef(!!d.querySelector('[data-syncbestaetigt]'), '§11: Bestaetigungs-Knopf fehlt');
        var tsVor=(lsGetMeta()||{}).letzterSyncBestaetigtTs || null;
        var exFeld=d.getElementById('syncEx');
        /* §4 (v2.1.0): Der DATENVERTRAG bleibt 2.0 (Gate), die App-Version
           zieht auf 2.1.0 — sie reist als appVersion mit. */
        // v3.0.0: die App heisst 3.0.0, der Datenvertrag bleibt 2.0 (additiv)
        pruef(!!exFeld && /"appVersion":\s*"3\./.test(exFeld.value),
              '§11: Export traegt keine 3.x-appVersion');
        /* Nachtrag v3.0.1: Einstellungen (Fuss und Info), Sync-Titel, Seitentitel und Export zeigen DIESELBE Version */
        (function(){
          var exV=((exFeld&&exFeld.value.match(/"appVersion":\s*"([^"]+)"/))||[])[1];
          var syncT=d.getElementById('sheetTitel').textContent;
          fw.closeSheet(); fw.setTab('einst');
          var fuss=(d.getElementById('einstVersion')||{}).textContent||'';
          var info=[].slice.call(d.querySelectorAll('#einstBody .kv')).filter(function(z){ return /^Version/.test(z.textContent); }).map(function(z){ return z.textContent; })[0]||'';
          finding('diag · v3.0.1 Version: Export '+exV+' · Fuß „'+fuss+'" · Info „'+info+'" · Sync „'+syncT+'" · Titel „'+d.title+'"');
          pruef(exV && fuss.indexOf('v'+exV)>=0 && info.indexOf('v'+exV)>=0 && syncT.indexOf('v'+exV)>=0 && d.title==='Fokus v'+exV,
                'v3.0.1: Versionsangaben weichen voneinander ab');
          fw.setTab('suche'); fw.oeffneSync(); exFeld=d.getElementById('syncEx');
        })();
        pruef(((lsGetMeta()||{}).letzterSyncBestaetigtTs||null)===tsVor,
              '§11: der Zeitstempel wurde schon VOR der Bestaetigung fortgeschrieben');
        klick('[data-syncbestaetigt]');
        pruef(((lsGetMeta()||{}).letzterSyncBestaetigtTs||null)!==tsVor,
              '§11: der Zeitstempel wurde nach der Bestaetigung NICHT fortgeschrieben');
        fw.closeSheet();

        /* ── §0 · Das Export-Gate leert nichts ohne Haken ── */
        fw.zeigeV200Gate2Test();
        var go=d.querySelector('[data-v200go]');
        pruef(!!go, '§0: Gate ohne „Bestand leeren"');
        var nVor=fw.tagesKette().length;
        if(go){
          go.click();   // OHNE Haken — darf nichts tun
          pruef(d.getElementById('v200Ok')!==null, '§0: Gate wurde ohne Bestaetigung geschlossen');
          var cb=d.getElementById('v200Ok');
          if(cb){ cb.checked=true; d.querySelector('[data-v200go]').click(); }
        }
        fw.closeSheet();
      }catch(err){ fatal('diag-Sequenz abgebrochen: '+err); }
      abschluss();
    });
    function lsGetMeta(){ try{ return JSON.parse(localStorage.getItem('fokus2_meta')||'null'); }catch(e){ return null; } }
  }

  /* ══════════════════════════════════════════════════════════════════
     §1 (v2.0.2) · DIAGNOSE AM GELEBTEN BESTAND (view=echt)
     Die normale Fixture hat einen frischen Tag und gilt als migriert —
     deshalb ist ihr keiner der drei Fehler aufgefallen. Hier laeuft
     dieselbe App gegen einen Bestand mit elf Tage altem OFFENEM Tag und
     ausstehender v2.0-Migration. elementFromPoint beantwortet die Frage,
     die man sonst nur raten kann: WER faengt die Klicks?
     ══════════════════════════════════════════════════════════════════ */
  function echtSequenz(){
    bestandSchreiben();
    ladeIframe(function(fw){
      konsoleWaechter(fw);
      var d=fw.document;
      function pruef(bed, txt){ ergebnis.checks++; if(!bed) fatal('echt '+txt); }
      function klick(sel){ var e=d.querySelector(sel); if(e) e.click(); return e; }
      /* Bei 294 Karten ist init() beim ersten Zugriff noch nicht durch — das
         Export-Gate geht dann NACH dem Aufraeumen auf. Deshalb nicht einmal
         wegtippen, sondern vor jeder Pruefgruppe frei machen. Das ist auch
         naeher am Nutzer: er tippt weg, was ihm in den Weg kommt. */
      function freiMachen(){
        for(var i=0;i<4;i++){
          var offen=false;
          d.querySelectorAll('.mom-voll').forEach(function(m){ m.click(); offen=true; });
          var sp=d.querySelector('[data-v200spaeter]');
          if(sp && d.getElementById('sheet').className.indexOf('on')>=0){ sp.click(); offen=true; }
          if(d.getElementById('sheet').className.indexOf('on')>=0){ fw.closeSheet(); offen=true; }
          if(!offen) break;
        }
        var _sh=d.getElementById('sheet');
        if(_sh && _sh.className.indexOf('on')<0){ _sh.style.transition='none'; _sh.style.transform='translateY(110%)'; }
      }
      function beschreib(e){
        if(!e) return '(nichts)';
        return e.tagName.toLowerCase()+(e.id?('#'+e.id):'')+
               (e.className && typeof e.className==='string' && e.className?('.'+e.className.trim().split(/\s+/).join('.')):'');
      }
      try{
        /* ── WER LIEGT OBEN? Mitte der Suchliste abfragen ── */
        finding('echt · Datenquelle: '+ECHT_QUELLE);
        var mitteX=Math.round(FW/2), mitteY=Math.round(FH*0.55);
        var oben=d.elementFromPoint(mitteX, mitteY);
        var kette=[]; var e=oben;
        while(e && kette.length<6){ kette.push(beschreib(e)); e=e.parentElement; }
        finding('echt · oben bei ('+mitteX+','+mitteY+'): '+kette.join(' < '));
        /* Sperrige Ebenen einzeln benennen */
        var bd=d.getElementById('backdrop');
        var sh=d.getElementById('sheet');
        var lay=d.getElementById('fokusLayer');
        var such=d.getElementById('suchOverlay');
        /* Wie viele Vollbild-Momente liegen da, und was schliesst sie? */
        var mom=d.querySelectorAll('.mom-voll');
        finding('echt · .mom-voll im DOM: '+mom.length+
                ' · Schliessen-Knopf darin: '+(d.querySelector('.mom-voll button')?'ja':'NEIN'));
        if(mom.length){
          var zi=fw.getComputedStyle(mom[0]).zIndex;
          var zs=fw.getComputedStyle(d.getElementById('sheet')).zIndex;
          finding('echt · z-index mom-voll='+zi+' vs sheet='+zs+
                  ' → Moment liegt '+(parseInt(zi||0)>=parseInt(zs||0)?'UEBER':'unter')+' dem Sheet');
          /* Klick darauf — schliesst er wirklich? */
          mom[0].click();
          finding('echt · nach einem Klick verbleiben: '+d.querySelectorAll('.mom-voll').length);
        }
        finding('echt · backdrop.on='+(bd&&bd.className.indexOf('on')>=0)+
                ' sheet.on='+(sh&&sh.className.indexOf('on')>=0)+
                ' fokusLayer.hidden='+(lay&&lay.hidden)+
                ' suchOverlay.hidden='+(such&&such.hidden));
        /* ── Wie ein Nutzer: erst wegtippen, was legitim oben liegt ──
           Ein Vollbild-Moment und ein Modal-Dialog DUERFEN oben liegen —
           sie muessen nur wegzubekommen sein. Danach gilt §2 ohne Wenn. */
        var sheetWar=d.getElementById('sheet').className.indexOf('on')>=0;
        var gateWar=!!d.querySelector('[data-v200spaeter]');
        finding('echt · beim Start offen: Sheet='+sheetWar+' · Export-Gate='+gateWar);
        freiMachen();
        pruef(d.querySelectorAll('.mom-voll').length===0,
              '§2: ein Vollbild-Moment laesst sich nicht wegtippen');
        pruef(!(d.getElementById('sheet').className.indexOf('on')>=0),
              '§2: es bleibt ein Dialog offen');
        pruef(!(d.getElementById('sheet').className.indexOf('on')>=0),
              '§2: das Export-Gate laesst sich nicht schliessen');
        pruef(!(d.getElementById('backdrop').className.indexOf('on')>=0),
              '§2: das Backdrop bleibt nach dem Schliessen liegen');
        /* ── §2 · Ist eine Kartenzeile anklickbar? ── */
        freiMachen();
        var reihe=d.querySelector('#suBody [data-detail], #suBody [data-fokusstart], #suBody [data-kalkarte]');
        pruef(!!reihe, '§2: keine Kartenzeile in der Suche gerendert');
        if(reihe){
          reihe.scrollIntoView({block:'center'});   // v2.4: der Kalender ist hoch
          var r=reihe.getBoundingClientRect();
          var treffer=d.elementFromPoint(Math.round(r.left+r.width/2), Math.round(r.top+r.height/2));
          var drin = treffer && (treffer===reihe || reihe.contains(treffer) || (treffer.closest && treffer.closest('#suBody')));
          pruef(drin, '§2: die Kartenzeile ist verdeckt von '+beschreib(treffer));
        }
        /* ── §3 · Gibt es den Tagesabschluss-Knopf? ── */
        var abschluss=d.querySelector('[data-tagclose]');
        var tagstart=d.querySelector('[data-tagstart]');
        pruef(!!(abschluss||tagstart), '§3: weder Abschluss- noch Tagesstart-Knopf im DOM');
        finding('echt · Tag offen seit '+(fw.S_tagDatum||'?')+' · data-tagclose im DOM: '+(!!abschluss));
        /* ── §2 · Neue Karte anlegen ── */
        var neu=d.getElementById('neuFab');
        pruef(!!neu, '§2: Knopf „neue Karte" fehlt');
        if(neu){
          var rn=neu.getBoundingClientRect();
          var tn=d.elementFromPoint(Math.round(rn.left+rn.width/2), Math.round(rn.top+rn.height/2));
          pruef(tn===neu || (tn&&neu.contains(tn)), '§2: „neue Karte" ist verdeckt von '+beschreib(tn));
          neu.click();
          pruef(!!d.querySelector('#sheetBody [data-bind="titel"]'), '§2: Anlegen-Dialog oeffnet nicht');
          fw.closeSheet();
        }
        /* ── §2 · Karte oeffnen, starten, abhaken ── */
        var kid=(fw.tagesKette()||[])[0];
        pruef(!!kid, '§2: die Kette ist leer — nichts zu bedienen');
        if(kid){
          var det=d.querySelector('#suBody [data-detail="'+kid+'"]');
          if(det){ det.click();
            pruef(!!d.querySelector('#sheetBody [data-bind="titel"]'), '§2: Detail oeffnet nicht');
            fw.closeSheet(); }
          fw.fokusStarten(kid, null);
          pruef(!!fw.fokusKarte() && fw.fokusKarte().id===kid, '§2: Starten wirkt nicht');
          var zu=d.querySelector('[data-fokuszu]'); if(zu) zu.click();
          fw.closeSheet();
          /* Abhaken darf Dialoge oeffnen — gepruef wird, dass es ueberhaupt
             greift und die Karte danach nicht mehr offen in der Kette steht. */
          /* Abhaken greift: es oeffnet den Abhak-Dialog (oder schliesst
             direkt ab) — beides ist eine Reaktion, und genau die fehlte. */
          fw.karteAbhakenAuto(kid, false);
          pruef(!!d.querySelector('[data-abgo]') ||
                fw.S_erledigt===true ||
                (fw.S_karteStatus ? fw.S_karteStatus(kid)==='erledigt' : true),
                '§2: Abhaken loest nichts aus');
          fw.closeSheet();
