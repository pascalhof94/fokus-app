<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fokus UI-Harness</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f18;height:100%}
  #app{border:0;width:375px;height:812px;display:block}
  #result{position:fixed;left:-9999px;top:0;white-space:pre}
</style>
<script src="fixture.js"></script>
</head>
<body>
<iframe id="app"></iframe>
<pre id="result"></pre>
<script>
/* Same-origin-Harness: schreibt die Fixture in localStorage, lädt /neu.html im
   iframe, führt je ?view= die nötigen Aktionen aus, fährt die Layout-Checks
   und den Konsolen-Wächter und legt das Ergebnis als JSON in #result ab.
   run.sh liest es über chrome --dump-dom. */
(function(){
  var Q=new URLSearchParams(location.search);
  var VIEW=Q.get('view')||'stapel';
  /* Headless-Chrome layoutet Fenster unter ~500px Breite trotzdem breiter —
     darum bekommt das iframe die Zielgroesse HART per Query-Param. Der
     Screenshot (window-size identisch) zeigt dann exakt das iframe. */
  var FW=parseInt(Q.get('w')||'375',10), FH=parseInt(Q.get('h')||'812',10);
  var ergebnis={ view:VIEW, fatal:[], findings:[], warnungen:[], checks:0, fertig:false };
  function fatal(t){ ergebnis.fatal.push(t); }
  function finding(t){ ergebnis.findings.push(t); }
  function abschluss(){
    ergebnis.fertig=true;
    document.getElementById('result').textContent='UIRESULT:'+JSON.stringify(ergebnis)+':ENDRESULT';
    document.title='HARNESS-FERTIG';
  }

  /* ── Tap-Ausnahmen: die EINZIGE Stelle für erlaubte Untergrößen ──
     (Sekundärzeile 40px seit v1.8.0 §2.1; Unteraufgaben-Kästchen 34px seit
     v1.10.0 §3.4; Chips 30px sind seit v1.0 der Dialog-/Detail-Standard;
     Unteraufgaben-Inline-Felder und Karten-Streifen-Elemente sind Bestand.) */
  var TAP_AUSNAHMEN=[
    { sel:'.trow.tsek button, .trow.tsek .sar', min:40 },
    { sel:'.uacheck, .uacheck .box',            min:32 },
    { sel:'.chip',                              min:26 },
    { sel:'.uamin, .uabonus, .uax, .uaneu button, .uaneu input', min:24 },
    { sel:'.tstreifen *, #fkNav *, .pql-b, .pql-chip', min:0 },   // Karten-Streifen/Quick-Leiste: Bestand
    { sel:'.st-edit, .st-groesse, .caret, .segmini button, .seg', min:24 },
    { sel:'.minibtn, .kg-edit, .albtab, .albitem', min:24 },
    { sel:'.tb-btn, .btn.sm, .btn.ghost.sm', min:30 },
    { sel:'#fkPP', min:38 },      // Play/Pause der Fokus-Leiste: bewusst kompakt (Bestand)
    { sel:'#sheetX, .x', min:34 } // Schliessen-X der Sheets: bewusst kompakt (Bestand)
  ];
  var TAP_MIN=44;

  function sichtbar(elm){
    if(!elm.getClientRects().length) return false;
    var st=getComputedStyle(elm);
    if(st.visibility==='hidden'||st.display==='none'||parseFloat(st.opacity||'1')===0) return false;
    var r=elm.getBoundingClientRect();
    return r.width>0.5 && r.height>0.5;
  }
  function tapMin(elm){
    for(var i=0;i<TAP_AUSNAHMEN.length;i++){
      try{ if(elm.matches(TAP_AUSNAHMEN[i].sel)) return TAP_AUSNAHMEN[i].min; }catch(e){}
    }
    return TAP_MIN;
  }
  function beschreibe(elm){
    var id=elm.id?'#'+elm.id:'';
    var cls=(elm.className&&elm.className.baseVal===undefined)?('.'+String(elm.className).trim().split(/\s+/).slice(0,2).join('.')):'';
    var txt=(elm.textContent||'').trim().slice(0,26);
    return elm.tagName.toLowerCase()+id+cls+(txt?' „'+txt+'“':'');
  }

  function layoutChecks(fw){
    var doc=fw.document, W=fw.innerWidth;
    /* 1) kein waagerechter Überlauf */
    ergebnis.checks++;
    if(doc.documentElement.scrollWidth>W+1)
      fatal('Waagerechter Überlauf: scrollWidth '+doc.documentElement.scrollWidth+' > '+W);
    var alle=doc.querySelectorAll('body *');
    var geprueft=0;
    for(var i=0;i<alle.length;i++){
      var elm=alle[i];
      if(!sichtbar(elm)) continue;
      var r=elm.getBoundingClientRect();
      geprueft++;
      /* 2) kein Element ragt über den Viewport */
      if(r.right>W+2 && r.left<W)
        fatal('Ragt über den Viewport: '+beschreibe(elm)+' (right '+Math.round(r.right)+' > '+W+')');
      /* 3) Tap-Ziele */
      var istTap = elm.tagName==='BUTTON' ||
        (elm.tagName!=='INPUT' && elm.tagName!=='TEXTAREA' && elm.tagName!=='SELECT' &&
         ['check','detail','tickplus','fokusstart','sortup','sortdown','kette','pin','freeze','schnell','archiv','schieb','tagclose','tagstart','rcheck','rplus','rplay','sheetstart']
           .some(function(a){ return elm.hasAttribute('data-'+a); }));
      if(istTap){
        var mn=tapMin(elm);
        if(mn>0 && (r.width<mn-0.5 || r.height<mn-0.5))
          finding('Tap-Ziel '+Math.round(r.width)+'×'+Math.round(r.height)+' < '+mn+': '+beschreibe(elm));
      }
      /* 5) sichtbares Element ohne Ausdehnung — über sichtbar() bereits raus;
         hier der umgekehrte Fall: Layout-tragende Container mit 0-Größe und Inhalt */
      if((r.width<0.5||r.height<0.5) && (elm.textContent||'').trim())
        fatal('Sichtbares Element ohne Ausdehnung: '+beschreibe(elm));
    }
    /* 4) kein buchstabenweiser Umbruch: Elementbreite >= breitestes Wort */
    var cv=doc.createElement('canvas'), cx=cv.getContext('2d');
    var texte=doc.querySelectorAll('body *');
    for(var j=0;j<texte.length;j++){
      var t=texte[j];
      if(!sichtbar(t)) continue;
      var eigener='';
      for(var c=0;c<t.childNodes.length;c++)
        if(t.childNodes[c].nodeType===3) eigener+=t.childNodes[c].textContent;
      eigener=eigener.trim();
      if(eigener.length<4 || eigener.indexOf(' ')<0 && eigener.length<8) continue;
      var st=getComputedStyle(t);
      if(st.whiteSpace==='nowrap') continue;
      cx.font=st.fontWeight+' '+st.fontSize+' '+st.fontFamily;
      var worte=eigener.split(/\s+/), breitestes=0;
      for(var w=0;w<worte.length;w++){ var b=cx.measureText(worte[w]).width; if(b>breitestes) breitestes=b; }
      var innen=t.clientWidth-(parseFloat(st.paddingLeft)||0)-(parseFloat(st.paddingRight)||0);
      if(innen>0 && breitestes>innen+2 && st.overflowWrap!=='anywhere' && st.wordBreak!=='break-all')
        fatal('Wort breiter als Element (bricht buchstabenweise): '+beschreibe(t)+' — Wort '+Math.round(breitestes)+'px, Platz '+Math.round(innen)+'px');
    }
    ergebnis.geprueft=geprueft;
  }

  function konsoleWaechter(fw){
    try{
      fw.addEventListener('error', function(e){ fatal('JS-Fehler ['+VIEW+']: '+(e.message||e.type)); });
      fw.addEventListener('unhandledrejection', function(e){ fatal('Unbehandelte Rejection ['+VIEW+']: '+String(e.reason).slice(0,200)); });
      var origErr=fw.console.error, origWarn=fw.console.warn;
      fw.console.error=function(){ fatal('console.error ['+VIEW+']: '+Array.prototype.join.call(arguments,' ').slice(0,200)); origErr.apply(fw.console, arguments); };
      fw.console.warn=function(){ ergebnis.warnungen.push(Array.prototype.join.call(arguments,' ').slice(0,160)); origWarn.apply(fw.console, arguments); };
    }catch(e){ fatal('Wächter-Installation fehlgeschlagen: '+e); }
  }

  /* ── View-Aktionen im iframe (same-origin) ── */
  var AKTIONEN={
    stapel:   function(fw){ fw.setTab('stapel'); fw.renderAlles(); },
    fokus:    function(fw){ fw.setTab('fokus'); fw.fokusStarten('k-lang', null); fw.closeSheet(); },
    leiste:   function(fw){ fw.setTab('fokus'); fw.renderAlles(); fw.closeSheet(); },
    sheet:    function(fw){ fw.setTab('fokus'); fw.renderAlles(); fw.oeffneStatusSheet(); },
    abschluss:function(fw){ fw.setTab('fokus'); fw.abhakDialog('k-lang', false); },
    routinen: function(fw){ fw.setTab('fokus'); fw.renderAlles(); fw.oeffneRoutinen();
                            var seg=fw.document.querySelector('[data-rdom="privat"]'); if(seg) seg.click(); },
    /* v1.12.0: Die Pin-Schublade ist der Ketten-Schublade gewichen. */
    kette:    function(fw){ fw.setTab('fokus'); fw.renderAlles(); fw.oeffneKetteSheet(); },
    belohnung:function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.closeSheet(); },
    albumR:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum(); },
    /* albumTab ist eine let-Variable im App-Scope (nicht auf window) —
       der Reiterwechsel geht deshalb ueber den echten Button-Klick. */
    albumK:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum();
                            var b=fw.document.querySelector('[data-albtab="kulissen"]'); if(b) b.click(); },
    albumB:   function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAlbum();
                            var b=fw.document.querySelector('[data-albtab="besitz"]'); if(b) b.click(); },
    detail:   function(fw){ fw.setTab('fokus'); fw.oeffneDetail('k-ticks'); },
    /* v1.10.1: Statistik (Detailanalyse-Overlay) — ergänzt, weil F2 (Zeitraum-
       Segmente) sonst ungeprüft bliebe. Einzige erlaubte Werkzeug-Änderung. */
    statistik:function(fw){ fw.setTab('belohnung'); fw.renderAlles(); fw.oeffneAnalyse(); }
  };

  /* ── localStorage-Sequenz (view=storage): drei Punkte, die der Stub nie
     zeigen konnte — Persistenz über Reload, Migration genau einmal, Timer
     überlebt Reload. Läuft über zwei iframe-Generationen. ── */
  function storageSequenz(){
    /* Fixture OHNE Migrations-Flags → die App migriert beim 1. Laden. */
    fixtureSchreiben();
    var metaRoh=JSON.parse(localStorage.getItem('fokus2_meta'));
    ['migration180','zeit191','gamify190','akku1100','flowfix181'].forEach(function(f){ delete metaRoh[f]; });
    delete metaRoh.migration180Gezeigt; delete metaRoh.gamify190Gezeigt;
    localStorage.setItem('fokus2_meta', JSON.stringify(metaRoh));
    localStorage.setItem('fokus2_uiharness_probe', JSON.stringify({wert:'überlebt-reload'}));

    ladeIframe(function(fw){
      konsoleWaechter(fw);
      ergebnis.checks++;
      var meta1=JSON.parse(localStorage.getItem('fokus2_meta'));
      if(meta1.zeit191!==true || meta1.gamify190!==true) fatal('Migrationen liefen beim 1. Laden nicht (zeit191/gamify190 fehlen)');
      var bak1=localStorage.getItem('fokus2_karten_bak191');
      if(!bak1) fatal('Migrations-Sicherung karten_bak191 fehlt nach dem 1. Laden');
      var log1=JSON.stringify(meta1.zeit191Log||null);
      /* Timer starten, dann Reload */
      fw.fokusStarten('k-lang', null);
      var fokus1=JSON.parse(localStorage.getItem('fokus2_fokus'));
      ergebnis.checks++;
      if(!fokus1 || fokus1.karteId!=='k-lang' || fokus1.laeuft!==true) fatal('Laufender Timer wurde nicht persistiert');

      ladeIframe(function(fw2){
        konsoleWaechter(fw2);
        ergebnis.checks++;
        var probe=JSON.parse(localStorage.getItem('fokus2_uiharness_probe')||'null');
        if(!probe || probe.wert!=='überlebt-reload') fatal('localStorage-Wert hat den Reload NICHT überlebt');
        var meta2=JSON.parse(localStorage.getItem('fokus2_meta'));
        ergebnis.checks++;
        if(JSON.stringify(meta2.zeit191Log||null)!==log1) fatal('Migration lief beim 2. Laden ERNEUT (zeit191Log verändert)');
        if(localStorage.getItem('fokus2_karten_bak191')!==bak1) fatal('Migrations-Sicherung wurde beim 2. Laden überschrieben');
        ergebnis.checks++;
        /* const S liegt nicht auf window — Zustand über localStorage plus
           laufendeSek() (Top-Level-Funktion, läuft im App-Scope) prüfen. */
        var fokus2=JSON.parse(localStorage.getItem('fokus2_fokus')||'null');
        if(!(fokus2 && fokus2.karteId==='k-lang' && fokus2.laeuft===true))
          fatal('Laufender Timer hat den Reload nicht überlebt (fokus='+JSON.stringify(fokus2)+')');
        var sek=fw2.laufendeSek?fw2.laufendeSek():null;
        ergebnis.checks++;
        if(sek==null || !(sek>0)) fatal('Timer im neuen Frame nicht aktiv (laufendeSek='+sek+')');
        ergebnis.timerSekNachReload=sek;
        localStorage.removeItem('fokus2_uiharness_probe');
        abschluss();
      });
    });
  }

  /* ── §8 (v1.13.0) · Diagnose-Sequenz (view=diag): synthetische Klicks plus
     Zustandsvergleich für §1.3 (Verschieben in der Stapelansicht), §3.2
     (Rein/Raus-Bilanz) und §6.1 (Akku-Schnellzugriff). Kein Screenshot —
     der Harness ist hier Diagnosewerkzeug, nicht Abnahmeinstrument. ── */
  function diagSequenz(){
    fixtureSchreiben();
    ladeIframe(function(fw){
      konsoleWaechter(fw);
      var d=fw.document;
      function lsGet(k){ return JSON.parse(localStorage.getItem('fokus2_'+k)||'null'); }
      /* v1.13.1: „heute" = App-TAGESFENSTER (belFensterDatum), nicht der rohe
         Kalendertag — sonst laufen Nachtläufe gegen den falschen Tag. */
      var heute=fw.belFensterDatum(fw.jetztIso());
      try{
        /* ══ §1.3 · Verschieben in der Stapelansicht (privater Liste) ══ */
        fw.setTab('stapel'); fw.renderAlles();
        var schieb=d.querySelector('#stapelListe [data-schieb="k-routine"]') || d.querySelector('#stapelListe [data-schieb]');
        ergebnis.checks++;
        if(!schieb){ fatal('diag §1.3: kein Schieben-Knopf in der Stapelansicht'); }
        else {
          var kid=schieb.dataset.schieb;
          schieb.click();   // öffnet den Date-Picker-Sheet
          var chips=d.querySelectorAll('[data-schiebziel]');
          ergebnis.checks++;
          if(chips.length<3) fatal('diag §1.2: Schnellziele fehlen ('+chips.length+'/3)');
          if(chips[1]) chips[1].click();   // „nächster Montag"
          var inp=d.getElementById('schiebDatum');
          var ziel=inp?inp.value:null;
          var wt=d.getElementById('schiebWt');
          ergebnis.checks++;
          if(!(wt && wt.textContent==='Montag')) fatal('diag §1.2: Wochentag nicht erkennbar ('+(wt&&wt.textContent)+')');
          var ohne=d.querySelector('[data-schiebohne]');
          ergebnis.checks++;
          if(!ohne){ fatal('diag §1.3: Bestätigungs-Knopf fehlt'); }
          else {
            ohne.click();
            var k=(lsGet('karten')||[]).filter(function(x){ return x.id===kid; })[0];
            ergebnis.checks++;
            if(!(k && ziel && k.faelligkeit===ziel && ziel>heute))
              fatal('diag §1.3: Fälligkeit nicht aufs Zieldatum gesetzt (ist '+(k&&k.faelligkeit)+', erwartet '+ziel+' > '+heute+')');
            var meta=lsGet('meta')||{};
            var kette=(meta.ketten && meta.ketten.privat)||{};
            ergebnis.checks++;
            if((kette.ids||[]).indexOf(kid)>=0 || (kette.entfernt||[]).indexOf(kid)<0)
              fatal('diag §1.3: Karte nicht aus der heutigen Kette entfernt');
            var iv=lsGet('intraday')||[];
            var schub=iv.filter(function(e){ return e.typ==='schub' && e.kartenId===kid; }).pop();
            ergebnis.checks++;
            if(!(schub && schub.ziel===ziel)) fatal('diag §3.2: Schub-Ereignis ohne Zieltag ('+JSON.stringify(schub)+')');
            var bil=((lsGet('tag')||{}).routinenBilanz)||[];
            ergebnis.checks++;
            if(!bil.some(function(b){ return b.id===kid && b.geschoben; }))
              fatal('diag §3.1: geschobene Routine nicht in der Tagesbilanz (Kategorie geschoben)');
          }
        }
        /* ══ §3.2 · raus (Abhaken) und rein (Wiedereröffnen) zählen ══ */
        var rrVor=fw.reinRausTag(fw.anFlowReihe('alle'), heute);
        var chk=d.querySelector('#stapelListe [data-check="k-morgen"]');
        ergebnis.checks++;
        if(!chk){ fatal('diag §3.2: Abhak-Kästchen k-morgen fehlt'); }
        else {
          chk.click();   // Abhak-Dialog
          var go=d.querySelector('[data-abgo]');
          if(go) go.click(); else fatal('diag §3.2: Abhak-Dialog ohne Erledigen-Knopf');
          var rr1=fw.reinRausTag(fw.anFlowReihe('alle'), heute);
          ergebnis.checks++;
          if(rr1.raus!==rrVor.raus+1) fatal('diag §3.2: Abhaken zählt nicht als raus ('+rrVor.raus+' → '+rr1.raus+') heute='+heute
            +' iv='+JSON.stringify((lsGet('intraday')||[]).slice(-3))
            +' sheet='+(d.getElementById('sheetBody')?d.getElementById('sheetBody').innerHTML.slice(0,80):'?'));
          /* Wiedereröffnen über den §8-Dialog = rein */
          fw.renderAlles();
          var chk2=d.querySelector('#stapelListe [data-check="k-morgen"]');
          if(chk2){ chk2.click();
            var wo=d.querySelector('[data-woeffnen]');
            ergebnis.checks++;
            if(!wo){ fatal('diag §3.2: Wiederholen-Dialog fehlt auf erledigter Karte'); }
            else { wo.click();
              var rr2=fw.reinRausTag(fw.anFlowReihe('alle'), heute);
              ergebnis.checks++;
              if(rr2.rein!==rr1.rein+1) fatal('diag §3.2: Wiedereröffnung zählt nicht als rein ('+rr1.rein+' → '+rr2.rein+')');
            }
          }
        }
        /* ══ §6.1 · Akku-Schnellzugriff — Tag-Fall und Karten-Fall ══ */
        fw.setTab('fokus'); fw.renderAlles(); fw.closeSheet();
        if(fw.fokusBeenden) fw.fokusBeenden();
        var aq=d.querySelector('[data-akkuquick]');
        ergebnis.checks++;
        if(!aq){ fatal('diag §6.1: Akku-Schnellzugriff nicht erreichbar'); }
        else {
          aq.click();
          var slider=d.getElementById('akkuQ'), komm=d.getElementById('akkuQk');
          ergebnis.checks++;
          if(!slider || !komm){ fatal('diag §6.1: Dialog ohne Regler/Kommentarfeld'); }
          else {
            slider.value='120'; komm.value='Harness: schlecht geschlafen';
            var goA=d.querySelector('[data-akkuqgo]'); if(goA) goA.click();
            var eintraege=(lsGet('meta')||{}).akkuEintraege||[];
            var e1=eintraege[eintraege.length-1];
            ergebnis.checks++;
            if(!(e1 && e1.nachher===120 && e1.kid===null && e1.kommentar.indexOf('schlecht geschlafen')>=0))
              fatal('diag §6.1: Tag-Eintrag falsch ('+JSON.stringify(e1)+')');
            ergebnis.checks++;
            var tagAkku=(lsGet('tag')||{}).akku;
            if(!(tagAkku>100)) fatal('diag §6.2: Akku über 100 nicht gespeichert ('+tagAkku+')');
            /* Karten-Fall: laufende Karte → Eintrag hängt an ihr */
            fw.fokusStarten('k-lang', null); fw.closeSheet();
            var aq2=d.querySelector('[data-akkuquick]');
            if(aq2){ aq2.click();
              var s2=d.getElementById('akkuQ'), k2=d.getElementById('akkuQk');
              if(s2){ s2.value='90'; if(k2) k2.value='Harness: Karte zieht';
                var goB=d.querySelector('[data-akkuqgo]'); if(goB) goB.click();
                var ein2=((lsGet('meta')||{}).akkuEintraege||[]);
                var e2=ein2[ein2.length-1];
                ergebnis.checks++;
                if(!(e2 && e2.kid==='k-lang')) fatal('diag §6.1: Karten-Eintrag hängt nicht an der laufenden Karte ('+JSON.stringify(e2)+')');
              }
            }
          }
        }
        /* ══ v1.13.1 · Import-Sequenz: ketteDfm ersetzt KOMPLETT, Historie
           trägt dfm, rec-id wird airtableId, Export trägt Sitzungen ══ */
        var vorherK=fw.tagesKetteDom('dfm').slice();
        fw.oeffneSync();
        var ta=d.getElementById('syncIn');
        ergebnis.checks++;
        if(!ta){ fatal('diag v1.13.1: Sync-Sheet ohne Importfeld'); }
        else {
          ta.value=JSON.stringify({ appVersion:'1.13.1',
            karten:[{ id:'recDiagAAAABBBBCC', titel:'Diag rec-Karte' },{ id:'k-lang' }],
            ketteDfm:['k-lang'] });
          var goI=d.querySelector('[data-syncimport]'); if(goI) goI.click();
          var nachK=fw.tagesKetteDom('dfm').slice();
          ergebnis.checks++;
          if(!(nachK.length===1 && nachK[0]==='k-lang'))
            fatal('diag §1 (1.13.1): ketteDfm ersetzt nicht komplett (vorher '+vorherK.length+' → nachher '+JSON.stringify(nachK)+')');
          ergebnis.checks++;
          if(fw.tagesKetteDom('dfm').length!==1)
            fatal('diag §1 (1.13.1): Auto-Nachzug holt bewusst Entferntes zurück');
          var metaK=lsGet('meta')||{};
          var histKeys=Object.keys(metaK.kettenHistorie||{}).sort();
          var histHeute=histKeys.length?metaK.kettenHistorie[histKeys[histKeys.length-1]]:[];
          ergebnis.checks++;
          if(!histHeute.some(function(x){ return x.dom==='dfm'; }))
            fatal('diag §2 (1.13.1): kein dfm-Eintrag in der Kettenhistorie');
          var recK=(lsGet('karten')||[]).filter(function(x){ return x.id==='recDiagAAAABBBBCC'; })[0];
          ergebnis.checks++;
          if(!(recK && recK.airtableId==='recDiagAAAABBBBCC'))
            fatal('diag §3 (1.13.1): rec-id nicht zur airtableId geworden ('+JSON.stringify(recK&&recK.airtableId)+')');
          var ex=fw.syncExport('sync');
          var exK=(ex.karten||[]).filter(function(x){ return x.id==='k-lang'; })[0];
          ergebnis.checks++;
          if(!(exK && exK.sitzungen && exK.sitzungen.length>=1 && exK.sitzungen[0].von && exK.sitzungen[0].bis && exK.sitzungen[0].min>0))
            fatal('diag §4 (1.13.1): Export ohne Sitzungszeiten ('+JSON.stringify(exK&&exK.sitzungen)+')');
        }
        /* ══ v1.13.2 · Start setzt IMMER den Fokus — je Startpfad ein
           synthetischer Klick, danach: laufende Karte == angezeigte Karte.
           (Die dfm-Kette steht nach dem Import-Test auf [k-lang] — Starts
           außerhalb der Kette sind exakt der Befund-Fall vom 02.09.) ══ */
        var fokusGleich=function(pfad){
          var fok=lsGet('fokus');
          ergebnis.checks++;
          if(!fok || !fok.karteId){ fatal('diag v1.13.2 ['+pfad+']: kein S.fokus nach Start'); return; }
          var ang=fw.aktiveFokusKarte();
          ergebnis.checks++;
          if(!(ang && ang.id===fok.karteId))
            fatal('diag v1.13.2 ['+pfad+']: Fokus/Uhr auf '+fok.karteId+', Ansicht zeigt '+(ang&&ang.id));
        };
        fw.closeSheet();
        // 1) Kartenzeile im Stapel — Karte AUSSERHALB jeder Kette (Befund-Fall)
        fw.setTab('stapel'); fw.renderAlles();
        var s1=d.querySelector('#stapelListe [data-fokusstart="k-counter"]');
        ergebnis.checks++;
        if(!s1){ fatal('diag v1.13.2: ▶ auf k-counter fehlt im Stapel'); } else { s1.click(); fokusGleich('Kartenzeile Stapel · außerhalb der Kette'); }
        // 2) Fokusliste der Fokusansicht
        fw.renderAlles();
        var s2=d.querySelector('#fokusView [data-fokusstart="k-timer"]');
        if(s2){ s2.click(); fokusGleich('Fokusliste'); }
        // 3) Ketten-Schublade
        fw.oeffneKetteSheet();
        var s3=d.querySelector('#ketteSheetListe [data-fokusstart]');
        if(s3){ s3.click(); fokusGleich('Ketten-Schublade'); } else fw.closeSheet();
        // 4) Ketten-Aktions-Sheet ▶ (Karte außerhalb der Kette)
        fw.setTab('stapel'); fw.renderAlles();
        var s4=d.querySelector('#stapelListe [data-kette="k-morgen"]');
        if(s4){ s4.click();
          var s4b=d.querySelector('[data-kaStart="k-morgen"]');
          if(s4b){ s4b.click(); fokusGleich('Ketten-Aktions-Sheet ▶'); } else fw.closeSheet(); }
        // 5) Routinen-Ansicht
        fw.setTab('fokus'); fw.oeffneRoutinen();
        var s5a=d.querySelector('[data-rdom="privat"]'); if(s5a) s5a.click();
        var s5=d.querySelector('.routsheet [data-fokusstart="k-ticks"]');
        if(s5){ s5.click(); fokusGleich('Routinen-Ansicht'); } else fw.closeSheet();
        // 6) Suche (eingefrorene Karte — Start taut auf)
        fw.oeffneSuche();
        var si=d.getElementById('suchInput'); si.value='Lieferant'; fw.renderSuchTreffer();
        var s6=d.querySelector('[data-suchstart="k-frost"]');
        if(s6){ s6.click(); fokusGleich('Suche'); } else { fw.schliesseSuche(); fatal('diag v1.13.2: Suchtreffer k-frost fehlt'); }
        // 7) Status-Sheet-Kettenzeile
        fw.oeffneStatusSheet();
        var s7=d.querySelector('#sheetKette [data-fokusstart]');
        if(s7){ s7.click(); fokusGleich('Status-Sheet-Kette'); } else fw.closeSheet();
        // 8) Nachrücken nach Abhaken der laufenden Karte (Quelle = Kette)
        fw.setTab('stapel'); fw.renderAlles();
        var s8=d.querySelector('#stapelListe [data-fokusstart="k-timer"]');
        if(!s8){ fatal('diag v1.13.2 [Nachrücken]: ▶ k-timer fehlt im Stapel'); }
        else { s8.click();
          fw.renderAlles();
          var s8b=d.querySelector('#fokusView [data-fkcheck="k-timer"]');
          if(!s8b){ fatal('diag v1.13.2 [Nachrücken]: ✓ auf der Fokus-Karte fehlt'); }
          else { s8b.click();
            var s8c=d.querySelector('[data-abgo]');
            if(!s8c){ fatal('diag v1.13.2 [Nachrücken]: Abhak-Dialog ohne Erledigen'); }
            else { s8c.click();
              var fok8=lsGet('fokus');
              ergebnis.checks++;
              // Quelle 'sys-dfm' hat keine Ansichts-Liste → Nachrücken darf
              // leer ausgehen (Fokus beendet) ODER nachrücken — aber wenn ein
              // Fokus da ist, muss die Ansicht ihn zeigen.
              if(fok8) fokusGleich('Nachrücken nach Abhaken');
            }
          }
        }
        // 9) Play/Pause der Fokus-Leiste (Toggle) — vorher definierten Fokus herstellen
        fw.fokusStarten('k-lang', null); fw.closeSheet();
        var s9=d.getElementById('fkPP'); if(s9){ s9.click(); fokusGleich('Fokus-Leiste ▶/⏸'); }
      }catch(err){ fatal('diag-Sequenz abgebrochen: '+err); }
      abschluss();
    });
  }

  var frame=document.getElementById('app');
  function ladeIframe(cb){
    var f=document.getElementById('app');
    var neu=document.createElement('iframe'); neu.id='app';
    neu.style.width=FW+'px'; neu.style.height=FH+'px';
    f.parentNode.replaceChild(neu, f);
    neu.addEventListener('load', function(){
      /* der App etwas Zeit für init() geben (virtuelle Zeit im Headless) */
      setTimeout(function(){
        try{ cb(neu.contentWindow); }
        catch(e){ fatal('Aktion fehlgeschlagen: '+e); abschluss(); }
      }, 900);
    });
    neu.src='/neu.html';
  }

  if(VIEW==='storage'){ storageSequenz(); return; }
  if(VIEW==='diag'){ diagSequenz(); return; }   // §8 (v1.13.0): Klick-Diagnose

  fixtureSchreiben();
  ladeIframe(function(fw){
    konsoleWaechter(fw);
    /* const S liegt nicht auf window — Initialisierung über die
       Top-Level-Funktionen und den gerenderten DOM feststellen. */
    if(typeof fw.setTab!=='function' || typeof fw.laufendeSek!=='function')
      fatal('App nicht initialisiert (Top-Level-Funktionen fehlen)');
    if(!fw.document.body || fw.document.body.children.length===0)
      fatal('App nicht initialisiert (leerer body)');
    try{ (AKTIONEN[VIEW]||AKTIONEN.stapel)(fw); }
    catch(e){ fatal('View-Aktion „'+VIEW+'“ fehlgeschlagen: '+e); }
    setTimeout(function(){
      try{ layoutChecks(fw); }catch(e){ fatal('Layout-Checks fehlgeschlagen: '+e); }
      abschluss();
    }, 700);
  });
})();
</script>
